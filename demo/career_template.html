    // 玩家在 LDL 时自己的队每周被这里多模拟一场：实测 7 周打出 6-8（14 场），
    // 同联赛别的队才 7-9 场。玩家从积分榜截图里抓出来的。
    const ts=S.world[lg].filter(t=>!(lg===(S.homeLeague||"LPL")&&(t.name===S.team||(S.match&&t.name===S.match.oppName))));
    for(let i=0;i<ts.length-1;i+=2){
      const a=ts[i],b=ts[i+1];
      const p=1/(1+Math.exp(-(power(a,0,sea.fav)-power(b,0,sea.fav))/SPREAD));
      const aw=rnd()<p;
      S.standings[lg][a.name][aw?"w":"l"]++;
      S.standings[lg][b.name][aw?"l":"w"]++;
      // 赛前明显不被看好的一方赢了 —— 记下来给际遇当素材，
      // 这样「强队今天输了」说的是真发生过的一场，而不是随手编个队名。
      if(lg===(S.homeLeague||"LPL")&&!S._upset&&(aw?p<0.33:p>0.67)){
        S._upset = aw ? {winner:a.name,loser:b.name} : {winner:b.name,loser:a.name};
      }
      if(lg==="LPL"){
        const f1=noteForm(a.name,aw), f2=noteForm(b.name,!aw);
        const rk=lplRank(), notable=new Set(
          rk.slice(0,4).map(r=>r.n).concat(rk.slice(-3).map(r=>r.n)).concat([S.team]));
        [[a.name,f1],[b.name,f2]].forEach(([tn,f])=>{
          if(!f||!notable.has(tn)) return;   // 只播榜首四强 / 垫底三名 / 你自己
          const key=SEASONS[S.si].tag+tn+f;
          if(S.formSeen[key]) return;          // 每队每赛季同类只播一次，避免刷屏
          S.formSeen[key]=1;
          pushEvent(f==="win4"?`<b>${tn}</b> 已经五连胜，状态正热。`
                              :`<b>${tn}</b> 遭遇五连败，更衣室传出不和传闻。`,
                    f==="win4"?"good":"bad","战况");
        });
        if((aw&&p<0.25)||(!aw&&p>0.75))
          pushEvent(`冷门：<b>${aw?a.name:b.name}</b> 爆冷击败 <b>${aw?b.name:a.name}</b>，赛前几乎无人看好。`,"big","冷门");
      }
    }
  });
}
function viewMatch(){
  const m=S.match,sea=SEASONS[S.si];
  // 赛后拆解独立成一屏（照 Val Manager）：比分页点「赛后拆解」进来，看完才有「继续」。
  // 原来拆解卡排在「继续」按钮底下，玩家点了继续就再也看不到了。
  if(m.done&&m.pmSeen&&m.attr&&typeof postMatchCard==="function"){
    return `${postMatchCard()}
    <div class="row"><button class="btn" id="next">继续 →</button></div>`;
  }
  const my=power(myRoster(),S.fatigue,sea.fav)+versionFit(),op=power(m.opp.players,0,sea.fav);
  return `<div class="card">
    <h2>${sea.tag} ${S.intl?intlStageName():S.playoff?"季后赛":"第 "+S.week+" 周"}<em>${
      m.need===1?"单局定胜负":m.need===2?"三局两胜":"五局三胜"}</em></h2>
    <div class="vs">
      <div class="side"><div class="nm">${teamLogo(S.team,34)}<br>${S.team}</div><div class="pw mono">战力 ${my.toFixed(1)}</div></div>
      <div class="score">${m.sc[0]} : ${m.sc[1]}</div>
      <div class="side"><div class="nm">${teamLogo(m.oppName,34)}<br>${m.oppName}</div><div class="pw mono">战力 ${op.toFixed(1)}</div></div>
    </div>
    ${m.node?`<div class="node"><div class="q">${m.node.q}</div><div class="ctx">${m.node.ctx}</div>
      <div class="grid g2">${m.node.a.map((a,i)=>`<button class="opt" data-node="${i}">
        <div class="t">${a.t}</div><div class="d">吃 <b>${a.dim}</b> · ${a.risk>0.8?'高风险高回报':'稳健'}</div>
      </button>`).join("")}</div></div>`:""}
    ${m.lines.length?`<div class="log">${m.lines.slice().reverse().join("")}</div>`:""}
    ${m.done?`<div class="row"><button class="btn" id="${m.attr?'pmgo':'next'}">${
      m.attr?'赛后拆解 →':'继续 →'}</button></div>`:""}
  </div>`;
}

/* 替补：不是等几周，而是要自己抢下首发位 */
function isBenched(){
  if(S.promoted) return false;
  const inc=S.understudy; if(!inc) { S.promoted=true; return false; }
  const me=avg(DIMS.map(d=>S.attrs[d])), him=avg(DIMS.map(d=>inc.r[d]));
  if(me>=him-2){
    S.promoted=true;
    const t=myTeam();
    t.players=t.players.map(q=>q===inc
      ? {id:S.name||"你",cn:"",pos:S.pos,age:S.age,r:S.attrs,me:true} : q);
    pushEvent((S.homeLeague||"LPL")==="LDL"
      ? `训练赛数据压过 <b>${inc.id}</b>，教练把你<b>写进了 ${S.team} 的 LDL 名单</b>。
         <b>你终于能打正式比赛了。</b>`
      : `训练赛数据压过 <b>${inc.id}</b>，教练组决定让你首发。<b>你终于上场了。</b>`,"big","转正");
    checkAch("promote");
    return false;
  }
  return true;
}

/* 替补席：队伍照打，你不上场也不计个人战绩 */
function benchWeek(){
  S.benchedThisSplit=true;
  const on=S.schedule[S.week-1], sea=SEASONS[S.si];
  const opp=S.world[S.homeLeague||"LPL"].find(t=>t.name===on);
  const p=1/(1+Math.exp(-(power(myRoster(),0,sea.fav)-power(opp,0,sea.fav))/SPREAD));
  const w1=rnd()<p, w2=rnd()<p, won=(w1&&w2)||((w1||w2)&&rnd()<p);
  S.standings[S.homeLeague||"LPL"][S.team][won?"w":"l"]++;
  S.standings[S.homeLeague||"LPL"][on][won?"l":"w"]++;
  addFans(-1.5);      // 不上场，热度在掉
  const acad=(S.homeLeague||"LPL")==="LDL";
  pushEvent(acad
    ? `${S.team} ${won?"击败":"负于"} ${on}。<b>你不在这周的名单里</b>——
       青训生要先在训练赛里打出来，教练才会把你写进去。`
    : `${S.team} ${won?"击败":"负于"} ${on}。<b>你在替补席上看完了整场</b>，没人提你的名字。`,
    won?"info":"bad", acad?"青训":"替补");
  // 替补周世界也要转。原来 simWorld 只在你亲自打完比赛时跑，
  // 坐板凳的赛段里其他队整周停摆——实测有队 7 周只攒了 0-4 场。
  // 临时把本周对手挂在 S.match 上，防止它在模拟里被再打一场（双算）。
  S.match={oppName:on};
  simWorld();
  S.match=null; nextWeek();
}

/* ================= 周 / 赛季推进 ================= */
function nextWeek(){
  if(S.intl){ intlAdvance(); return; }
  if(S.playoff){ playoffAdvance(); return; }
  if(S.week>=WEEKS){
    // 现实里常规赛打完不会第二天就打季后赛，中间有几天到一周的间隔。
    // 这一周也是有用的：调整状态、针对性备战、把体能补回来。
    enterBreak("playoff", 1, "常规赛结束 · 季后赛前");
    return;
  }
  S.week++; S.ap=apFor('season'); S.step="season"; S.match=null; addFat(-10);
  if(S.assets&&S.assets.apt) addFat(-4);           // 电竞公寓：住得好，恢复就是快
  if(typeof weeklyEcho==="function") weeklyEcho(); // 事件链/周报/商业机会的周节拍
  if(typeof injuryTick==="function") injuryTick();
  if(typeof rollInjury==="function") rollInjury("赛季中");
  if(typeof archiveWeek==="function") archiveWeek();
  if(typeof btkWeekEnd==="function") btkWeekEnd();
  if(typeof tickBuffs==='function') tickBuffs();
  if(typeof fanWeek==='function') fanWeek();
  if(typeof questWeek==='function') questWeek();
  if(typeof tryRandomEvent==='function'&&rnd()<0.14) tryRandomEvent();
  if(typeof saveGame==='function') saveGame('S'+S.si+' 第'+S.week+'周');
  render();
}
function lplRank(){
  return Object.entries(S.standings[S.homeLeague||"LPL"])
    .map(([n,r])=>({n,...r,p:(r.w+r.l)?r.w/(r.w+r.l):0}))
    .sort((a,b)=>b.p-a.p||b.w-a.w);
}
/* 正经种子对阵：越往后对手越强，决赛必碰常规赛第一 */
function startPlayoff(){
  const rk=lplRank(), seed=rk.findIndex(r=>r.n===S.team)+1;
  S.career.best=Math.min(S.career.best,seed);
  S.playoffSeed=seed;
  if(seed>6){
    /* 没进季后赛，但季后赛不会因此消失。
       原来这里直接 endSeason()：常规赛最后一场刚打完，下一秒就弹出
       世界赛冠军、跳进休赛期——世界像是替你按了快进。
       现在别人打季后赛的这两周照样流逝，你训练、直播、休息都行，
       半决赛和决赛的结果按周揭晓。 */
    S.playoff=null;
    const fin=majorStandings(S.homeLeague||"LPL");   // 有缓存：这里播的冠军就是之后的国际赛种子
    S.pendingEnd={result:null,seed};
    enterBreak("poEnd",2,SPLITS[S.split||0]+"季后赛 · 场边",
      `常规赛第 ${seed} 名，无缘季后赛。<b>别人在打季后赛的这几周，你的时间是自己的</b>——练、直播、休息，都行。`);
    if(fin&&fin.length>=4){
      queueBreakNews(2,`季后赛半决赛打完：<b>${fin[0]}</b> 和 <b>${fin[1]}</b> 会师决赛，${fin[2]}、${fin[3]} 止步四强。`,"info","季后赛");
      queueBreakNews(3,`<b>${fin[0]}</b> 击败 ${fin[1]}，夺得 ${SEASONS[S.si].tag} ${S.homeLeague||"LPL"}${SPLITS[S.split||0]}冠军。${
        (S.homeLeague||"LPL")==="LDL"?"":S.split===0?"他们将代表赛区出战 MSI。":"他们拿到了世界赛的头号种子。"}`,"big","季后赛");
    }
    return;
  }
  S.playoffSeed=seed;
  checkAch("playoff");
  S.playoff={round:1,seed,alive:true,beaten:[S.team]};
  S.step="match";
  startMatch(true, playoffOpp(1));
}
/* 第1轮打 5/6 号种子，第2轮打 2/3 号，决赛打 1 号 */
function playoffOpp(round){
  const rk=lplRank().filter(r=>!S.playoff.beaten.includes(r.n));
  const want = round===1 ? 4 : round===2 ? 1 : 0;   // 索引：5-6号 / 2-3号 / 榜首
  return (rk[Math.min(want, rk.length-1)]||rk[0]).n;
}
/* 季后赛这一轮叫什么。六队、三轮：首轮 → 半决赛 → 决赛。
   玩家原话：「打一线比赛 lpl 也是常规赛，季后赛季后赛半决赛这些要写清楚」。 */
function poRoundName(r){ return ["季后赛首轮","半决赛","决赛"][(r||1)-1] || `第 ${r} 轮`; }
function playoffAdvance(){
  const won=S.match.sc[0]>S.match.sc[1];
  if(!won){ noteGrudge(S.match.oppName,S.playoff.round>=3?4:2,
      `${poRoundName(S.playoff.round)}被淘汰`);
    S.playoff.alive=false; endSeason(S.playoff.round,S.playoff.seed); return; }
  S.playoff.beaten.push(S.match.oppName);
  S.playoff.round++;
  if(S.playoff.round>3){ endSeason("champion",S.playoff.seed); return; }
  const nm=playoffOpp(S.playoff.round);
  enterPrep("playoff", nm, true,
    `${poRoundName(S.playoff.round)} · 赛前备战`);
}

/* ---------- 淘汰赛之间的备战 ----------
   原来季后赛打完一轮直接 startMatch() 开下一轮，国际赛也一样：
   一路连打三场甚至更多，中间一个行动点都没有、训练框都不出现。
   最高强度的比赛反而最没得操作，这不对。
   现在每轮之间插一个备战环节：2 个行动点，休息、复盘、找手感都行。 */
function enterPrep(mode, opp, bo, label){
  S.prep={mode, opp, bo, label};
  // 2 点。当年压到 1 点是防「连休两次清 60+ 疲劳」——那是休息还没有
  // 备战折减的年代。现在 doAction 里 prepMul=0.45，两次休息只清 ~27，
  // 回血站开不起来；1 点的备战则退化成「点一下就上场」，没有决策可言。
  // 改动照例过了 120 局 A/B：冠军率见提交说明。
  S.ap=2;
  if(S.btk) S.btk.apWeek=2;
  S.step="prep";
  render();
}
function prepGo(){
  const P=S.prep; if(!P) return;
  S.prep=null;
  if(P.mode==="intl"){ S.step="match"; startMatch(P.bo, P.opp); return; }
  S.step="match"; startMatch(true, P.opp);
}
/* 备战也要有标签栏。
   玩家原话：「现在栏目不见了，根本看不见队友的数据，这个是个巨大的问题」。
   赛前备战恰恰是最该翻队友状态、翻对手、翻默契的时候，
   而这一屏原来什么导航都没有——只能上场或者干等。 */
function viewPrep(){
  const T=curTab(TABS_SEASON);
  const pops=`${(S.patchNote&&typeof patchNoteCard==="function")?patchNoteCard():""}${
    S.locker?lockerCard():""}${S.rndResult?randomResultCard():""}${S.rndEv?randomCard():""}`;
  if(T!=="act") return `${pops}${tabBar(TABS_SEASON)}${tabContent(T)}`;
  return `${pops}${tabBar(TABS_SEASON)}${prepPanel()}`;
}
function prepPanel(){
  const P=S.prep; if(!P) return "";
  const oppT=(S.world[S.homeLeague||"LPL"]||[]).find(t=>t.name===P.opp)
          || Object.values(S.world).flat().find(t=>t.name===P.opp);
  return `<div class="card">
    <h2>${P.label}<em>剩余行动点 ${S.ap}</em></h2>
    ${typeof autoBar==="function"?autoBar():""}
    ${typeof questCard==="function"?questCard():""}
    <div class="next">
      <div class="sd"><div class="nm">${typeof teamLogo==="function"?teamLogo(S.team,20):""} ${S.team}</div>
        <div class="pw">战力 ${power(myRoster(),S.fatigue,SEASONS[S.si].fav).toFixed(1)}</div></div>
      <div class="mid">VS</div>
      <div class="sd"><div class="nm">${typeof teamLogo==="function"?teamLogo(P.opp,20):""} ${P.opp}</div>
        <div class="pw">${oppT?`战力 ${power(oppT,0,SEASONS[S.si].fav).toFixed(1)}`:""}</div></div>
    </div>
    <p class="note">下一场之前还有一点时间。<b>怎么用是你的事</b>——歇一口气、过一遍录像，
      或者临阵再练一手。</p>
    ${typeof btkChaseNote==="function"?btkChaseNote():""}
    ${fatigueBar()}
    <div class="grid g5">
      ${DIMS.map(d=>{const b=trainBtn(d,S.ap);
        return `<button class="act" data-train="${d}" title="${b.tip||''}" ${b.dis?'disabled style="opacity:.34"':''} ${b.style}>
        <div class="t">${b.title}</div><div class="d">${b.desc}</div></button>`}).join("")}
      <button class="act" data-do="solo" ${S.ap<=0?'disabled style="opacity:.34"':''}>
        <div class="t">打排位</div><div class="d">找回手感${
          typeof myForm==="function"?`　<b>状态 ${Math.round(myForm())}</b>`:""}${costSolo()}</div></button>
      <button class="act" data-do="rest" ${S.ap<=0?'disabled style="opacity:.34"':''}>
        <div class="t">休息</div><div class="d">清疲劳，护状态${costRest()}</div></button>
    </div>
    ${typeof squadActs==="function"?squadActs():""}
    <div class="row"><button class="btn" id="prepgo">上场 →</button>
      ${typeof quickBtn==="function"?quickBtn():""}</div>
    <p class="note">行动点没用完也可以直接上场。</p>
  </div>`;
}

function endSeason(result,seed){
  payday();
  const up=(S.bg&&S.bg.upkeep)||0;
  if(up){ const paid=Math.min(up,Math.max(0,S.money));
    if(typeof addMoney==='function') addMoney('home',-paid); else S.money-=paid;
    pushEvent(`往家里寄了 <b>${paid} 万</b>。`,"info","家用"); }
  trustDecay(); squadDecay(); checkBreakthrough();
  // 关系崩到底的队友会走——这是更衣室里那些选择真正的出口
  if(typeof checkMateExit==="function") checkMateExit();
  // 话题人物的代价：教练每赛段都少信你一点
  if(typeof traitMul==="function"){
    const cp=traitMul("coachPer",true);
    if(cp&&typeof addStaff==="function") addStaff("coach",cp);
  }
  if(typeof streamClauseCheck==='function') streamClauseCheck();   // 独家合同的开播条款
  // 赛段打完先攒一次球探关注——转会不该只在休赛期那一瞬间才有动静
  if(typeof noteScoutInterest==='function') noteScoutInterest();
  // 天梯不守就掉：段位分向「当前实力守得住的位置」回落。
  // 爬分是带下行阻尼的随机游走，运气好的连胜能把峰值冲到实力线上方
  // 十几分——那是峰值快照，不是水平。挂着王者却只有钻石的实力，
  // 一个赛段不守，分就该掉。
  if(S.pre&&typeof S.pre.rank==="number"&&typeof soloSkill==="function"){
    const hold=clamp(skillToRank(soloSkill())+6,0,100);   // 统一标尺曲线 + 6 分宽限
    if(S.pre.rank>hold){
      const before=S.pre.rank;
      S.pre.rank=q1(Math.max(hold,S.pre.rank-(S.pre.rank-hold)*0.35));
      if(rankName(before)!==rankName(S.pre.rank))
        pushEvent(`一个赛段没怎么守天梯，段位掉到 <b>${rankFull(S.pre.rank)}</b>。分数是要用实力守的。`,"info","排位");
    }
  }
  if(typeof cloutTick==='function') cloutTick();
  if(typeof rollForm==='function') rollForm();
  if(typeof rollWorldForm==='function'){ rollWorldForm(); formNews(); }
  if(typeof btkSplitEnd==='function') btkSplitEnd();
  const cut=contractCheck();
  if(cut) S.gotCut=true;
  S.lastSeason={result,seed,rec:Object.assign({},S.record),
    grow:DIMS.map(d=>({d,g:S.attrs[d]-S.seasonAttr0[d]}))};
  // 赛事奖金：走到哪一档发哪一档，每次都发（见 shop.js 的 PRIZE_*）
  if(typeof addMoney==="function"&&typeof PRIZE_PO!=="undefined"){
    const tbl=(S.homeLeague||"LPL")==="LDL"?PRIZE_PO_LDL:PRIZE_PO;
    const amt=result==="champion"?tbl.champion:result===3?tbl.runner:result===2?tbl.semi:0;
    if(amt){ addMoney("prize",amt);
      pushEvent(`${SPLITS[S.split||0]}季后赛奖金到账 <b>${amt} 万</b>。`,"good","奖金"); }
  }
  if(result==="champion"){
    const sp=SPLITS[S.split||0];
    S.career.titles.push(`${SEASONS[S.si].tag} ${S.homeLeague||"LPL"}${sp}`);
    S.career.leagueTitles=(S.career.leagueTitles||0)+1;
    S.career.lgYears=(S.career.lgYears||[]).concat([S.si]);
    S.career.lgStreak=(S.career.lgStreak||0)+1;
    checkAch("lgtitle");
    // 夺冠之后：庆功宴、采访、商务饭局——这也是选手人生的一部分
    if(typeof fireEvent==="function") fireEvent("afterchamp", 0.7);
    breakthrough("心态",2.0,"捧过一次奖杯之后，大场面对你来说不一样了。","lgtitle","mile");
    pushEvent(`<b>${S.team} 夺得 ${SEASONS[S.si].tag} ${sp}冠军。</b>${
      S.split===0?"下一站 MSI。":"世界赛资格到手。"}`,"big","联赛冠军");
  }
  if(result!=="champion") S.career.lgStreak=0;
  checkAch("splitend");
  checkAch("money");
  S.playoff=null;
  // 二级联赛的冠军不去国际赛——LDL 打得再好也只是升上一队的资格
  const majorLg = (S.homeLeague||"LPL")!=="LDL";
  // 玩家原话：「打完季后赛直接进世界赛……中间毫无休息」。
  // 现在出征前先过一段集结周：休整、抽签，然后才开打。
  if(S.split===0){
    // 春季赛结束 -> 冠军去 MSI -> 然后开夏季赛。
    // 没去 MSI 的人也不会看到世界快进：MSI 照打，结果在间歇期里分周揭晓。
    if(majorLg&&result==="champion"){
      S.pendingIntl={type:"msi",result};
      enterBreak("intl",1,"出征 MSI 前 · 集结",
        `联赛冠军到手，<b>MSI 的机票已经订好</b>。出发前还有一周——把状态调到最好。`);
      return;
    }
    spectateIntl("msi");
    return;
  }
  // 夏季赛结束 -> 世界赛 -> 休赛期。
  // 没资格去的人，世界赛那三周照样过：你在训练室里，冠军在最后一周才揭晓。
  if(majorLg&&typeof worldsSlot==="function"&&worldsSlot(result)!==null){
    S.pendingIntl={type:"worlds",result};
    enterBreak("intl",2,"世界赛前 · 集结与适应",
      `<b>世界赛的名额到手了。</b>接下来两周：集结、飞抵主办地、适应场馆——抽签结果出来之前，把自己调整好。`);
    return;
  }
  spectateIntl("worlds");
}

function viewOffseason(){
  const champ=((S.intlChamp&&typeof intlChampCard==="function")?intlChampCard():"")
    +((S.contentPick&&typeof contentCard==="function")?contentCard():"")
    +((S.promoteDeal&&typeof promoteDealCard==="function")?promoteDealCard():"")
    +((S.patchNote&&typeof patchNoteCard==="function")?patchNoteCard():"");
  if(S.off){
    const T=curTab(TABS_SEASON);
    const pops=`${champ}${S.locker?lockerCard():""}${S.rndResult?randomResultCard():""}${S.rndEv?randomCard():""}`;
    if(T!=="act") return `${pops}${tabBar(TABS_SEASON)}${tabContent(T)}`;
    return `${pops}${tabBar(TABS_SEASON)}${offPanel()}${typeof pressCard==="function"?pressCard():""}`;
  }
  const ls=S.lastSeason,sea=SEASONS[S.si];
  let label=ls.result==="champion"?`<span class="tag g">LPL 冠军</span>`
    :ls.result===null?`常规赛第 ${ls.seed} 名 · 无缘季后赛`
    :`${(typeof poRoundName==="function")?poRoundName(ls.result):("季后赛第 "+ls.result+" 轮")}出局（常规赛第 ${ls.seed}）`;
  // 夺了世界冠军的年，结算标题不能只念国内那半句（玩家原话：
  // 「决赛夺冠了但是写常规赛第五半决赛出局」——数据都对，主次错了）
  const wcYear=(S.career&&S.career.worldsYears||[]).includes(S.si);
  const msiYear=(S.career&&S.career.msiYears||[]).includes(S.si);
  if(wcYear) label=`<b style="color:var(--gold-hi)">世界冠军</b> · 联赛${label}`;
  else if(msiYear) label=`<b style="color:var(--gold-hi)">MSI 冠军</b> · 联赛${label}`;
  const last=S.si>=SEASONS.length-1;
  return `${champ}<div class="card">
    <h2>${sea.tag} ${sea.y} 赛季结算</h2>
    <h3>${S.team} — ${label}</h3>
    <p class="note">你的战绩 ${ls.rec.w}胜 ${ls.rec.l}负 · 生涯小分 ${S.career.w}−${S.career.l}
      ${S.career.titles.length?` · 已夺冠 ${S.career.titles.join("、")}`:""}</p>
    <div class="attrs" style="margin-top:16px">
      ${ls.grow.map(({d,g})=>{const c=capOf(d),v=S.attrs[d];
        return `<div class="at"><div class="lb">${d}</div>
        <div class="track"><div class="fill" style="width:${clamp(v,0,100)}%"></div>
        <div class="capline" style="left:${clamp(c,0,100)}%"></div></div>
        <div class="vn mono"><b>${v.toFixed(1)}</b>${Math.abs(g)>=0.05?` <span class="${g>0?'up':'dn'}">${g>0?'+':''}${g.toFixed(1)}</span>`:""}</div></div>`}).join("")}
    </div>
    <div class="row">
      <button class="btn" id="off">${last?"生涯总结 →":`进入休赛期 · ${SEASONS[S.si+1].tag} 备战 →`}</button>
    </div>
  </div>
  ${eventsCard()}`;
}

/* 休赛期不该是一个按钮。
   AP_OFF 和 apFor("off") 早就写好了，但从来没被用上——结算页点一下
   就直接跳进下赛季。可休赛期只是没有比赛，训练、排位、直播反而是
   这段时间的重点：这是唯一一段你能安心补短板、攒人气的日子。 */
const OFF_WEEKS=3, MID_WEEKS=2;
/* 春夏之间也是一段没有比赛的日子。
   原来没进 MSI 就直接开夏季赛，中间一点时间都没有——
   可那正是现实里休整、补短板的窗口。用同一套面板，只是去向不同。 */
function enterBreak(next, weeks, label, note){
  S.off={week:1, weeks, next, label};
  // 出征周是赶路、抽签、适应场馆——能自主安排的时间少，
  // 而且长途飞行和时差本身就不养人：这里不自动洗疲劳（别的间歇会），
  // 休息也按 0.45 折算（见 doAction 的 prepMul）。当年只给 1 点是因为
  // 休息还没折减、给满 3 点等于满血进世界赛（实测冠军率 9% -> 25%）；
  // 折减落地后 2 点最多清 ~27 疲劳，换来的是「练还是养」的真选择。
  S.ap=(next==="intl")?2:apFor("off");
  if(next==="intl"&&S.btk) S.btk.apWeek=2;
  S.step="offseason";
  if(next!=="intl") S.fatigue=Math.max(0,S.fatigue-20);
  pushEvent(note||`${label}（${weeks} 周）。没有比赛，正好把该补的补上。`,"info","间歇");
  // 季中注册窗（2026-08-31 玩家拍板的双窗制）：春季赛打完，转会市场开门。
  // 赛段里攒的意向在这里兑现——LDL 打半年打得好，夏季赛就能上一线。
  if(next==="summer"&&S.career){
    S.askedTransfer=false;
    if(typeof rollProOffers==="function") rollProOffers("mid");
  }
  render();
}
/* ---------- 间歇期的分周新闻 ----------
   没进季后赛/世界赛时，别人的比赛照打。结果不能一口气全倒出来——
   半决赛、决赛、冠军按周揭晓，世界才有「还在转」的感觉。 */
function queueBreakNews(week,text,tone,tag){
  if(!S.off||week<=S.off.week){ pushEvent(text,tone,tag); return; }
  S.off.news=S.off.news||{};
  (S.off.news[week]=S.off.news[week]||[]).push({text,tone,tag});
}
function flushBreakNews(week){
  if(!S.off||!S.off.news) return;
  Object.keys(S.off.news).map(Number).sort((a,b)=>a-b).forEach(w=>{
    if(w>week) return;
    S.off.news[w].forEach(e=>pushEvent(e.text,e.tone,e.tag));
    delete S.off.news[w];
  });
}
function doOffseason(){
  if(S.off) return;          // 已经在休赛期里了，别把周数重置回第 1 周
  if(S.si>=SEASONS.length-1){ S.step="end"; render(); return; }
  S.off={week:1, weeks:OFF_WEEKS, next:"year", label:"休赛期"};
  S.ap=apFor("off");
  S.askedTransfer=false;             // 每个休赛期能主动挂牌一次
  // 升队、转会、下放都跟着注册窗口走：休赛期是主窗口（季中间歇是另一个，见 offNextWeek）
  if(typeof checkPromote==="function" && checkPromote()) { /* 升上一队了 */ }
  else if(typeof rollProOffers==="function") rollProOffers();
  // 一队替补整年拿不到比赛：俱乐部会提议下放青训队打 LDL（可拒绝）
  if(!S.proOffer&&!S.confirm&&typeof offerSendDown==="function") offerSendDown();
  S.fatigue=Math.max(0,S.fatigue-25);      // 赛季打完，先喘口气
  pushEvent(`赛季结束，进入休赛期（${OFF_WEEKS} 周）。没有比赛，
    但这是一年里唯一能安心补短板的时间。`,"info","休赛期");
  render();
}
/* 休赛期推进；走完就进下一个赛季 */
function offNextWeek(){
  if(!S.off) return;
  if(typeof archiveWeek==="function") archiveWeek();
  if(S.off.week>=S.off.weeks){
    flushBreakNews(1e9);                                  // 攒着的决赛与冠军，离开前全部揭晓
    // 间歇的最后一周也要结算突破进度——原来只有「进入下一周」才结算，
    // 最后一周练的操作直接被转场吞掉，三周连击永远卡在 2/3
    if(typeof btkWeekEnd==="function"&&S.off.next!=="intl") btkWeekEnd();
    const nx=S.off.next; S.off=null;
    if(nx==="poEnd"){                                     // 别人的季后赛落幕 -> 赛段结算
      const pe=S.pendingEnd; S.pendingEnd=null;
      endSeason(pe?pe.result:null, pe?pe.seed:7); return;
    }
    if(nx==="intl"){                                      // 集结结束 -> 出征
      const pi=S.pendingIntl; S.pendingIntl=null;
      if(pi){
        S.afterIntlGo = pi.type==="msi" ? "summer" : "offseason";
        if(startIntl(pi.type,pi.result)) return;
        // 名额判定的边缘情况（理论上到不了这里）：退回围观
        S.afterIntlGo=null; spectateIntl(pi.type); return;
      }
      S.step="offseason"; render(); return;
    }
    if(nx==="wrap"){                                      // 世界赛落幕 -> 赛季结算页
      S.step="offseason";
      if(typeof saveGame==='function') saveGame('赛季结算');
      render(); return;
    }
    if(nx==="summer"){
      // 季中间歇也是注册窗口：LDL 打得好，夏季赛能直接调上一队——
      // 现实里升降就是跟着转会/注册窗走的，不用等到年底
      if(typeof checkPromote==="function") checkPromote();
      if(S.promoteDeal){
        // 调令没批完不开赛：赛程是按你所在的队排的，先表态再进夏季赛
        S.off={week:1,weeks:1,next:"summer",label:"季中注册窗 · 调令待决"};
        S.ap=0; render(); return;
      }
      startSeason(false,1); return;
    }
    if(nx==="playoff"){ startPlayoff(); return; }         // 休整结束 -> 季后赛
    finishOffseason(); return;
  }
  S.off.week++;
  S.ap=(S.off.next==="intl")?2:apFor("off");
  if(S.off.next==="intl"&&S.btk) S.btk.apWeek=2;
  if(S.assets&&S.assets.apt) addFat(-4);
  if(typeof weeklyEcho==="function") weeklyEcho();
  if(S.off.next!=="intl") addFat(-14);
  // 休赛期/间歇周也要结算突破进度——原来只有赛季周结算，
  // 玩家在休赛期连练三周操作，计数器纹丝不动。
  // 出征周只有 1 点，练不满是制度问题不是玩家问题：不计数也不清零。
  if(typeof btkWeekEnd==="function"){
    if(S.off.next==="intl"){ if(S.btk) S.btk.opThisWeek=0; }
    else btkWeekEnd();
  }
  flushBreakNews(S.off.week);
  if(typeof tickBuffs==='function') tickBuffs();
  if(typeof fanWeek==='function') fanWeek();
  if(typeof questWeek==='function') questWeek();
  if(typeof tryRandomEvent==='function'&&rnd()<0.16) tryRandomEvent();
  if(typeof saveGame==='function') saveGame('休赛期第'+S.off.week+'周');
  render();
}
function finishOffseason(){
  S.si++; S.age++;
  S.yearBase=0;              // 新的一年，全年计数从头开始
  S.miniPatch=null; S.patchClock=0;   // 新版本年，热修编号从 .1 重数
  const news=ageWorld();
  // 玩家自己的年龄曲线
  const base=ageCurve(S.age);
  DIMS.forEach(d=>{
    const delta=base*(base>0?0:DECAY_W[d]);
    if(delta<0) S.attrs[d]=clamp(S.attrs[d]+delta,20,capOf(d));
  });
  news.unshift(`<div class="hi">— ${SEASONS[S.si].tag} ${SEASONS[S.si].y}：版本「${SEASONS[S.si].ver}」· ${SEASONS[S.si].story} —</div>`);
  S.news=S.news.concat(news);
  S.fatigue=0; S.buff={};
  if(S.gotCut){
    S.gotCut=false;
    const rk=lplRank(), weak=rk[rk.length-1-Math.floor(rnd()*3)];
    const old=S.team;
    S.team=weak.n; S.promoted=true; S.understudy=null; S.offerKind="core";
    const t=myTeam();
    t.players=t.players.map(q=>q.pos===S.pos?{id:S.name||"你",cn:"",pos:S.pos,age:S.age,r:S.attrs,me:true}:q);
    S.trust={}; initTrust();
    S.everCut=true;
    pushEvent(`<b>${old}</b> 没有和你续约。你最后签到了 <b>${S.team}</b>——从头再来。`,"bad","合同");
  }
  syncTrust();
  startSeason(false,0);
}

/* 休赛期的行动面板：没有比赛，其余照常 */

  if(S.tryout) return tryoutCard();
  if(S.deal)   return dealCard();
  const nx=SEASONS[S.si+1];
  return `${typeof proOfferCard==="function"?proOfferCard():""}
  <div class="card">
    <h2>${S.off.label||"休赛期"}<em>第 ${S.off.week}/${S.off.weeks} 周 · 剩余行动点 ${S.ap}</em></h2>
    <p class="note">没有比赛要打。${S.off.next==="playoff"
      ? `接下来就是 <b>季后赛</b>——把体能和状态调到最好，一场定生死。`
      : S.off.next==="poEnd"
      ? `季后赛正在进行——<b>没有你</b>。结果会一轮一轮传过来，你能做的只有把这段时间用在自己身上。`
      : S.off.next==="intl"
      ? `接下来就是 <b>${S.pendingIntl&&S.pendingIntl.type==="msi"?"MSI":"世界赛"}</b>。抽签在出征时揭晓——这几天把体能和状态调到最好。`
      : S.off.next==="wrap"

      : S.off.next==="summer"
      ? `接下来是 <b>${SEASONS[S.si].tag} 夏季赛</b>，还是吃 <b>${SEASONS[S.si].dim}</b>。`
      : (nx?`下赛季是 <b>${nx.tag} ${nx.y}</b>，版本「${nx.ver}」，吃 <b>${nx.dim}</b>——现在补这一项最划算。`:"")}</p>
    ${typeof btkChaseNote==="function"?btkChaseNote():""}
    ${fatigueBar()}
    ${typeof routineBar==="function"?routineBar():""}
    <div class="grid g5">
      ${DIMS.map(d=>{const b=trainBtn(d,S.ap);
        return `<button class="act" data-train="${d}" title="${b.tip||''}" ${b.dis?'disabled style="opacity:.34"':''} ${b.style}>
        <div class="t">${b.title}</div><div class="d">${b.desc}</div></button>`}).join("")}
      <button class="act" data-do="solo" ${S.ap<=0?'disabled style="opacity:.34"':''}>
        <div class="t">打排位</div><div class="d">五项小涨 + 找回手感${
          typeof myForm==="function"?`　<b>状态 ${Math.round(myForm())}</b>`:""}${costSolo()}</div></button>
      <button class="act" data-do="stream" ${S.ap<=0?'disabled style="opacity:.34"':''}>
        <div class="t">${typeof gicon==="function"?gicon("stream",14):""} 直播</div><div class="d">涨人气与收入${costStream()}</div></button>
      <button class="act" data-do="content" ${S.ap<=0?'disabled style="opacity:.34"':''}>
        <div class="t">做内容</div><div class="d">教学 / 高光 / 复盘 / 整活——同样一点，方向不同</div></button>
      <button class="act" data-do="rest" ${S.ap<=0?'disabled style="opacity:.34"':''}>
        <div class="t">休息</div><div class="d">清疲劳，护状态${costRest()}</div></button>
    </div>
    ${typeof squadActs==="function"?squadActs():""}
    ${(()=>{ if(!S.career||typeof txWindowOpen!=="function"||!txWindowOpen()) return "";
      // 挂牌/买断/接触都住进「转会」栏了——这里只提醒窗口开着
      return `<p class="note" style="margin-top:14px"><b style="color:var(--gold)">${txWindowName()}开着。</b>
        挂牌、买断、主动接触都在<b>「转会」栏</b>——想动就趁现在。</p>`;})()}
    <div class="row"><button class="btn" id="offnext" ${S.ap>0?'disabled':''}>
      ${S.ap>0?`还剩 ${S.ap} 个行动点`
        :(S.off.week>=S.off.weeks
            ?(S.off.next==="summer"?`开始夏季赛 →`
             :S.off.next==="playoff"?`进入季后赛 →`
             :S.off.next==="poEnd"?`季后赛落幕 · 赛段结算 →`
             :S.off.next==="wrap"?`世界赛落幕 · 赛季结算 →`

/* ================= 结局 ================= */
function ending(){
  if(S.neverSigned) return {n:"没能上岸",
    d:`到 2026 年，你始终没能签下第一份职业合同。排位打到过 ${rankFull(S.pre?S.pre.rank:0)}，直播间也有过人，但那扇门没有为你开。`};
  if(!S.career) return {n:"没能上岸",
    d:`到最后你也没能签下第一份职业合同。排位打到过 ${rankFull(S.pre?S.pre.rank:0)}，但那扇门没有为你开。`};
  const played=S.career.w+S.career.l, best=S.career.best;
  const msi=S.career.msi||0, worlds=S.career.worlds||0, lg=S.career.leagueTitles||0;
  if(played<18){
    if(msi+worlds+lg>=1) return {n:"板凳冠军",d:"四年里你大部分时间坐在替补席上。队伍捧起了奖杯，合影里有你，但那不是你打下来的。"};
    return {n:"泯然众人",d:"四年过去，你始终没能拿到稳定的首发位。这条路本来就不是所有人都能走通。"};
  }
  if(msi>=1&&worlds>=1) return {n:"破局者",
    d:"MSI 与世界赛，你都拿到了。至暗五年结束在你手上——这个赛区终于有人做到了。"};
  if(worlds>=2) return {n:"王朝",d:"两座世界冠军奖杯。人们开始用你的名字来划分时代。"};
  if(worlds===1) return {n:"世界冠军",
    d:"你捧起了那座奖杯。MSI 还差一座，但没人会因此少记你一分。"};
  if(msi>=1) return {n:"半程加冕",
    d:"MSI 冠军。你证明了 LPL 能赢，只是最重的那一座还没到手。"};
  const depth=S.career.bestIntl||0;
  if(depth>=4) return {n:"无冕之王",
    d:"你站上过世界赛决赛的舞台，然后输掉了它。所有人都知道你有多强，只是没有奖杯。"};
  if(depth>=3) return {n:"四强遗恨",
    d:"两次三次杀进四强，每次都差一口气。LPL 的观众记得你的名字，也记得那些没能翻过去的比赛。"};
  if(depth>=2) return {n:"八强常客",
    d:"你带队年年打进世界赛淘汰赛，然后年年被挡在门外。稳定，但不够。"};
  if(depth>=1) return {n:"赛区功勋",
    d:"你带队打进过世界赛正赛。没能走远，但这五年 LPL 没有塌，有你一份。"};
  if(lg>=1) return {n:"内战之王",d:"你拿过联赛冠军，却始终没能在国际赛场证明什么。五年里，最重的那一步始终没迈出去。"};
  if(best<=4) return {n:"常青树",d:"四强常客。你在联赛里站稳了，不是所有人都能做到这件事。"};
  return {n:"至暗未破",d:"S12 到 S16，五年。你打过、拼过、被记住过，但那座墙始终没有倒。<b>至暗时刻，最终写进了历史。</b>"};
}

function tabBar(list){

function curTab(list){

}
/* 当前所在的功能域，给 #stage 打个标记，卡片左边线和区块标题跟着换色。
   只有这两处换——底色、面板、按钮一律不动，整体还是那个冷蓝夜景。 */
function curZone(){
  const list = S.step==="pre" ? TABS_PRE : S.step==="season" ? TABS_SEASON : null;

  const k=curTab(list), t=list.find(x=>x.k===k);

    <div class="hud-fan"><div class="k">粉丝</div><div class="v" style="font-size:13px">${fanTier()}<small class="mono"> ${fansText()}</small></div>${fanNextNote()}</div>
      <div><div class="k">热度</div><div class="v" style="font-size:13px">${heatTier()}</div>${heatNote()}</div>

/* 常驻属性条：贴在页面顶部，滚到哪都能看见。
   玩家原话：「做决策时忘了自己的强项是什么」——五维只在属性卡里，
   切个 tab 就没了。这里只放名称和数字，最强的一维标金色。 */
function pinbar(){
  const p=$("pin"); if(!p) return;
  if(!S||S.step==="create"||!S.attrs){ p.classList.add("hide"); return; }
  p.classList.remove("hide");
  const top=DIMS.reduce((a,d)=>S.attrs[a]>=S.attrs[d]?a:d);
  // 行动点放最前面——这是每周最要紧的操作数字，有剩余时亮金色
  const ap=(S.step==="pre"&&S.pre)?S.pre.ap
          :(S.step==="season"||S.step==="prep"||S.step==="offseason")?S.ap:null;
  p.innerHTML=(ap!==null&&ap!==undefined?`<span class="pv ${ap>0?'top':'dim'}"><i>行动</i><b>${ap}</b></span>`:"")
  +DIMS.map(d=>
    `<span class="pv ${d===top?'top':''}"><i>${d}</i><b>${S.attrs[d].toFixed(0)}</b></span>`
  ).join("")
  +`<span class="pv dim"><i>体能</i><b>${100-Math.round(S.fatigue)}</b></span>`
  +(S.form!==undefined&&S.career?`<span class="pv dim"><i>状态</i><b>${Math.round(myForm())}</b></span>`:"");
}
/* 新的内联阻塞卡出现时把内容区拉到可见位置。
   玩家原话：「新的事件有时候会在下面，我不滑动都看不见」。
   注意只统计真正内联的卡——际遇/结果/夺冠/确认这些全是悬浮居中的遮罩，
   跟滚动位置无关，原来把它们也算进来，玩家点个按钮页面就弹回顶部，
   还得自己滑回去（玩家报的就是这个）。 */
let _lastBlock="";
function blockSig(){
  return [S.cupMatch&&"cm",
    S.tryout&&"to",S.deal&&"dl",
    S.proOffer&&"po",S.streamOffer&&"so",
    (S.pre&&S.pre.invite&&S.pre.invite.pending)&&"iv"].filter(Boolean).join("|");
}
/* 滚到内容区顶部（属性条下面一点），而不是页面绝对顶部——
   页面顶部还有横幅，跳过去反而看不见内容，又得往下滑。 */
function scrollStageTop(){
  try{
    const st=$("stage"); if(!st||!st.getBoundingClientRect) return;
    const pin=$("pin");
    const ph=(pin&&pin.getBoundingClientRect)?pin.getBoundingClientRect().height:0;
    const y=st.getBoundingClientRect().top+(window.scrollY||window.pageYOffset||0)-ph-6;
    window.scrollTo(0,Math.max(0,y));
  }catch(e){}
}
let _renderLock=0;
function render(){
  if(_renderLock>0) return;                 // 托管正在连续处理，等它做完再画
  if(typeof autoSweep==="function"&&S&&S.auto){
    _renderLock++;
    try{ autoSweep(); } finally{ _renderLock--; }
  }
  if(typeof watchRoster==="function") watchRoster();
  hud(); pinbar();
  const body = S.step==="create"?viewCreate()
    : S.step==="pre"?viewPre()
    : S.step==="offer"?viewOffer()
    : S.step==="season"?viewSeason()
    : S.step==="prep"?viewPrep()
    : S.step==="match"?viewMatch()
    : S.step==="offseason"?viewOffseason() : viewEnd();
  const _st=$("stage");
  _st.innerHTML = body
    + (typeof saveBar==="function"?saveBar():"")
    + (typeof achPopCard==="function"?achPopCard():"")
    + (typeof traitUpCard==="function"?traitUpCard():"")
    + (typeof streamOfferCard==="function"?streamOfferCard():"")
    + (typeof confirmCard==="function"?confirmCard():"");
  if(_st.setAttribute) _st.setAttribute("data-zone", curZone());
  /* 大标题只在创建页和结局页铺开。
     进了游戏之后它每一屏都在重复占 237px，而首屏总共才 900px——
     收成一条窄横幅，把地方让给内容。 */
  const _top=$("top");
  if(_top&&_top.classList){
    const full = S.step==="create" || S.step==="end";
    _top.classList[full?"remove":"add"]("compact");
  }
  /* 标签栏要贴在属性条正下方，而属性条高度随宽度变——量一次写进变量，不写死 */
  const _pin=$("pin");
  if(_pin&&_pin.getBoundingClientRect&&document.documentElement&&document.documentElement.style){
    const h=Math.round(_pin.getBoundingClientRect().height);
    document.documentElement.style.setProperty("--pin-h",(h>0?h:0)+"px");
  }
  bind();
  const sig=blockSig();
  if(sig&&sig!==_lastBlock&&typeof window!=="undefined"&&window.scrollTo) scrollStageTop();
  _lastBlock=sig;
}
function bind(){
  const st=$("stage");
  st.querySelectorAll("[data-age]").forEach(b=>b.onclick=()=>{S.ageIdx=+b.dataset.age;render()});
  st.querySelectorAll("[data-bg]").forEach(b=>b.onclick=()=>{
    S.bgPick=b.dataset.bg;
    const bb=bgOf(S.bgPick); if(bb&&bb.origin) S.origin=bb.origin;   // 出身随背景走
    render()});
  const rr=$("reroll"); if(rr) rr.onclick=()=>{S.bgOffer=drawBackgrounds();S.bgPick=null;render()};
  const ru=$("rankupok"); if(ru) ru.onclick=()=>{S.rankUp=null;render()};
  const sy=$("signyes"); if(sy) sy.onclick=()=>{
    const m=S.signup; S.signup=null;
    const tn=$("cupteam");
    if(tn&&S.pre){
      const v=safeName(tn.value);
      S.pre.cupTeam=v||S.pre.cupTeam||safeName((S.name&&S.name!=="无名"?S.name:"无名")+"战队");
    }
    if(typeof addMoney==='function') addMoney('fee',-m.fee); else S.money-=m.fee;
    preLog(`交了 <b>${m.fee} 万</b>报名费，以「<b>${escapeHtml((S.pre&&S.pre.cupTeam)||meName())}</b>」的名义报了 ${m.name}。`,"info");
    enterCup(m.signup);   // 建赛程，第一场按 CUPS[kind].gap 排
    render();             // 报名发生在这一周的开头，答完这一周还没过完
  };
  const sn=$("signno"); if(sn) sn.onclick=()=>{
    const m=S.signup; S.signup=null;
    preLog(`没报 ${m.name}。省下的钱和体力，用在别处。`,"info");
    render();             // 同上：这一周才刚开始，别把它跳掉
  };
  st.querySelectorAll("[data-gear]").forEach(b=>b.onclick=()=>{
    const a=b.dataset.gear.split(":");buyGear(a[0],+a[1]);});
  // 装备栏的「去商城挑」：切到商城并滚到对应外设区
  st.querySelectorAll("[data-goshop]").forEach(b=>b.onclick=()=>{
    const slot=b.dataset.goshop;
    S.shopFocus=slot; S.tab="shop"; render();
    const el=document.getElementById("shopgear-"+slot);
    if(el&&el.scrollIntoView) el.scrollIntoView({block:"center"});
  });
  st.querySelectorAll("[data-course]").forEach(b=>b.onclick=()=>buyCourse(b.dataset.course));
  st.querySelectorAll("[data-relax]").forEach(b=>b.onclick=()=>buyRelax(b.dataset.relax));
  const dc=$("decline"); if(dc) dc.onclick=()=>{S.step="pre";preNextYear();};
  st.querySelectorAll("[data-pos]").forEach(b=>b.onclick=()=>{S.pos=b.dataset.pos;render()});
  st.querySelectorAll("[data-org]").forEach(b=>b.onclick=()=>{S.origin=b.dataset.org;render()});
  st.querySelectorAll("[data-inc]").forEach(b=>b.onclick=()=>{
    const d=b.dataset.inc;if(talentLeft()>0&&S.talent[d]<10){S.talent[d]++;render()}});
  st.querySelectorAll("[data-dec]").forEach(b=>b.onclick=()=>{
    const d=b.dataset.dec;if(S.talent[d]>0){S.talent[d]--;render()}});
  const nm=$("nm"); if(nm) nm.oninput=e=>{S.name=safeName(e.target.value)};
  const go=$("go"); if(go) go.onclick=()=>{
    /* 输入框可能因为重渲染而拿不到值（换一批出身、调天赋都会重画这一页）。
       oninput 已经把名字存进 S.name 了，这里要以「非空者优先」，
       不能拿一个空的 input 把它盖成「无名」——玩家报过名字莫名其妙没了。 */
    S.name=safeName((nm&&nm.value)||S.name||"")||"无名"; S.showStart=true; render(); };
  const sg=$("startgo"); if(sg) sg.onclick=()=>{ S.showStart=false; startPre(); };
  st.querySelectorAll("[data-prolg]").forEach(b=>b.onclick=()=>{S.proLg=b.dataset.prolg;render()});
  st.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render()});
  const _rok=$("rndok"); if(_rok) _rok.onclick=()=>{S.rndResult=null;render()};
  st.querySelectorAll("[data-rnd]").forEach(b=>b.onclick=()=>resolveRandom(+b.dataset.rnd));
  st.querySelectorAll("[data-locker]").forEach(b=>b.onclick=()=>resolveLocker(+b.dataset.locker));
  st.querySelectorAll("[data-spend]").forEach(b=>b.onclick=()=>{
    const x=SPEND[+b.dataset.spend];
    if(S.money>=x.cost&&!(S.buff&&S.buff[x.k])){ if(typeof addMoney==='function') addMoney('team',-x.cost); else S.money-=x.cost; x.run();
      pushEvent(`花 ${x.cost} 万：${x.n}。`,"info","开销");render();}
  });
  st.querySelectorAll("[data-pre]").forEach(b=>b.onclick=()=>preAct(b.dataset.pre));
  st.querySelectorAll("[data-pretrain]").forEach(b=>b.onclick=()=>preAct("train",b.dataset.pretrain));
  const pn=$("prenext"); if(pn&&!S.rndEv&&!S.cupMatch) pn.onclick=()=>{
    // 本周有到点没打的比赛，不能就这么翻页过去
    const due=(typeof dueCups==="function")?dueCups():[];
    if(due.length){
      const c=due[0], nm=CUPS[c.kind].name;
      askConfirm(`${nm}还没打`,
        `<b>${nm}</b> <b>${cupRoundName(c.kind,c.round)}</b>就在本周，对手是 <b>${cupOppName(c.kind)}</b>，你还没上场。<br>
         直接进入下一周就是 <b style="color:var(--red)">弃权</b>——这届比赛到此为止，
         奖金按已经赢下的轮次结算。`,
        "去打这一场", ()=>startCupMatch(c.kind),
        {t:"弃权，进入下一周", fn:()=>{ due.forEach(x=>forfeitCup(x.kind)); preNextWeek(); }});
      return;
    }
    preNextWeek();
  };
  // 年末的报价现在也只是「试训机会」——点了是去试训，不是直接签
  st.querySelectorAll("[data-offer]").forEach(b=>b.onclick=()=>{
    const of=S.pre.offers[+b.dataset.offer];
    const tier={sub:"top",foreign:"top",start:"mid",core:"low"}[of.k]||"mid";
    S.pre.offerPick=+b.dataset.offer;
    S.step="pre";
    startTryout(tier, of.team, CLUB_TIERS[tier].expect);
  });

  /* ---- 试训 · 谈判 ---- */
  const _ivg=$("ivgo"); if(_ivg) _ivg.onclick=()=>{
    const iv=S.pre.invite; iv.pending=false;
    startTryout(iv.tier, iv.team, iv.expect);
  };
  const _ivn=$("ivno"); if(_ivn) _ivn.onclick=()=>{
    const iv=S.pre.invite; iv.pending=false;
    preLog(`婉拒了 <b>${iv.team}</b> 的试训。你想再练一练，也许下次能去更好的地方。`,"info");
    render();
  };
  st.querySelectorAll("[data-tryout]").forEach(b=>b.onclick=()=>resolveTryoutDay(+b.dataset.tryout));
  const _td=$("tryoutdone"); if(_td) _td.onclick=afterTryout;
  st.querySelectorAll("[data-ask]").forEach(b=>b.onclick=()=>askDeal(b.dataset.ask));
  const _ds=$("dealsign"); if(_ds) _ds.onclick=()=>{
    (S.deal&&S.deal.transfer) ? signTransfer() : signDeal(); };
  const _de=$("dealend");  if(_de) _de.onclick=dropDeal;
  const _dn=$("dealno");   if(_dn) _dn.onclick=()=>{
    if(S.deal&&S.deal.transfer){
      askConfirm("拒绝转会",
        `留在 <b>${S.team}</b>，不去 <b>${S.deal.team}</b>。<br>
         <span class="note">这家今年不会再来。</span>`,
        "留下", ()=>{ pushEvent(`最终没有转会，留在 <b>${S.team}</b>。`,"info","转会");
                     S.deal=null; render(); });
      return;
    }
    askConfirm("拒绝这份合同",
    `<b>${S.deal.team}</b> 给的是 <b>${DEAL_TIERS[S.deal.dealTier].n}</b>，年薪 ${S.deal.salary} 万。<br>
     拒了就没了——这家今年不会再来第二次。<br>
     <span class="note">剩下的时间你得练出更好的成绩，才会有更好的队来找你。</span>`,
    "拒绝", declineDeal); };
  st.querySelectorAll("[data-train]").forEach(b=>b.onclick=()=>doTrain(b.dataset.train));
  st.querySelectorAll("[data-cupprep]").forEach(b=>b.onclick=()=>cupPrep(b.dataset.cupprep));
  st.querySelectorAll("[data-cupgo]").forEach(b=>b.onclick=()=>startCupMatch(b.dataset.cupgo));
  st.querySelectorAll("[data-cupnode]").forEach(b=>b.onclick=()=>resolveCupNode(+b.dataset.cupnode));
  const _cd=$("cupdone"); if(_cd) _cd.onclick=cupDismissMatch;
  const _cr=$("cupresok"); if(_cr) _cr.onclick=()=>{S.cupResult=null;render()};
  const _ic=$("intlchampok"); if(_ic) _ic.onclick=()=>{S.intlChamp=null;render()};
  st.querySelectorAll("[data-content]").forEach(b=>b.onclick=()=>{
    if(typeof doContent==="function") doContent(b.dataset.content); });
  const _cc=$("contentcancel"); if(_cc) _cc.onclick=()=>{S.contentPick=null;render()};
  st.querySelectorAll("[data-asset]").forEach(b=>b.onclick=()=>{
    if(typeof buyAsset==="function") buyAsset(b.dataset.asset); });
  const _pok=$("promoteok"); if(_pok) _pok.onclick=()=>{ if(typeof acceptPromote==="function") acceptPromote(); };
  const _pask=$("promoteask"); if(_pask) _pask.onclick=()=>{ if(typeof askPromoteRaise==="function") askPromoteRaise(); };
  const _pno=$("promoteno"); if(_pno) _pno.onclick=()=>{ if(typeof declinePromote==="function") declinePromote(); };
  const _pat=$("patchok"); if(_pat) _pat.onclick=()=>{
    S.patchNote=null; S.patchSeen=(typeof GAME_VER!=="undefined")?GAME_VER:1;
    if(typeof saveGame==="function") saveGame("更新说明已读"); render(); };
  const _pp=$("prepgo"); if(_pp) _pp.onclick=prepGo;
  const _off=$("offnext"); if(_off) _off.onclick=offNextWeek;
  const _pg=$("pofgo"); if(_pg) _pg.onclick=takeProOffer;
  const _pn=$("pofno"); if(_pn) _pn.onclick=dropProOffer;
  const _at=$("askTransfer"); if(_at) _at.onclick=()=>askTransfer();
  st.querySelectorAll("[data-approach]").forEach(b=>b.onclick=()=>{
    if(typeof approachTeam==="function") approachTeam(b.dataset.approach); });
  const _bo=$("doBuyout"); if(_bo) _bo.onclick=()=>askConfirm("买断合同？",
    `自己掏 <b>${(S.contract&&S.contract.buyout)||0} 万</b>解约，立刻成为自由身。<br>
     <span class="note">这笔钱不退。经理和教练会记着，更衣室也会知道。
     好处是从此没人拦着你，别的队也不用替你付违约金。</span>`,
    "掏钱走人", ()=>doBuyout());
  const _sy2=$("strmyes"); if(_sy2) _sy2.onclick=()=>signStreamDeal();
  const _sc2=$("strmclub"); if(_sc2) _sc2.onclick=()=>signStreamDeal("club");
  const _sr2=$("strmrival"); if(_sr2) _sr2.onclick=()=>signStreamDeal("rival");
  const _sn2=$("strmno"); if(_sn2) _sn2.onclick=declineStreamDeal;
  // ---- 托管 ----
  const _aA=$("autoAll"); if(_aA) _aA.onclick=()=>{
    if(!autoAllOn()){
      askConfirm("一键全托管？",
        `采购、商务、日常会按推荐自动处理——这些是杂事，交出去没什么可惜的。<br>
         但它<b>也包含「生涯」</b>：试训、转会、合同、下放都不再问你。<br>
         <span class="note">想只交杂事的话，点下面四格里的前三个就行。</span>`,
        "全部交出去", ()=>{ autoToggleAll(); },
        {t:"只交杂事", fn:()=>{ S.auto=S.auto||{}; ["buy","biz","daily"].forEach(k=>S.auto[k]=true);
          S.auto.career=false;
          pushEvent(`赛场外的杂事交给团队了：采购、商务、日常按推荐执行。
            <b>生涯（试训/转会/合同）还是你自己定。</b>`,"info","托管"); render(); }});
      return;
    }
    autoToggleAll(); };
  const _aN=$("autoNow"); if(_aN) _aN.onclick=autoOnce;
  const _aB=$("autoBack"); if(_aB) _aB.onclick=()=>{ S.tab="act"; render(); };
  const _aO=$("autoOff"); if(_aO) _aO.onclick=()=>{ AUTO_KEYS.forEach(x=>{S.auto&&(S.auto[x.k]=false)}); render(); };
  st.querySelectorAll("[data-auto]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.auto;
    /* 「生涯」那一档要单独确认。它会替你去试训、替你谈合同、替你签字——
       玩家反馈过「打完城市争霸赛就自动上岸了」，就是误开了这一档：
       打完杯赛触发试训邀请 -> 托管自动去 -> 自动谈 -> 自动签，全程没停。
       那是它该有的行为，但绝不该是手滑点出来的。 */
    if(k==="career" && !autoOn(k)){
      askConfirm("把主线也交出去？",
        `开了这一档，<b>试训、转会、合同、下放</b>全部由推荐自动决定——<br>
         打完杯赛来了试训邀请，它会直接替你去、替你谈、替你签字。<br>
         <span class="note">你还是在打比赛，但「去哪支队、签什么合同」不再问你。
         这是这个游戏的主线，交出去基本等于看别人打。</span>`,
        "交出去", ()=>{ autoSet(k,true); },
        {t:"算了，我自己管", fn:()=>render()});
      return;
    }
    autoSet(k,!autoOn(k)); });
  st.querySelectorAll("[data-reco]").forEach(b=>b.onclick=()=>{
    // 弹窗上的单次「按推荐」：不开托管，也能这一次偷个懒
    const k=b.dataset.reco;
    if(k==="daily") autoDaily();
    else if(k==="biz") autoBiz();
    else if(k==="career") autoCareerStep();
    render(); });
  const _rn=$("renameok");
  if(_rn) _rn.onclick=()=>{
    const el=$("rename"); const v=el?safeName(el.value):"";
    if(!v){ return; }
    const old=S.name; S.name=v;
    pushEvent(`比赛服上的名字换了：<b>${escapeHtml(old||"无名")}</b> → <b>${escapeHtml(v)}</b>。`,"info","赛段");
    render();
  };
  const _tu=$("traitok"); if(_tu) _tu.onclick=()=>{ S.traitUp=null; render(); };
  const _qa=$("quickap"); if(_qa) _qa.onclick=()=>{ if(typeof quickPlan==="function") quickPlan(); };
  const _rtA=$("rtRepeat"); if(_rtA) _rtA.onclick=repeatLast;
  const _rtB=$("rtPlan");   if(_rtB) _rtB.onclick=runPlan;
  const _rtR=$("rtResume"); if(_rtR) _rtR.onclick=()=>{runActs(null,true);render();};
  const _rtX=$("rtDrop");   if(_rtX) _rtX.onclick=()=>{S.exec=null;render();};

  /* ---- 存档 ---- */
  const _sc=$("savecont"); if(_sc) _sc.onclick=()=>{ if(!loadGame()) alert("这个存档读不了，只能重开一局。"); };
  const _sn=$("savenew");  if(_sn) _sn.onclick=()=>askConfirm("重新开一局",
      "上次那个存档会被覆盖，回不来了。","确定重开",()=>{dropSave();S.confirm=null;render();});
  const _sd=$("savedrop"); if(_sd) _sd.onclick=()=>{dropSave();render();};
  const _s1=$("savenow");  if(_s1) _s1.onclick=()=>{ saveGame("手动"); render(); };
  const _s2=$("saveexp");  if(_s2) _s2.onclick=exportSave;
  const _s3=$("saveimp");  if(_s3) _s3.onclick=importSave;
  const _s4=$("saverst");  if(_s4) _s4.onclick=()=>askConfirm("放弃这一局",
      "当前进度会被清掉，从捏人重新开始。<br><span class=\"note\">想留着的话，先「导出」。</span>",
      "放弃并重开",()=>{ dropSave(); location.reload(); });

  /* ---- 通用确认框 ---- */
  const _ap=$("achpopok"); if(_ap) _ap.onclick=()=>{ (S.achPop||[]).shift(); render(); };
  const _ck=$("cfmOk"); if(_ck) _ck.onclick=()=>{ const f=S.confirm&&S.confirm.fn; S.confirm=null; if(f) f(); else render(); };
  const _ca=$("cfmAlt"); if(_ca) _ca.onclick=()=>{ const a=S.confirm&&S.confirm.alt; S.confirm=null; if(a&&a.fn) a.fn(); else render(); };
  const _cn=$("cfmNo"); if(_cn) _cn.onclick=()=>{ S.confirm=null; render(); };
  const _rtC=$("rtSave");   if(_rtC) _rtC.onclick=savePlan;
  const _rtD=$("rtSave2");  if(_rtD) _rtD.onclick=savePlan;
  const _rtE=$("rtClear");  if(_rtE) _rtE.onclick=clearPlan;
  st.querySelectorAll("[data-list]").forEach(b=>b.onclick=()=>doList(b.dataset.list));
  st.querySelectorAll("[data-sign]").forEach(b=>b.onclick=()=>doSign(b.dataset.sign));
  st.querySelectorAll("[data-squad]").forEach(b=>b.onclick=()=>doSquad(b.dataset.squad));
  st.querySelectorAll("[data-do]").forEach(b=>b.onclick=()=>doAction(b.dataset.do));
  const p=$("play"); if(p&&!S.locker) p.onclick=()=>{isBenched()?benchWeek():startMatch(false)};
  const au=$("auto"); if(au) au.onclick=()=>{
    const f=DIMS.reduce((a,b)=>S.talent[a]>=S.talent[b]?a:b);
    askConfirm("自动推进",
      `由系统替你安排：疲劳高就休息，否则练 <b>${f}</b>，然后打完比赛。<br>
       <b>一旦有事情需要你决定，会立刻停下来交回给你</b>——推几周不影响这一点。<br>
       <span class="note">这期间的训练和临场决策都不是你做的。</span>`,
      "推 6 周", ()=>autoRest(f,AUTO_MAX),
      {t:"推到赛季结束", fn:()=>autoRest(f,AUTO_FAR)});
  };
  st.querySelectorAll("[data-node]").forEach(b=>b.onclick=()=>resolveNode(+b.dataset.node));
  const nx=$("next"); if(nx) nx.onclick=nextWeek;
  // 赛后拆解一屏（照 Val Manager）：比分页 → 拆解页 → 下一周
  const pg=$("pmgo"); if(pg) pg.onclick=()=>{S.match.pmSeen=true;render();scrollStageTop();};
  // 比赛档案里的拆解回放
  st.querySelectorAll("[data-pmv]").forEach(b=>b.onclick=()=>{S.pmView=+b.dataset.pmv;render()});
  const pc=$("pmclose"); if(pc) pc.onclick=()=>{S.pmView=null;render()};
  const of=$("off"); if(of) of.onclick=doOffseason;
  st.querySelectorAll("[data-ef]").forEach(b=>b.onclick=()=>{S.evFilter=b.dataset.ef;render()});
  const ag=$("again"); if(ag) ag.onclick=screenCreate;
}

let S=null;
screenCreate();
if(typeof audioInit==="function") audioInit();   // 声音、作者栏版本号、更新日志浮窗
</script>
