<style>
:root{
  --paper:#F4F6F9;--surface:#FFF;--surface-2:#EAEEF4;
  --line:#D3DAE4;--line-soft:#E2E7EE;
  --ink:#16202D;--ink-2:#47566A;--ink-3:#74839A;
  --gold:#9A7118;--gold-bg:#F5EDD8;
  --win:#1D6349;--win-bg:#DDEDE5;
  --loss:#A03D2E;--loss-bg:#F7E2DD;
  --bar:#3D6EA8;--bar-2:#8FA9C9;
  --shadow:0 1px 2px rgba(22,32,45,.05),0 8px 24px -14px rgba(22,32,45,.22);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E141C;--surface:#161E29;--surface-2:#1D2734;
  --line:#2C3846;--line-soft:#232E3B;
  --ink:#E6EBF2;--ink-2:#A3B0C1;--ink-3:#74839A;
  --gold:#D9AC4E;--gold-bg:#2A2313;
  --win:#6DC29C;--win-bg:#14291F;
  --loss:#DE8878;--loss-bg:#2C1A16;
  --bar:#6E9BD1;--bar-2:#3E5A7D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -14px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --paper:#0E141C;--surface:#161E29;--surface-2:#1D2734;
  --line:#2C3846;--line-soft:#232E3B;
  --ink:#E6EBF2;--ink-2:#A3B0C1;--ink-3:#74839A;
  --gold:#D9AC4E;--gold-bg:#2A2313;
  --win:#6DC29C;--win-bg:#14291F;
  --loss:#DE8878;--loss-bg:#2C1A16;
  --bar:#6E9BD1;--bar-2:#3E5A7D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:Archivo,"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;
  font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px 80px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{text-wrap:balance}

.top{padding:34px 0 18px;border-bottom:1px solid var(--line);margin-bottom:20px}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--gold);margin:0 0 9px}
h1{font-size:clamp(28px,5vw,42px);margin:0 0 9px;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--ink-2);margin:0;max-width:62ch;font-size:15px}

.hud{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:10px;overflow:hidden;margin-bottom:20px}
.hud>div{background:var(--surface);padding:10px 15px;flex:1 1 96px}
.hud .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);
  font-family:"IBM Plex Mono",monospace}
.hud .v{font-size:16px;font-weight:650;margin-top:1px}
.hud .v small{font-size:11px;color:var(--ink-3);font-weight:400}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.card h2{font-size:11.5px;letter-spacing:.15em;text-transform:uppercase;
  font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--ink-3);
  margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line-soft);
  display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card h2 em{font-style:normal;color:var(--gold);text-transform:none;letter-spacing:.02em}
.card h3{font-size:16.5px;margin:0 0 7px;font-weight:650}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.two{grid-template-columns:1fr}}

.grid{display:grid;gap:9px}
.g5{grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.opt{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;
  padding:13px;text-align:left;color:var(--ink);transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--gold)}
.opt.on{border-color:var(--gold);background:var(--gold-bg)}
.opt .t{font-weight:650;font-size:15px}
.opt .d{font-size:12.5px;color:var(--ink-2);margin-top:3px;line-height:1.5}

.tal{display:flex;align-items:center;gap:13px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.tal:last-child{border-bottom:none}
.tal .nm{width:54px;font-weight:650;flex:none}
.tal .desc{flex:1;font-size:12.5px;color:var(--ink-3);line-height:1.45}
.tal .ctl{display:flex;align-items:center;gap:7px;flex:none}
.tal button{width:29px;height:29px;border-radius:7px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--ink);font-size:16px;line-height:1;font-weight:600}
.tal button:disabled{opacity:.3;cursor:not-allowed}
.tal .n{width:24px;text-align:center;font-size:17px;font-weight:650}
.tal .cap{width:70px;text-align:right;font-size:11px;color:var(--ink-3)}

.attrs{display:flex;flex-direction:column;gap:8px}
.at{display:grid;grid-template-columns:50px 1fr 78px;align-items:center;gap:11px}
.at .lb{font-size:13px;font-weight:600}
.track{height:7px;background:var(--surface-2);border-radius:99px;position:relative;overflow:visible}
.fill{height:7px;background:var(--bar);border-radius:99px;transition:width .4s ease}
.capline{position:absolute;top:-2px;width:2px;height:11px;background:var(--ink-3);opacity:.55}
.at .vn{font-size:12px;color:var(--ink-2);text-align:right}
.at .vn b{color:var(--ink);font-size:13.5px}
.at .vn .up{color:var(--win)} .at .vn .dn{color:var(--loss)}

.act{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;
  padding:12px;text-align:left;color:var(--ink)}
.act:hover{border-color:var(--gold)}
.act .t{font-weight:650;font-size:14px}
.act .d{font-size:11.5px;color:var(--ink-3);margin-top:2px}

.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;margin-bottom:14px}
.side{text-align:center}
.side .nm{font-weight:650;font-size:15.5px}
.side .pw{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.score{font-family:"IBM Plex Mono",monospace;font-size:29px;font-weight:600;letter-spacing:.04em}
.log{background:var(--surface-2);border-radius:9px;padding:13px 15px;margin:12px 0;
  max-height:250px;overflow-y:auto;font-size:13px;line-height:1.65}
.log div{padding:2px 0;border-bottom:1px solid var(--line-soft)}
.log div:last-child{border-bottom:none}
.log .w{color:var(--win);font-weight:600}
.log .l{color:var(--loss);font-weight:600}
.log .hi{color:var(--gold);font-weight:600}

.node{background:var(--gold-bg);border:1px solid var(--gold);border-radius:10px;
  padding:15px 17px;margin:12px 0}
.node .q{font-weight:650;margin-bottom:3px}
.node .ctx{font-size:12.5px;color:var(--ink-2);margin-bottom:11px}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:9px}
table{width:100%;border-collapse:collapse;background:var(--surface);font-size:13px}
th{text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);
  font-family:"IBM Plex Mono",monospace;white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid var(--line-soft)}
tr:last-child td{border-bottom:none}
td.n{font-family:"IBM Plex Mono",monospace;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.me td{background:var(--gold-bg);font-weight:600}
tr.cut td{border-bottom:2px solid var(--ink-3)}

.btn{background:var(--ink);color:var(--paper);border:none;border-radius:9px;
  padding:11px 24px;font-weight:650;font-size:15px}
.btn:disabled{opacity:.32;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:8px 15px;font-size:13.5px}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:14px}
input[type=text]{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;
  padding:10px 13px;color:var(--ink);font-size:15px;width:210px}
.hide{display:none}
.note{font-size:12.5px;color:var(--ink-3);margin-top:9px;line-height:1.6}
.tag{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:99px;
  background:var(--surface-2);color:var(--ink-2);margin-left:5px}
.tag.w{background:var(--win-bg);color:var(--win)}
.tag.l{background:var(--loss-bg);color:var(--loss)}
.tag.g{background:var(--gold-bg);color:var(--gold)}
.ver{background:var(--surface-2);border-left:3px solid var(--gold);border-radius:8px;
  padding:12px 15px;margin:12px 0;font-size:13.5px}
.ver b{color:var(--gold)}
/* 下一场 */
.next{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;
  background:var(--surface-2);border-radius:10px;padding:16px 18px;margin-bottom:12px}
.next .sd{text-align:center}
.next .sd .nm{font-weight:650;font-size:16px}
.next .sd .pw{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3);margin-top:2px}
.next .mid{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--gold);
  letter-spacing:.1em;text-align:center}
.oppinfo{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chipx{font-size:11.5px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:99px;padding:3px 10px;color:var(--ink-2)}
.chipx b{color:var(--ink)}
.forms{display:inline-flex;gap:3px;margin-left:4px;vertical-align:middle}
.forms i{width:7px;height:7px;border-radius:2px;background:var(--ink-3);display:inline-block;font-style:normal}
.forms i.w{background:var(--win)} .forms i.l{background:var(--loss)}

/* 大事记 */
.feed{display:flex;flex-direction:column;gap:0;max-height:420px;overflow-y:auto}
.ev{display:grid;grid-template-columns:auto 1fr;gap:11px;padding:11px 2px;
  border-bottom:1px solid var(--line-soft);align-items:start}
.ev:last-child{border-bottom:none}
.ev .tg{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.08em;
  padding:3px 7px;border-radius:5px;background:var(--surface-2);color:var(--ink-3);
  white-space:nowrap;margin-top:2px}
.ev.big .tg{background:var(--gold-bg);color:var(--gold)}
.ev.good .tg{background:var(--win-bg);color:var(--win)}
.ev.bad .tg{background:var(--loss-bg);color:var(--loss)}
.ev .tx{font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.ev.big .tx{color:var(--ink);font-weight:500}
.ev .tm{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);margin-left:6px}
.filt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filt button{font-size:11.5px;padding:4px 11px;border-radius:99px;border:1px solid var(--line);
  background:transparent;color:var(--ink-2)}
.filt button.on{background:var(--gold-bg);border-color:var(--gold);color:var(--gold);font-weight:600}
.big{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:8px 0}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
