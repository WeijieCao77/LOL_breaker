<script>
const DATA = __GAME_DATA__;
/* 像素头像（可选）：data/photos/ 里的照片经 make_avatars.py 烤成 24x24。

/* ================= 常量 ================= */

  体质:"赛季耐久，生涯后期明显下滑"
};
const POS=[{k:"top",n:"上单"},{k:"jng",n:"打野"},{k:"mid",n:"中单"},{k:"bot",n:"AD"},{k:"sup",n:"辅助"}];
const POSN={top:"上单",jng:"打野",mid:"中单",bot:"AD",sup:"辅助"};
const ORIGIN={
  streamer:{n:"主播出身",d:"人气高、直播收益好；体质与运营底子薄",
    base:{操作:59,运营:50,心态:55,指挥:51,体质:48},fame:62,
    perk:"流量加持：直播收益 +60%"},
  academy:{n:"青训出身",d:"操作与运营扎实；人气低、期待压力大",
    base:{操作:64,运营:60,心态:50,指挥:53,体质:58},fame:14,
    perk:"科班底子：训练收益 +20%"}
};
/* 出道年龄：小的起点低但成长快，大的起点高但成长慢。
   衰退（ageCurve）2026-09-06 起从 24 岁起扣属性：20 岁出道最后一年、21 岁出道最后两年会尝到；
   17-19 岁出道整个生涯都在巅峰窗口里。

    所以要么别写，要么给一个真会下滑的选项。两个都做了。） */
const AGES=[
  {a:17,n:"17 岁",d:"手最快的年纪，也最沉不住气",
   mod:{操作:+3,运营:-3,心态:-3,指挥:-4,体质:+2}, grow:1.10, note:"成长最快，收尾时正当打"},
  {a:18,n:"18 岁",d:"最常见的出道年龄", mod:{}, grow:1.00, note:"没有偏科"},
  {a:19,n:"19 岁",d:"多打了一年，脑子清楚一些",
   mod:{操作:-2,运营:+2,心态:+2,指挥:+3,体质:-1}, grow:0.95, note:"起点更高，成长稍慢"},
  {a:20,n:"20 岁",d:"起步晚，但想得明白",
   mod:{操作:-4,运营:+4,心态:+4,指挥:+6,体质:-2}, grow:0.88, note:"开局强，最后一年会开始走下坡"},
  {a:21,n:"21 岁",d:"大器晚成，几乎没有试错时间",
   mod:{操作:-6,运营:+6,心态:+6,指挥:+8,体质:-3}, grow:0.82, note:"起点最高——但最后两年都在走下坡"}
];
const TOTAL_TALENT=20, WEEKS=7;   // 一个赛段 7 周 x 2 赛段 x 5 赛季 = 70 周
/* 节点模板扩到 34 个之后，加长赛季不会变重复——
   之前 5 周是因为 8 个模板反复出现，现在瓶颈解除了。 */
/* 胜率对实力差的敏感度：刻意压低。
   真实电竞里最强的队面对全联盟也只能拿下六成上下，不是碾压——
   数值只决定每局胜率，不保证结果。SPREAD 越大越接近这个事实。 */
/* 真实赛季胜率进战力的权重。LEC 的 wr 跨度 0.19–0.68，
   个人数据只反映五个人的账面，配合/教练/BP/版本理解全在 wr 里。
   权重给到 28：LPL 的 wr 跨度 0.27–0.68，折成 ±5.7 分，
   足以让「真实成绩好的队」稳稳排在前面——玩家报的

const WR_WEIGHT=28;
const SPREAD=16;   // 统一标尺把队伍战力差放大了（明星 ×2.2），sigmoid 的坡跟着放宽——
                   // 13.5 时强队碾压一切（MSI 12%），20 又把主角建立的优势也磨平了（4%），16 居中
/* 行动力按「实际有多少事可做」给，不是固定值：
   赛季中要打比赛、体能吃紧，能安排的事其实少；
   职业前和休赛期窗口全开，能做的事多得多。
   受伤时也给少一点——你本来就动不了。 */
/* 赛段从 5 周拉到 7 周，每周点数就要相应下调——
   否则总行动点从 20 涨到 28，成长速度凭空多了四成。
   目标是「比赛更多、成长不变」：内容变长，强度不变。 */
/* AP_OFF 原来是 6，和职业前一样。但加了季中间歇、季后赛前休整、

   实测 MSI 冠军率被抬到 45%。间歇期该有价值（没有比赛要打），

/* 3 -> 4：玩家反馈赛季周只有 3 点，九个行动按钮加四个战队行动，

   每周训练总量 4×0.8=3.2 对 3×1.0=3.0，只多 7%。
   改完照例跑 120 局对比冠军率，通胀就回调。 */
/* ---------- 更新日志 ----------
   每次上线在数组头部加一条：改了什么、什么时候上的。
   三个读者：右下角 📜 浮窗（全部历史）、老档读档弹窗（最新一条）、
   存档栏版本戳（第一条的 v）。玩家拍板：从这一版开始记，之前的不补。 */

  {y:2025,tag:"S15",ver:"无畏征召",fav:["mid","jng"],dim:"指挥",fearless:true,
   story:"无畏征召元年——同一个英雄一个系列赛只能用一次。英雄池深的人笑了。",
   msi:{mode:"double",playin:{teams:4,take:2,bo:3}},
   worlds:{playin:{teams:8,take:2,bo:3},main:"swiss"}},
  {y:2026,tag:"S16",ver:"中野联动",fav:["mid","jng"],dim:"运营",fearless:true,
   story:"最后一年。再拿不下，至暗时刻就写进历史了。",
   msi:{mode:"double",playin:{teams:4,take:1,bo:3}},      // 2026 入围只取 1
   worlds:{playin:{teams:4,take:1,bo:3},main:"swiss"}}    // 2026 入围 4 队取 1
];

/* ================= 工具 ================= */
const $=id=>document.getElementById(id);
const rnd=()=>Math.random();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
/* 数值统一量化到一位小数。
   信任、默契这类池子每赛段都做「×0.32 向 50 回归」，浮点尾巴会越滚越长，
   最后 47.60402559999999 这种数直接印在界面上。在写入的地方掐掉尾巴，
   显示层就永远不用提防它——0.1 的精度对平衡毫无影响。 */
const q1=v=>Math.round(v*10)/10;
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const mult=t=>0.40+t*0.16;

/* ================= 统一实力标尺（2026-09-02 玩家拍板的大重锚） =================
   从路人到世界第一只有一把尺子，天梯只是它下半段的显示器：
   钻石45 · 大师55 · 宗师60(职业门槛) · 王者65(=LPL平均) · 前十77，
   综合 81 以上天梯已无法区分——Faker 档 88-90，排位读数一样是「国服第一」。
   世界数据整体 +15 并按赛区定锚（见 REGION_ANCHOR），玩家开局属性不动：
   开局 ~45 恰好就是新尺上的钻石门口，前期节奏和过去一致。 */
/* 统一实力尺（2026-09-05 玩家拍板：「基础实力只有一个数据」）：
   曲线的横轴现在是五维均值（strength），不再是操作加权的「排位实力」。
   整体左移 5.5——那是同一个人两种算法的系统差（开局 48 vs 42.6，满练 75 vs 69），
   所以天梯的爬升节奏与迁移前一致。对表：LDL 均值 58 ≈ 宗师、LPL 均值 65 ≈ 国服前 100 边缘、
   明星 75+ ≈ 国服第一档；玩家开局 42.6 ≈ 钻石。 */
/* 2026-09-05 尺顶重新对表（玩家拍板）：全体系 +5 之后，LPL 首发整体进国服前 100
   （门 62 ≈ LPL 首发的 p10），明星 85-90 = 国服第一档，前 10 的门 78。
   下半段（钻石 44.5→王者 59）是玩家开局到出道的路，节奏与换尺前一致。 */
const RANK_CURVE=[[34.5,0],[39.5,12],[44.5,26],[52,44],[56.5,60],[59,74],[62,86],[78,95],[85,100]];
function skillToRank(s){
  const C=RANK_CURVE;
  if(s<=C[0][0]) return 0;
  for(let i=1;i<C.length;i++){
    if(s<=C[i][0]){
      const s0=C[i-1][0],r0=C[i-1][1],s1=C[i][0],r1=C[i][1];
      return r0+(r1-r0)*(s-s0)/(s1-s0);
    }
  }
  return 100;
}
function rankToSkill(r){
  const C=RANK_CURVE;
  if(r<=0) return C[0][0];
  for(let i=1;i<C.length;i++){
    if(r<=C[i][1]){
      const s0=C[i-1][0],r0=C[i-1][1],s1=C[i][0],r1=C[i][1];
      return s0+(s1-s0)*(r-r0)/(r1-r0);
    }
  }
  return C[C.length-1][0];
}
/* 天花板重锚：天赋1→54≈大师边，天赋5→70≈一线主力封顶，天赋10→90＝顶级职业；
   加上突破双池（机械4+里程碑5）最高 99——苦练+多冠稳定站上 95+，
   超过世界上任何一个职业选手（Faker 档 88-90）。天赋依然主导。 */
/* 2026-09-05 全体系 +5（玩家拍板）：天赋 10 的维度基础上限 95，加突破池 +13 顶到 99；
   均衡 4 点 71+13=84 ≈ 明星下沿。试过再多抬 5（60+4t）：机器人末态五维全顶上限、实力 81.5，
   MSI/世界赛率从 16/21 飙到 45/45——上限每多 1 分都是难度决策，不在这次换尺里偷渡 */
const SCALE_SHIFT=5;   // 2026-09-05 全体系平移量：凡是「属性/上限」这种比值，都先减掉它再算
const cap=t=>55+t*4;
/* 上限池分两个：机械/环境路径一个，里程碑经历一个。
   原来只有一个 6 点的池，强队、老将、复盘这些「肯做就有」的来源先到先得，
   等你真的捧起 MSI 奖杯，池子里只剩零头——玩家实测夺冠时刻只 +0.7，
   一辈子最大的时刻拿到最小的数，这不对。
   分池之后：机械路径刷得再满，也占不掉冠军该有的份量。 */
const CAP_MECH_MAX=6;     // 机械/环境路径最多顶开这么多——肯练就拿得到的部分
const CAP_MILE_MAX=7;     // 里程碑经历（夺冠这类一辈子没几次的时刻）单独一池
/* 统一标尺校准：世界 +15 后主角对联赛的携带优势从 +32 缩到 +17，冠军引擎熄火
   （实测 MSI 从 50% 掉到 9%）。池子 4+5→6+7 把「苦练」的上限还给主角：
   主修维度满突破 78+13=91，压过 Faker 档——「95+ 超越所有职业」这句由此兑现。 */
const CAP_MAX_BONUS=CAP_MECH_MAX+CAP_MILE_MAX;

/* 实际瓶颈 = 天赋上限 + 经历顶开的部分 */
/* 经验顶瓶颈（2026-09-06 玩家拍板，变体 B4）：每打完一个赛段所有维度上限 +0.3，最多 +3——练满从 71 到 74，明星线留给突破。
   B（+1/赛段）把世界赛冠军率打到 36%、B′（+0.5）26%、B″（+0.5 + 贴顶衰减 35%）19%——上限就是难度本身；B4 在噪声带内。 */
const CAP_EXP_STEP=0.3, CAP_EXP_MAX=3;
function capOf(d){
  return cap(S.talent[d])+((S.capBonus&&S.capBonus[d])||0)+((S&&S.capExp)||0);
}
function initCapBonus(){ S.capBonus={}; S.capMile={}; DIMS.forEach(d=>{S.capBonus[d]=0;S.capMile[d]=0;}); }
function capMileOf(d){ return (S.capMile&&S.capMile[d])||0; }
/* 旧档没有 capMile：整个 capBonus 都按机械算（他们那 6 点本来就是单池攒的），
   机械池视为已满、里程碑池从零开始——老玩家夺冠照样拿整份奖励。 */
function capMechOf(d){ return Math.max(0,((S.capBonus&&S.capBonus[d])||0)-capMileOf(d)); }
/* 顶开瓶颈：同一个来源只算一次。kind==="mile" 走里程碑池 */
function breakthrough(d,n,reason,key,kind){
  if(!S.capBonus) initCapBonus();
  if(key){ S.capSeen=S.capSeen||{}; if(S.capSeen[key]) return; S.capSeen[key]=1; }
  S.capMile=S.capMile||{};
  const before=S.capBonus[d];
  let got;
  if(kind==="mile"){
    // 里程碑内部也递减，但保底 0.4：第二座奖杯依然要有份量
    const mile=capMileOf(d);
    const room=clamp(1-mile/CAP_MILE_MAX,0.4,1);
    got=Math.max(0,Math.min(n*room,CAP_MILE_MAX-mile));
    S.capMile[d]=q1(mile+got);
  }else{
    // 递减：已经顶开越多，再往上越难。否则可重复的机械路径会把池子刷穿。
    const mech=capMechOf(d);
    const room=clamp(1-mech/CAP_MECH_MAX,0.12,1);
    got=Math.max(0,Math.min(n*room,CAP_MECH_MAX-mech));
  }
  S.capBonus[d]=q1(clamp(before+got,0,CAP_MAX_BONUS));
  const gotS=(S.capBonus[d]-before).toFixed(1);
  if(+gotS<=0){
    // 里程碑撞上池满不能无声——「+0.0 的夺冠奖励」比没有更伤
    if(kind==="mile")
      pushEvent(`<b>瓶颈已在极限</b>　${reason}<br>
        <span style="color:var(--ink-3)">${d}的上限已经被经历顶到头了——再往上的路，只属于天赋。</span>`,
        "info","突破");
    return;
  }
  const c0=cap(S.talent[d])+before, c1=cap(S.talent[d])+S.capBonus[d];
  pushEvent(`<b>瓶颈松动</b>　${reason}<br>
    <span style="color:var(--cyan)">${d}上限 ${c0.toFixed(1)} → <b>${c1.toFixed(1)}</b>（+${gotS}）</span>`,
    "big","突破");
  checkAch("break");
  // 纯机械成就只认机械路径：夺冠类里程碑（mile）也走 key=undefined，原来会误发「苦练出真章」
  if(key===undefined&&kind!=="mile") checkAch("breakauto");
}
/* ---------- 突破路径 ----------
   每一维都有明确的破法。前三条是机械的：肯这么练就一定拿得到。
   后两条要靠经历——但也写在明面上，不藏着。 */
/* by:"train" 表示「继续练这一项」就能推进——只有操作是这样。
   其余几项撞了瓶颈之后再点训练是没有意义的，界面必须说清楚
   该去做什么，而不是显示一个点了不动的进度条。 */
const BREAK_PATHS={
  操作:{ how:"连续 3 周，每周至少 3 个行动点投在操作上（备战/出征/受伤这类不足 3 点的周自动暂停，不断连击）",
        by:"train", act:"练操作",
        auto:true, gain:2.0,
        prog:()=>`本周 ${S.btk&&S.btk.opThisWeek||0}/3 点 · 已连续 ${clamp(S.btk&&S.btk.opStreak||0,0,3)}/3 周`,
        done:()=>(S.btk&&S.btk.opStreak||0)>=3 },
  运营:{ how:"一个赛段里做满 6 次战术复盘",
        by:"squad", act:"战术复盘（战队行动）",
        auto:true, gain:2.0,
        prog:()=>`${clamp(S.btk&&S.btk.vod||0,0,6)}/6 次`,
        done:()=>(S.btk&&S.btk.vod||0)>=6 },
  体质:{ how:"一个赛段里休息满 12 次（攒满当场兑现；没顶到瓶颈就先攒着，顶到那一刻兑现）",
        // 休息改 1 点碎片档后次数翻倍可得：6→12，真实投入量和原来完全一样
        by:"rest", act:"休息",
        auto:true, gain:1.6,
        prog:()=>`${clamp(S.btk&&S.btk.rest||0,0,12)}/12 次`,
        done:()=>(S.btk&&S.btk.rest||0)>=12 },
  心态:{ how:"在落后的局面里赢下 3 场，或者拿一次冠军",
        by:"play", act:"在比赛里翻盘",
        auto:true, gain:3.0, sweep:true, key:"cb3",
        reason:"你已经在落后的局面里赢过三次。队友开始相信你不会崩。",
        prog:()=>`翻盘 ${clamp(S.comebacks||0,0,3)}/3`,
        done:()=>(S.comebacks||0)>=3||((S.career&&S.career.titles||[]).length>0) },
  指挥:{ how:"和 27 岁以上的老将同队、待在强队，或者打进国际赛",
        by:"env", act:"换环境",
        auto:true, gain:2.4, sweep:true, key:"cmdenv",
        reason:"这一年你身边的人和场面，把你看事情的方式改了。",
        prog:()=>{ const v=myRoster&&S.team?myRoster().find(x=>!x.me&&x.age>=27):null;
                   return v?`队里有 ${v.id}`:((S.career&&S.career.bestIntl)?"打过国际赛":"队里没有老将"); },
        done:()=>{ if(!S.team) return false;
                   const v=myRoster().find(x=>!x.me&&x.age>=27);
                   return !!v || power(myRoster(),0)>=76 || !!(S.career&&S.career.bestIntl); } }
};
/* 机械条件的计数器 */
function initBtk(){ S.btk={opStreak:0,opThisWeek:0,vod:0,rest:0}; }
/* 这条机械路径还付得出钱吗？付不出就直说，别让玩家推死轮。
   两种「到头」：机械池刷满；一次性钥匙（心态的 cb3 这类）已经用过。 */
function btkPathDead(d){
  if(typeof capMechOf==="function"&&capMechOf(d)>=CAP_MECH_MAX-0.01)
    return "机械路径已刷满——再往上要靠<b>冠军</b>这样的里程碑";
  const P=(typeof BREAK_PATHS!=="undefined")?BREAK_PATHS[d]:null;
  if(P&&P.key&&S.capSeen&&S.capSeen[P.key])
    return "这条路的收益已经拿过一次——再往上要靠<b>冠军</b>这样的里程碑";
  return null;
}
/* 机械磨练路径的公共闸：不顶着瓶颈就不存在「顶开」这回事。
   玩家实锤：操作 80/92 随便练三周也弹突破+成就——路径只查计数从不查你在不在瓶颈上。 */
function btkAtCap(d){ return S.attrs&&typeof capOf==="function"&&S.attrs[d]>=capOf(d)-0.05; }
function btkNote(d,n){ S.btk=S.btk||{opStreak:0,opThisWeek:0,vod:0,rest:0};
  if(d==="op") S.btk.opThisWeek+=n;
  else S.btk[d]=(S.btk[d]||0)+n;
  /* 复盘攒满当场兑现。原来拖到赛段结算才发，玩家看着 6/6 毫无动静
     以为坏了（线上报的）；机械池满时也不再静默发 0，直说到头了。 */
  if(d==="vod"&&S.btk.vod>=6&&typeof BREAK_PATHS!=="undefined"&&btkAtCap("运营")){
    const dead=btkPathDead("运营");
    if(dead) pushEvent(`战术复盘做满 6 次——但${dead}。这个计数不再有意义。`,"info","突破");
    else breakthrough("运营",BREAK_PATHS.运营.gain,"整个赛段泡在录像里，你看比赛的方式变了。");
    S.btk.vod=0;
  }
  /* 体质同理（玩家实锤：休息 12/12 却没突破）。原来拖到赛段结算，
     而且结算时还暗查「本赛段个人出场 ≥ 7」——替补席上的场次不算，
     坐过板凳的赛段永远兑不了。现在攒满当场兑现，出场数不再是条件
     （「打满一个赛段」本来就是另一条独立的突破）。 */
  if(d==="rest") btkRestSettle();
}
function btkRestSettle(){
  if(!S.btk||(S.btk.rest||0)<12||typeof BREAK_PATHS==="undefined") return;
  if(!btkAtCap("体质")){
    if(!S.btk.restWait){ S.btk.restWait=true;
      pushEvent(`休息攒满 12 次——但你的体质还没顶到瓶颈（${S.attrs.体质.toFixed(1)}/${capOf("体质").toFixed(0)}）。计数先留着，顶到那一刻兑现。`,"info","突破"); }
    return;
  }
  const dead=btkPathDead("体质");
  if(dead) pushEvent(`休息攒满 12 次——但${dead}。这个计数不再有意义。`,"info","突破");
  else breakthrough("体质",BREAK_PATHS.体质.gain,"这个赛段你把作息守住了，身体给了回报。");
  S.btk.rest=0; S.btk.restWait=false;
}
/* 声明式补发。
   原来心态那条是在「恰好第 3 次翻盘」那一刻用 ===3 触发的，
   而界面读的是 BREAK_PATHS.心态.done()——那个写死 false。
   于是进度条数到 3/3，瓶颈却纹丝不动。
   现在只要条件成立就补发，错过那一瞬间也没关系。 */
function sweepBreakthroughs(){
  if(typeof BREAK_PATHS==="undefined") return;
  DIMS.forEach(d=>{
    const P=BREAK_PATHS[d];
    if(!P||!P.sweep||!P.gain||!P.done) return;
    try{ if(P.done()&&btkAtCap(d)) breakthrough(d,P.gain,P.reason||"条件达成了。",P.key||("path_"+d)); }
    catch(e){}
  });
}

/* 每周结算：操作的连续周数要在周末判定。
   「至少 3 点」在行动点本来就不足 3 的周（受伤 2 点）放宽为「全投也算」——
   否则伤一周连击就断，提示让你做的事你根本做不到。 */
function btkWeekEnd(){
  S.btk=S.btk||{opStreak:0,opThisWeek:0,vod:0,rest:0};
  sweepBreakthroughs();
  if(typeof btkRestSettle==="function") btkRestSettle();   // 之前攒满、后来才顶到瓶颈的，周末补发
  // 审判用这一周「实际发放」的预算（apFor/enterPrep/出征周都会记录）。
  // 玩家实测抓出来的冤案：季后赛备战、出征这些 1 点的段落，把仅有的
  // 点全投操作也凑不满 3，下一次结算却按整周审判——连击被无声清零。
  const budget=(S.btk.apWeek!==undefined)?S.btk.apWeek:6;
  const invested=S.btk.opThisWeek, was=S.btk.opStreak;
  const chasing=S.attrs&&S.attrs.操作>=capOf("操作")-0.05;
  // 异化点数后练一次操作 = 2 点，「练满 3 次」要 6 点预算——
  // 备战/出征/受伤（4 点）的周照旧按暂停处理，不计数也绝不清零
  if(budget<6){
    S.btk.opThisWeek=0;
    if(chasing&&was>0)
      pushEvent(`这段时间精力预算不足，冲击操作瓶颈<b>按暂停处理</b>——连续 ${was}/3 周保留。`,"info","突破");
    return;
  }
  if(invested>=3) S.btk.opStreak++;
  else S.btk.opStreak=0;
  S.btk.opThisWeek=0;
  if(chasing){
    if(invested>=3&&S.btk.opStreak<3)
      pushEvent(`冲击操作瓶颈：本周练满 ${invested} 次，连续 <b>${S.btk.opStreak}/3 周</b>。`,"good","突破");
    // 断了必须说——默默清零就是「练了却没计入」的体感来源
    else if(invested<3&&(was>0||invested>0))
      pushEvent(`冲击操作瓶颈<b>断了</b>：这周只练了 ${invested}/3 次，连续周数清零。要连着 3 周、每周至少练 3 次操作。`,"bad","突破");
  }
  const P=BREAK_PATHS.操作;
  if(P.done()&&btkAtCap("操作")){ breakthrough("操作",P.gain,"连着三周把行动点全砸在操作上，手感磨出来了。");
    S.btk.opStreak=0; }
}
/* 每赛段结算：运营与体质 */
function btkSplitEnd(){
  S.btk=S.btk||{opStreak:0,opThisWeek:0,vod:0,rest:0};
  if(BREAK_PATHS.运营.done()&&btkAtCap("运营")) breakthrough("运营",BREAK_PATHS.运营.gain,"整个赛段泡在录像里，你看比赛的方式变了。");
  if(typeof btkRestSettle==="function") btkRestSettle();
  S.btk.vod=0; S.btk.rest=0; S.btk.restWait=false;
}

/* 每个赛段检查一次「环境带来的成长」 */
function checkBreakthrough(){
  if(!S.team) return;
  const mates=myRoster().filter(x=>!x.me);
  const teamPw=power(myRoster(),0);
  // 待在强队：耳濡目染，指挥与运营的天花板会松
  // 环境类只算一次，否则十个赛段会把天花板顶穿
  if(teamPw>=72){ breakthrough("指挥",2.2,`在 <b>${S.team}</b> 这样的队里待着，你看事情的方式变了。`,"strongteam");
                  breakthrough("运营",1.8,`高强度的训练赛把你的判断磨快了。`,"strongteam2"); }
  // 队里有老将：有人手把手教
  const vet=mates.find(x=>x.age>=27);
  if(vet) breakthrough("指挥",2.4,`<b>${vet.id}</b> 在复盘里把他这些年的东西讲给了你。`,"vet"+vet.id);
  // 更衣室氛围好：心态托底
  if(typeof avgTrust==="function"&&avgTrust()>=68)
    breakthrough("心态",1.8,`这支队伍让你打得很放松。`,"goodroom");
  // 打满一个赛段不缺阵
  if(S.record.w+S.record.l>=WEEKS) breakthrough("体质",1.6,`一个赛段打满，身体扛住了。`,"fullsplit");
}

/* 年龄曲线：操作/体质掉得快，运营/指挥掉得慢甚至涨 */
/* 2026-09-06 玩家拍板：衰退从 24 岁起（原来 25 岁起，五个赛季里只有 21 岁出道够得着）。
   现在 20 岁出道 S16 那年 24、21 岁出道最后两年都在掉——生涯末期随年龄上涨属性会往下走。 */
function ageCurve(age){
  if(age<=21) return 3.6;
  if(age<=23) return 0.6;
  if(age<=25) return -1.6;
  if(age<=27) return -3.6;
  return -6.2;
}
const DECAY_W={操作:1.35,运营:0.35,心态:0.30,指挥:-0.30,体质:1.25};

/* 玩家适应力：天赋越专精越低 —— 专精 build 换版本时更痛 */
function adaptOf(){
  const t=DIMS.map(d=>S.talent[d]);
  const m=avg(t), sd=Math.sqrt(avg(t.map(x=>(x-m)**2)));
  return clamp(52+(S.attrs.运营-50)*0.32-(sd-1.8)*7.5, 18, 96);
}

/* 版本相性：本赛季强调的维度上，你比同行强还是弱。
   原来比的是一条写死的 55 分线——于是「操作是我最高的一项，
   版本吃操作，我却逆版本」这种事天天发生；而且这条线不分联赛，
   LDL 平均才 40 上下，50 分在二队明明是版本受益者。
   现在和所在联赛的真实平均比：版本抬高某一维的权重，全联盟都在吃，
   比同行强才占得到便宜。 */
const VER_DIM_W=0.08;    // 版本关键属性：每高于联赛均线 1 分 → 战力 +0.08（全联盟通用，你的那份走 versionFit）
const VER_TRAIN=1.10;    // 版本答案：本季关键属性的训练收益 ×1.10（教练组重点抓；1.15 批测转会均值 +0.4，收一档）
/* 版本的账，摊开算给玩家看 */
function verInfo(){
  const sea=SEASONS[S.si], d=sea.dim;
  const bar=leagueDimAvg(d), mine=S.attrs[d];
  const rel=(mine-bar)/8, posB=sea.fav.includes(S.pos)?1.6:0, cushion=adaptOf()/100;
  const mini=(typeof miniPatchAdj==="function")?miniPatchAdj():0;
  return {sea,d,bar,mine,rel,posB,cushion,mini,fit:versionFit(),
    parts:{dim:rel*VER_ME_K*2.0, pos:posB*2.0, cushion:(rel<0?rel*-1*cushion*1.4*(VER_ME_K/2.2):0)*2.0, mini}};
}
/* 一支队从版本里拿到多少战力（战力口径，显示时乘 PW_SHOW）：强势位置每人 +1.5，关键属性高于联赛均线的部分 ×VER_DIM_W；你的队再加你的相性 */
function teamVerBonus(team){
  const sea=SEASONS[S.si]; if(!sea||!team) return 0;
  const ps=team.players||[]; let v=0;
  ps.forEach(p=>{
    if(sea.fav.includes(p.pos)) v+=1.5;
    if(!p.me){ const bar=((S.lgAvg||S.baseline)&&(S.lgAvg||S.baseline)[p.lg])||70; const r=p.r||p; if(r[sea.dim]!==undefined) v+=(r[sea.dim]-bar)*VER_DIM_W; }
  });
  // 队均口径：各人的红利位/关键属性项进 s/wt 的平均；你的相性（versionFit）在模拟里是整份加到全队战力上的，
  // 不能再除以五（玩家实锤：行里写「你队 +3.5」，比赛卡却比备战卡高了 9）
  let out=v/Math.max(1,ps.length);
  if(ps.some(p=>p.me)) out+=versionFit();
  return out;
}
function verLine(oppName){
  if(!S.career||!SEASONS[S.si]) return "";
  const sea=SEASONS[S.si];
  const mine=myTeam(), opp=oppName?findTeam(oppName):null;
  const a=pwShow(teamVerBonus(mine)), b=opp?pwShow(teamVerBonus(opp)):null;
  const f=pwShow(versionFit());
  return `<div class="ver" style="margin-top:6px;color:var(--ink-2);font-size:12.5px">版本「${sea.ver}」：你队 <b style="color:${a>=0?'var(--cyan)':'var(--red)'}">${a>=0?"+":""}${a.toFixed(1)}</b>（含你 ${f>=0?"+":""}${f.toFixed(1)}）${
    b!=null?` · 对手 <b style="color:${b>=0?'var(--cyan)':'var(--red)'}">${b>=0?"+":""}${b.toFixed(1)}</b>${b-a>1?'<span style="color:var(--ink-3)">——这个版本更站在他们那边</span>':a-b>1?'<span style="color:var(--ink-3)">——版本站在你们这边</span>':""}`:""}</div>`;
}
function versionCard(){
  const I=verInfo(), sea=I.sea, HL=S.homeLeague||"LPL";
  const s=v=>(v>=0?"+":"")+pwShow(v).toFixed(1);
  const mates=myRoster().filter(p=>!p.me);
  const favMates=mates.filter(p=>sea.fav.includes(p.pos));
  const lg=(S.world&&S.world[HL])||[];
  const top=lg.filter(t=>t.name!==S.team).map(t=>({n:t.name,v:pwShow(teamVerBonus(t))})).sort((a,b)=>b.v-a.v).slice(0,3);
  const label=I.fit>=1.5?"顺风":I.fit>=-0.5?"中性":"逆版本";
  return `<div class="ver">
    <div>版本 <b>${sea.ver}</b>（${sea.tag}）— 强势位置 <b>${sea.fav.map(k=>POSN[k]).join("、")}</b> · 关键属性 <b>${sea.dim}</b>${
      S.miniPatch?`　·　热修 <b>${sea.tag}.${S.miniPatch.n}</b>：${S.miniPatch.dim}权重${S.miniPatch.up?"↑":"↓"}`:""}</div>
    ${uiNum()?`<div style="margin-top:4px">你的相性 <b style="color:${I.fit>=1.5?'var(--cyan)':I.fit>=-0.5?'var(--ink)':'var(--red)'}">${label} ${s(I.fit)}</b> 战力
      <span style="color:var(--ink-3)">= ${sea.dim} ${I.mine.toFixed(0)} vs ${HL}均线 ${I.bar.toFixed(0)}（${s(I.parts.dim)}）${
        I.posB?` + ${POSN[S.pos]}是红利位（${s(I.parts.pos)}）`:""}${I.parts.cushion?` + 适应力缓冲（${s(I.parts.cushion)}）`:""}${I.mini?` + 热修（${s(I.mini)}）`:""}</span></div>
    <div style="margin-top:4px;color:var(--ink-2)">本队：${favMates.length?`${favMates.map(p=>p.id).join("、")} 站在红利位`:"没有队友在红利位"}，全队版本加成 <b>${s(teamVerBonus(myTeam()))}</b>${
      top.length?`　·　本联赛最吃版本的队：${top.map(t=>`${t.n} ${t.v>=0?"+":""}${t.v.toFixed(1)}`).join("、")}`:""}</div>`
    :`<div style="margin-top:4px">你的相性 <b style="color:${I.fit>=1.5?'var(--cyan)':I.fit>=-0.5?'var(--ink)':'var(--red)'}">${label}</b>
      <span style="color:var(--ink-3)">（你的${sea.dim}${I.mine>=I.bar?"高于":"低于"}${HL}均线${I.posB?`，${POSN[S.pos]}是红利位`:""}${I.parts.cushion?"，适应力兜了一手":""}${I.mini?"，热修也有影响":""}）</span></div>
    <div style="margin-top:4px;color:var(--ink-2)">本队：${favMates.length?`${favMates.map(p=>p.id).join("、")} 站在红利位`:"没有队友在红利位"}，版本上${(()=>{const v=teamVerBonus(myTeam());return v>=0.5?"占便宜":v<=-0.5?"吃亏":"不占不亏";})()}${
      top.length?`　·　本联赛最吃版本的队：${top.map(t=>t.n).join("、")}`:""}</div>`}
    <div style="margin-top:4px;color:var(--ink-3);font-size:12px">这一年练 <b>${sea.dim}</b> 收益 ×${VER_TRAIN}（教练组按版本抓训练）；赛后拆解里「版本相性」那一行就是这个数。</div>
  </div>`;
}
function leagueDimAvg(d){
  const lg=S.homeLeague||"LPL";
  const ts=(S.world&&S.world[lg])||[];
  let s=0,n=0;
  ts.forEach(t=>t.players.forEach(p=>{ if(!p.me&&p.r&&p.r[d]!==undefined){ s+=p.r[d]; n++; } }));
  return n?s/n:55;
}
/* 2026-09-06 玩家拍板「弱队冲榜」方案 A：你的版本相性压回 AI 同一把尺。
   原来每高联赛均线 1 分 +0.55 战力（AI 每分只有 0.08，且要和四个队友平均），操作 92 遇上吃操作的赛季一项就 +14.7，
   垫底队直接抬到中游。现在每分 0.16（AI 的两倍——你是全队唯一被行动点培养的人，留一点倾斜），整体封顶 ±6。 */
const VER_ME_K=0.64;      // rel=差/8，×VER_ME_K×2 ＝ 每分 0.16
const VER_ME_CAP=6;
function versionFit(){
  const sea=SEASONS[S.si], d=sea.dim;
  const bar=leagueDimAvg(d);
  const rel=(S.attrs[d]-bar)/8;                 // 你在该维度相对联赛的水平（统一标尺后差值压缩，除数 12→8 补偿）
  const posBonus=sea.fav.includes(S.pos)?1.6:0;
  const cushion=adaptOf()/100;                  // 适应力缓冲逆版本
  const mini=(typeof miniPatchAdj==="function")?miniPatchAdj():0;   // 赛季中热修的小刀
  return clamp((rel*VER_ME_K+posBonus+(rel<0?rel*-1*cushion*1.4*(VER_ME_K/2.2):0))*2.0,-VER_ME_CAP,VER_ME_CAP)+mini;
}

/* LCK 的统治力逐年变化——S12 起步、S14 顶峰、S16 才松动。
   这不是随便配的难度旋钮，它就是「至暗四年」这个设定本身。
   统一标尺后拆成两层：基础实力走赛区锚（LCK 66.5，比 LPL 高 1.5），
   年份状态走这条曲线——S16 归零，主角破局的窗口敞开。 */
const LCK_DYNASTY=[0.8,1.6,2.2,1.2,0];

/* ---------- 赛区定锚与风格（2026-09-02 玩家拍板） ----------
   各赛区数据原本是联赛内标准化（每个联赛平均都是 50）——VCS 的平均值
   和 LPL 一样高，外卡不弱是漏了。现在装进同一把尺：锚定联赛平均，
   风格在维度间重分配（总和≈0，不改均值）：LCK 赢在脑子和纪律，
   LPL 枪最利，VCS 莽是天赋。默契/战术也分赛区（LCK 的强不全在个人数值）。 */
/* 2026-09-05 全体系 +5（玩家拍板：LPL 首发整体进国服前 100、明星 85-90）：差值一分不变，胜率不动 */
const REGION_ANCHOR={LCK:71.5,LPL:70,LEC:68,LCS:66.5,PCS:63,VCS:62.5,LJL:60.5,LLA:60,CBLOL:60,LCO:59,TCL:59.5};
const REGION_STYLE={
  LCK:{运营:2,指挥:1,操作:-2,体质:-1},
  LPL:{操作:2,运营:-1,心态:-1},
  LEC:{指挥:1.5,运营:0.5,操作:-2},
  VCS:{操作:2.5,运营:-2.5}
};
const REGION_SYN={LCK:3,VCS:-2};
/* 把一个联赛整体装进统一标尺：
   ① 均值精确压到赛区锚（数据各联赛均值本就不齐：LCK 56、LCO 43——实测量的）
   ② 离均差不对称放大：向上 ×2（数据的单年 z 标准化把明星压扁了，
      Knight/BeryL 这级别要放大到 88-90 档才对得上「天梯量不动的人」），
      向下 ×1（一线最弱的替补也得站在宗师附近，不能放大成钻石）
   ③ 不对称会让均值上漂，第二遍整体回中
   风格（REGION_STYLE）最后加，维度间重分配不改均值。 */
const SCALE_UP=2.0;   // 2.2 时明星队叠出 88+ 车队，主角的冠军窗被焊死——2.0 是批测出来的平衡点
/* 名望地板：单年比赛数据量不出历史级选手的统治力（实测 2022 数据里
   Faker 的离均差只有 +0.2）。这些名字不该低于他们的江湖地位——
   这是编辑判断，不是数据，所以名单刻意短。 */
const STAR_FLOOR={Faker:87,Chovy:85,Ruler:85,Viper:83,ShowMaker:83,Keria:82,
  Deft:81,Scout:82,TheShy:80,Rookie:80,Xiaohu:79,
  Caps:77,     // 2022 数据把「欧洲之王」量成 66（体质维度异常低）——LEC 春季冠军中单不该低于 LPL 均值
  Jiejie:79};  // S11 冠军打野、2022 数据只量到 72——玩家点名的明星，不该在 LPL 均值边上
function anchorLeague(lg,teams,anchorOverride){
  const anchor=(anchorOverride!==undefined)?anchorOverride:REGION_ANCHOR[lg];
  if(anchor===undefined||!teams||!teams.length) return;
  const st=REGION_STYLE[lg]||{};
  const all=[], wrOf=new Map();
  teams.forEach(t=>(t.players||[]).forEach(p=>{ if(!p.me&&p.r){ all.push(p); wrOf.set(p,(t.wr!==undefined)?t.wr:0.5); } }));
  if(!all.length) return;
  const compOf=p=>avg(DIMS.map(d=>p.r[d]||50));
  const mean=avg(all.map(compOf));
  all.forEach(p=>{
    const dev=compOf(p)-mean;
    /* 明星放大量跟着战队真实胜率走（2026-09-05 玩家点名「具体选手实力要根据比赛数据做平衡」）：
       胜率 50% 以上的队全额放大——这部分是批测校准过的头部格局，一分不动；
       输多赢少的队按胜率打折（39% 的队放 82%，垫底 30% 的队放六成）——
       垫底队刷出来的个人数据不值满额（此前 Astralis 的 Kobbe 被放到世界前 20，压过 TheShy/Rookie）。
       第一版以 0.5 为中心双向缩放，结果 LCK 前二胜率更极端、LPL 头部反被打八折，世界赛率掉了 8 个点——
       2×120 局批测抓的，改成只罚不奖。 */
    const wr=wrOf.get(p);
    const up=(SCALE_UP-1)*clamp(1+(wr-0.5)*1.6,0.6,1.0);
    const add=anchor-mean+(dev>0?dev*up:0);
    DIMS.forEach(d=>{ p.r[d]=q1(clamp((p.r[d]||50)+add+(st[d]||0),35,99)); });
  });
  const drift=avg(all.map(compOf))-anchor;
  if(Math.abs(drift)>0.05)
    all.forEach(p=>DIMS.forEach(d=>{ p.r[d]=q1(clamp(p.r[d]-drift,35,99)); }));
  // 名望地板最后抬（不参与回中——十来个人的零头不值得稀释全联盟）
  all.forEach(p=>{
    const f=STAR_FLOOR[p.id]; if(!f) return;
    const c=compOf(p);
    if(c<f){
      // 抬升量只分给还有余量的维度，分几轮直到均值到地板——
      // Faker 的指挥一抬就顶到 99，单轮均匀加会被截掉 10 分、地板吃不满（实测 84.9 vs 87）
      for(let k=0;k<4;k++){
        const c2=compOf(p); if(c2>=f-0.05) break;
        const room=DIMS.filter(d=>p.r[d]<99); if(!room.length) break;
        const up=(f-c2)*DIMS.length/room.length;
        room.forEach(d=>{ p.r[d]=q1(clamp(p.r[d]+up,35,99)); });
      }
    }
  });
}
function dynastyBonus(players){
  const p=players&&players[0];
  if(!p||p.me||p.lg!=="LCK") return 0;
  return LCK_DYNASTY[S.si]||0;
}

/* 战力：指挥是全队乘数 */
/* 综合实力 = 基础战力 × 默契 × 战术 × 士气 × 指挥 × 体能
   传战队对象时用它自己的默契/战术；传数组时按中性 50 处理。 */
function power(teamOrPlayers,fatigue=0,verFav=null){
  const team=(teamOrPlayers&&teamOrPlayers.players)?teamOrPlayers:null;
  const players=team?team.players:teamOrPlayers;
  return powerCore(players,fatigue,verFav,team);
}
/* AI 队的士气：近六场胜率 → 0.97～1.03。首版 ±0.05 叠上真对阵树把联赛/国际冠军率压过头（批测 2026-09-05），
   幅度收到 ±0.03——结构不动、只调数值 */
function formMorale(team){
  try{
    const f=team&&S.teamForm&&S.teamForm[team.name]; if(!f||f.length<3) return 1;
    const wr=f.reduce((a,b)=>a+b,0)/f.length;
    return 1+(wr-0.5)*0.06;
  }catch(e){ return 1; }
}
function powerCore(players,fatigue=0,verFav=null,team=null){
  let s=0,wt=0,cmd=0;
  players.forEach(p=>{
    const r=(p.me&&S&&S.attrs)?S.attrs:(p.r||p);   // 「你」直读 S.attrs：读档后名单里的拷贝可能是旧的
    // 玩家定的哲学（2026-09-02）：这是五个人的游戏——队友弱，你再强也赢不了。
    // 权重只比普通队友略高（你是拿了行动点培养的那个人），
    // 冠军资格靠转会去强队挣，不靠一个人扛穿弱队。
    const w=p.me?(S.offerKind==="core"?1.6:1.3):1.0;
    let v=r.操作*0.34+r.运营*0.28+r.心态*0.14+r.体质*0.10;
    if(p.me&&typeof injuryHit==="function"){
      v+=injuryHit("操作")*0.34+injuryHit("运营")*0.28+injuryHit("心态")*0.14+injuryHit("体质")*0.10;
    }
    if(p.me&&typeof gearBonus==="function"){
      v+=gearBonus("操作")*0.34+gearBonus("运营")*0.28+gearBonus("体质")*0.10+langBonus();
    }
    if(!p.me&&typeof mateInjuryHit==="function") v+=mateInjuryHit(p);
    if(verFav&&verFav.includes(p.pos)) v+=1.5;
    // 版本关键属性对全联盟生效（2026-09-05 玩家点名「版本相性不能只是一句顺风逆风」）：
    // 队里这一维比本联赛均线高的人吃版本红利、低的人吃亏；你自己的那份走 versionFit
    if(!p.me&&verFav){
      const vd=SEASONS[S.si]&&SEASONS[S.si].dim, bar=((S.lgAvg||S.baseline)&&(S.lgAvg||S.baseline)[p.lg])||70;
      if(vd&&r[vd]!==undefined) v+=(r[vd]-bar)*VER_DIM_W;
    }
    // 人物特质：刺头逆风时更稳，这一下真的进战力
    if(p.me&&typeof traitMul==="function") v+=traitMul("clutch",true);
    // 能力 × 状态：同一个人，今年打成什么样是另一回事
    const fm=(typeof formMul==="function")?(p.me?myFormMul():formMul(p)):1;
    s+=v*fm*w; wt+=w; cmd=Math.max(cmd,r.指挥);
  });
  const mine=players.some(x=>x.me);
  // 士气：你的队看信任（trustMod），AI 队看近六场战绩（连胜 ×1.05、连败 ×0.95）——两边都有，不再偏袒
  const tm=(mine&&typeof trustMod==="function"&&S.trust)?trustMod():formMorale(team);
  // 默契与战术：自己的队看 S.squad，别人的队看它自己的（真实战绩反推）
  const syn=mine?(typeof squadOf==="function"?squadOf("syn"):50):(team&&team.syn!==undefined?team.syn:50);
  const tac=mine?(typeof squadOf==="function"?squadOf("tac"):50):(team&&team.tac!==undefined?team.tac:50);
  const rm=(mine&&typeof relMod==='function')?relMod():1;
  const sq=(1+(syn-50)/950)*(1+(tac-50)/1100)*rm;
  /* 队伍强度不只是五个人的均值。
     配合、教练、BP、版本理解——这些个人数据里都没有，但真实赛季胜率捕捉得到。
     数据里本来就带着每支队的 wr（LEC 2022：G2 68% / Excel 49% / BDS 19%），
     一直没有任何地方用过它：于是 Excel 靠个人数据被排到 LEC 第 4、拿了世界赛名额，
     而现实里他们是中下游。玩家原话：「一线联赛的队伍实力包括外赛区的队伍实力
     要重新设计思考」——这就是那个缺口。 */
  const wrAdj = (team && team.wr!==undefined) ? (team.wr-0.5)*WR_WEIGHT : 0;
  return (s/wt+dynastyBonus(players)+wrAdj)*(1+(cmd-68)/520)*(1-clamp(fatigue,0,100)*0.0022)*tm*sq;
}

/* ================= 世界 ================= */
function leagueBaseline(w){
  const b={};
  Object.keys(w).forEach(lg=>{
    b[lg]=avg(w[lg].flatMap(t=>t.players.map(p=>avg(DIMS.map(d=>p.r[d])))));
  });
  return b;
}
/* 中文名修正表（外部测评抓的：导出器按不分大小写的 ID 建索引，同名选手后者覆盖前者——
   RNG 的 Bin 被写成了韩国选手的「이승빈」）。键：赛区/ID */
const CN_FIX={"LPL/Bin":"陈泽彬"};
function cloneWorld(){
  const w={};
  Object.keys(DATA.leagues).forEach(lg=>{
    w[lg]=DATA.leagues[lg].map(t=>({
      name:t.name,
      wr:(t.wr===undefined?0.5:t.wr),     // 真实赛季胜率，进战力（见 powerCore）
      syn:(t.syn===undefined?50:t.syn)+(REGION_SYN[lg]||0),   // 默契也分赛区
      tac:(t.tac===undefined?50:t.tac)+(REGION_SYN[lg]||0),
      logo:t.logo,
      players:t.players.map(p=>({
        id:p.id,cn:(CN_FIX[lg+"/"+p.id]!==undefined)?CN_FIX[lg+"/"+p.id]:p.cn,pos:p.pos,age:p.age||22,
        form:(p.form===undefined||p.form===null)?52:p.form,lg:lg,
        r:Object.assign({},p.r),retired:false
      }))
    }));
    // 选手身份去重（外部测评抓的：Fudge 在 C9 同时占上单和中单、Grell 同时在 LLA 两支队）——
    // 同一个 ID 在一个联赛里只能出现一次，后出现的换成同水平新秀
    const seen=new Set();
    w[lg].forEach(t=>{
      const lvl=avg(t.players.map(q=>avg(DIMS.map(d=>q.r[d]||50))));
      t.players=t.players.map(q=>{ if(seen.has(q.id)){ const nr=makeRookie(q.pos,lvl,lg); nr.lg=lg; return nr; } seen.add(q.id); return q; });
    });
    // 统一标尺：均值锚定 + 明星放大 + 风格重分配（LDL 随后按母队生成，自动继承）
    anchorLeague(lg,w[lg]);
  });
  w.LDL=buildLDL(w);
  return w;
}

/* ---------- LDL：二级联赛 ----------
   结构对齐 2022 年的真实规则：
     俱乐部 = 一队（LPL 名单）+ 青训队（LDL 名单）。
     合同签给俱乐部；你注册在哪个名单，决定你在哪个联赛打比赛。
     2022 年 LPL 十七家俱乐部被强制配置青训队（LDL 当年 24 队 =
     17 家青训 + 7 支独立队；独立队暂未做）——所以这里是全部十七家，
     不再只有后十名，「这家没有青训编制」的怪事不会再发生。
   青训队实力大致等于对应一队减 12。
   上调窗口 = 季中间歇 + 休赛期（见 checkPromote）；
   一队替补拿不到比赛时，休赛期俱乐部会提议下放（见 offerSendDown）。 */
/* 战队简称。LDL 的二队队名用的是「简称 + 后缀」这套真实惯例
   （EDG.Y、JDG.Y、TES.C 这种），不是「XX 青训队」——现实里没有
   「青训队联赛」这回事，LDL 是正式的次级联赛，队伍有自己的队名。
   说明：2022 赛季 LDL 的完整队名名单没能查到可核实的来源，
   所以这里只套用命名惯例，不假装它是真实名单。 */
const LPL_CODE={
  "Royal Never Give Up":"RNG","JD Gaming":"JDG","Top Esports":"TES",
  "Victory Five":"V5","EDward Gaming":"EDG","Weibo Gaming":"WBG",
  "LNG Esports":"LNG","Bilibili Gaming":"BLG","Oh My God":"OMG",
  "FunPlus Phoenix":"FPX","Rare Atom":"RA","Invictus Gaming":"IG",
  "ThunderTalk Gaming":"TT","Anyone's Legend":"AL","LGD Gaming":"LGD",
  "Ultra Prime":"UP","Team WE":"WE"
};
function teamCode(name){
  if(LPL_CODE[name]) return LPL_CODE[name];
  // 兜底：取每个词的首字母，最多三位
  return String(name||"").split(/\s+/).map(x=>x[0]||"").join("").toUpperCase().slice(0,3)||"XX";
}
/* 2022 LDL 春季赛真实首发（Leaguepedia）。
   主联赛就是「2022 真实数据快照＋逐年老化」，二队用同一口径：只借名字，
   数值仍走 buildLDL 的母队锚定带（零平衡影响）。缺数据的俱乐部回落占位名。

function buildLDL(w){
  const src=(w.LPL||[]);
  const rk=src.map(t=>({t,p:avg(t.players.map(q=>avg(DIMS.map(d=>q.r[d]))))}))
              .sort((a,b)=>b.p-a.p);
  /* LDL 的天花板钉在「LPL 垫底三队的平均」（2026-09-05 玩家拍板）：原来母队 −8～−4 让
     TES.Y/RNG.Y 跑到 73，比 LPL 后四名（56-62）强一大截——儿子比爹强。现在强队青训
     仍是 LDL 的头，但只和 LPL 弱队打个五五开：能赢、不保证。 */
  const lplLow=rk.length>=3?avg(rk.slice(-3).map(x=>x.p)):62;
  return rk.map(({t,p})=>({
    name:teamCode(t.name)+".Y", parent:t.name, logo:t.logo,
    syn:Math.max(20,(t.syn===undefined?50:t.syn)-10),
    tac:Math.max(20,(t.tac===undefined?50:t.tac)-10),
    /* 二队坐着的是正经选手，不是靶子。
       原来是 parent−12（均值 ~40），玩家签进去当周就把对位顶掉；
       后来加了写死的下限 56，又闹出反向笑话：UP 这种弱队全队平均才 47
       （真实数据、50=LPL 位置平均），它的二队新秀反而 56——儿子比爹强
       （玩家线上抓的倒挂）。
       统一标尺版：母队−8～−4、下限 55（LPL 均值 65 → LDL 57–61，
       大师到王者边缘）——强队青训≈王者边的门神，弱队青训跟弱队一样菜，
       宗师实力（60）有得打、没得躺。 */
    players:POS.map(x=>{
      const pl=Object.assign(makeRookie(x.k,Math.max(56,Math.min(p-8,lplLow)),"LDL"),{lg:"LDL",form:52,retired:false});   // 母队 −8，不高于 LPL 垫底三队均值，下限 56
      const R=LDL_ROSTER[teamCode(t.name)];
      const real=R&&R.find(q=>q.pos===x.k);
      if(real) pl.id=real.id;               // 真名上身；数值不动
      return pl;
    })
  }));
}

/* 职业前的世界推进：你没在打，但联赛在打。 */
function simWorldPre(){
  if(!S.world||!S.standings) return;
  if(typeof aiTeamsTrain==="function") aiTeamsTrain();   // 职业前世界照样在练
  Object.keys(S.world).forEach(lg=>{
    const ts=S.world[lg].slice();
    for(let i=ts.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[ts[i],ts[j]]=[ts[j],ts[i]];}
    for(let i=0;i+1<ts.length;i+=2){
      const a=ts[i],b=ts[i+1];
      const p=1/(1+Math.exp(-(power(a)-power(b))/SPREAD));
      const aw=rnd()<p;
      S.standings[lg][a.name][aw?"w":"l"]++;
      S.standings[lg][b.name][aw?"l":"w"]++;
      if(lg==="LPL"&&rnd()<0.06){
        pushEvent(`<b>${aw?a.name:b.name}</b> 击败 ${aw?b.name:a.name}。`,"info","联赛");
      }
    }
  });
  // 偶尔来一条职业圈新闻，让世界有存在感
  if(rnd()<0.22) proNews();
}
function proNews(){
  const lg=["LPL","LCK","LEC","LCS"][Math.floor(rnd()*4)];
  const rk=Object.entries(S.standings[lg]||{})
    .map(([n,r])=>({n,...r,p:(r.w+r.l)?r.w/(r.w+r.l):0})).sort((a,b)=>b.p-a.p);
  if(!rk.length) return;
  const top=rk[0], bot=rk[rk.length-1];
  const pool=[
    ()=>`<b>${top.n}</b> 以 ${top.w}−${top.l} 领跑 ${lg}。`,
    ()=>`<b>${bot.n}</b> 跌到 ${lg} 垫底，传出换人消息。`,
    ()=>{const t=S.world[lg][Math.floor(rnd()*S.world[lg].length)];
         const q=t.players[Math.floor(rnd()*t.players.length)];
         return `${lg} 周最佳：<b>${q.id}</b>${q.cn?`（${q.cn}）`:""}（${t.name}）。`},
    ()=>`${lg} 官方公布下赛季赛制调整，讨论度不低。`,
    ()=>{const t=S.world[lg][Math.floor(rnd()*S.world[lg].length)];
         return `<b>${t.name}</b> 宣布启用青训选手，位置暂时保密。`}

}
/* 职业前跨年：结算各赛区冠军，然后清空积分榜 */
function proSeasonWrap(){

/* ---------- 现在是什么时候 ----------
   一个地方定义，HUD、事件戳、日志都用它。
   玩家任何时候都该知道：哪个赛季、哪个阶段、还剩多久。 */

/* 一年之内的周数要连续。
   原来每个阶段各数各的：职业前数到第 12 周，一签约又从「春季赛第 1 周」
   重新开始——现实里确实是新赛季从头算，但玩家看到的是时间倒流。
   现在全年连续计数，阶段只当标签。 */
const YEAR_PHASES=[
  {k:"spring", n:"春季赛",    len:WEEKS},
  {k:"sppo",   n:"春季季后赛", len:3},
  {k:"msi",    n:"MSI",      len:2},
  {k:"summer", n:"夏季赛",    len:WEEKS},
  {k:"supo",   n:"夏季季后赛", len:3},
  {k:"worlds", n:"世界赛",    len:3},
  {k:"off",    n:"休赛期",    len:3}
];
function phaseOffset(k){
  let o=0;
  for(const p of YEAR_PHASES){ if(p.k===k) return o; o+=p.len; }
  return o;
}
function yearTotal(){
  return (S.yearBase||0)+YEAR_PHASES.reduce((a,p)=>a+p.len,0);
}
function yearWeek(){
  if(S.step==="pre"||S.step==="offer") return S.pre?S.pre.week:1;
  const base=S.yearBase||0;
  if(S.step==="end")       return yearTotal();
  if(S.step==="offseason"){
    if(S.off&&S.off.next==="playoff") return base+phaseOffset((S.split>=1)?"supo":"sppo");
    if(S.off&&S.off.next==="poEnd")  return base+phaseOffset((S.split>=1)?"supo":"sppo")+(S.off.week||1);
    if(S.off&&S.off.next==="wrap")   return base+phaseOffset("worlds")+(S.off.week||1);
    if(S.off&&S.off.next==="intl")   return base+phaseOffset((S.pendingIntl&&S.pendingIntl.type==="msi")?"msi":"worlds")+(S.off.week||1)-1;
    if(S.off&&S.off.next==="summer") return base+phaseOffset("msi")+(S.off.week||1);
    return base+phaseOffset("off")+((S.off&&S.off.week)||1);
  }
  if(S.step==="prep") return base+phaseOffset((S.split>=1)?"supo":"sppo")+((S.playoff&&S.playoff.round)||1);
  if(S.intl)               return base+phaseOffset(S.intl.type==="msi"?"msi":"worlds")+1;
  if(S.playoff)            return base+phaseOffset((S.split>=1)?"supo":"sppo")+(S.playoff.round||1);
  return base+phaseOffset((S.split>=1)?"summer":"spring")+(S.week||1);
}
function nowPhase(){
  const sea=SEASONS[S.si]||SEASONS[0];
  // 「现在」是个时钟，只报时间。职业前是你的处境，不是赛季的阶段
  const YW=`第 ${yearWeek()} 周`;
  if(S.step==="pre"||S.step==="offer")
    return {tag:sea.tag,phase:S.careerBak?"自由身":"赛季前",detail:`${YW} · 窗口剩 ${Math.max(0,PRE_YEAR-(S.pre?S.pre.week:1))} 周`,
            urgent:S.pre&&S.pre.week>PRE_YEAR-4};
  if(S.intl){
    const n=S.intl.type==="msi"?"MSI":"世界赛";
    const st=S.intl.stage==="playin"?"入围赛":S.intl.stage==="groups"?"小组赛":
             S.intl.stage==="swiss"?"瑞士轮":
             (S.intl.knockRound>=3?"决赛":S.intl.knockRound===2?"半决赛":"八强");
    return {tag:sea.tag,phase:n,detail:`${YW} · ${st}`,urgent:true};
  }
  if(S.playoff) return {tag:sea.tag,phase:SPLITS[S.split||0]+"季后赛",
                        detail:`${YW} · ${(typeof poRoundName==="function")?poRoundName(S.playoff.round):("第 "+S.playoff.round+" 轮")}`,urgent:true};
  if(S.step==="prep") return {tag:sea.tag,phase:"赛前备战",detail:YW,urgent:true};
  if(S.step==="offseason") return {tag:sea.tag,phase:(S.off&&S.off.label)||"休赛期",
    detail:S.off?`${YW} · 第 ${S.off.week}/${S.off.weeks} 周`:`${YW} · 赛季结算`,urgent:false};
  if(S.step==="end") return {tag:sea.tag,phase:"生涯结束",detail:"",urgent:false};
  // 写清楚这是常规赛——「春季赛 第 3/7 周」看不出它和季后赛的区别
  return {tag:sea.tag,phase:SPLITS[S.split||0]+"常规赛",detail:`${YW} · 第 ${S.week}/${WEEKS} 周`,
          urgent:S.week>=WEEKS-1};
}
function nowLabel(){ const n=nowPhase(); return `${n.tag} ${n.phase}${n.detail?" "+n.detail:""}`; }
/* 事件戳：短一点，够定位就行 */
function nowStamp(){
  const n=nowPhase();
  if(S.step==="pre"||S.step==="offer") return `${n.tag} W${yearWeek()}`;
  if(n.phase==="MSI"||n.phase==="世界赛") return `${n.tag} ${n.phase}`;
  if(n.phase==="休赛期") return `${n.tag} 休赛期`;
  if(n.phase.includes("季后赛")) return `${n.tag} ${n.phase}`;
  return `${n.tag} W${yearWeek()}`;
}

/* ---------- 事件系统 ---------- */
function ovrOf(p){ return avg(DIMS.map(d=>p.r[d])); }
/* ================= 统一实力尺（2026-09-05）=================
   全游戏只有一个「实力」：五维均值。天梯、试训、杯赛、队伍面板、明星聚光灯全读它，
   段位是它的函数（RANK_CURVE 一张表，tierOf）。
   战力（power）内部权重和是 0.86、不含指挥——那是比赛模拟的口径，对外显示一律
   乘 PW_SHOW 归一到实力尺，免得「LPL 首发 47」这种读数把人骗到。 */
function strength(r){
  // 「你」一律直读 S.attrs 并含装备（和「我的」页的综合同一口径）——名单里那份 r 在读档后
  // 可能是断了引用的旧拷贝（玩家实锤：我的页 61、队伍页 53）
  if(r&&r.me&&S&&S.attrs) return myStrength();
  const x=(r&&r.r)?r.r:r; return avg(DIMS.map(d=>(x&&x[d])||0));
}
function myStrength(){
  return strength(S.attrs)+(typeof gearBonus==="function"?avg(DIMS.map(d=>gearBonus(d)||0)):0);
}
function tierOf(s){ return rankName(skillToRank(s)); }
const PW_SHOW=1/0.86;
function pwShow(p){ return p*PW_SHOW; }
function pushEvent(text,tone,tag){
  S.events.push({s:(typeof nowStamp==="function")?nowStamp():SEASONS[S.si].tag,
                 w:S.week,text,tone:tone||"info",tag:tag||"联赛"});
  if(S.events.length>420) S.events.shift();   // 五年十个赛段，160 条会把早期记录挤掉
  if(typeof toastPush==="function") toastPush({text,tone:tone||"info",tag:tag||"联赛"});   // 界面提示条（第二期 ③）
}
function noteForm(team,won){
  const f=S.teamForm[team]||(S.teamForm[team]=[]);   // 各队近期战绩；玩家状态用 S.form
  f.push(won?1:0); if(f.length>6) f.shift();
  const n=f.length;
  if(n>=5&&f.slice(-5).every(x=>x===1)) return "win4";
  if(n>=5&&f.slice(-5).every(x=>x===0)) return "lose4";
  return null;
}

/* 休赛期：全世界老一岁 */
/* 世界水位年漂移上限（2026-09-05 玩家实锤「Knight 94、那 Faker 得多高」）：
   AI 年轻选手每年在涨，五年下来 LPL 均值从 70 涨到 77——「LPL 平均 = 国服前 10」，段位表失真。
   每个休赛期把每个联赛的均值压回「赛区锚 + 0.8 × 年数」以内（非主角一律等量下调），
   世界仍在长（五年 +3.2），但尺子不走样。 */
const WORLD_DRIFT=0.8;
function capWorldDrift(){
  try{
    Object.keys(S.world||{}).forEach(lg=>{
      const anchor=REGION_ANCHOR[lg]; if(anchor===undefined) return;   // LDL 走 capLDL
      const ps=S.world[lg].flatMap(t=>t.players.filter(q=>!q.me&&q.r));
      if(!ps.length) return;
      const cur=avg(ps.map(q=>avg(DIMS.map(d=>q.r[d]))));
      const allowed=anchor+WORLD_DRIFT*(S.si||0);
      if(cur<=allowed) return;
      const cut=cur-allowed;
      ps.forEach(q=>DIMS.forEach(d=>{ q.r[d]=q1(clamp(q.r[d]-cut,30,99)); }));
    });
  }catch(e){}
}
/* LDL 天花板每年重钉（2026-09-05 玩家实锤「RNG.Y 八十多」：S16 末 LDL 均值 83 > LPL 75）——
   二队全是 18-23 岁的新秀，AI 每年都在练、又没有升队/离队，五年后儿子比爹强。
   每个休赛期把每支二队压回「LPL 垫底三队的平均」以下：强队青训仍是 LDL 的头，但永远只是 LPL 弱队的水平。 */
function capLDL(){
  try{
    const L=S.world&&S.world.LDL, P=S.world&&S.world.LPL; if(!L||!P||!P.length) return;
    const tavg=t=>avg((t.players||[]).filter(q=>!q.me).map(q=>avg(DIMS.map(d=>q.r[d]))));
    const low=avg(P.map(tavg).sort((a,b)=>a-b).slice(0,3));
    L.forEach(t=>{
      const a=tavg(t); if(!(a>low)) return;
      const cut=a-low;
      (t.players||[]).forEach(q=>{ if(q.me) return; DIMS.forEach(d=>{ q.r[d]=q1(clamp(q.r[d]-cut,45,99)); }); });
    });
  }catch(e){}
}
function ageWorld(){
  const news=[];
  Object.keys(S.world).forEach(lg=>{
    S.world[lg].forEach(team=>{
      team.players.forEach((p,i)=>{
        if(p.me) return;           // 主角的年龄曲线由 doOffseason 处理，且受天赋瓶颈约束
        p.age++;
        const base=ageCurve(p.age);
        /* AI 也在练。
           原来他们只有年龄曲线，没有「训练」这一项——年轻的涨、年长的掉，
           整个联赛五年纹丝不动（实测 LPL 平均战力 S12 46.9 -> S16 47.1），
           而玩家靠行动点从五维均值 45 练到 63。生涯末我队比联赛其余高 10 分，
           于是联赛冠军率 100%、MSI 80%：那不是玩家变强了，是世界停在原地等他。
           幅度刻意远小于玩家（玩家有行动点、瓶颈突破、装备、私教），
           只是让联赛的水位跟着往上抬，赢不再是理所当然。 */
        const dev = p.age<=23 ? 2.3 : p.age<=25 ? 1.3 : p.age<=27 ? 0.4 : 0;
        DIMS.forEach(d=>{
          const delta=base*(base>0?(1.4-DECAY_W[d]*0.5):DECAY_W[d]);
          p.r[d]=clamp(p.r[d]+delta+dev,20,99);
        });
        // 退役
        const ovr=ovrOf(p);
        if(p.age>=30||(p.age>=27&&ovr<47)){   // 全体系 +5：退役线 42→47
          // 新秀水平锚定「赛区开局基准」：真实联赛靠新血维持水位，
          // 若按当前均值生成，会随老将衰退形成死亡螺旋。
          const base=(S.baseline&&S.baseline[lg])||avg(S.world[lg].map(t=>avg(t.players.map(q=>ovrOf(q)))));
          /* 新血的水位一年比一年高。
             原来锚死在「赛区开局基准 −6」，于是整个联赛五年纹丝不动
             （实测 LPL 平均战力 S12 46.9 -> S16 47.1），而玩家从 45 练到 63——
             生涯末我队比联赛其余高 10 分，联赛冠军率 100%、MSI 80%。
             那不是玩家变强了，是世界停在原地等他。
             现实里新一代选手确实一年比一年强，所以锚点跟着赛季往上走。 */
          const nr=makeRookie(p.pos,base-6+(S.si||0)*2.2,lg);
          S.retiredPool.push({p:Object.assign({},p),peak:ovr,year:SEASONS[S.si].y,lg});
          if(lg==="LPL"||ovr>58){
            const honor = ovr>76?"一代人的记忆就此谢幕":ovr>64?"结束了自己的职业生涯":"低调退役";
            pushEvent(`<b>${p.id}</b>${p.cn?`（${p.cn}）`:""} ${p.age} 岁宣布退役，${honor}。${team.name} 提拔新秀 <b>${nr.id}</b> 接班。`,
              ovr>58?"big":"info","退役");
          }
          team.players[i]=nr;
          S.retireSeen=(S.retireSeen||0)+1; checkAch("retire");
          team.syn=clamp((team.syn===undefined?50:team.syn)-7,20,90);   // 换人要重新磨
        }
      });
    });
  });

  // 历史胜率每年向 50% 回归一截：三年前的战绩不该一直替今天的队说话
  Object.keys(S.world).forEach(lg=>S.world[lg].forEach(t=>{
    if(t.wr===undefined) t.wr=0.5;
    t.wr=0.5+(t.wr-0.5)*0.72;
  }));
  // 阵容没动的队，默契自然回升——稳定本身就是一种实力。
  // 强队还会像玩家一样主动经营（他们也有教练组），所以水位更高：
  // 不给这条，只有玩家能把默契练到 68，NPC 永远卡在 50，等于白送优势。
  Object.keys(S.world).forEach(lg=>{
    const rk=(S.standings&&S.standings[lg])
      ? Object.entries(S.standings[lg]).map(([n,r])=>({n,p:(r.w+r.l)?r.w/(r.w+r.l):0}))
          .sort((a,b)=>b.p-a.p).slice(0,3).map(x=>x.n)
      : [];
    S.world[lg].forEach(t=>{
      if(t.syn===undefined) t.syn=50;
      if(t.tac===undefined) t.tac=50;
      const elite=rk.includes(t.name)||power(t)>=76;   // 全体系 +5（战力口径 ×0.86 ≈ +4）
      const ceil=elite?72:58;                 // 强队经营得好，水位更高
      const rate=elite?4.5:2.2;
      t.syn=clamp(t.syn+(t.syn<ceil?rate:0.5),20,90);
      t.tac=clamp(t.tac+(t.tac<ceil?rate*0.8:0.4),20,90);
    });
  });

  // —— 复出：传奇池 + 本局内退役的选手 ——
  /* 复出要回自己的赛区（玩家实锤：在 IG 时更衣室里「老将 PraY 问你还能不能打」——
     他根本不是 LPL 的人）。原来落点写死随机一支 LPL 队。传奇池没有赛区字段，
     韩国老将里只有真在 LPL 打过的（Mata / Looper）才可能回 LPL；本局内退役的按退役时的联赛。
     另：传奇池里还在役的人（Rookie 在 V5）不能再「复出」一份。 */
  const LEGEND_HOME={PraY:["LCK"],Smeb:["LCK"],Wolf:["LCK"],Bang:["LCK","LCS"],Mata:["LCK","LPL"],Looper:["LCK","LPL"]};
  const activeIds=new Set(Object.values(S.world).flat().flatMap(t=>t.players.map(q=>q.id)));
  const legendCands=(DATA.legends||[]).filter(L=>!S.usedLegends.includes(L.id)&&!activeIds.has(L.id))
                  .map(L=>Object.assign({homes:LEGEND_HOME[L.id]||["LPL"]},L));
  const inGame=S.retiredPool.filter(r=>r.peak>54&&SEASONS[S.si].y-r.year<=2&&!r.back)
                  .map(r=>({id:r.p.id,cn:r.p.cn,pos:r.p.pos,age:r.p.age,r:r.p.r,_ref:r,homes:[r.lg||"LPL"]}));
  // 30 岁是强制退役线，复出也不能越线
  const cands=legendCands.concat(inGame)
    .filter(c=>c.age+Math.max(1,SEASONS[S.si].y-2022)<=30);
  if(cands.length&&rnd()<0.7){
    const c=cands[Math.floor(rnd()*cands.length)];
    if(c._ref) c._ref.back=true; else S.usedLegends.push(c.id);
    const homeLgs=(c.homes||["LPL"]).filter(k=>S.world[k]&&S.world[k].length);
    const homeLg=homeLgs.length?homeLgs[Math.floor(rnd()*homeLgs.length)]:"LPL";
    const team=S.world[homeLg][Math.floor(rnd()*S.world[homeLg].length)];
    const idx=team.players.findIndex(q=>q.pos===c.pos&&!q.me);
    if(idx>=0){
      const yearsOut=Math.max(1,SEASONS[S.si].y-2022);
      const back={id:c.id,cn:c.cn,pos:c.pos,age:c.age+yearsOut,comeback:true,
                  r:Object.assign({},c.r)};
      // 复出有代价：手生了，脑子还在
      back.r.操作=clamp(back.r.操作-6-yearsOut*1.5,20,99);
      back.r.体质=clamp(back.r.体质-8-yearsOut*1.5,20,99);
      back.r.指挥=clamp(back.r.指挥+5,20,99);
      back.r.运营=clamp(back.r.运营+2,20,99);
      const old=team.players[idx];
      team.players[idx]=back;
      pushEvent(`<b>${back.id}</b>${back.cn?`（${back.cn}）`:""} 宣布复出，${back.age} 岁加盟 ${homeLg!=="LPL"?homeLg+" 的 ":""}<b>${team.name}</b>${team.name===S.team?"——<b>你的队</b>":""}，顶替 ${old.id}。手还在不在，要打了才知道。`,"big","复出");
    }
  }

  // —— 新秀爆发 ——
  const rooks=Object.values(S.world).flat().flatMap(t=>t.players.filter(q=>q.rookie&&!q.hyped).map(q=>({q,t})));
  rooks.filter(x=>ovrOf(x.q)>56).slice(0,2).forEach(x=>{
    x.q.hyped=true;
    pushEvent(`新秀 <b>${x.q.id}</b> 在 ${x.t.name} 的季前训练赛里数据炸裂，被媒体称为「下一个天才${POSN[x.q.pos]}」。`,"good","新秀");
  });

  // —— 阵容补强：上赛季打得好的队，休赛期能签到更好的人 ——
  //    没有这条，队伍五年只会随年龄衰退，玩家一个人抬不动，冠军永远够不着。
  (function reinforce(){
    const rk=lplRank(), myRank=rk.findIndex(r=>r.n===S.team)+1;
    // 名次越高补强越猛，但对玩家自己的队要克制——
    // 否则「赢→补强→更容易赢」会滚成一条无法追赶的雪球。
    const tiers=[[1,1.5],[4,1.1],[8,0.7]];
    Object.keys(S.world).forEach(lg=>{
      S.world[lg].forEach(team=>{
        const isMine=team.name===S.team;
        let gain;
        if(isMine){
          const t=tiers.find(([k])=>myRank<=k);
          gain=t?t[1]:0.4;
        } else {
          // NPC 强队也会补强，保证世界不是只有你在变强
          // NPC 强队补强要跟得上，否则玩家很快就一骑绝尘
          const p=power(team);
          gain=p>76?3.4:p>70?2.4:1.2;
        }
        if(gain<=0) return;
        // 补最弱的一个非玩家位置
        const cand=team.players.filter(q=>!q.me);
        if(!cand.length) return;
        const weak=cand.reduce((a,b)=>ovrOf(a)<=ovrOf(b)?a:b);
        DIMS.forEach(d=>weak.r[d]=clamp(weak.r[d]+gain*(0.6+rnd()*0.8),20,99));
        if(isMine&&gain>=2.2)
          pushEvent(`战绩带来了议价权：<b>${S.team}</b> 签下补强，<b>${weak.id}</b> 的位置被顶了上来。`,"good","补强");
      });
    });
  })();

  // —— 转会：两支队互换一名同位置选手 ——
  const lpl=S.world.LPL.filter(t=>t.name!==S.team);
  if(lpl.length>=2&&rnd()<0.75){
    const a=lpl[Math.floor(rnd()*lpl.length)];
    const b=lpl[Math.floor(rnd()*lpl.length)];
    if(a!==b){
      const pos=["top","jng","mid","bot","sup"][Math.floor(rnd()*5)];
      const ia=a.players.findIndex(q=>q.pos===pos&&!q.me);
      const ib=b.players.findIndex(q=>q.pos===pos&&!q.me);
      if(ia>=0&&ib>=0){
        const pa=a.players[ia],pb=b.players[ib];
        a.players[ia]=pb; b.players[ib]=pa;
        a.syn=clamp((a.syn===undefined?50:a.syn)-8,20,90);
        b.syn=clamp((b.syn===undefined?50:b.syn)-8,20,90);
        if(Math.max(ovrOf(pa),ovrOf(pb))>52)
          pushEvent(`转会：<b>${pa.id}</b> 加盟 ${b.name}，<b>${pb.id}</b> 转投 ${a.name}。`,"info","转会");
      }
    }
  }
  return news;
}

/* 三项都选完之后，才把最终的起点摊开给玩家看一次 */

/* 进游戏时每一维的起始能力值（和「你的起点」弹窗、游戏里个人能力值同一个算法）：
   出身底子 + 年龄修正 + 背景修正，再被天赋瓶颈（上限）截住。出身/年龄还没选时返回 null。 */
function startAttrs(){
  if(S.bgPick==null||S.ageIdx==null) return null;
  const B=bgOf(S.bgPick), o=ORIGIN[(B&&B.origin)||S.origin]; if(!o) return null;
  const A=AGES[S.ageIdx];
  const out={};
  DIMS.forEach(d=>out[d]=Math.min((o.base[d]-9)+((A.mod&&A.mod[d])||0)+((B.mod&&B.mod[d])||0),capOf(d)));
  return out;
}
/* 一键随机分配：把 20 点天赋随机撒到五维，尊重每维 0–10 的上限 */
function randomTalent(){
  DIMS.forEach(d=>S.talent[d]=0);
  let pts=TOTAL_TALENT, guard=0;
  while(pts>0 && guard++<2000){
    const avail=DIMS.filter(d=>S.talent[d]<10);
    if(!avail.length) break;
    S.talent[avail[Math.floor(Math.random()*avail.length)]]++; pts--;
  }
  render();
}

/* ================= 职业前：从路人到被发掘 ================= */
const RANKS=[{n:"黄金",at:0},{n:"铂金",at:12},{n:"钻石",at:26},{n:"大师",at:44},
             {n:"宗师",at:60},{n:"王者",at:74},{n:"国服前 100",at:86},{n:"国服前 10",at:95}];
/* 没有死线：一年一个转会窗口，这次没签就接着打，等明年。
   代价是你又老了一岁——巅峰期是有限的，而这个世界只跑到 2026。 */
const PRE_YEAR=20;
const PRE_AP=AP_PRE;       // 一个「职业前年度」20 周，年末是转会窗口
const PRE_INVITE=118;               // 综合评估到这个水平，才有俱乐部来谈
const PRE_EARLIEST=13;             // 主播杯打完之前，没人会下判断
const PRE_WEEKS=PRE_YEAR;

/* 起始段位不是所有人都从黄金爬：
   青训是被选进去的，底子摆在那；主播靠人气，段位一般没那么高。 */
/* 起始段位由「排位实力」反推：你现在的水平配得上哪个分段，就在哪个分段。
   否则会出现开局钻石但实力只够铂金、一上来就掉分的怪事。 */
function initialRank(){
  const sk=soloSkill();
  const fit=skillToRank(sk);                    // 实力对应的分数位置（统一标尺曲线）
  const bonus=S.origin==="academy"?3:-2;        // 青训有人带，主播时间被直播分走
  return clamp(fit+bonus+rnd()*7-3.5,4,55);
}
function rankName(v){ let r=RANKS[0]; RANKS.forEach(x=>{if(v>=x.at)r=x}); return r.n; }
/* 细分到小段：打一把排位要看得见变化，不能永远只显示「黄金」 */
const DIV=["","一","二","三","四"];
function rankFull(v){
  let i=0; RANKS.forEach((x,k)=>{ if(v>=x.at) i=k; });
  const cur=RANKS[i], next=RANKS[i+1];
  if(!next) return v>=99?"国服第一":cur.n+" "+Math.round((v-cur.at)*22)+" 点";
  if(i>=3){                                   // 大师及以上按点数
    return cur.n+" "+Math.round((v-cur.at)*22)+" 点";
  }
  const span=next.at-cur.at;
  const d=clamp(4-Math.floor((v-cur.at)/span*4),1,4);
  return cur.n+DIV[d];
}
function startPre(){
  S.patchSeen=(typeof GAME_VER!=="undefined")?GAME_VER:1;   // 新开局不弹更新说明
  if(typeof statEvent==="function") statEvent("start");
  const o=ORIGIN[S.origin], A=AGES[S.ageIdx], B=bgOf(S.bgPick);
  const attrs={};
  DIMS.forEach(d=>attrs[d]=Math.min(
    o.base[d]-9+(A.mod[d]||0)+((B.mod&&B.mod[d])||0), capOf(d)));
  S=Object.assign({},S,{
    step:"pre",attrs,age:A.a,fans:Math.max(0,o.fame+(B.fame||0)),heat:0,money:B.money||0,fatigue:0,
    btk:{opStreak:0,opThisWeek:0,vod:0,rest:0},
    ageCfg:A,bg:B,preYear:1,si:0,split:0,
    pre:{week:1,ap:PRE_AP,rank:0,scout:0,cityCup:null,streamCup:null,log:[],offers:null},
    seasonAttr0:Object.assign({},attrs),
    events:[],usedLegends:[],retiredPool:[],teamForm:{},formSeen:{},news:[],log:[],
    // 审计 P0：新档必须自带标尺版本，否则第一次读档会被当成老档整体 +15
    scaleVer:2, born:(typeof GAME_VER!=="undefined")?GAME_VER:""
  });
  S.pre.rank=initialRank();
  initShop(); initAch();
  if(typeof initLedger==="function") initLedger();
  // 世界从现在就开始转——你打排位的每一周，职业赛都在打
  S.world=cloneWorld();
  S.baseline=leagueBaseline(S.world);
  S.standings={};
  Object.keys(S.world).forEach(lg=>{
    S.standings[lg]={};
    S.world[lg].forEach(t=>S.standings[lg][t.name]={w:0,l:0});
  });
  if(B.course) S.courses[B.course]=1;
  preLog(`<b>${B.n}</b>。${B.d}`,"big");
  preLog(`你 ${S.age} 岁，${ORIGIN[S.origin].n}，当前 ${rankBadge(S.pre.rank,22)}。没有战队，没有人认识你。`,"info");
  render();
}
function preLog(t,tone){ S.pre.log.push({t,tone:tone||"info",w:S.pre.week,
    stamp:(typeof nowStamp==="function")?nowStamp():""}); if(S.pre.log.length>60)S.pre.log.shift(); }

/* 排位实力：单排能不能赢，主要看操作和运营，心态决定逆风局。 */
/* 统一实力尺：排位看的也是同一个数（原来是操作 .5/运营 .3/心态 .2 的另一把尺，
   和队伍面板、试训、杯赛各说各话——玩家原话「基础实力只有一个数据」） */
function soloSkill(){ return myStrength(); }
/* 当前分数位置对应的实力门槛。
   这条曲线必须和「实际能练到的排位实力」在同一量纲上：
   均衡 build 练满约 58 -> 大师；极限 build 约 77 -> 国服前十。
   之前用的 33+v*0.63 太陡，均衡 build 连大师都摸不到，
   最强 build 也上不了王者——整条段位天梯有一半是死的。 */
function rankReq(v){ return rankToSkill(clamp(v,0,100)); }   // 统一标尺：门槛走新曲线
/* 段位旁边把账算清楚：你现在的实力、本段门槛、下一档要多少、还差多少。
   职业前天梯卡本来有这行，进俱乐部后 HUD 只剩一个段位徽章——玩家原话
   「不显示门槛和当前实力，玩家不知道自己差多少」。 */
function rankGapNote(){
  if(!S.pre||typeof S.pre.rank!=="number") return "";
  const me=myStrength(), cur=rankReq(S.pre.rank);
  const nextR=RANKS.find(x=>x.at>S.pre.rank);
  const nx=nextR?rankToSkill(nextR.at):null;
  const gap=nx!=null?nx-me:0;
  return `<small class="gapnote" style="display:block;color:var(--ink-3);font-size:11px;line-height:1.35;margin-top:4px">实力 <b style="color:var(--ink)">${me.toFixed(0)}</b> · 本段门槛 ${cur.toFixed(0)}${
    nx!=null?` · ${nextR.n}要 ${nx.toFixed(0)}<span style="color:${gap<=0?'var(--cyan)':'var(--gold)'}">（${gap<=0?"实力已够，去打排位":"差 "+gap.toFixed(0)}）</span>`:" · 已到顶"}</small>`;
}
/* 打一把的胜率：实力压过门槛就赢多输少，差得远就基本打不动 */
function soloWinP(){
  const md=(typeof buffVal==="function")?(buffVal("mood")-1)*8:0;
  const d=soloSkill()-rankReq(S.pre.rank)+md;
  return clamp(1/(1+Math.exp(-d/5.2)),0.06,0.94);
}
/* 一次「打排位」= 3 把，赢了涨输了掉 */
function rankStep(){ return clamp(2.6-S.pre.rank*0.012,1.1,2.6); }
function preAct(k,dim){
  const P=S.pre;
  const _c=(typeof apCost==="function")?apCost(k==="rank"?"solo":k):2;
  if(P.ap<_c) return;
  if(typeof noteAct==="function") noteAct(k==="train"?"train":"pre",k==="train"?dim:k);
  if(k==="rank"){
    const beforeT=rankName(P.rank), beforeF=rankFull(P.rank);
    // 异化点数配平：1 点＝几把排位，单次涨跌 ×0.55（12 点预算下可刷，不配平会通胀）
    const lightMul=0.50;
    const p=soloWinP(), step=rankStep()*lightMul;
    let w=0,l=0;
    for(let i=0;i<3;i++){
      if(rnd()<p){ w++; P.rank=clamp(P.rank+step,0,100); }
      else { l++; P.rank=clamp(P.rank-step*0.82,0,100); }
    }
    addFat(4);
    // 排位打多了本身就会变强，而且是全面的——一局排位里对线、
    // 运营、心态、指挥、体力都在用，只是每一样都不如专项训练练得深。
    // （这也让「冲分」和「训练」不再是纯粹互抢行动点的关系。）
    rankGain(w,lightMul);
    if(typeof ladderEncounter==="function") ladderEncounter(0.50);   // 天梯撞车：按场次折算

    const afterT=rankName(P.rank), afterF=rankFull(P.rank);
    addFans(w*0.25);      // 赢下来的分才带来关注
    P.lastQ={w,l,p}; checkAch("rank");
    const up=RANKS.findIndex(r=>r.n===afterT)>RANKS.findIndex(r=>r.n===beforeT);
    if(afterT!==beforeT&&up){
      preLog(`${w} 胜 ${l} 负，<b>打上 ${afterF}</b>。`,"good");
      // 只有第一次摸到这个段位才弹窗——不然在门槛上来回跳会刷屏
      P.seenTier=P.seenTier||{};
      if(!P.seenTier[afterT]){ P.seenTier[afterT]=1; S.rankUp={from:beforeT,to:afterT,v:P.rank}; }
    } else if(afterT!==beforeT){
      preLog(`${w} 胜 ${l} 负，<b>掉回 ${afterF}</b>。`,"bad");
    } else if(afterF!==beforeF){
      preLog(`${w} 胜 ${l} 负，${beforeF} → <b>${afterF}</b>。`,w>l?"good":w<l?"bad":"info");
    } else {
      preLog(`${w} 胜 ${l} 负，还在 ${afterF} 原地踏步。`,"info");
    }
    checkAch("rank");
    if(P.rank>=95&&!P.top10){P.top10=true;preLog(`你冲进<b>国服前 10</b>。这个位置上的人，职业队不会看不见。`,"big");}
    if(P.rank>=99&&!P.top1){P.top1=true;preLog(`<b>国服第一。</b>这个服务器上没有人排在你前面了。`,"big");}
  } else if(k==="stream"){
    const m=S.origin==="streamer"?1.7:1.0;
    // 单纯开播涨得很慢；真正让人记住你的是段位和战绩
    const pop=1.9+S.pre.rank*0.05;
    const gift=streamIncome();
    addFans(pop*m*(typeof streamFansMul==="function"?streamFansMul():1));
    if(typeof addMoney==='function') addMoney('stream',gift); else S.money+=gift;
    addFat(4); checkAch("stream");
    if(S.streamDeal) S.streamDeal.done=(S.streamDeal.done||0)+1;   // 开播条款按次数记
    if(typeof checkStreamBiz==="function") checkStreamBiz();   // 分成上调、独家谈约都在开播时发生
    if(gift>=50&&!P.bigGift){P.bigGift=true;
      preLog(`直播间刷起了礼物，这一场进账 <b>${Math.round(gift)} 万</b>。`,"good");}
    if(S.fans>=120&&!P.famous){P.famous=true;preLog(`直播间人数破万。<b>你在圈子里有名气了</b>，虽然还没打过一场正赛。`,"good");}
    if(typeof fireEvent==="function") fireEvent("streamGift",0.20);
  } else if(k==="train"){
    const c=capOf(dim);
    if(dim==="操作"&&typeof btkNote==="function") btkNote("op",1);   // 到瓶颈也要能攒突破进度
    if(S.attrs[dim]<c) S.attrs[dim]=Math.min(c,S.attrs[dim]+gain(dim)*0.85);
    addFat(9);
  } else if(k==="boost"){
    /* 接代练（2026-09-05 玩家点名「职业前第二年只有训练可做」）：来钱快，但手会糙、心会累，
       接多了就是一笔旧账——职业后有概率被扒（走 daida 回响） */
    const cash=Math.round(3+P.rank*0.06);
    if(typeof addMoney==='function') addMoney('boost',cash); else S.money+=cash;
    addFat(8); S.attrs.心态=Math.max(20,S.attrs.心态-0.15); S.heat=Math.max(0,(S.heat||0)-1);
    S.flags=S.flags||{}; S.flags.boostN=(S.flags.boostN||0)+1;
    if(S.flags.boostN>=3&&!S.flags.daida){ S.flags.daida=1; preLog(`代练接到第三单，圈子里开始有人知道你的号在「帮人上分」。<b>这事以后可能会被翻出来。</b>`,"bad"); }
    else if(S.flags.boostN===1) preLog(`接了一单代练，到手 <b>${cash} 万</b>。钱是真的，风险也是——接多了会留下记录。`,"info");
  } else if(k==="cafe"){
    /* 和朋友上网：清疲劳、稳心态，网吧里认识的人也是人气；有车队的话默契一起涨 */
    addFat(-8); S.attrs.心态=Math.min(capOf("心态"),S.attrs.心态+0.25); addFans(1.5);
    if(P.mates&&P.mates.length&&typeof addSquad==="function") addSquad("syn",1.2);
  } else if(k==="chill"){
    /* 换个游戏放松：疲劳掉得最快，但手感会生一点 */
    addFat(-12); S.attrs.心态=Math.min(capOf("心态"),S.attrs.心态+0.2); S.attrs.操作=Math.max(20,q1(S.attrs.操作-0.08));
  } else if(k==="watch"){
    /* 看职业比赛录像：运营和指挥的便宜课，战术素养也涨一点 */
    S.attrs.运营=Math.min(capOf("运营"),q1(S.attrs.运营+0.18)); S.attrs.指挥=Math.min(capOf("指挥"),q1(S.attrs.指挥+0.18));
    addFat(2); if(typeof tacAdd==="function") tacAdd(0.3,"看职业比赛录像");
  } else { addFat(-18); S.attrs.心态=Math.min(capOf("心态"),S.attrs.心态+0.3); }   // 1 点碎片休息 ×0.55
  P.ap-=_c; render();
}

/* 业余赛的老实现（报名即出结果）已经删掉——
   现在走 cup.js 里的多周赛程：报名建赛程，每轮单独打。
   留着两套并行的判定，迟早会漂移成两种结果。 */

/* 职业前的时间节点：都有明确门槛和倒计时 */

/* 隐性指标只给感觉，不给数字——不然玩游戏就变成刷数值 */
/* 俱乐部怎么看你——由段位、名气与赛事成绩共同决定，不再是单独一条数值 */
function scoutTier(){
  const r=preScore()/PRE_INVITE;
  return r<0.2?"没人知道你是谁":r<0.4?"偶尔有人提起":r<0.6?"圈子里有你的名字"
       :r<0.82?"有俱乐部在打听":r<1?"已经有人在联系你了":"随时可以谈签约";
}
/* 咖位用人话说，别甩数字——没人知道「粉丝 137」是什么概念。
   档位按实测的粉丝分布重排（120 局，机器人已修：p5 2103 / p25 3255 /
   p50 4850 / p75 6348 / p85 6923 / p97 8465）。机器人接近满配打法
   （MSI 夺冠率 85%），所以它的 p85 就是「门面」这一档该在的位置。
   旧表最高档是 850，而当时实测中位 2539——九个档只有最高那一档被用到。 */
const FAN_TIERS=[
  [0,"无人问津"],[45,"直播间几十个人"],[120,"小主播"],[350,"有固定观众"],
  [900,"平台头部"],[2000,"全网知名"],[3500,"出圈到路人都认识"],[5500,"现象级"],
  [8000,"这个项目的门面"]
];
function fanTier(v){
  v=(v===undefined)?S.fans:v;
  let n=FAN_TIERS[0][1];
  FAN_TIERS.forEach(([at,nm])=>{ if(v>=at) n=nm; });
  return n;
}
function nextMilestone(){ return PRE_MILESTONES.find(m=>m.open&&m.w>=S.pre.week); }

/* 进入新的一周之后，这一周该发生的事立刻发生。

   原来这段挂在 preNextWeek 里，用**自增之前**的周数去匹配里程碑：
   于是第 8 周的城市争霸赛是在你「离开」第 8 周的那一下才弹出来，
   而 HUD 那一整周都写着「城市争霸赛 第 8 周（就是本周）」。
   玩家原话：「游戏显示本周，但是得等到我点击下一周才会弹出来」。
   现在改成「进入这一周就触发」，报名弹完你还有整周的行动点可用。 */
function fireWeekEvents(){
  const P=S.pre; if(!P) return;
  const busyCup = (typeof activeCups==="function") && activeCups().length>0;

  // 被推迟的报名单独处理，不跟当周的里程碑抢——
  // 否则同一周只要还有别的里程碑（比如「青训教练到场」），补发就被挡住了
  if(P.deferSignup && !busyCup){
    const d=PRE_MILESTONES.find(m=>m.name===P.deferSignup);
    P.deferSignup=null;
    if(d){
      if(!d.need()){ d.fail(); }
      else { S.signup=d; render(); return; }
    }
  }

  const hit=PRE_MILESTONES.find(m=>m.w===P.week);
  // 手上还有没打完的赛事，就别在这周开新的——两个赛程叠在一起，
  // 行动点根本不够分，备战也顾不过来
  if(hit&&hit.signup&&busyCup){
    P.deferSignup=hit.name;
    preLog(`<b>${hit.name}</b>开始报名了，但你手上的比赛还没打完——先打完再说。`,"info");
  } else if(hit&&hit.signup){
    if(!hit.need()){ hit.fail(); }
    else { S.signup=hit; render(); return; }     // 交给玩家决定报不报
  } else if(hit){ hit.need()?hit.run():hit.fail(); }

  // 够格就随时有人来谈；不够就等转会窗口。
  // 玩家点名：不许一天批发一摞报价——随时够格也是「一家来谈」，
  // 处理完这家、过了冷却，下一家才来。
  if(!busyCup && preScore()>=PRE_INVITE && !(P.invite&&P.invite.pending)
     && P.week>=(P.earlyCd||0)){
    P.earlyCd=P.week+3;
    const s=preScore();
    const pick=wndPickOffer(s>=92?"foreign":s>=70?"sub":"start");
    if(pick){ wndDeliver(pick, "你的名字已经在圈里传开——不用等窗口"); render(); return; }
  }
  render();
}
/* 「下一周」：把这一周收尾，走到下一周，然后触发那一周的事 */
function preNextWeek(){ advancePreWeek(); }
/* 杯赛轮次到点提醒 */
/* cupTick 在 cup.js 里（原来这里还有一份旧的，被模块版静默覆盖，已删） */
/* 报名弹窗处理完之后，继续把这一周走完 */
function advancePreWeek(){
  const P=S.pre;
  if(P.week>=PRE_YEAR){
    // 窗口在最后一周关闭。手上还挂着没处理的邀请就先别翻年——
    // 报价是流程里一家家来的（玩家点名），不是关窗那天批发的
    if(P.invite&&P.invite.pending){
      preLog(`转会窗口<b>今天就关</b>——先把手上 <b>${P.invite.team}</b> 的邀请处理了。`,"big");
      render(); return;
    }
    preLog(((P.wndGiven&&Object.keys(P.wndGiven).length)
      ? `转会窗口关了。来谈过的机会都过去了——`
      : `转会窗口关了，<b>没有一家找你</b>。`)+`明年再来。`,"bad");
    preNextYear(); return;
  }
  if(typeof archiveWeek==='function') archiveWeek();
  P.week++; P.ap=apFor('pre'); addFat(-9);
  if(typeof weeklyEcho==="function") weeklyEcho();
  if(typeof injuryTick==='function') injuryTick();
  if(typeof cupTick==='function') cupTick();
  if(typeof wndOfferTick==='function') wndOfferTick();   // 转会窗口滴灌：一周最多一家
  if(typeof checkRankInvite==='function') checkRankInvite();
  if(typeof checkTopUpInvite==='function') checkTopUpInvite();   // 前职业选手：赛段注册期里有队缺人来找你顶班
  // 突破进度也要在职业前结算。原来 btkWeekEnd 只在赛季的 nextWeek 里调，
  // 职业前那条「连续 3 周投操作」的提示就永远是 0/3——提示让你做的事做了也不算数。
  if(typeof btkWeekEnd==='function') btkWeekEnd();
  if(typeof rollInjury==='function') rollInjury('职业前');
  if(typeof tickBuffs==='function') tickBuffs();
  if(typeof fanWeek==='function') fanWeek();
  if(typeof questWeek==='function') questWeek();
  simWorldPre();
  if(typeof tryRandomEvent==='function'&&rnd()<0.22) tryRandomEvent();   // 职业前 0.22（玩家点名前期无聊；伏笔事件池已扩）
  if(typeof saveGame==='function') saveGame('第'+P.week+'周');
  // 提前预告：还有 3 周 / 1 周时提醒，并说清差多少
  PRE_MILESTONES.forEach(m=>{
    const d=m.w-P.week;
    if((d===3||d===1)&&m.open){
      const ok=m.need();
      if(m.dateOnly){
        preLog(`<b>${m.name}</b> ${d===1?"下周":"三周后"}。这半年做的每件事都会在那天结算。`,"big");
      } else if(m.vague){
        preLog(`<b>${m.name}</b> ${d===1?"下周":"三周后"}开始，${m.needTxt}。你现在的名气：${m.cur()}。`,"info");
      } else {
        preLog(`<b>${m.name}</b> ${d===1?"下周":"三周后"}开始。门槛 ${m.needTxt}，你现在 ${m.cur()}——${
          ok?'<span style="color:var(--cyan)">已达标</span>':'<span style="color:var(--red)">还不够</span>'}。`,
          ok?"good":"bad");
      }
    }
  });
  // 走进了新的一周，这一周该发生的事就在这一刻发生——
  // 不能等到玩家再点一次「下一周」
  fireWeekEvents();
}

/* 只有一个「外界评价」维度：段位 + 名气 + 赛事成绩。
   原来还有个「星探关注度」，但它和名气靠同样的行为增长，玩家分不清区别——已合并。 */
/* 综合评估里的读数项走「旧刻度」：2026-09-05 读数曲线中段压紧后，同一实力的读数高了
   最多 15 分，PRE_INVITE=118 这类阈值是按旧刻度调的——先把读数翻回实力，再按旧曲线
   读一遍，评估节奏就和换尺前一致。 */
const LEGACY_CURVE=[[34.5,0],[39.5,12],[44.5,26],[54.5,44],[59.5,60],[64.5,74],[70.5,86],[76.5,95],[80.5,100]];
function legacyRead(r){
  const s=rankToSkill(r), C=LEGACY_CURVE;
  if(s<=C[0][0]) return 0;
  for(let i=1;i<C.length;i++){
    if(s<=C[i][0]){ const [s0,r0]=C[i-1],[s1,r1]=C[i]; return r0+(r1-r0)*(s-s0)/(s1-s0); }
  }
  return 100;
}
function preScore(){
  const P=S.pre;
  return legacyRead(P.rank)*0.92+Math.min(S.fans,300)*0.22+(P.cityCup||0)*8+(P.streamCup||0)*8;
}
/* 这一年没签成：世界往前走一年，你也老一岁。没有死线，只有代价。 */
function preNextYear(){
  const P=S.pre;
  if(S.si>=SEASONS.length-1){
    // 曾打过职业的人走到时间尽头：履历接回来，结局按职业生涯算，不是「没能上岸」
    if(S.careerBak){ S.career=S.careerBak; S.careerBak=null; } else S.neverSigned=true;
    S.step="end"; render(); return;
  }
  S.si++; S.age++; P.preYear=(P.preYear||1)+1;
  P.week=1; P.ap=apFor('pre'); P.cityCup=null; P.streamCup=null;
  P.noRe={};   // 「拒绝试训后这家今年不再来」——过了年就既往不咎
  S.fatigue=0; S.buff={};
  if(S.careerBak){
    // 回到路人的前职业选手：世界照样老一岁、转会、退役（第一次职业前不动世界，和以前一样）；
    // 每年重新给一次「段位/人气够了就有人来问」的机会
    P.rankInvited={}; P.fanInvited={}; P.wndGiven={};
    try{
      const nw=ageWorld();
      if(typeof aiMarketWindow==="function") aiMarketWindow(true);
      capWorldDrift(); capLDL();
      S.news=(S.news||[]).concat(nw||[]);
    }catch(e){}
  }
  if(typeof ledgerRotate==="function") ledgerRotate();
  P.rank=Math.max(0,P.rank-4);          // 一年下来手会生一点
  if(P.mates&&P.mates.length&&typeof disbandCrew==="function") disbandCrew();
  proSeasonWrap();
  pushEvent(`<b>${SEASONS[S.si].tag} ${SEASONS[S.si].y}</b>：你还没打上职业。${SEASONS[S.si].story}`,"bad","赛季");
  preLog(`<b>${SEASONS[S.si].tag} ${SEASONS[S.si].y} 赛季开始</b>，你 ${S.age} 岁了。
    上一年没能签约，这一年从头再来——但世界已经往前走了一年。`,"hi");
  render();
}
/* ---------- 转会窗口滴灌（2026-09-04 玩家点名）----------
   窗口是最后 4 周的一段时间，不是关窗那天的一次批发：
   弱队最先动手，中游跟上，豪门压哨，外赛区最后一刻才来电——
   每周最多一家，走现成的试训邀请弹窗；错过的档位每周补试，直到关窗。 */
const WND_OPEN=PRE_YEAR-3;
function wndPickOffer(kind){
  const rk=S.world.LPL.map(t=>({n:t.name,p:power(t)})).sort((a,b)=>b.p-a.p);
  if(kind==="core")  return {kind,tier:"low", team:rk[rk.length-1-Math.floor(rnd()*4)].n,
    label:"弱队想把全队资源押在你身上"};
  if(kind==="start") return {kind,tier:"mid", team:rk[6+Math.floor(rnd()*4)].n,
    label:"中游俱乐部缺一个首发"};
  if(kind==="sub")   return {kind,tier:"top", team:rk[Math.floor(rnd()*3)].n,
    label:"豪门想签你进替补席培养"};
  if(kind==="foreign"){
    const lg=rnd()<0.5?"LCK":"LEC";
    const pool=(S.world[lg]||[]);
    if(!pool.length) return null;
    const ft=pool[Math.floor(rnd()*Math.min(4,pool.length))];
    return {kind,tier:"top", team:ft.name, league:lg, label:lg+" 的队伍越洋来电"};
  }
  return null;
}
function wndDeliver(o,why){
  const P=S.pre; if(!P||!o) return false;
  const T=CLUB_TIERS[o.tier];
  P.invite={tier:o.tier, team:o.team, league:o.league||null,
            reason:why||o.label, pending:true, week:P.week, expect:T.expect};
  P.inviteN=(P.inviteN||0)+1;
  preLog(`<b>${o.team}</b>${o.league?`（${o.league} 赛区）`:""}发来试训邀请——${o.label}。`,"big");
  return true;
}
function wndOfferTick(){
  const P=S.pre; if(!P) return;
  if(P.week<WND_OPEN||P.week>PRE_YEAR) return;
  if(P.week===WND_OPEN&&!P.wndOpened){
    P.wndOpened=1;
    preLog(`<b>转会窗口开启</b>：接下来 ${PRE_YEAR-WND_OPEN+1} 周，各队陆续定人。
      够格的话，邀请会一家一家来——豪门向来压哨。`,"hi");
  }
  if(P.invite&&P.invite.pending) return;          // 一次只谈一家，谈完下一家才来
  if(typeof activeCups==="function"&&activeCups().length) return;  // 打着比赛不搅局
  P.wndGiven=P.wndGiven||{};
  const score=preScore();
  const ladder=[
    {wk:WND_OPEN,   k:"core",   ok:score>=PRE_INVITE*0.82},
    {wk:WND_OPEN+1, k:"start",  ok:score>=32},
    {wk:WND_OPEN+2, k:"sub",    ok:score>=70},
    {wk:PRE_YEAR,   k:"foreign",ok:score>=92}
  ];
  for(const r of ladder){
    if(P.week<r.wk||P.wndGiven[r.k]||!r.ok) continue;
    const o=wndPickOffer(r.k);
    if(o&&wndDeliver(o)){ P.wndGiven[r.k]=1; break; }   // 每周最多一家
  }
}
function makeOffers(forced){
  const P=S.pre, score=preScore();
  P.finalScore=Math.round(score);
  P.forced=!!forced;
  const world=cloneWorld();
  const rk=world.LPL.map(t=>({t,p:power(t)})).sort((a,b)=>b.p-a.p);
  const offers=[];
  if(score>=70) offers.push({k:"sub",team:rk[Math.floor(rnd()*3)].t.name,
     t:"强队替补",d:"顶级豪门，但首发位上坐着一位强力老将。你得练到压过他，否则可能整年不上场。",
     note:"天花板最高，也真的可能坐穿板凳"});
  if(score>=32) offers.push({k:"start",team:rk[6+Math.floor(rnd()*4)].t.name,
     t:"中游首发",d:"稳定首发位置，队伍中规中矩。最普通的一条路。",note:"稳，但很难摸到冠军"});
  offers.push({k:"core",team:rk[rk.length-1-Math.floor(rnd()*4)].t.name,
     t:"弱队核心",d:"全队资源向你倾斜，但队友确实弱。赢球要靠你自己。",
     note:"成长最快，战绩最难看"});
  if(score>=92){
    const foreign=(rnd()<0.5?world.LCK:world.LEC);
    const ft=foreign[Math.floor(rnd()*Math.min(4,foreign.length))];
    offers.push({k:"foreign",team:ft.name,league:foreign===world.LCK?"LCK":"LEC",
      t:"外赛区首发",d:`${foreign===world.LCK?"LCK":"LEC"} 的 ${ft.name} 向你发来试训邀请。语言不通，环境陌生。`,
      note:"最难的路，也最能证明你"});
  }
  P.offers=offers; P.world=world; P.baseline=leagueBaseline(world); S.step="offer"; render();
}

function acceptOffer(i){
  const P=S.pre, of=P.offers[i];
  S.proLg=null;
  const lgKey=of.league||"LPL";
  const world=P.world;
  const team=world[lgKey].find(t=>t.name===of.team);
  const incumbent=team.players.find(q=>q.pos===S.pos);
  /* 青训生不是「二队首发」，是「还没被写进名单的人」。
     现实里青训是身份不是队伍：LDL 是正式的次级联赛，而青训生一个赛季只能
     以青训生身份代表一支队；要正式上场，得先被注册进名单。教练看的是训练赛。
     所以签青训合同进 LDL 的人一律先当替补，靠 isBenched() 那条
     「训练赛数据压过对位才首发」打上去——那条机制本来就在，只是从来没被青训用上。 */
  const asSub = (of.k==="sub") || (lgKey==="LDL");
  if(!asSub){
    team.players=team.players.map(q=>q.pos===S.pos
      ? {id:S.name||"你",cn:"",pos:S.pos,age:S.age,r:S.attrs,me:true} : q);
  }
  const back=!!S.careerBak;   // 前职业选手重返（dropToStreets 封存的履历）
  S=Object.assign({},S,{
    step:"season",age:S.age,world,baseline:P.baseline,team:of.team,homeLeague:lgKey,offerKind:of.k,
    understudy:asSub?incumbent:null, promoted:!asSub,
    // si 保持不动。原来写死 si:0，于是在职业前多打一年（已经到 S13）
    // 的人一签约就被扔回 S12，整条时间线倒流。
    week:1,ap:AP,record:{w:0,l:0},gameRec:{w:0,l:0},
    career:S.careerBak||{w:0,l:0,titles:[],best:99},seasonAttr0:Object.assign({},S.attrs),
    buff:{},contract:(S.pendingContract||{years:2,left:2}),rivals:{},lockerSeen:[]
  });
  /* 签约就离开业余赛季了——手上还没打完的杯赛必须有个交代。
     原来它们会一直挂着 alive=true 到生涯结束（实测 104 次报名里 10 次这样），
     玩家交了报名费、赛程还在，然后这件事就人间蒸发了。 */
  if(typeof activeCups==="function"){
    activeCups().forEach(c=>{
      c.alive=false;
      preLog(`你签了职业合同，<b>${c.name}</b>就不打了——报名费不退，
        走到${(typeof cupRoundName==="function")?cupRoundName(c.kind,c.round):"这一轮"}为止。`,"info");
    });
  }
  if(typeof markTeamJoin==="function") markTeamJoin();   // 在队时长从这里开始算
  initTrust(); initSquad(); if(!back){ initCapBonus(); initBtk(); }   // 顶开过的天花板、突破进度是自己的，换队不清
  initStaff(); initRelations();
  // 伏笔兑现：职业前帮路人冲过分的人，队里可能就有一个认识你的
  if(S.flags&&S.flags.peilian&&!S.flags.peilianDone){
    const mates=myRoster().filter(p=>!p.me);
    const t=mates[Math.floor(rnd()*mates.length)];
    if(t){ S.flags.peilianDone=1; addTrust(t.id,10);
      pushEvent(`更衣室里 <b>${t.id}</b> 先认出了你——当年在排位里你陪他冲过分。<b>这层关系省了你两个月的磨合。</b>`,"good","人脉"); }
  }
  S.winStreak=0; S.sweepStreak=0; S.lckBeaten=[]; S.retireSeen=0;
  S.benchedSplits=0; S.everCut=back; S.cameFromPlayin=false;
  if(!back){ S.career.msiYears=[]; S.career.worldsYears=[]; S.career.lgYears=[]; S.career.lgStreak=0; }
  S.careerBak=null; S.freeAgent=false; S.gotCut=false;
  S.form=52; S.injury=null; S.listCooldown=0; S.signCooldown=0;
  S.rosterSig=myRoster().map(x=>x.id).sort().join("|");
  S.pendingContract=null;
  S.yearBase=(S.pre&&S.pre.week)?S.pre.week:0;   // 今年在职业前用掉的周数，让全年计数接得上
  // P.world 和 S.world 本来就是同一个对象。签完约之后 P.world 再没人读，
  // 但 JSON.stringify 会把它当成第二份完整世界写进存档——76KB 的纯冗余，
  // 每次自动存档都写一遍。用完就断开。
  S.pre.world=null; S.pre.offers=null; S.pre.baseline=null;
  S.pre.mates=null;              // 车队就到这了——职业队的默契信任由 initSquad/initTrust 重开
  // 你自己就是那个「强援」：base 上去了，但五个人要重新磨
  disruptSynergy(1,`<b>${meName()}</b> 加盟`);
  pushEvent(`<b>${meName()}</b> 正式签约 <b>${of.team}</b>（${of.t}）。${back?"重返职业赛场——上一段履历接着算。":"职业生涯从这里开始。"}`,"big","签约");
  if(!back) checkAch("sign");   // 重返职业不是「第一份合同」——野路子那类成就不该再发（玩家实锤）
  startSeason(true);
}

/* ================= 进队 ================= */
function joinTeam(){
  const o=ORIGIN[S.origin], attrs={};
  // 天赋是硬瓶颈——连出身给的底子也不例外
  DIMS.forEach(d=>attrs[d]=Math.min(o.base[d],capOf(d)));
  const world=cloneWorld();
  S.baseline=leagueBaseline(world);
  const ranked=world.LPL.map(t=>({t,p:power(t)})).sort((a,b)=>b.p-a.p);
  const idx=clamp(Math.round(ranked.length*0.55+(rnd()*4-2)),5,ranked.length-2);
  const team=ranked[idx].t;
  team.players=team.players.map(p=>p.pos===S.pos
    ? {id:S.name||"你",cn:"",pos:S.pos,age:18,r:attrs,me:true} : p);

  S=Object.assign({},S,{
    step:"season",attrs,age:18,fans:o.fame,heat:0,money:0,fatigue:0,
    si:0,week:1,ap:AP,world,team:team.name,
    record:{w:0,l:0},gameRec:{w:0,l:0},career:{w:0,l:0,titles:[],best:99},
    log:[],news:[],events:[],retiredPool:[],usedLegends:[],form:{},formSeen:{},
    schedule:[],standings:null,seasonAttr0:Object.assign({},attrs),
    scaleVer:2, born:(typeof GAME_VER!=="undefined")?GAME_VER:""
  });
  startSeason(true);
}

function myTeam(){ return S.world[S.homeLeague||"LPL"].find(t=>t.name===S.team); }
/* 在这支队待了多久（正式比赛场次）。
   玩家原话：「刚加入职业队，哪来的队友被开除，这个事件抽取也要根据玩家的游玩进度走」。
   「一起打了很久的队友被卖了」这种事件原来只判断 !!S.team——有队的第一周就能抽到。
   换队之后也要归零：刚转会过去的人，队友同样都是刚认识的。 */
function teamTenure(){
  const g=((S.career&&(S.career.w+S.career.l))||0);
  return Math.max(0, g-(S.teamSince||0));
}
function markTeamJoin(){ S.teamSince=((S.career&&(S.career.w+S.career.l))||0); }
function myRoster(){ return myTeam().players; }

/* 圆桌法循环赛：奇数队补一个轮空位，每轮每队一场 */
function roundRobin(names){
  const a=names.slice(); if(a.length%2) a.push(null);
  const n=a.length, rounds=[];
  for(let r=0;r<n-1;r++){
    const pairs=[];
    for(let i=0;i<n/2;i++){ const x=a[i], y=a[n-1-i]; if(x&&y) pairs.push(r%2?[y,x]:[x,y]); }
    rounds.push(pairs);
    a.splice(1,0,a.pop());   // 第一个固定，其余顺时针转
  }
  return rounds;
}
function buildFixtures(){
  S.fixtures={};
  const HL=S.homeLeague||"LPL";
  Object.keys(S.world||{}).forEach(lg=>{
    const names=S.world[lg].map(t=>t.name);
    for(let i=names.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [names[i],names[j]]=[names[j],names[i]]; }
    const rounds=roundRobin(names); const R=rounds.length; if(!R) return;
    let off=Math.floor(rnd()*R);
    if(lg===HL&&S.team&&names.length%2){
      // 我的轮空轮不能落在赛季里：选一个起点让 WEEKS 个连续轮避开它
      const bye=rounds.findIndex(rd=>!rd.some(x=>x[0]===S.team||x[1]===S.team));
      if(bye>=0&&R>WEEKS){ const span=R-WEEKS; off=(bye+1+Math.floor(rnd()*span))%R; }
    }
    S.fixtures[lg]=Array.from({length:WEEKS},(_,i)=>rounds[(off+i)%R]);
  });
}
function startSeason(first,split){
  S.split=(split===undefined)?0:split;
  S.carrySplit=0;      // 「院长」次数按赛段算（球探看本赛段）
  S.benchedPO=false;   // 新赛段重置「替补看完季后赛」标记
  S.loseStreak=0; S.benchLock=false;   // 新赛段：连败清零；被换下的锁也解开（新赛段教练重新看数据）
  const HL=S.homeLeague||"LPL";
  /* 真循环赛程（外部测评抓的：原来世界模拟每周把队伍按数组顺序两两固定配对，同一对打整季，
     积分榜/季后赛/国际赛名额全建在假赛程上）。每个联赛用圆桌法排出整轮，取 WEEKS 轮；
     你的赛程直接从同一张表里取，避开你的轮空轮——世界和你打的是同一份日程。 */
  buildFixtures();
  S.schedule=(S.fixtures[HL]||[]).map(round=>{ const pr=round.find(x=>x[0]===S.team||x[1]===S.team); return pr?(pr[0]===S.team?pr[1]:pr[0]):null; });
  // 兜底：极端情况下某周没排到对手（不该发生），随机补一个
  const rest=S.world[HL].filter(t=>t.name!==S.team).map(t=>t.name);
  for(let i=0;i<WEEKS;i++){ if(!S.schedule[i]) S.schedule[i]=rest[Math.floor(rnd()*rest.length)]; }
  S.schedule=S.schedule.slice(0,WEEKS);
  S.standings={};
  Object.keys(S.world).forEach(lg=>{
    S.standings[lg]={};
    S.world[lg].forEach(t=>S.standings[lg][t.name]={w:0,l:0});
  });
  S.week=1; S.ap=apFor('season'); S.record={w:0,l:0}; S.step="season"; S.tab="act";
  if(typeof ledgerRotate==="function") ledgerRotate();
  if(typeof saveGame==='function') saveGame('赛季开始');
  if(S.benchedThisSplit){ S.benchedSplits=(S.benchedSplits||0)+1; S.benchedThisSplit=false; }
  if(S.split===0) S.seasonAttr0=Object.assign({},S.attrs);
  S.buff={};                       // 私教/理疗等按赛段生效，每赛段重新买
  if(S.split===1){
    pushEvent(`<b>${SEASONS[S.si].tag} 夏季赛开赛</b>。世界赛名额就看这个赛段。`,"big","赛段");
  }
  if(!first&&S.split===0){
    S.log.push(`<div class="hi">— ${SEASONS[S.si].tag} 赛季开始（版本：${SEASONS[S.si].ver}）—</div>`);
    const sea=SEASONS[S.si];
    pushEvent(`<b>${sea.tag} 开赛</b>，版本主题「${sea.ver}」。本赛季 ${sea.fav.map(x=>POSN[x]).join("、")} 是红利位，<b>${sea.dim}</b>的权重上升。`,"big","版本");
    // 版本真的换了，才谈得上「你的英雄池被砍了一刀」
    if(typeof fireEvent==="function") fireEvent("patch",0.5);
  }
  render();
}

/* 赛段里换了队：剩下的常规赛按新队在轮次表里的对手打（转会 / 升队都用） */
function rebuildMySchedule(){
  try{
    const HL=S.homeLeague||"LPL";
    if(!S.fixtures||!S.fixtures[HL]||!S.world[HL]) return;
    const sch=(S.fixtures[HL]||[]).map(round=>{ const pr=round.find(x=>x[0]===S.team||x[1]===S.team); return pr?(pr[0]===S.team?pr[1]:pr[0]):null; });
    const rest=S.world[HL].filter(t=>t.name!==S.team).map(t=>t.name);
    for(let i=0;i<WEEKS;i++){ if(!sch[i]) sch[i]=rest[Math.floor(rnd()*rest.length)]; }
    S.schedule=sch.slice(0,WEEKS);
    if(!S.standings[HL]) S.standings[HL]={};
    if(!S.standings[HL][S.team]) S.standings[HL][S.team]={w:0,l:0};
  }catch(e){}
}
/* ================= 赛季回合 ================= */
/* 打排位带来的成长：五项都涨，但每一项都比专项训练浅。
   权重按「一局排位里各项用得多不多」来分：对线和运营用得最多，
   心态其次（连败翻盘那种），指挥在路人局里最难练，体质最慢。
   赢下来的局练得更扎实，所以带一个胜场加成。

   定标：主项（操作）约为专项训练的一半。第一版给到 75%，那样排位
   单项就快赶上专项、还外送四项，等于没人会去训练了。 */
const RANK_GAIN = { 操作:0.105, 运营:0.080, 心态:0.055, 指挥:0.035, 体质:0.025 };
function rankGain(wins, mul){
  const w = wins || 0;
  // mul：会话规模折算（异化点数后 1 点＝几把）。基项原来不缩放，
  // 12 次半场会话的「保底」是 6 次全场的两倍——属性通胀的总源头（批测抓的）。
  const m = mul || 1;
  DIMS.forEach(d=>{
    const g = RANK_GAIN[d] * (1 + w*0.22) * m;
    S.attrs[d] = Math.min(capOf(d), S.attrs[d] + g);
  });
}
/* 训练按钮的文案与可点状态。
   赛季和职业前两套面板各写过一份，结果修死锁时只改了一份，
   职业前的操作突破照样点不动。统一到这里。 */
function trainBtn(d, ap, attr){
  const c=capOf(d), done=(attr!==undefined?attr:S.attrs[d])>=c;
  const P=(typeof BREAK_PATHS!=="undefined")?BREAK_PATHS[d]:null;
  // 这条机械路已经付不出钱了？（池满 / 一次性收益已领）——
  // 玩家线上抓的：心态翻盘 3/3、复盘 6/6 还挂着进度条，其实早就没得领
  const deadWhy = done ? btkPathDead(d) : null;
  // 只有「靠继续练」能突破的维度（操作），撞瓶颈之后点它才有意义。
  // 运营靠战术复盘、体质靠休息——那些维度再点训练是纯浪费行动点。
  const trainable = done && P && P.by==="train" && !deadWhy;
  const dead = done && !trainable;
  const locked = dead && !deadWhy && P && P.by==="squad" && !S.squad;   // 职业前根本没有战队行动
  return { dead, trainable,
    dis: (ap<apCost("train")||dead),
    style: trainable?'style="border-color:var(--gold)"':'',
    title: `练${d} ${apTag("train")}${trainable?' <span class="tag">冲击瓶颈</span>':''}`,
    // tip 挂在按钮 title 上：鼠标悬停就能看到完整规则/突破路径
    tip: (done&&P)?P.how:(done?"已到天赋上限":DIM_DESC[d]),
    desc: deadWhy   ? `已达瓶颈 · ${deadWhy}`
        : trainable ? `<b>连续 3 周、每周练满 3 次</b>可破上限　${P.prog?P.prog():""}${costTrain(d)}`
        : locked    ? `已达瓶颈 · 突破要做<b>战术复盘</b>，签约战队后才有`
        : dead      ? `已达瓶颈 · 突破靠<b>${P&&P.act?P.act:"别的途径"}</b>${
                       P&&P.auto&&P.prog?`　${P.prog()}`:""}`
        : DIM_HINT[d]+costTrain(d)+(d==="指挥"?cmdNote():"") };
}
/* 指挥这一维在比赛里只取队内最高（powerCore 的 cmd=max）——训练它之前得知道主指挥是谁、差多少。
   外部测评抓的「隐性无效区间」：队友指挥比你高时，练指挥对当场战力没用；但段位/试训/实力照样算它。 */
function cmdNote(){
  if(!S.career||!S.team||typeof myRoster!=="function") return "";
  try{
    const mates=myRoster().filter(p=>!p.me);
    if(!mates.length) return "";
    const top=mates.slice().sort((a,b)=>((b.r||b).指挥||0)-((a.r||a).指挥||0))[0];
    const tv=(top.r||top).指挥||0, me=S.attrs.指挥;
    return me>=tv-0.05
      ? `　<span style="color:var(--cyan)">你是队里的主指挥</span>`
      : `　<span style="color:var(--ink-3)">主指挥是 ${top.id}（${tv.toFixed(0)}）——比赛只取队内最高，你要过 ${tv.toFixed(0)} 才进战力；段位 / 试训 / 实力照样算</span>`;
  }catch(e){ return ""; }
}
function gain(d){
  // 余量按「平移后的尺」算：全体系 +5 之后 attr/cap 的比值会缩小、全程收益慢 6%
  //（2×120 批测世界赛率掉 5 个点抓出来的）——减掉平移量再算，与换尺前逐点等价
  const t=S.talent[d],c=cap(t),room=clamp(1-((S.attrs[d]-SCALE_SHIFT)/(c-SCALE_SHIFT)),0,1);
  const ageM=S.age<=21?1.15:S.age<=23?1.0:0.6;   // 训练收益也从 24 岁起打折
  const bonus=S.origin==="academy"?1.2:1.0;
  const coach=(S.buff&&S.buff.coach)?1.22:1;
  const tb=(typeof buffVal==='function')?buffVal('train')*buffVal('mood'):1;
  const tt=(typeof traitMul==="function")?traitMul("train"):1;   // 劳模练得更快
  const ij=(typeof injuryTrainMul==='function')?injuryTrainMul():1;
  const ag=(S.ageCfg&&S.ageCfg.grow)||1;
  const bg=(S.bg&&S.bg.train)||1;
  const cs=(typeof courseTrainMul==="function")?courseTrainMul(d):1;
  // 职业前打排位现在也长属性，进队时的底子比以前厚，
  // 所以职业后的训练收益要相应压低，否则终局会失衡。
  // apComp：赛季/休赛期每周从 3 点提到 4 点，多出来的是决策空间，
  // 不能顺手多出 33% 的成长——签约后单次收益乘 0.8 对冲。
  // 职业前还是 6 点没动，不吃这个折扣。
  const apComp=S.career?0.80:1.00;
  const asset=(S.assets&&S.assets.station)?1.04:1;   // 数据分析工作站
  // 最后 5 分越练越慢（贴顶只剩 25%）——抬上限的配套，不然练到上限零成本（B4）
  const gap=capOf(d)-S.attrs[d], near=gap<5?(0.25+0.15*Math.max(0,gap)):1;
  return apComp*asset*mult(t)*(0.20+0.80*room)*near*bonus*ageM*coach*ag*bg*cs*tb*tt*ij;
}
/* ---------- 本周流水（叙事层）----------
   点了「练操作」之后原来只有数字悄悄变了一下（玩家反馈：反馈太直接、没有游戏性）。
   现在每个行动都留一句话在行动卡顶上：这周做了什么、手感怎么样。文案按本周行动数轮着挑，同一周不重复。 */
const DIARY_POOL={
  train:{
    操作:["泡在训练营磨对线，手上的细节顺了一点。","一下午的补刀和换血，肌肉记忆在长。","对着录像抠了一晚上走位。"],
    运营:["复盘了几局视野和转线的时机。","把地图资源的刷新时间背了一遍。","跟着高分局学怎么滚雪球。"],
    心态:["逆风局硬撑到底的几把，心稳了一点。","输了不摔键盘，这也是练出来的。","连败之后照常上号，这就是进步。"],
    指挥:["开麦指挥了一晚，队友居然听了。","练了怎么在团战前十秒把话说清楚。","看职业指挥的第一视角，学他们什么时候开口。"],
    体质:["跑步、拉伸、早睡——身体是本钱。","按点吃饭按点睡，手腕不酸了。","做了两组护腕训练，坐姿也改了。"]},
  pre:{rank:P=>P&&P.lastQ?`打了几把排位，${P.lastQ.w} 胜 ${P.lastQ.l} 负。`:"打了几把排位。",
       stream:"开了一晚直播。",rest:"睡了个饱，什么都没干。",boost:"接了一单代练，钱到手了。",
       cafe:"和朋友去网吧开黑，笑得比赢得多。",chill:"换了个游戏放松，手感生了一点。",watch:"看了一晚职业比赛录像。"},
  do:{solo:"打了几把排位找手感。",stream:"开了一晚直播。",content:"剪了条内容发出去。",rest:"好好休息了一天。"},
  squad:{scrim:"和别的队打了训练赛。",vod:"全队一起复盘录像。",drill:"专项练了配合。",duo:"和队友双排了一晚。"}
};
function diaryLine(a,i){
  const n=(S.thisWeek||[]).length, pick=arr=>arr[(i+n)%arr.length];
  if(a.k==="train"){ const p=DIARY_POOL.train[a.v]; return p?pick(p):`练了${a.v}。`; }
  if(a.k==="pre"){ const p=DIARY_POOL.pre[a.v]; return typeof p==="function"?p(S.pre):(p||""); }
  if(a.k==="do") return DIARY_POOL.do[a.v]||"";
  if(a.k==="squad") return DIARY_POOL.squad[a.v]||"和队里一起练了练。";
  return "";
}
function weekDiary(){
  const list=S.thisWeek||[];
  if(!list.length) return `<div class="diary muted"><span class="dk">这周</span>还什么都没做——下面挑一件事。</div>`;
  const lines=[], seen={};
  list.forEach((a,i)=>{ const key=a.k+":"+a.v; if(seen[key]) return; seen[key]=1; const t=diaryLine(a,i); if(t) lines.push(t); });
  return `<div class="diary"><span class="dk">这周</span>${lines.slice(-3).join(" ")}${

    // 但真正的价值是状态——手感这东西不练会掉。
