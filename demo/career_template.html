  const _cc=$("contentcancel"); if(_cc) _cc.onclick=()=>{S.contentPick=null;render()};
  st.querySelectorAll("[data-asset]").forEach(b=>b.onclick=()=>{
    if(typeof buyAsset==="function") buyAsset(b.dataset.asset); });
  const _pok=$("promoteok"); if(_pok) _pok.onclick=()=>{ if(typeof acceptPromote==="function") acceptPromote(); };
  const _pask=$("promoteask"); if(_pask) _pask.onclick=()=>{ if(typeof askPromoteRaise==="function") askPromoteRaise(); };
  const _pno=$("promoteno"); if(_pno) _pno.onclick=()=>{ if(typeof declinePromote==="function") declinePromote(); };
  const _pat=$("patchok"); if(_pat) _pat.onclick=()=>{
    S.patchNote=null; S.patchSeen=(typeof GAME_VER!=="undefined")?GAME_VER:1;
    if(typeof saveGame==="function") saveGame("更新说明已读"); render(); };
  const _pp=$("prepgo"); if(_pp) _pp.onclick=prepGo;
  const _off=$("offnext"); if(_off) _off.onclick=()=>{
    // 自由身在窗口的最后一周点「下一周」：先提醒（玩家点名：不然不知不觉就回了路人）
    const lastWk=S.off&&S.off.week>=S.off.weeks&&typeof txWindowOpen==="function"&&txWindowOpen();
    if(S.career&&S.freeAgent&&lastWk&&typeof askConfirm==="function"){
      const n=(S.faOffers||[]).length;
      askConfirm("注册窗这周就关",
        `你还没签约。<b>这一周过去窗口就关了</b>——没合同就回到路人主播的身份（排位、直播、杯赛，等下一次试训邀请；履历不清零）。<br>
         ${n?`桌上还有 <b>${n}</b> 家俱乐部的邀请没谈（本周页顶上的「你是自由身」卡）。`:"桌上没有邀请——「转会」栏里还能挂牌、主动接触。"}`,
        "我知道，继续", ()=>offNextWeek(), {t:"回去看看", fn:()=>render()}, "fa-last-week");
      return;
    }
    offNextWeek();
  };
  const _pg=$("pofgo"); if(_pg) _pg.onclick=takeProOffer;
  st.querySelectorAll("[data-fa]").forEach(b=>b.onclick=()=>{ if(typeof takeFaOffer==="function") takeFaOffer(+b.dataset.fa); });
  const _pn=$("pofno"); if(_pn) _pn.onclick=dropProOffer;
  const _rwy=$("rnwyes"); if(_rwy) _rwy.onclick=()=>{ if(typeof acceptRenew==="function") acceptRenew(); };
  const _rwt=$("rnwtalk"); if(_rwt) _rwt.onclick=()=>{ if(typeof renewNegotiate==="function") renewNegotiate(); };
  const _rwn=$("rnwno");  if(_rwn) _rwn.onclick=()=>{ if(typeof declineRenew==="function") declineRenew(); };
  const _at=$("askTransfer"); if(_at) _at.onclick=()=>askTransfer();
  st.querySelectorAll("[data-approach]").forEach(b=>b.onclick=()=>{
    if(typeof approachTeam==="function") approachTeam(b.dataset.approach); });
  const _bo=$("doBuyout"); if(_bo) _bo.onclick=()=>askConfirm("买断合同？",
    `自己掏 <b>${(S.contract&&S.contract.buyout)||0} 万</b>解约，立刻成为自由身。<br>
     <span class="note">这笔钱不退。经理和教练会记着，更衣室也会知道。
     好处是从此没人拦着你，别的队也不用替你付违约金。</span>`,
    "掏钱走人", ()=>doBuyout());
  const _sy2=$("strmyes"); if(_sy2) _sy2.onclick=()=>signStreamDeal();
  const _sc2=$("strmclub"); if(_sc2) _sc2.onclick=()=>signStreamDeal("club");
  const _sr2=$("strmrival"); if(_sr2) _sr2.onclick=()=>signStreamDeal("rival");
  const _sn2=$("strmno"); if(_sn2) _sn2.onclick=declineStreamDeal;
  // ---- 托管 ----
  const _aA=$("autoAll"); if(_aA) _aA.onclick=()=>{
    if(!autoAllOn()){
      askConfirm("一键全托管？",
        `采购、商务、日常会按推荐自动处理——这些是杂事，交出去没什么可惜的。<br>
         但它<b>也包含「生涯」</b>：试训、转会、合同、下放都不再问你。<br>
         <span class="note">想只交杂事的话，点下面四格里的前三个就行。</span>`,
        "全部交出去", ()=>{ autoToggleAll(); },
        {t:"只交杂事", fn:()=>{ S.auto=S.auto||{}; ["buy","biz","daily"].forEach(k=>S.auto[k]=true);
          S.auto.career=false;
          pushEvent(`赛场外的杂事交给团队了：采购、商务、日常按推荐执行。
            <b>生涯（试训/转会/合同）还是你自己定。</b>`,"info","托管"); render(); }});
      return;
    }
    autoToggleAll(); };
  const _aN=$("autoNow"); if(_aN) _aN.onclick=autoOnce;
  const _aB=$("autoBack"); if(_aB) _aB.onclick=()=>{ S.tab="act"; render(); };
  const _aO=$("autoOff"); if(_aO) _aO.onclick=()=>{ AUTO_KEYS.forEach(x=>{S.auto&&(S.auto[x.k]=false)}); render(); };
  st.querySelectorAll("[data-auto]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.auto;
    /* 「生涯」那一档要单独确认。它会替你去试训、替你谈合同、替你签字——
       玩家反馈过「打完城市争霸赛就自动上岸了」，就是误开了这一档：
       打完杯赛触发试训邀请 -> 托管自动去 -> 自动谈 -> 自动签，全程没停。
       那是它该有的行为，但绝不该是手滑点出来的。 */
    if(k==="career" && !autoOn(k)){
      askConfirm("把主线也交出去？",
        `开了这一档，<b>试训、转会、合同、下放</b>全部由推荐自动决定——<br>
         打完杯赛来了试训邀请，它会直接替你去、替你谈、替你签字。<br>
         <span class="note">你还是在打比赛，但「去哪支队、签什么合同」不再问你。
         这是这个游戏的主线，交出去基本等于看别人打。</span>`,
        "交出去", ()=>{ autoSet(k,true); },
        {t:"算了，我自己管", fn:()=>render()});
      return;
    }
    autoSet(k,!autoOn(k)); });
  st.querySelectorAll("[data-reco]").forEach(b=>b.onclick=()=>{
    // 弹窗上的单次「按推荐」：不开托管，也能这一次偷个懒
    const k=b.dataset.reco;
    if(k==="daily") autoDaily();
    else if(k==="biz") autoBiz();
    else if(k==="career") autoCareerStep();
    render(); });
  const _rn=$("renameok");
  if(_rn) _rn.onclick=()=>{
    const el=$("rename"); const v=el?safeName(el.value):"";
    if(!v){ return; }
    const old=S.name; S.name=v;
    pushEvent(`比赛服上的名字换了：<b>${escapeHtml(old||"无名")}</b> → <b>${escapeHtml(v)}</b>。`,"info","赛段");
    render();
  };
  const _tu=$("traitok"); if(_tu) _tu.onclick=()=>{ S.traitUp=null; render(); };
  const _qa=$("quickap"); if(_qa) _qa.onclick=()=>{ if(typeof quickPlan==="function") quickPlan(); };
  const _rtA=$("rtRepeat"); if(_rtA) _rtA.onclick=repeatLast;
  const _rtB=$("rtPlan");   if(_rtB) _rtB.onclick=runPlan;
  const _rtR=$("rtResume"); if(_rtR) _rtR.onclick=()=>{runActs(null,true);render();};
  const _rtX=$("rtDrop");   if(_rtX) _rtX.onclick=()=>{S.exec=null;render();};

  /* ---- 存档 ---- */
  const _sc=$("savecont"); if(_sc) _sc.onclick=()=>{ if(!loadGame()) alert("这个存档读不了，只能重开一局。"); };
  const _sn=$("savenew");  if(_sn) _sn.onclick=()=>askConfirm("重新开一局",
      "上次那个存档会被覆盖，回不来了。","确定重开",()=>{dropSave();S.confirm=null;render();});
  const _sd=$("savedrop"); if(_sd) _sd.onclick=()=>{dropSave();render();};
  const _s1=$("savenow");  if(_s1) _s1.onclick=()=>{ saveGame("手动"); render(); };
  const _s2=$("saveexp");  if(_s2) _s2.onclick=exportSave;
  const _s3=$("saveimp");  if(_s3) _s3.onclick=importSave;
  const _s4=$("saverst");  if(_s4) _s4.onclick=()=>askConfirm("放弃这一局",
      "当前进度会被清掉，从捏人重新开始。<br><span class=\"note\">想留着的话，先「导出」。</span>",
      "放弃并重开",()=>{ dropSave(); location.reload(); });

  /* ---- 通用确认框 ---- */
  const _ap=$("achpopok"); if(_ap) _ap.onclick=()=>{ (S.achPop||[]).shift(); render(); };
  const _ck=$("cfmOk"); if(_ck) _ck.onclick=()=>{ const f=S.confirm&&S.confirm.fn; S.confirm=null; if(f) f(); else render(); };
  const _ca=$("cfmAlt"); if(_ca) _ca.onclick=()=>{ const a=S.confirm&&S.confirm.alt; S.confirm=null; if(a&&a.fn) a.fn(); else render(); };
  const _cn=$("cfmNo"); if(_cn) _cn.onclick=()=>{ S.confirm=null; render(); };
  const _rtC=$("rtSave");   if(_rtC) _rtC.onclick=savePlan;
  const _rtD=$("rtSave2");  if(_rtD) _rtD.onclick=savePlan;
  const _rtE=$("rtClear");  if(_rtE) _rtE.onclick=clearPlan;
  st.querySelectorAll("[data-list]").forEach(b=>b.onclick=()=>doList(b.dataset.list));
  st.querySelectorAll("[data-sign]").forEach(b=>b.onclick=()=>doSign(b.dataset.sign));
  st.querySelectorAll("[data-squad]").forEach(b=>b.onclick=()=>doSquad(b.dataset.squad));
  const _ss=$("scrimStart"); if(_ss) _ss.onclick=()=>{ if(typeof startScrim==="function") startScrim(); };
  const _sx=$("scrimClose"); if(_sx) _sx.onclick=()=>{ if(S.scrim) S.scrim.live=null; render(); };
  st.querySelectorAll("[data-scrimopt]").forEach(b=>b.onclick=()=>scrimPick(+b.dataset.scrimopt));
  st.querySelectorAll("[data-do]").forEach(b=>b.onclick=()=>doAction(b.dataset.do));
  const p=$("play"); if(p&&!S.locker) p.onclick=()=>{isBenched()?benchWeek():startMatch(false)};
  const au=$("auto"); if(au) au.onclick=()=>{
    const f=DIMS.reduce((a,b)=>S.talent[a]>=S.talent[b]?a:b);
    askConfirm("自动推进",
      `由系统替你安排：疲劳高就休息，否则练 <b>${f}</b>（练满就转去补最短的板），然后打完比赛。<br>
       <b>路上的际遇、更衣室、报价、试训、转会问询、合同，全部按托管规则替你决定</b>——不会中途停下（不动你的采购开关，不替你花钱）。<br>
       推满周数或常规赛打完时，弹一份<b>推进总结</b>：战绩、每场比分、属性变化、替你做的每个决定。<br>
       <span class="note">这期间的训练和临场决策都不是你做的。</span>`,
      "推 6 周", ()=>autoRest(f,AUTO_MAX),
      {t:"推到赛季结束", fn:()=>autoRest(f,AUTO_FAR)});
  };
  st.querySelectorAll("[data-node]").forEach(b=>b.onclick=()=>resolveNode(+b.dataset.node));
  const nx=$("next"); if(nx) nx.onclick=nextWeek;
  // 赛后拆解一屏（照 Val Manager）：比分页 → 拆解页 → 下一周
  const pg=$("pmgo"); if(pg) pg.onclick=()=>{S.match.pmSeen=true;render();scrollStageTop();};
  // 比赛档案里的拆解回放
  st.querySelectorAll("[data-pmv]").forEach(b=>b.onclick=()=>{S.pmView=+b.dataset.pmv;render()});
  st.querySelectorAll("[data-selfrec]").forEach(b=>b.onclick=()=>selfRecommend(b.dataset.selfrec));
  st.querySelectorAll("[data-txlg]").forEach(b=>b.onclick=()=>{S.txLgPick=b.dataset.txlg;render()});
  const pc=$("pmclose"); if(pc) pc.onclick=()=>{S.pmView=null;render()};
  const of=$("off"); if(of) of.onclick=doOffseason;
  st.querySelectorAll("[data-ef]").forEach(b=>b.onclick=()=>{S.evFilter=b.dataset.ef;render()});
  const ag=$("again"); if(ag) ag.onclick=screenCreate;
  const ag2=$("again2"); if(ag2) ag2.onclick=screenCreate;   // 结局页最底下那颗（原来和名片下那颗撞了 id，点不动）
}

let S=null;
screenCreate();
if(typeof audioInit==="function") audioInit();   // 声音、作者栏版本号、更新日志浮窗
if(typeof xferPull==="function") xferPull();     // 老域名上的存档接力（只在 www 上生效）
</script>
