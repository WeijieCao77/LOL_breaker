    // 不然 1 点行动在 8 点预算下可刷，批测把 MSI 从 13 抬到 23（实测）。
    const lightMul=0.50;
    const w=1+Math.floor(rnd()*3);
    if(typeof rankGain==="function") rankGain(w,lightMul);
    // 段位也要跟着动。原来赛季里段位是个冻住的死数字，
    // 进职业之后就再也不变了——但职业选手照样在天梯上。
    if(S.pre&&S.pre.rank!==undefined&&typeof soloWinP==="function"){
      const st=(typeof rankStep==="function")?rankStep():2;
      for(let i=0;i<3;i++){
        if(rnd()<soloWinP()) S.pre.rank=clamp(S.pre.rank+st*prepMul*lightMul,0,100);
        else S.pre.rank=clamp(S.pre.rank-st*0.82*prepMul*lightMul,0,100);
      }
      if(typeof checkAch==="function") checkAch("rank");   // 生涯里冲到国服前十也该解锁
    }
    if(S.form!==undefined){
      const before=S.form;
      // 往「不错」的方向拉，但越接近上限拉得越慢；不可能靠排位刷到爆表
      S.form=q1(clamp(S.form+((68-S.form)*0.11+1.2)*prepMul*lightMul,25,95));
      if(Math.round(S.form)>Math.round(before))
        pushEvent(`打了几把排位，手感回来一些（状态 ${Math.round(before)} → ${Math.round(S.form)}）。`,"info","排位");
    }
    addFat(4*prepMul);
    if(typeof ladderEncounter==="function") ladderEncounter(0.50);   // 天梯撞车：按场次折算
  }
  else if(k==="stream"){const m=S.origin==="streamer"?1.6:1.0;
    addFans(4.5*m*(typeof streamFansMul==="function"?streamFansMul():1));
    if(typeof addMoney==='function') addMoney('stream',streamIncome()); else S.money+=streamIncome();
    addFat(5);
    if(S.streamDeal) S.streamDeal.done=(S.streamDeal.done||0)+1;   // 开播条款按次数记
    if(typeof checkStreamBiz==="function") checkStreamBiz();
    // 榜一大哥只会在你真的开播的时候出现，不该每周瞎摇
    if(typeof fireEvent==="function") fireEvent("streamGift",0.20);}
  else{ if(typeof btkNote==="function") btkNote("rest",1);
    addFat(((S.buff&&S.buff.physio)?-23:-17)*((S.bg&&S.bg.rest)||1)*prepMul);   // 1 点碎片休息：效果 ×0.55
    if(S.assets&&S.assets.rehab) addFat(-4.5*prepMul);      // 私人康复室（×0.55）
    S.attrs.心态=Math.min(capOf("心态"),S.attrs.心态+0.35*prepMul);
    // 休息也是泄压阀：心理课让它更管用
    if(S.tilt) S.tilt=Math.max(0,q1(S.tilt-(6+(typeof hasCourse==="function"&&hasCourse("psy")?3:0))*prepMul));}
  S.ap-=apCost(k);render();
}
/* 自动推进 —— 推到「下一件需要你拿主意的事」就停。

   原来这里是「自动推完本赛季」：一路 while 到底，中间的际遇、
   更衣室谈话、突破提示全被无声地压过去。等你回过神，一个赛季没了，
   而且你根本不知道中间发生过什么——那些本该是你做的选择，
   被一个按钮替你做了（而且是随机做的）。

   现在它只替你跳过「没得选的周」，一旦有事立刻交回给你。       */
/* 上限交给玩家选：有人想「跳过没事的几周」，有人想「这赛季别烦我」。
   写死 6 周是我一开始的保守，但真正的安全阀是 autoStop()——
   有事就停，跟推几周无关。 */
const AUTO_MAX=6;
const AUTO_FAR=99;

/* 需要玩家决定的事——任何一个亮着，自动推进就必须停 */
function autoStop(){
  // 待处理的试训邀请也是「需要你决定的事」，漏在这里的话
  // 「自动推进到下一件事」会直接冲过去，机会就这么没了。
  return !!(S.rndEv||S.rndResult||S.locker||S.signup||S.rankUp
           ||S.cupResult||S.cupMatch||S.confirm||S.streamOffer||S.intlChamp||S.contentPick
           ||S.promoteDeal||S.patchNote||S.autoSum
           ||(S.pre&&S.pre.invite&&S.pre.invite.pending));
}
function autoRestLegacy(focus,weeks){
  const lim=weeks||AUTO_MAX;
  const w0=S.week, s0=S.step;
  let w=0;
  while(S.step==="season"&&w<lim){
    if(autoStop()) break;
    while(S.ap>0){
      if(autoStop()) break;
      const _b=S.ap;
      const av=DIMS.filter(d=>S.attrs[d]<capOf(d));
      const fbp=(typeof BREAK_PATHS!=="undefined")?BREAK_PATHS[focus]:null;
      if(S.fatigue>70) doAction("rest");
      else if(av.includes(focus)) doTrain(focus);
      // 主项撞了瓶颈但「继续练就能突破」——那就接着练，别改道；
      // 前提是机械突破池还有余量。池子用完还死练满级维度，就是整季白练
      //（玩家实锤：推了一个赛季实力一动不动）
      else if(fbp&&fbp.by==="train"&&S.attrs[focus]>=capOf(focus)
              &&typeof capMechOf==="function"&&capMechOf(focus)<CAP_MECH_MAX) doTrain(focus);
      else if(av.length) doTrain(av.slice().sort((a,b)=>S.attrs[a]-S.attrs[b])[0]);   // 补最短的板
      else doAction("stream");
      // 异化点数：剩 1 点付不起 2 点的行动会原地死转（玩家实测「只打了一场就停」
      // ——其实是这里卡死、刷新后只剩自动存档那一周）。1 点用排位收尾。
      if(S.ap===_b) doAction("solo");
      if(S.ap===_b) break;
    }
    if(autoStop()||S.ap>0) break;      // 有事，或者一个点都没推动
    startMatch(); autoMatch();
    w++;
    if(typeof saveGame==="function") saveGame("自动推进");
  }
  // 说清楚停在哪、为什么停——不然玩家不知道刚才那几周发生了什么
  if(w>0){
    const why=autoStop()?"有事情需要你处理。"
             :S.step!==s0?"赛季阶段变了。"
             :w>=lim?`到了这次推进的上限（${lim} 周）。`:"";
    pushEvent(`自动推进了 <b>${w} 周</b>（第 ${w0}–${S.week>w0?S.week-1:w0} 周），停下了：${why}`,"info","推进");
  }
  render();
}

/* ================= 自动推进（2026-09-05 重做）=================
   玩家原话：「推到赛季结束没有意义，每次都会被周中的事件截断」「推六周也是一样的问题」。
   现在两种推进都不会被打断：路上的际遇、更衣室、直播报价、试训邀请、转会问询、
   合同、转正、确认框，全部按托管规则代办（不动你的采购开关——不替你花钱），
   推满周数或到赛季末停下，弹一份「推进总结」：战绩、每场比分、属性变化、
   突破、替你做的决定、大事记。 */
function autoClear(){
  const saved=S.auto;
  S.auto={buy:!!(saved&&saved.buy), biz:true, daily:true, career:true};
  try{
    for(let i=0;i<40;i++){
      let did=false;
      if(S.rankUp){ S.rankUp=null; did=true; }
      else if(S.patchNote){ S.patchNote=false; did=true; }
      else if(S.intlChamp){ S.intlChamp=null; did=true; }
      else if(S.rndResult){ S.rndResult=null; did=true; }
      else if(S.contentPick){ S.contentPick=null; did=true; }
      else if(S.promoteDeal){
        if(typeof acceptPromote==="function"){ acceptPromote(); if(typeof autoNote==="function") autoNote("首发合同：接受了"); }
        else S.promoteDeal=null;
        did=true;
      }
      else if(S.confirm){
        const c=S.confirm;
        if(c.tag==="senddown"&&typeof autoCareerStep==="function"&&autoCareerStep()) did=true;
        else { S.confirm=null; if(typeof autoNote==="function") autoNote(`「${c.title}」：先放着（取消）`); did=true; }
      }
      else if(typeof autoStep==="function"&&S.step!=="match"&&autoStep()) did=true;
      if(!did) break;
    }
  }catch(e){ S._autoErr=(e&&e.message)||String(e); }
  finally{ S.auto=saved; }
}
function autoRest(focus,weeks){
  const lim=weeks||AUTO_MAX;
  const w0=S.week, s0=S.step, si0=S.si, sp0=S.split||0;
  const snap={ attrs:Object.assign({},S.attrs), money:S.money, fat:S.fatigue,
    rec:Object.assign({w:0,l:0},S.record||{}), ev:(S.events||[]).length,
    log:(S.autoLog||[]).length, arc:(S.archive||[]).length, ach:(S.achLog||[]).length };
  let w=0, guard=0, stuck="";
  while(S.step==="season"&&w<lim&&guard++<80){
    autoClear();
    if(autoStop()){ stuck="有件事托管处理不了"; break; }
    while(S.ap>0){
      const _b=S.ap;
      const av=DIMS.filter(d=>S.attrs[d]<capOf(d));
      const fbp=(typeof BREAK_PATHS!=="undefined")?BREAK_PATHS[focus]:null;
      if(S.fatigue>70) doAction("rest");
      else if(av.includes(focus)) doTrain(focus);
      else if(fbp&&fbp.by==="train"&&S.attrs[focus]>=capOf(focus)
              &&typeof capMechOf==="function"&&capMechOf(focus)<CAP_MECH_MAX) doTrain(focus);
      else if(av.length) doTrain(av.slice().sort((a,b)=>S.attrs[a]-S.attrs[b])[0]);
      else doAction("stream");
      if(S.ap===_b) doAction("solo");
      if(S.ap===_b) break;
      autoClear();
    }
    if(S.ap>0){ stuck="行动点花不出去"; break; }
    if(autoStop()){ stuck="有件事托管处理不了"; break; }
    // 替补就是替补——自动推进不能把你偷偷排上场（和季后赛那次是同一个坑）
    if(typeof isBenched==="function"&&isBenched()) benchWeek();
    else { startMatch(); autoMatch(); }
    w++;
    if(typeof saveGame==="function") saveGame("自动推进");
  }
  autoClear();
  if(w>0||stuck){
    const rec={w:(S.record?S.record.w:0)-snap.rec.w, l:(S.record?S.record.l:0)-snap.rec.l};
    const matches=(S.archive||[]).slice(snap.arc).filter(r=>r.si===si0&&r.sp===sp0);
    const ev=(S.events||[]).slice(snap.ev);
    const why=stuck?stuck+"。"
             :S.step!==s0?"常规赛打完了。"
             :w>=lim?`推满了 ${lim} 周。`:"";
    S.autoSum={ w0, w1:w0+Math.max(0,w-1), weeks:w, why, rec,   // 赛季一结束 S.week 会归 1，按推进周数算末周
      team:S.team, teamRec:((S.standings[S.homeLeague||"LPL"]||{})[S.team])?Object.assign({},(S.standings[S.homeLeague||"LPL"]||{})[S.team]):null,
      benched:(typeof isBenched==="function")?isBenched():false,   // 替补的「0 胜 0 负」是你没上场，不是队伍没打（玩家实锤）
      matches:matches.map(r=>({w:r.w,opp:r.opp,sc:r.sc,win:r.win})),
      attrs:DIMS.map(d=>({d,a:snap.attrs[d],b:S.attrs[d]})),
      strength:{a:strength(snap.attrs),b:strength(S.attrs)},
      money:(S.money||0)-(snap.money||0), fat:S.fatigue,
      breaks:ev.filter(e=>e.tag==="突破").map(e=>e.text),
      notes:(S.autoLog||[]).slice(snap.log),
      big:ev.filter(e=>e.tone==="big"||e.tone==="bad").map(e=>e.text).slice(-10),
      achs:(S.achLog||[]).slice(snap.ach).map(a=>a.n||a.id),
      injury:S.injury?(S.injury.n||"伤病"):"" ,
      seasonOver:S.step!==s0 };
    pushEvent(`自动推进了 <b>${w} 周</b>（第 ${w0}–${S.autoSum.w1} 周），${why}<span style="color:var(--ink-3)">这段时间的详情见推进总结。</span>`,"info","推进");
  }
  render();
}
/* ================= 职业前的自动推进（2026-09-06 玩家点名）=================
   「有的玩家就是喜欢看故事」——赛季里能一键推到赛季末，职业前却只能一周一周点。
   和赛季版同一套规矩：行动点按「一键安排」的路数花；报名、杯赛、际遇、直播报价、
   试训邀请、合同全部按托管规则代办（不动采购开关，不替你花钱）；
   推满周数、年底关窗结算、或签进俱乐部时停下，弹一份推进总结。 */
function autoCupPlay(){

  while(S.cupMatch&&g++<60){
    const m=S.cupMatch;
    if(m.done){ cupDismissMatch(); break; }
    if(!m.node) break;
    // 节点：选和自己最强那一维对上的选项（和托管打试训同一条规则）
    let best=-1,i=0; (m.node.a||[]).forEach((o,k)=>{ const v=S.attrs[o.dim]||0; if(v>best){best=v;i=k;} });
    resolveCupNode(i);

           :ended?"走到了时间尽头。"
           :yearEnd?"转会窗口关了，这一年结算完毕——新的一年交回给你。"
           :w>=lim?`推满了 ${lim} 周。`:"";
  const plog=P.log||[];

  S.autoSum={ pre:true, w0, w1:yearEnd?PRE_YEAR:Math.min(PRE_YEAR,w0+Math.max(0,w-1)), weeks:w, why, signed, yearEnd,
    rec:{w:0,l:0}, matches:[], team:signed, teamRec:null, benched:false,
    rank:{a:snap.rank,b:P.rank}, fans:{a:snap.fans,b:S.fans||0},
    attrs:DIMS.map(d=>({d,a:snap.attrs[d],b:S.attrs[d]})),
    strength:{a:strength(snap.attrs),b:strength(S.attrs)},
    money:(S.money||0)-(snap.money||0), fat:S.fatigue,
    breaks:ev.filter(e=>e.tag==="突破").map(e=>e.text),
    notes:(S.autoLog||[]).slice(snap.log),
    preLines,
    big:ev.filter(e=>e.tone==="big"||e.tone==="bad").map(e=>e.text).slice(-10),
    achs:(S.achLog||[]).slice(snap.ach).map(a=>a.n||a.id),
    injury:S.injury?(S.injury.n||"伤病"):"", seasonOver:false };
  pushEvent(`自动推进了 <b>${w} 周</b>（赛季前第 ${w0}–${S.autoSum.w1} 周），${why}<span style="color:var(--ink-3)">这段时间的详情见推进总结。</span>`,"info","推进");
  render();
}

function startMatch(bo,oppName){
  const on=oppName||S.schedule[S.week-1];
  let opp=findTeam(on);
  /* 赛程里的队名在当前世界里找不到，findTeam 就返回 null——而 m.opp.players
     在 gameWinP / playGame / endMatch 里有六七处是不设防的，一路带下去就是
     整局崩掉（实测 100 局命中 1 次）。跨赛区转会和赛季换代都可能留下这种
     陈旧条目。这里在唯一的入口兜住：从当前联赛里挑一支真实存在的队顶上，
     并且把队名也改过来，免得界面显示一个不存在的对手。 */
  if(!opp){
    /* 兜底要挑对池子。原来一律从「你自己的联赛」里挑一支顶上——
       于是国际赛也会拿本赛区的队来填，MSI 小组赛里冒出同赛区对手
       （玩家报的：LNG 在 MSI 小组赛遇到 ThunderTalk）。
       国际赛就从这届的参赛名单里挑，联赛才从你的联赛里挑。 */
    const inIntl = !!S.intl;
    let pool=[];
    if(inIntl){
      const names=[].concat(S.intl.field||[], S.intl.direct||[], S.intl.queue||[])
                    .filter(n=>n&&n!==S.team);
      pool=names.map(n=>findTeam(n)).filter(Boolean);
    }
    if(!pool.length){
      const lg=(S.world&&S.world[S.homeLeague||"LPL"])||[];
      pool=lg.filter(t=>t.name!==S.team);
    }
    opp=pool[0]||null;
    S._oppFix=(S._oppFix||0)+1;
    if(opp&&typeof pushEvent==="function")
      pushEvent(`赛程里的 <b>${on}</b> 找不到了，本场对手改为 <b>${opp.name}</b>。`,"info","赛段");
  }
  const need=(typeof bo==="number")?bo:(bo?3:2);   // 1=BO1 2=BO3 3=BO5
  S.match={opp,oppName:(opp&&opp.name)||on,sc:[0,0],game:1,lines:[],node:null,swing:0,done:false,
           need,bo5:need>=3};
  // 竞技锐度：距离上一场正赛超过 4 周（长间歇/休赛期回来），手是生的——
  // 开局带一点负 swing，第一局打完就找回来。轻手感，不是惩罚。
  if(S.career&&S.lastFightClock!==undefined&&((S.evClock||0)-S.lastFightClock)>=4){
    S.match.swing-=2;
    S.match.lines.push(`<div><span class="hi">久疏赛场</span> 离上一场正赛已经有一阵了，开局手有点生（第一局赢面略降）。</div>`);
  }
  S.step="match"; nextGame();
}
function nextGame(){
  const m=S.match;
  if(m.sc[0]>=m.need||m.sc[1]>=m.need){endMatch();return;}
  // 扩充池并入；给条件函数补上局势信息
  const ALL=(typeof NODES_MORE!=="undefined")?NODES.concat(NODES_MORE):NODES;
  const ctx=Object.assign({},m,{lead:m.sc[0]-m.sc[1]});
  let pool=ALL.filter(n=>{try{return n.when(ctx);}catch(e){return false;}});
  // 同一场里尽量不重复
  m.seenNodes=m.seenNodes||[];
  const fresh=pool.filter(n=>!m.seenNodes.includes(n.q));
  if(fresh.length) pool=fresh;
  m.node=pool[Math.floor(rnd()*pool.length)];
  if(m.node) m.seenNodes.push(m.node.q);
  render();
}
/* 心态气压对战力的拖累：Tilt 55 以下没事，越往上手越抖（100 时约 −1.8）。
   泄压的路都写在明面上：赢一场、休息、心理课。 */
function tiltDrag(){
  const t=S.tilt||0;
  return t>55?(t-55)*0.04:0;
}
/* 这一局此刻的赢面（给玩家看的，和 playGame 用同一套算法） */
function gameWinP(swing){
  const m=S.match,sea=SEASONS[S.si];
  const my=power(myRoster(),S.fatigue,sea.fav)+(swing||0)+versionFit()+rivalBoost(m.oppName)-tiltDrag();
  const op=power(m.opp.players,0,sea.fav);
  return clampWinProb(1/(1+Math.exp(-(my-op)/SPREAD)), my-op);
}
/* 节点摆动倍率与成功率里的队友占比（2026-09-06 方案 A）：一个人拉不动四个人——
   成功率七成看你、三成看队友同一维的均值；摆动从 ±风险×6 收到 ±风险×4.5。操作 92 配 55 分队友：75% → 67%，期望每节点 +2.7 → +1.5 */
const NODE_SWING=5.5, NODE_MATE_W=0.3;   // 2026-09-06 夜：4.5 把国际冠军率压回 3–4%，5.5 是「一个人拉不动垫底队」和「国际赛还打得赢」之间的折中（批测 H）
function nodeSkill(dim){
  const mine=S.attrs[dim];
  try{
    const mates=myRoster().filter(p=>!p.me);
    if(!mates.length) return mine;
    const avgM=mates.reduce((a,p)=>a+((p.r||p)[dim]||50),0)/mates.length;
    return mine*(1-NODE_MATE_W)+avgM*NODE_MATE_W;
  }catch(e){ return mine; }
}
function resolveNode(ai){
  const m=S.match,opt=m.node.a[ai],v=nodeSkill(opt.dim);
  // 风险真的影响成功率（外部测评抓的：原来「高风险」只放大摆动、不降成功率，标签骗人）：
  // risk 0.9 的选项比中性低约 6 个点，0.3 的高约 3 个点；摆动倍率照旧
  const p=clamp(0.30+(v/100)*0.55-((opt.risk||0.5)-0.5)*0.15,0.12,0.92);
  const ok=rnd()<p;
  const was=gameWinP(m.swing);            // 做决定之前的赢面
  m.swing+=(ok?1:-1)*opt.risk*NODE_SWING;
  const now=gameWinP(m.swing);            // 做完之后
  if(typeof addStaff==='function') addStaff('coach',ok?0.3:-0.6);
  if(!ok){ m.nodeFails=(m.nodeFails||0)+1;
    (m.failDims=m.failDims||[]).push(opt.dim); }   // 复盘要知道输在哪个维度上
  const d=Math.round(now*100)-Math.round(was*100);
  // 拆解要的账本：这个选择当时的成功率、结果、动了几个百分点的赢面
  (m.nodeLog=m.nodeLog||[]).push({g:m.game,t:opt.t,dim:opt.dim,p:Math.round(p*100),ok,d});
  m.lines.push(`<div><span class="hi">第${m.game}局</span> ${opt.t} — ${ok
    ?`<span class="w">成了</span>`:`<span class="l">没成</span>`}　<span class="${
      d>0?'w':d<0?'l':''}">赢面 ${Math.round(was*100)}% → ${Math.round(now*100)}%</span></div>`);
  m.node=null; playGame();
}
function playGame(){
  const m=S.match,sea=SEASONS[S.si];
  const my=power(myRoster(),S.fatigue,sea.fav)+m.swing+versionFit()+rivalBoost(m.oppName)-tiltDrag();
  const op=power(m.opp.players,0,sea.fav);
  let p=1/(1+Math.exp(-(my-op)/SPREAD));
  // 封顶用的差距必须把 m.swing（临场决策的结果）算进去。
  // 原来传的是不含 swing 的原始差距，于是差距一超过 GAP_WINDOW，
  // 赢面就被锁死在 7%——你抢龙抢成了也没用。
  // 而游戏自己的文案写着「劣势：硬碰硬赢不了，得赌一把」，
  // 赌了却不算数，那这些选项就真的没有意义了。
  p=clampWinProb(p, my-op);
  const win=rnd()<p;
  if(win){m.sc[0]++;S.gameRec.w++;S.career.w++}else{m.sc[1]++;S.gameRec.l++;S.career.l++}
  // 拆解要的账本：这一局开打时的赢面和结果——「90% 也输了」要能对上号
  (m.gameLog=m.gameLog||[]).push({g:m.game,p:Math.round(p*100),win});
  m.lines.push(`<div>第${m.game}局 ${win?'<span class="w">胜</span>':'<span class="l">负</span>'}</div>`);
  if(m.game===2&&m.sc[1]===2) m.firstTwoLost=true;
  m.game++; m.swing*=0.4; nextGame();
}
function autoMatch(){
  let g=0;
  while(S.step==="match"&&!S.match.done&&g++<40){
    if(S.match.node) resolveNode(rnd()<0.5?0:1); else playGame();
  }
  if(S.step==="match"&&S.match.done) nextWeek();
}
/* ---------- 个人数据与比赛档案（2026-08-31 竞品拆解移植）----------
   每个系列赛合成一份可信的个人数据：KDA、分均补刀、伤害占比、评分。
   教练组、周报、试训谈判看的都是这些数字——「都是用比赛衡量的」。
   合成口径：以你和对手的真实战力差、临场节点成败为骨架，按位置画像摆数。 */
const POS_STATLINE={top:[3.1,2.7,4.9,8.3,0.24],jng:[2.8,2.5,7.6,6.2,0.18],
  mid:[4.1,2.5,5.2,8.8,0.28],bot:[5.0,2.3,4.4,9.4,0.30],sup:[1.0,2.9,9.8,1.6,0.10]};
function synthSeriesStats(m,won,myPw,opPw){
  if(!S.career) return;
  const games=m.sc[0]+m.sc[1];
  /* 全员数据（boxscore.js）：双方十个人一起合成，你的那一行从里面取——
     这样你的数据、队友的数据、球探看的数据是同一份。没有模块时退回旧算法。 */
  const box=(typeof synthBoxScore==="function")?synthBoxScore(m,won):null;
  let k,d,a,cs,dmg,rating;
  if(box){ const me=box.mine.find(x=>x.me)||box.mine[0]; k=me.k;d=me.d;a=me.a;cs=me.cs;dmg=me.dmg;rating=me.rating; }
  else{
    const P=POS_STATLINE[S.pos]||POS_STATLINE.mid;
    const perf=clamp(1+ (myPw-opPw)*0.022 + (won?0.14:-0.10) - (m.nodeFails||0)*0.05 + (rnd()-0.5)*0.24, 0.5, 1.65);
    k=q1(P[0]*perf); d=q1(P[1]*(2-perf)*0.85+0.6); a=q1(P[2]*(0.8+perf*0.25));
    cs=q1(P[3]*(0.9+perf*0.12)); dmg=Math.round(P[4]*100*(0.82+perf*0.2));
    const kda=q1((k+a)/Math.max(1,d));
    rating=q1(clamp(0.35+perf*0.55+(kda-2.6)*0.045,0.2,2.0));
  }
  const tag=S.intl?(S.intl.type==="msi"?"MSI":"世界赛"):S.playoff?"季后赛":((S.homeLeague||"LPL")==="LDL"?"LDL":"联赛");
  S.archive=(S.archive||[]);
  S.archive.push({si:S.si,sp:S.split||0,w:S.week,tag,opp:m.oppName,sc:m.sc.slice(),win:won,g:games,k,d,a,cs,dmg,rating,box:box||undefined});
  if(S.archive.length>60) S.archive.shift();
  // 全员表只留最近 20 场，存档别撑大
  let keepBox=0;
  for(let i=S.archive.length-1;i>=0;i--) if(S.archive[i].box&&++keepBox>20) delete S.archive[i].box;
  S.stats=S.stats||{n:0,k:0,d:0,a:0,r:0};
  S.stats.n++; S.stats.k+=k; S.stats.d+=d; S.stats.a+=a; S.stats.r+=rating;
  m.myline={k,d,a,cs,dmg,rating}; m.box=box;
  if(box&&box.carry){
    S.carries=(S.carries||0)+1; S.carrySplit=(S.carrySplit||0)+1;
    pushEvent(`<b>院长局</b>：输给 ${m.oppName}，但你评分 <b>${rating.toFixed(2)}</b> 全队最高，队友场均 ${box.mateAvg.toFixed(2)}${box.worst?`（${box.worst} ${box.worstR.toFixed(2)}）`:""}。<span style="color:var(--ink-3)">这场输球不算在你头上——球探看数据，不只看比分。</span>`,"info","数据");
  }
  if(box&&box.soloWin) S.soloWins=(S.soloWins||0)+1;
  S.log.push(`<div><span class="hi">个人数据</span> ${Math.round(k*games)}/${Math.round(d*games)}/${Math.round(a*games)}（${games} 局合计）· 分均补刀 ${cs} · 伤害 ${dmg}% · 评分 <b>${rating.toFixed(2)}</b></div>`);
}
/* 我的页 · 比赛档案卡：生涯场均 + 最近八个系列赛 */
function dataCard(){
  if(!S.career||!S.stats||!S.stats.n) return "";
  const st=S.stats, n=st.n;
  const rows=(S.archive||[]).map((x,i)=>({x,i})).slice(-8).reverse();
  return `<div class="card"><h2>比赛档案<em>${n} 个系列赛</em></h2>
    <p class="note" style="margin:0 0 8px">生涯场均
      <b>${q1(st.k/n)} / ${q1(st.d/n)} / ${q1(st.a/n)}</b> · 评分 <b>${(st.r/n).toFixed(2)}</b>
      <span style="color:var(--ink-3)">——教练组和试训谈判看的就是这几个数字。</span></p>
    <div class="tw"><table><thead><tr><th></th><th>对手</th><th>比分</th><th>KDA</th><th>评分</th><th></th></tr></thead><tbody>

      <td class="n">${x.pm?`<button class="act" data-pmv="${i}" style="padding:2px 10px;font-size:12px">拆解</button>`:""}</td></tr>`).join("")}
    </tbody></table></div></div>`;
}
/* 本周页 · 心态气压条：只在开始起飞时出现，不占地方 */
function tiltNote(){
  const t=S.tilt||0;
  if(t<40) return "";
  const drag=tiltDrag();
  return `<p class="note" style="color:${t>=60?'var(--red)':'var(--gold)'};margin:2px 0">
    心态气压 <b>${Math.round(t)}</b>/100${drag?`——发挥正在被拖累（战力 −${drag.toFixed(1)}）`:"，再输就要影响发挥了"}。
    <span style="color:var(--ink-3)">休息、心理课、或者赢一场都能泄压。</span></p>`;
}
function endMatch(){
  const m=S.match,won=m.sc[0]>m.sc[1];
  if(!S.playoff&&!S.intl){
    if(won)S.record.w++;else S.record.l++;
    const HL=S.homeLeague||"LPL";
    const st=S.standings[HL];
    if(st&&st[S.team]) st[S.team][won?"w":"l"]++;
    if(st&&st[m.oppName]) st[m.oppName][won?"l":"w"]++;

  }

  // 出场费按联赛分级：LDL 的钱就是 LDL 的钱（经济重锚）

  if(typeof addMoney==='function') addMoney('match',purse); else S.money+=purse;
  // 胜 +0.6 / 负 +0.7（外部测评抓的：原来负 +1.1 是胜的两倍多，等于鼓励故意输球养心态；挫折仍长心态，但不值得故意输）
  S.attrs.心态=Math.min(capOf("心态"),S.attrs.心态+(won?0.6:0.7));

      if(m.attr&&S.archive&&S.archive.length){
        const row=S.archive[S.archive.length-1];
        if(row.opp===m.oppName&&row.sc[0]===m.sc[0]&&row.sc[1]===m.sc[1]){
          row.pm={rows:m.attr.rows,my:m.attr.myTotal,op:m.attr.opTotal,
                  adv:(typeof reviewAdvice==="function")?reviewAdvice(m):null,
                  nodes:m.nodeLog||[],luck:m.luck||[]};
          let keep=0;
          for(let i=S.archive.length-1;i>=0;i--) if(S.archive[i].pm&&++keep>12) delete S.archive[i].pm;
        }
      }
    }catch(e){}
  }
  if(typeof rollInjury==='function'&&S.fatigue>55) rollInjury('赛后');
  simWorld(); m.done=true;
  if(!won) tryLockerEvent();
  /* 赛后事件：每一条都由这场比赛里真的发生的事引出来。
     fireEvent 内部会检查「已经有事件挂着」，所以这里按重要性排，先到先得。 */
  if(typeof fireEvent==="function"){
    // 赢下比自己强的队 → 官方采访点名要你
    if(won && ctx.gap < -1.5) fireEvent("bigWin", 0.45);
    // 连败到第三场 → 经理找你谈
    if(!won && (S.record.l||0) >= 3) fireEvent("skid", 0.40);
    // 营销号剪的是「你这场没成的那几个操作」，所以必须真的失手过；
    // 输了比赢了更容易被拿来做文章。
    if((m.nodeFails||0) > 0) fireEvent("hater", won?0.10:0.22);
    // 强队爆冷是 simWorld 真的模拟出来的，不是编的
    if(S._upset) fireEvent("upset", 0.55);
    // 连败拖长了就不只是「经理找你谈」了——更衣室开始翻你的数据
    if(!won && (S.record.l||0) >= 5) fireEvent("slump", 0.35);
  }
  render();
}
/* AI 队赛季里也练默契 / 战术（2026-09-06 玩家拍板「弱队冲榜」方案 B）：每周 +0.6、只往 62 靠，换人后照旧砸、再回补。
   原来只有你的队在练（托管一个赛段能把默契推到 65+），AI 队的默契整个赛季不动——这是「明星个人进垫底队」还能冲前二的最后一根杠杆。 */
const AI_TRAIN_STEP=0.6, AI_TRAIN_CAP=62;
function aiTeamsTrain(){
  try{
    Object.keys(S.world||{}).forEach(lg=>(S.world[lg]||[]).forEach(t=>{
      if(S.team&&t.name===S.team) return;
      if(t.syn!==undefined&&t.syn<AI_TRAIN_CAP) t.syn=q1(Math.min(AI_TRAIN_CAP,t.syn+AI_TRAIN_STEP));
      if(t.tac!==undefined&&t.tac<AI_TRAIN_CAP) t.tac=q1(Math.min(AI_TRAIN_CAP,t.tac+AI_TRAIN_STEP));
    }));
  }catch(e){}
}
function simWorld(){
  // 国际赛 / 季后赛期间联赛停摆——原来每打一场国际赛都替联赛多模拟一周，
  // 世界赛期间冒出「TT 爆冷击败 EDG」还进了大事记（玩家实锤：TT 根本没来世界赛）
  if(S.intl||S.playoff) return;
  aiTeamsTrain();   // 方案 B：AI 队每个常规赛周也在练
  S._upset=null;          // 每周重摇：际遇里说的冷门必须是「这一周真的发生的」
  Object.keys(S.world).forEach(lg=>{
    const sea=SEASONS[S.si];
    // 排除「你的队和你本周对手」要看你实际在哪个联赛——原来写死 LPL，
    // 玩家在 LDL 时自己的队每周被这里多模拟一场：实测 7 周打出 6-8（14 场），
    // 同联赛别的队才 7-9 场。玩家从积分榜截图里抓出来的。
    // 按本周轮次表打（真循环赛）；没有表的老档退回旧配对
    const byName=n=>S.world[lg].find(t=>t.name===n);
    const round=(S.fixtures&&S.fixtures[lg]&&S.fixtures[lg][S.week-1])||null;
    let pairs;
    if(round){
      pairs=round.filter(x=>!(lg===(S.homeLeague||"LPL")&&(x[0]===S.team||x[1]===S.team)))
                 .map(x=>[byName(x[0]),byName(x[1])]).filter(x=>x[0]&&x[1]);
    }else{
      const ts=S.world[lg].filter(t=>!(lg===(S.homeLeague||"LPL")&&(t.name===S.team||(S.match&&t.name===S.match.oppName))));
      pairs=[]; for(let i=0;i<ts.length-1;i+=2) pairs.push([ts[i],ts[i+1]]);
    }
    for(const [a,b] of pairs){
      const p=1/(1+Math.exp(-(power(a,0,sea.fav)-power(b,0,sea.fav))/SPREAD));
      const aw=rnd()<p;
      S.standings[lg][a.name][aw?"w":"l"]++;
      S.standings[lg][b.name][aw?"l":"w"]++;
      // 赛前明显不被看好的一方赢了 —— 记下来给际遇当素材，
      // 这样「强队今天输了」说的是真发生过的一场，而不是随手编个队名。
      if(lg===(S.homeLeague||"LPL")&&!S._upset&&(aw?p<0.33:p>0.67)){
        S._upset = aw ? {winner:a.name,loser:b.name} : {winner:b.name,loser:a.name};
      }
      const f1=noteForm(a.name,aw), f2=noteForm(b.name,!aw);   // 所有联赛都记近况（AI 士气用）
      if(lg===(S.homeLeague||"LPL")){   // 播的是你所在联赛的战况（玩家实锤：在 LCK 打球却一直弹 LPL 的冷门）
        const rk=lplRank(), notable=new Set(
          rk.slice(0,4).map(r=>r.n).concat(rk.slice(-3).map(r=>r.n)).concat([S.team]));
        [[a.name,f1],[b.name,f2]].forEach(([tn,f])=>{
          if(!f||!notable.has(tn)) return;   // 只播榜首四强 / 垫底三名 / 你自己
          const key=SEASONS[S.si].tag+tn+f;
          if(S.formSeen[key]) return;          // 每队每赛季同类只播一次，避免刷屏
          S.formSeen[key]=1;
          pushEvent(f==="win4"?`<b>${tn}</b> 已经五连胜，状态正热。`
                              :`<b>${tn}</b> 遭遇五连败，更衣室传出不和传闻。`,
                    f==="win4"?"good":"bad","战况");
        });
        if((aw&&p<0.25)||(!aw&&p>0.75))
          pushEvent(`冷门：<b>${aw?a.name:b.name}</b> 爆冷击败 <b>${aw?b.name:a.name}</b>，赛前几乎无人看好。`,"big","冷门");
      }
    }
  });
}

  // 开打编排（界面重做第二期 ②）：比分刚变的那次渲染，两侧向中线撞一下、结果字砸出来；系列赛打完的字留住
  const scKey=m.sc.join(":"); let hit="";

    <div class="vs ${hit}">
      <div class="side"><div class="nm">${teamLogo(S.team,34)}<br>${S.team}</div><div class="pw mono">战力 ${pwShow(my0).toFixed(1)}<small style="color:var(--ink-3)"> 版本 ${vf>=0?"+":""}${pwShow(vf).toFixed(1)}</small></div></div>
      <div class="mid"><div class="score">${m.sc[0]} : ${m.sc[1]}</div>${stamp}</div>
      <div class="side"><div class="nm">${teamLogo(m.oppName,34)}<br>${m.oppName}</div><div class="pw mono">战力 ${pwShow(op).toFixed(1)}</div></div>
    </div>
    ${typeof starLaneBadge==="function"?starLaneBadge(m.oppName):""}
    ${typeof verLine==="function"?verLine(m.oppName):""}
    ${m.node?`<div class="node"><div class="q">${m.node.q}</div><div class="ctx">${m.node.ctx}</div>
      <div class="grid g2">${m.node.a.map((a,i)=>`<button class="opt" data-node="${i}">
        <div class="t">${a.t}</div><div class="d">吃 <b>${a.dim}</b> · ${a.risk>0.8?'高风险高回报':'稳健'}</div>
      </button>`).join("")}</div></div>`:""}
    ${m.lines.length?`<div class="log">${m.lines.slice().reverse().join("")}</div>`:""}
    ${m.done?`<div class="row"><button class="btn" id="${m.attr?'pmgo':'next'}">${
      m.attr?'赛后拆解 →':'继续 →'}</button></div>`:""}

}

/* 替补：不是等几周，而是要自己抢下首发位 */
function isBenched(){
  if(S.promoted) return false;
  const inc=S.understudy; if(!inc) { S.promoted=true; return false; }
  // 训练赛攒够资本、或首发受伤你顶上：这周名单上是你（rotation.js）
  if(typeof scrimTrialCheck==="function"&&scrimTrialCheck()) return false;
  const me=avg(DIMS.map(d=>S.attrs[d])), him=avg(DIMS.map(d=>inc.r[d]));
  // 被换下来的人不能靠数值自动回首发——得走训练赛试用（rotation.js 的 benchLock）
  if(me>=him-2&&!S.benchLock){
    S.promoted=true;
    const t=myTeam();
    t.players=t.players.map(q=>(q===inc||q.id===inc.id)
      ? {id:S.name||"你",cn:"",pos:S.pos,age:S.age,r:S.attrs,me:true} : q);
    if(S.scrim){ S.scrim.trial=null; S.scrim.pendingTrial=false; }
    pushEvent((S.homeLeague||"LPL")==="LDL"
      ? `训练赛数据压过 <b>${inc.id}</b>，教练把你<b>写进了 ${S.team} 的 LDL 名单</b>。
         <b>你终于能打正式比赛了。</b>`
      : `训练赛数据压过 <b>${inc.id}</b>，教练组决定让你首发。<b>你终于上场了。</b>`,"big","转正");
    checkAch("promote");
    return false;
  }
  return true;
}

/* 替补席：队伍照打，你不上场也不计个人战绩 */
function benchWeek(){
  S.benchedThisSplit=true;
  const on=S.schedule[S.week-1], sea=SEASONS[S.si];
  const opp=S.world[S.homeLeague||"LPL"].find(t=>t.name===on);
  // 赛程名对不上世界名单（罕见边界，批测撞到过一次）：跳过这周的模拟，
  // 别让整局崩掉——比崩溃更重要的是把周推进走完
  if(!opp){ S.match=null; nextWeek(); return; }
  const p=1/(1+Math.exp(-(power(myRoster(),0,sea.fav)-power(opp,0,sea.fav))/SPREAD));
  const w1=rnd()<p, w2=rnd()<p, won=(w1&&w2)||((w1||w2)&&rnd()<p);
  S.standings[S.homeLeague||"LPL"][S.team][won?"w":"l"]++;
  S.standings[S.homeLeague||"LPL"][on][won?"l":"w"]++;
  if(typeof fixNote==="function") fixNote(S.week,on,won?[2,(w1&&w2)?0:1]:[(w1||w2)?1:0,2],won,false);
  addFans(-1.5);      // 不上场，热度在掉
  const acad=(S.homeLeague||"LPL")==="LDL";
  pushEvent(acad
    ? `${S.team} ${won?"击败":"负于"} ${on}。<b>你不在这周的名单里</b>——
       青训生要先在训练赛里打出来，教练才会把你写进去。`
    : `${S.team} ${won?"击败":"负于"} ${on}。<b>你在替补席上看完了整场</b>，没人提你的名字。`,
    won?"info":"bad", acad?"青训":"替补");
  // 替补周世界也要转。原来 simWorld 只在你亲自打完比赛时跑，
  // 坐板凳的赛段里其他队整周停摆——实测有队 7 周只攒了 0-4 场。
  // 临时把本周对手挂在 S.match 上，防止它在模拟里被再打一场（双算）。
  S.match={oppName:on};
  simWorld();
  S.match=null; nextWeek();
}

/* ================= 周 / 赛季推进 ================= */
function nextWeek(){
  if(S.intl){ intlAdvance(); return; }
  if(S.playoff){ playoffAdvance(); return; }
  if(S.week>=WEEKS){
    // 现实里常规赛打完不会第二天就打季后赛，中间有几天到一周的间隔。
    // 这一周也是有用的：调整状态、针对性备战、把体能补回来。
    enterBreak("playoff", 1, "常规赛结束 · 季后赛前");
    return;
  }
  S.week++; S.ap=apFor('season'); S.step="season"; S.match=null; addFat(-10);
  // 赛段注册期（前 REG_WEEKS 周）：第 3 周 AI 队做一次升降；第 2 周起可能有队来挖（概率远低于窗口，且要付 1.2 倍违约金）
  if(typeof REG_WEEKS!=="undefined"&&S.week<=REG_WEEKS&&S.career){
    if(S.week===3&&typeof aiMarketWindow==="function") aiMarketWindow(false);
    if(S.week>=2&&typeof regRollOffer==="function") regRollOffer();
  }
  if(S.assets&&S.assets.apt) addFat(-4);           // 电竞公寓：住得好，恢复就是快
  if(typeof weeklyEcho==="function") weeklyEcho(); // 事件链/周报/商业机会的周节拍
  if(typeof injuryTick==="function") injuryTick();
  if(typeof rollInjury==="function") rollInjury("赛季中");
  if(typeof mateInjuryTick==="function") mateInjuryTick();
  if(typeof mateInjuryRoll==="function") mateInjuryRoll();
  if(typeof archiveWeek==="function") archiveWeek();
  if(typeof btkWeekEnd==="function") btkWeekEnd();
  if(typeof tickBuffs==='function') tickBuffs();
  if(typeof fanWeek==='function') fanWeek();
  if(typeof questWeek==='function') questWeek();
  if(typeof tryRandomEvent==='function'&&rnd()<0.14) tryRandomEvent();
  if(typeof saveGame==='function') saveGame('S'+S.si+' 第'+S.week+'周');
  render();
}
function lplRank(){
  return Object.entries(S.standings[S.homeLeague||"LPL"])
    .map(([n,r])=>({n,...r,p:(r.w+r.l)?r.w/(r.w+r.l):0}))
    .sort((a,b)=>b.p-a.p||b.w-a.w);
}
/* 正经种子对阵：越往后对手越强，决赛必碰常规赛第一 */
function startPlayoff(){
  const rk=lplRank(), seed=rk.findIndex(r=>r.n===S.team)+1;
  S.career.best=Math.min(S.career.best,seed);
  S.playoffSeed=seed;
  if(seed>6){
    /* 没进季后赛，但季后赛不会因此消失。
       原来这里直接 endSeason()：常规赛最后一场刚打完，下一秒就弹出
       世界赛冠军、跳进休赛期——世界像是替你按了快进。
       现在别人打季后赛的这两周照样流逝，你训练、直播、休息都行，
       半决赛和决赛的结果按周揭晓。 */
    S.playoff=null;
    const fin=majorStandings(S.homeLeague||"LPL");   // 有缓存：这里播的冠军就是之后的国际赛种子
    S.pendingEnd={result:null,seed};
    enterBreak("poEnd",2,SPLITS[S.split||0]+"季后赛 · 场边",
      `常规赛第 ${seed} 名，无缘季后赛。<b>别人在打季后赛的这几周，你的时间是自己的</b>——练、直播、休息，都行。`);
    if(fin&&fin.length>=4){
      queueBreakNews(2,`季后赛半决赛打完：<b>${fin[0]}</b> 和 <b>${fin[1]}</b> 会师决赛，${fin[2]}、${fin[3]} 止步四强。`,"info","季后赛");
      queueBreakNews(3,`<b>${fin[0]}</b> 击败 ${fin[1]}，夺得 ${SEASONS[S.si].tag} ${S.homeLeague||"LPL"}${SPLITS[S.split||0]}冠军。${
        (S.homeLeague||"LPL")==="LDL"?"":S.split===0?"他们将代表赛区出战 MSI。":"他们拿到了世界赛的头号种子。"}`,"big","季后赛");
    }
    return;
  }
  S.playoffSeed=seed;
  checkAch("playoff");
  /* 替补不打季后赛（玩家实锤：常规赛全程没抢下首发，季后赛却被莫名安排上场，
     还和同位置首发同框）。教练的名单是连续的：你没压过他，季后赛还是他打。
     球队用真首发阵容模拟，你在替补席按周看结果；夺冠算球队的，不进你的生涯表。 */
  if(typeof isBenched==="function"&&isBenched()){
    const tmp={round:1,seed,alive:true,beaten:[S.team]};
    S.playoff=tmp;
    const myPw=power(myRoster(),0,SEASONS[S.si].fav);   // 你不在名单里，这就是首发阵容
    let result="champion";
    const runNews=[], agenda=[];
    for(let r=1;r<=3;r++){
      const on=playoffOpp(r);
      agenda.push({w:Math.min(r,2),t:`${poRoundName(r)} · vs ${on}`});
      const op=teamPowerOf(on);
      const p=clampWinProb(1/(1+Math.exp(-(myPw-op)/SPREAD)), myPw-op);
      let w=0,l=0; while(w<3&&l<3){ rnd()<p?w++:l++; }
      if(w<3){ result=r; runNews.push(`${poRoundName(r)}：${S.team} ${w}:${l} 不敌 <b>${on}</b>，止步于此。你在替补席看完了整场。`); break; }
      tmp.beaten.push(on);
      runNews.push(`${poRoundName(r)}：${S.team} ${w}:${l} 击败 ${on}。<b>你没有出场。</b>`);
    }
    S.playoff=null;
    S.benchedPO=true;                        // endSeason 据此不给你记冠军
    S.pendingEnd={result,seed};
    enterBreak("poEnd",2,SPLITS[S.split||0]+"季后赛 · 替补席",
      `季后赛名单公布，<b>首发还是 ${S.understudy?S.understudy.id:"他"}</b>——教练看的是训练赛数据，你还没压过他。
       这几周你坐在替补席上，时间是自己的：练，把差距补上。`);
    runNews.forEach((t,i)=>queueBreakNews(Math.min(1+i,2),t,/不敌/.test(t)?"bad":"info","季后赛"));
    if(typeof setBreakAgenda==="function") setBreakAgenda(agenda,
      `首发还是 <b>${S.understudy?S.understudy.id:"他"}</b>，你在替补席。球队按真首发阵容打，赛果按周揭晓。`);
    return;
  }
  S.playoff={round:1,seed,alive:true,beaten:[S.team]};
  poBrInit();                              // 六队真对阵树；1/2 号种子轮空，从半决赛打起
  S.playoff.round=S.playoff.br.stage;
  S.step="match";
  startMatch(true, poMyOpp()||playoffOpp(S.playoff.round));
}
/* ---------- 季后赛对阵树（2026-09-06 玩家点名：要像瑞士轮/杯赛那样看得到线路——对手是击败了谁来的、赢了下一个打谁）----------
   六队三轮：首轮 3v6 / 4v5，一二号种子轮空；半决赛 1 号打 4v5 的胜者、2 号打 3v6 的胜者；决赛。
   你不在的对局不摇骰子，按 majorStandings 的正典顺序判（冠军 > 亚军 > 四强 > 其余按排名）——
   这样树上的结果和赛后宣布的冠军、国际赛的种子是同一件事。老档没有 br 就走原来的阶梯逻辑。 */
function poCanon(){
  const HL=S.homeLeague||"LPL";
  const rk=lplRank().map(r=>r.n);
  let top=[]; try{ top=(typeof majorStandings==="function")?majorStandings(HL):[]; }catch(e){ top=[]; }
  return top.concat(rk.filter(n=>!top.includes(n)));
}
function poAiWin(a,b){
  if(!a) return b||null; if(!b) return a;
  const o=poCanon(), ia=o.indexOf(a), ib=o.indexOf(b);
  return ((ia<0?99:ia)<=(ib<0?99:ib))?a:b;
}
function poBrInit(){
  const six=lplRank().slice(0,6).map(r=>r.n);
  S.playoff.br={seeds:six, hist:[], stage:1, pairs:[[six[2]||null,six[5]||null],[six[3]||null,six[4]||null]], champ:null};
  poBrSettle();
}
function poBrAdvance(winners){
  const B=S.playoff.br, six=B.seeds;
  if(B.stage===1){ B.pairs=[[six[0]||null,winners[1]||null],[six[1]||null,winners[0]||null]]; B.stage=2; }
  else if(B.stage===2){ B.pairs=[[winners[0]||null,winners[1]||null]]; B.stage=3; }
  else { B.champ=winners[0]||null; B.pairs=[]; B.stage=4; }
}
/* 当前阶段没有我的对局：整阶段判掉、推进，直到轮到我或出冠军 */
function poBrSettle(){
  const B=S.playoff&&S.playoff.br; if(!B) return;
  for(let g=0;g<4;g++){
    if(B.champ||!B.pairs.length) return;
    if(B.pairs.some(p=>p[0]===S.team||p[1]===S.team)) return;
    const winners=B.pairs.map(p=>poAiWin(p[0],p[1]));
    B.hist.push({label:poRoundName(B.stage),pairs:B.pairs.map(p=>p.slice()),winners});
    poBrAdvance(winners);
  }
}
function poMyOpp(){
  const B=S.playoff&&S.playoff.br; if(!B) return null;
  const p=B.pairs.find(p=>p[0]===S.team||p[1]===S.team);
  return p?(p[0]===S.team?p[1]:p[0]):null;
}
/* 我打完：结果写回树，同阶段另一场判掉，推进一阶段 */
function poBrResolveMine(won,opp){
  const B=S.playoff&&S.playoff.br; if(!B) return;
  const winners=B.pairs.map(p=>(p[0]===S.team||p[1]===S.team)?(won?S.team:opp):poAiWin(p[0],p[1]));
  B.hist.push({label:poRoundName(B.stage),pairs:B.pairs.map(p=>p.slice()),winners});
  poBrAdvance(winners);
}
/* 第1轮打 5/6 号种子，第2轮打 2/3 号，决赛打 1 号 */
function playoffOpp(round){
  const rk=lplRank().filter(r=>!S.playoff.beaten.includes(r.n));
  const want = round===1 ? 4 : round===2 ? 1 : 0;   // 索引：5-6号 / 2-3号 / 榜首
  return (rk[Math.min(want, rk.length-1)]||rk[0]).n;
}
/* 季后赛这一轮叫什么。六队、三轮：首轮 → 半决赛 → 决赛。
   玩家原话：「打一线比赛 lpl 也是常规赛，季后赛季后赛半决赛这些要写清楚」。 */
function poRoundName(r){ return ["季后赛首轮","半决赛","决赛"][(r||1)-1] || `第 ${r} 轮`; }
function playoffAdvance(){
  const won=S.match.sc[0]>S.match.sc[1], opp=S.match.oppName;
  if(S.playoff.br) poBrResolveMine(won,opp);
  if(!won){ noteGrudge(opp,S.playoff.round>=3?4:2,
      `${poRoundName(S.playoff.round)}被淘汰`);
    S.playoff.alive=false; endSeason(S.playoff.round,S.playoff.seed); return; }
  S.playoff.beaten.push(opp);
  if(S.playoff.br){
    poBrSettle();
    S.playoff.round=S.playoff.br.stage;
    if(S.playoff.br.champ===S.team||S.playoff.round>3){ endSeason("champion",S.playoff.seed); return; }
  } else {
    S.playoff.round++;
    if(S.playoff.round>3){ endSeason("champion",S.playoff.seed); return; }
  }
  const nm=(S.playoff.br&&poMyOpp())||playoffOpp(S.playoff.round);
  enterPrep("playoff", nm, true,
    `${poRoundName(S.playoff.round)} · 赛前备战`);
}

/* ---------- 淘汰赛之间的备战 ----------
   原来季后赛打完一轮直接 startMatch() 开下一轮，国际赛也一样：
   一路连打三场甚至更多，中间一个行动点都没有、训练框都不出现。
   最高强度的比赛反而最没得操作，这不对。
   现在每轮之间插一个备战环节：2 个行动点，休息、复盘、找手感都行。 */
function enterPrep(mode, opp, bo, label){
  S.prep={mode, opp, bo, label};
  addFat(-12);   // 两场之间本来就有调整日（玩家实锤：备战期除了休息什么都做不了）
  // 异化点数后 4 点（≈原 2 点的强度：主流行动都是 2 点一件）。
  // 休息的备战折减（prepMul 0.45）不变——回血站照旧开不起来。
  S.ap=4;
  if(S.btk) S.btk.apWeek=4;
  S.step="prep";
  render();
}
function prepGo(){
  const P=S.prep; if(!P) return;
  S.prep=null;
  if(P.mode==="intl"){ S.step="match"; startMatch(P.bo, P.opp); return; }
  S.step="match"; startMatch(true, P.opp);
}
/* 备战也要有标签栏。
   玩家原话：「现在栏目不见了，根本看不见队友的数据，这个是个巨大的问题」。
   赛前备战恰恰是最该翻队友状态、翻对手、翻默契的时候，
   而这一屏原来什么导航都没有——只能上场或者干等。 */

}

      <button class="act" data-do="solo" ${S.ap<apCost("solo")?'disabled style="opacity:.34"':''}>

function endSeason(result,seed){
  payday();
  S.capExp=Math.min(CAP_EXP_MAX,q1((S.capExp||0)+CAP_EXP_STEP));   // 经验顶瓶颈（B4）
  // 世界线张力弛豫：你不在的联赛，每个赛段往史实弹回 ×0.6
  if(typeof wlRelax==="function") wlRelax();
  const up=(S.bg&&S.bg.upkeep)||0;
  if(up){ const paid=Math.min(up,Math.max(0,S.money));
    if(typeof addMoney==='function') addMoney('home',-paid); else S.money-=paid;
    pushEvent(`往家里寄了 <b>${paid} 万</b>。`,"info","家用"); }
  trustDecay(); squadDecay(); checkBreakthrough();
  // 关系崩到底的队友会走——这是更衣室里那些选择真正的出口
  if(typeof checkMateExit==="function") checkMateExit();
  // 话题人物的代价：教练每赛段都少信你一点
  if(typeof traitMul==="function"){
    const cp=traitMul("coachPer",true);
    if(cp&&typeof addStaff==="function") addStaff("coach",cp);
  }
  if(typeof streamClauseCheck==='function') streamClauseCheck();   // 独家合同的开播条款
  // 赛段打完先攒一次俱乐部关注——转会不该只在休赛期那一瞬间才有动静
  if(typeof noteScoutInterest==='function') noteScoutInterest();
  // 天梯不守就掉：段位分向「当前实力守得住的位置」回落。
  // 爬分是带下行阻尼的随机游走，运气好的连胜能把峰值冲到实力线上方
  // 十几分——那是峰值快照，不是水平。挂着王者却只有钻石的实力，
  // 一个赛段不守，分就该掉。
  if(S.pre&&typeof S.pre.rank==="number"&&typeof soloSkill==="function"){
    const hold=clamp(skillToRank(soloSkill())+6,0,100);   // 统一标尺曲线 + 6 分宽限
    if(S.pre.rank>hold){
      const before=S.pre.rank;
      S.pre.rank=q1(Math.max(hold,S.pre.rank-(S.pre.rank-hold)*0.35));
      if(rankName(before)!==rankName(S.pre.rank))
        pushEvent(`一个赛段没怎么守天梯，段位掉到 <b>${rankFull(S.pre.rank)}</b>。分数是要用实力守的。`,"info","排位");
    }
  }
  if(typeof cloutTick==='function') cloutTick();
  if(typeof rollForm==='function') rollForm();
  if(typeof rollWorldForm==='function'){ rollWorldForm(); formNews(); }
  if(typeof btkSplitEnd==='function') btkSplitEnd();
  const dc=contractCheck();
  if(dc==="cut"){
    S.gotCut=true;              // 队伍放你走 → 休赛期走自由市场
    pushEvent(`<b>${S.team}</b> 决定<b>不再与你续约</b>。${S.cutReason||""}<br>
      <span style="color:var(--ink-3)">你成了自由身——休赛期的转会市场上，去哪由你自己找。</span>`,"bad","合同");
  }
  // dc==="renew" 时 S.pendingRenew 已挂起，续约报价卡会在休赛期弹出，由你拍板
  S.lastSeason={result,seed,rec:Object.assign({},S.record),
    grow:DIMS.map(d=>({d,g:S.attrs[d]-S.seasonAttr0[d]}))};
  // 生涯轨迹（结局名片的「五年一行」用）：每个赛段记一条——哪支队、第几名、季后赛走到哪
  S.career.log=(S.career.log||[]).concat([{si:S.si,split:S.split||0,team:S.team,lg:S.homeLeague||"LPL",
    seed,result,w:S.record.w,l:S.record.l}]);
  // 赛事奖金：走到哪一档发哪一档，每次都发（见 shop.js 的 PRIZE_*）
  if(typeof addMoney==="function"&&typeof PRIZE_PO!=="undefined"){
    const tbl=(S.homeLeague||"LPL")==="LDL"?PRIZE_PO_LDL:PRIZE_PO;
    const amt=result==="champion"?tbl.champion:result===3?tbl.runner:result===2?tbl.semi:0;
    if(amt){ addMoney("prize",amt);
      pushEvent(`${SPLITS[S.split||0]}季后赛奖金到账 <b>${amt} 万</b>。`,"good","奖金"); }
  }
  if(result==="champion"&&S.benchedPO){
    /* 球队夺冠、你全程替补：荣誉是球队的（现实里替补也有戒指，
       但这游戏的生涯表只记你亲手打下的——五人哲学的另一面）。 */
    const sp=SPLITS[S.split||0];
    if(typeof addRingTitle==="function") addRingTitle(`${SEASONS[S.si].tag} ${S.homeLeague||"LPL"}${sp}`);
    pushEvent(`<b>${S.team} 夺得 ${SEASONS[S.si].tag} ${sp}冠军。</b>
      你在替补席见证了整个过程——<span style="color:var(--ink-3)">戒指有你一枚，生涯表记为<b>随队冠军</b>；
      想让奖杯写上你的名字、算进成就和转会筹码，先把首发抢下来。</span>`,"big","联赛冠军");
  }
  else if(result==="champion"){
    const sp=SPLITS[S.split||0];
    S.career.titles.push(`${SEASONS[S.si].tag} ${S.homeLeague||"LPL"}${sp}`);
    S.career.leagueTitles=(S.career.leagueTitles||0)+1;
    S.career.lgYears=(S.career.lgYears||[]).concat([S.si]);
    S.career.lgStreak=(S.career.lgStreak||0)+1;
    checkAch("lgtitle"); checkAch("crown");
    // 夺冠之后：庆功宴、采访、商务饭局——这也是选手人生的一部分
    if(typeof fireEvent==="function") fireEvent("afterchamp", 0.7);
    breakthrough("心态",2.0,"捧过一次奖杯之后，大场面对你来说不一样了。","lgtitle","mile");
    pushEvent(`<b>${S.team} 夺得 ${SEASONS[S.si].tag} ${sp}冠军。</b>${
      S.split===0?"下一站 MSI。":"世界赛资格到手。"}`,"big","联赛冠军");
  }
  if(result!=="champion") S.career.lgStreak=0;
  checkAch("splitend");
  checkAch("money");
  S.playoff=null;
  // 二级联赛的冠军不去国际赛——LDL 打得再好也只是升上一队的资格
  const majorLg = (S.homeLeague||"LPL")!=="LDL";
  // 玩家原话：「打完季后赛直接进世界赛……中间毫无休息」。
  // 现在出征前先过一段集结周：休整、抽签，然后才开打。
  if(S.split===0){
    // 春季赛结束 -> 冠军去 MSI -> 然后开夏季赛。
    // 没去 MSI 的人也不会看到世界快进：MSI 照打，结果在间歇期里分周揭晓。
    if(majorLg&&result==="champion"){
      S.pendingIntl={type:"msi",result};
      enterBreak("intl",1,"出征 MSI 前 · 集结",
        `联赛冠军到手，<b>MSI 的机票已经订好</b>。出发前还有一周——把状态调到最好。`);
      return;
    }
    spectateIntl("msi");
    return;
  }
  // 夏季赛结束 -> 世界赛 -> 休赛期。
  // 没资格去的人，世界赛那三周照样过：你在训练室里，冠军在最后一周才揭晓。
  if(majorLg&&typeof worldsSlot==="function"&&worldsSlot(result)!==null){
    S.pendingIntl={type:"worlds",result};
    enterBreak("intl",2,"世界赛前 · 集结与适应",
      `<b>世界赛的名额到手了。</b>接下来两周：集结、飞抵主办地、适应场馆——抽签结果出来之前，把自己调整好。`);
    return;
  }
  spectateIntl("worlds");
}

/* 休赛期不该是一个按钮。
   AP_OFF 和 apFor("off") 早就写好了，但从来没被用上——结算页点一下
   就直接跳进下赛季。可休赛期只是没有比赛，训练、排位、直播反而是
   这段时间的重点：这是唯一一段你能安心补短板、攒人气的日子。 */
const OFF_WEEKS=3, MID_WEEKS=2;
/* 春夏之间也是一段没有比赛的日子。
   原来没进 MSI 就直接开夏季赛，中间一点时间都没有——
   可那正是现实里休整、补短板的窗口。用同一套面板，只是去向不同。 */
function enterBreak(next, weeks, label, note){
  /* 注册窗只在 MSI / 世界赛结束之后才开（玩家 2026-09-06 定的：那两段不是转会时间，
     合同的实际到期点就是 MSI 结束 / 世界赛结束）。标签里带「MSI」的季中间歇＝MSI 还在打：
     拉到 3 周，第 3 周冠军揭晓、注册窗同时打开（wndFrom）。世界赛期间走 "wrap"，本来就在年底窗之前。 */
  const during=(next==="summer"&&/MSI/.test(label||""));
  if(during) weeks=Math.max(weeks,3);
  S.off={week:1, weeks, next, label, wndFrom:during?3:1};
  // 出征周是赶路、抽签、适应场馆——能自主安排的时间少，
  // 而且长途飞行和时差本身就不养人：这里不自动洗疲劳（别的间歇会），
  // 休息也按 0.45 折算（见 doAction 的 prepMul）。当年只给 1 点是因为
  // 休息还没折减、给满 3 点等于满血进世界赛（实测冠军率 9% -> 25%）；
  // 折减落地后 2 点最多清 ~27 疲劳，换来的是「练还是养」的真选择。
  S.ap=(next==="intl")?4:apFor("off");
  if(next==="intl"&&S.btk) S.btk.apWeek=4;
  S.step="offseason";
  if(next!=="intl") S.fatigue=Math.max(0,S.fatigue-20);
  pushEvent(note||`${label}（${weeks} 周）。没有比赛，正好把该补的补上。`,"info","间歇");
  // 季中注册窗（2026-08-31 玩家拍板的双窗制）：春季赛打完，转会市场开门。
  // 赛段里攒的意向在这里兑现——LDL 打半年打得好，夏季赛就能上一线。
  if(next==="summer"&&S.career&&!during){
    S.askedTransfer=false;
    if(typeof rollProOffers==="function") rollProOffers("mid");
  }
  render();
}
/* ---------- 间歇期的分周新闻 ----------
   没进季后赛/世界赛时，别人的比赛照打。结果不能一口气全倒出来——
   半决赛、决赛、冠军按周揭晓，世界才有「还在转」的感觉。 */
function queueBreakNews(week,text,tone,tag){
  if(!S.off||week<=S.off.week){ pushEvent(text,tone,tag); return; }
  S.off.news=S.off.news||{};
  (S.off.news[week]=S.off.news[week]||[]).push({text,tone,tag});
}
function flushBreakNews(week){
  if(!S.off||!S.off.news) return;
  Object.keys(S.off.news).map(Number).sort((a,b)=>a-b).forEach(w=>{
    if(w>week) return;
    S.off.news[w].forEach(e=>pushEvent(e.text,e.tone,e.tag));
    delete S.off.news[w];
  });
}
function doOffseason(){
  if(S.off) return;          // 已经在休赛期里了，别把周数重置回第 1 周
  if(S.si>=SEASONS.length-1){ S.step="end"; render(); return; }
  S.off={week:1, weeks:OFF_WEEKS, next:"year", label:"休赛期"};
  S.ap=apFor("off");
  S.askedTransfer=false;             // 每个休赛期能主动挂牌一次
  // 升队、转会、下放都跟着注册窗口走：休赛期是主窗口（季中间歇是另一个，见 offNextWeek）
  if(typeof checkPromote==="function" && checkPromote()) { /* 升上一队了 */ }
  else if(typeof rollProOffers==="function") rollProOffers();
  // 一队替补整年拿不到比赛：俱乐部会提议下放青训队打 LDL（可拒绝）
  if(!S.proOffer&&!S.confirm&&typeof offerSendDown==="function") offerSendDown();
  S.fatigue=Math.max(0,S.fatigue-25);      // 赛季打完，先喘口气
  pushEvent(`赛季结束，进入休赛期（${OFF_WEEKS} 周）。没有比赛，
    但这是一年里唯一能安心补短板的时间。`,"info","休赛期");
  render();
}
/* 休赛期推进；走完就进下一个赛季 */
function offNextWeek(){
  if(!S.off) return;
  if(typeof archiveWeek==="function") archiveWeek();
  if(S.off.week>=S.off.weeks){
    flushBreakNews(1e9);                                  // 攒着的决赛与冠军，离开前全部揭晓
    // 间歇的最后一周也要结算突破进度——原来只有「进入下一周」才结算，
    // 最后一周练的操作直接被转场吞掉，三周连击永远卡在 2/3
    if(typeof btkWeekEnd==="function"&&S.off.next!=="intl") btkWeekEnd();
    const nx=S.off.next; S.off=null;
    if(nx==="poEnd"){                                     // 别人的季后赛落幕 -> 赛段结算
      const pe=S.pendingEnd; S.pendingEnd=null;
      endSeason(pe?pe.result:null, pe?pe.seed:7); return;
    }
    if(nx==="intl"){                                      // 集结结束 -> 出征
      const pi=S.pendingIntl; S.pendingIntl=null;
      if(pi){
        S.afterIntlGo = pi.type==="msi" ? "summer" : "offseason";
        if(startIntl(pi.type,pi.result)) return;
        // 名额判定的边缘情况（理论上到不了这里）：退回围观
        S.afterIntlGo=null; spectateIntl(pi.type); return;
      }
      S.step="offseason"; render(); return;
    }
    if(nx==="wrap"){                                      // 世界赛落幕 -> 赛季结算页
      S.step="offseason";
      if(typeof saveGame==='function') saveGame('赛季结算');
      render(); return;
    }
    if(nx==="summer"){
      // 季中间歇也是注册窗口：LDL 打得好，夏季赛能直接调上一队——
      // 现实里升降就是跟着转会/注册窗走的，不用等到年底
      if(typeof aiMarketWindow==="function") aiMarketWindow(false);   // 全联盟的提拔/下放先走一遍（AI 队）
      // 季中到期的合同也要有个了断（玩家实锤：拒了续约、没人签，夏季赛照样穿着旧队衣上场）
      if(S.pendingRenew) settleRenewDefault();
      if(S.gotCut){ dropToStreets(true); return; }
      if(typeof checkPromote==="function") checkPromote();
      if(S.promoteDeal){
        // 调令没批完不开赛：赛程是按你所在的队排的，先表态再进夏季赛
        S.off={week:1,weeks:1,next:"summer",label:"季中注册窗 · 调令待决"};
        S.ap=0; render(); return;
      }
      startSeason(false,1); return;
    }
    if(nx==="playoff"){ startPlayoff(); return; }         // 休整结束 -> 季后赛
    finishOffseason(); return;
  }
  S.off.week++;
  // MSI 落幕的那一周：季中注册窗开门（续约卡、问询、挂牌都从这一周起）
  if(S.off.wndFrom&&S.off.week>=S.off.wndFrom&&!S.off.wndOpened){
    S.off.wndOpened=true;
    if(S.off.next==="summer"){
      S.off.label="季中注册窗"; S.askedTransfer=false;
      if(S.career&&typeof rollProOffers==="function") rollProOffers("mid");
      pushEvent(`MSI 落幕，<b>季中注册窗</b>开了：续约、挂牌、问询都在这一周。`,"info","转会");
    }
  }
  S.ap=(S.off.next==="intl")?2:apFor("off");
  if(S.off.next==="intl"&&S.btk) S.btk.apWeek=4;
  if(S.assets&&S.assets.apt) addFat(-4);
  if(typeof weeklyEcho==="function") weeklyEcho();
  if(S.off.next!=="intl") addFat(-14);
  // 休赛期/间歇周也要结算突破进度——原来只有赛季周结算，
  // 玩家在休赛期连练三周操作，计数器纹丝不动。
  // 出征周只有 1 点，练不满是制度问题不是玩家问题：不计数也不清零。
  if(typeof btkWeekEnd==="function"){
    if(S.off.next==="intl"){ if(S.btk) S.btk.opThisWeek=0; }
    else btkWeekEnd();
  }
  flushBreakNews(S.off.week);
  if(typeof mateInjuryTick==="function") mateInjuryTick();
  if(typeof mateInjuryRoll==="function") mateInjuryRoll();
  if(typeof tickBuffs==='function') tickBuffs();
  if(typeof fanWeek==='function') fanWeek();
  if(typeof questWeek==='function') questWeek();
  if(typeof tryRandomEvent==='function'&&rnd()<0.16) tryRandomEvent();
  if(typeof saveGame==='function') saveGame('休赛期第'+S.off.week+'周');
  render();
}
function finishOffseason(){
  S.si++; S.age++;
  S.yearBase=0;              // 新的一年，全年计数从头开始
  S.miniPatch=null; S.patchClock=0;   // 新版本年，热修编号从 .1 重数
  const news=ageWorld();
  if(typeof aiMarketWindow==="function") aiMarketWindow(true);   // 休赛期转会窗口：提拔/下放 + 跨队转会
  capWorldDrift();   // 世界水位年漂移上限：段位表五年不走样
  capLDL();   // 二队每年重钉天花板：不能越长越比爹强
  try{ S.lgAvg=leagueBaseline(S.world); }catch(e){}   // 年度均值（版本红利算法用；S.baseline 是签约水位，不动）
  // 玩家自己的年龄曲线
  const base=ageCurve(S.age);
  DIMS.forEach(d=>{
    const delta=base*(base>0?0:DECAY_W[d]);
    if(delta<0) S.attrs[d]=clamp(S.attrs[d]+delta,20,capOf(d));
  });
  news.unshift(`<div class="hi">— ${SEASONS[S.si].tag} ${SEASONS[S.si].y}：版本「${SEASONS[S.si].ver}」· ${SEASONS[S.si].story} —</div>`);
  pushEvent(`<b>${SEASONS[S.si].tag} 版本「${SEASONS[S.si].ver}」</b>：强势位置 <b>${SEASONS[S.si].fav.map(k=>POSN[k]).join("、")}</b>，关键属性 <b>${SEASONS[S.si].dim}</b>——这一维高于联赛均线的人全年吃红利，低的人吃亏；本周卡的「版本」块里有你和本队的账。`,"info","版本");
  S.news=S.news.concat(news);
  S.fatigue=0; S.buff={};
  if(S.pendingRenew) settleRenewDefault();
  // 自由市场走到最后还没签成（队伍放你走 / 你拒了续约，且整个休赛期没接任何报价）：
  // 没合同就是没队——回到路人。原来按表现自动塞去弱队/二队，玩家实锤「没人要却自动有队」不合理。
  if(S.gotCut){ dropToStreets(false); return; }
  syncTrust();
  startSeason(false,0);
}

/* 续约报价整个窗口都没回应（多半是托管/自动推进）：默认接受，留队比瞬移友好 */
function settleRenewDefault(){
  const r=S.pendingRenew; if(!r) return;
  S.contract={years:r.years,left:r.years,salary:r.salary,sign:0,buyout:r.buyout,
              team:r.team,tier:r.tier,grade:r.grade,clubTier:r.clubTier};
  S.pendingRenew=null; S.gotCut=false;
  pushEvent(`<b>${r.team}</b> 的续约没等到你的答复，默认接受——续约 ${r.years} 个赛段。`,"info","合同");
}
/* ---------- 自由身走到窗口关闭还没签成 → 变回路人主播 ----------
   玩家原话（2026-09-05）：「我选择不续约进入转会市场，市场上又没人要我，那我就应该变回路人主播；
   但我点击下一回合，又继续去打比赛了，还是在我原来的队伍，这完全不合理。」
   两处病根：① 年底没签成会按表现自动塞去弱队/二队——「没人要」却自动有队；
   ② 季中到期（转会合同/短约）的续约与放走，在「开始夏季赛」那一步根本没结算，旧队衣照穿。
   现在没合同就是没队：从旧队名单除名，回到职业前那套循环（排位/直播/杯赛/等试训邀请）。
   职业履历封存在 S.careerBak（冠军、战绩、生涯轨迹一样不丢），再签约时 acceptOffer 原样接回；
   走到时间尽头还没签回去，preNextYear 把履历接回来按职业生涯算结局。 */
/* 离队：旧队名单里的「我」换成一个比队均低一点的新秀，换人要重新磨。
   signTransfer 原来只往新队塞人，旧队里那个 me:true 的幻影一直留着——
   powerCore 见到 me 就按「我的队」算（用我的默契/信任/状态），AI 队的战力从此失真。 */
function leaveRoster(name,lg){
  const t=(S.world[lg||"LPL"]||[]).find(x=>x.name===name);
  if(!t||!t.players||!t.players.some(q=>q.me)) return false;
  const others=t.players.filter(q=>!q.me);
  const lvl=others.length?avg(others.map(q=>ovrOf(q))):60;
  t.players=t.players.map(q=>q.me?Object.assign(makeRookie(q.pos,lvl-3,lg||"LPL"),{lg:lg||"LPL"}):q);
  t.syn=clamp((t.syn===undefined?50:t.syn)-7,20,90);
  return true;
}
function dropToStreets(mid){
  const old=S.team||"", lg=S.homeLeague||"LPL";
  // 全世界扫一遍：旧队、以及以前转会留下的幻影，一个不留
  Object.keys(S.world||{}).forEach(k=>(S.world[k]||[]).forEach(x=>leaveRoster(x.name,k)));
  const missed=S.proOffer?S.proOffer.team:null;
  if(S.career) S.careerBak=S.career;
  S.career=null;
  S.streets=(S.streets||0)+1; S.everCut=true;
  S.team=null; S.homeLeague=null; S.contract=null; S.understudy=null; S.promoted=false;
  S.squad=null; S.trust={}; S.gotCut=false; S.freeAgent=true; S.pendingRenew=null; S.proOffer=null;
  S.deal=null; S.tryout=null; S.scrim=null; S.promoteDeal=null; S.cutReason=null; S.askedTransfer=false; S.faOffers=null;
  const P=S.pre=S.pre||{rank:0}; P.log=P.log||[];
  P.world=S.world; P.baseline=leagueBaseline(S.world);   // 再签约接的是这个活着的世界，不是重开一份
  P.week=mid?9:1; P.ap=apFor("pre");                    // 季中回落：从年中开始，主播杯和年底窗口都还赶得上
  P.cityCup=null; P.streamCup=null; P.noRe={}; P.wndGiven={}; P.rankInvited={}; P.fanInvited={};
  P.invite=null; P.inviteCd=P.week+4; P.mates=null; P.offers=null; P.finalScore=undefined;   // 先冷一个月，电话才会来
  P.exPro={team:old,lg,si:S.si};
  if(!mid){   // 年底回落：新赛季的积分榜从零开始（季中回落时夏季赛还在打，榜不动）
    Object.keys(S.world).forEach(k=>{ S.standings[k]={}; S.world[k].forEach(x=>S.standings[k][x.name]={w:0,l:0}); });
  }
  S.step="pre"; S.tab="act";
  const why=missed?`你没有回应 <b>${missed}</b> 的问询，机会过期了。`:`没有一家俱乐部给你合同。`;
  pushEvent(`${mid?"季中注册窗":"转会窗口"}关了，${why}<b>${old}</b> 把你从名单上除了名——你又是路人了。<br>
    <span style="color:var(--ink-3)">排位、直播、杯赛、等电话：和当年一样。冠军和履历都还在，圈子不会忘记你，但也不会等你。</span>`,"bad","合同");
  preLog(`<b>回到路人的日子。</b>${why}上一份合同在 <b>${old}</b> 结束。俱乐部看的是你现在的段位和人气——履历不清零。`,"bad");
  if(typeof saveGame==="function") saveGame("回到路人");
  render();
}

/* ================= 结局 ================= */
function ending(){
  if(typeof statEvent==="function") statEvent("end");
  if(S.neverSigned) return {n:"没能上岸",
    d:`到 2026 年，你始终没能签下第一份职业合同。排位打到过 ${rankFull(S.pre?S.pre.rank:0)}，直播间也有过人，但那扇门没有为你开。`};
  if(!S.career) return {n:"没能上岸",
    d:`到最后你也没能签下第一份职业合同。排位打到过 ${rankFull(S.pre?S.pre.rank:0)}，但那扇门没有为你开。`};
  const played=S.career.w+S.career.l, best=S.career.best;
  const msi=S.career.msi||0, worlds=S.career.worlds||0, lg=S.career.leagueTitles||0;
  if(played<18){
    if(msi+worlds+lg>=1) return {n:"板凳冠军",d:"四年里你大部分时间坐在替补席上。队伍捧起了奖杯，合影里有你，但那不是你打下来的。"};
    return {n:"泯然众人",d:"四年过去，你始终没能拿到稳定的首发位。这条路本来就不是所有人都能走通。"};
  }
  if(msi>=1&&worlds>=1) return {n:"破局者",
    d:"MSI 与世界赛，你都拿到了。至暗五年结束在你手上——这个赛区终于有人做到了。"};
  if(worlds>=2) return {n:"王朝",d:"两座世界冠军奖杯。人们开始用你的名字来划分时代。"};
  if(worlds===1) return {n:"世界冠军",
    d:"你捧起了那座奖杯。MSI 还差一座，但没人会因此少记你一分。"};
  if(msi>=1) return {n:"半程加冕",
    d:"MSI 冠军。你证明了 LPL 能赢，只是最重的那一座还没到手。"};
  const depth=S.career.bestIntl||0;
  if(depth>=4) return {n:"无冕之王",
    d:"你站上过世界赛决赛的舞台，然后输掉了它。所有人都知道你有多强，只是没有奖杯。"};
  if(depth>=3) return {n:"四强遗恨",
    d:"两次三次杀进四强，每次都差一口气。LPL 的观众记得你的名字，也记得那些没能翻过去的比赛。"};
  if(depth>=2) return {n:"八强常客",
    d:"你带队年年打进世界赛淘汰赛，然后年年被挡在门外。稳定，但不够。"};
  if(depth>=1) return {n:"赛区功勋",
    d:"你带队打进过世界赛正赛。没能走远，但这五年 LPL 没有塌，有你一份。"};
  if(lg>=1) return {n:"内战之王",d:"你拿过联赛冠军，却始终没能在国际赛场证明什么。五年里，最重的那一步始终没迈出去。"};
  if(best<=4) return {n:"常青树",d:"四强常客。你在联赛里站稳了，不是所有人都能做到这件事。"};
  return {n:"至暗未破",d:"S12 到 S16，五年。你打过、拼过、被记住过，但那座墙始终没有倒。<b>至暗时刻，最终写进了历史。</b>"};
}
/* ---------- 生涯名片（结局）----------
   玩家点名（2026-09-05）：结局总结没故事、成绩不显眼、不好看、没有一块能截图转发去炫耀。
   一张独立的名片：结局称号做大字＋一句故事，奖杯墙按含金量排（世界赛 > MSI > 联赛），
   五年一行五格（每年哪支队、第几名、国际赛走到哪），底下五个数和签名。
   动效只有一处：加载时元素依次浮现（尊重 prefers-reduced-motion）。 */
const INTL_DEPTH_N={1:"小组赛",2:"八强",3:"四强",4:"决赛",5:"冠军"};
function careerPoster(){
  const e=ending(), C=S.career||{};
  const own=C.titles||[], ring=C.ringTitles||[];
  const kind=t=>/世界赛/.test(t)?"worlds":/MSI/.test(t)?"msi":"lg";
  const yearOf=t=>{ const m=t.match(/S(\d\d)/); return m?+m[1]:0; };
  const rank={worlds:0,msi:1,lg:2};
  const troph=own.map(t=>({t,k:kind(t),y:yearOf(t),ring:false}))
    .concat(ring.map(t=>({t,k:kind(t),y:yearOf(t),ring:true})))
    .sort((a,b)=>(rank[a.k]-rank[b.k])||(a.y-b.y));
  const wall=troph.length?troph.map((x,i)=>`<div class="tp ${x.k}${x.ring?' ring':''}" style="--i:${i}">
      <div class="tp-ic">${x.k==="worlds"?"🏆":x.k==="msi"?"🥇":"🏅"}</div>
      <div class="tp-n">${x.t.replace(/^S\d\d\s*/,"")}</div>
      <div class="tp-y">S${x.y}${x.ring?' · 随队':''}</div></div>`).join("")
    :`<div class="tp none" style="--i:0"><div class="tp-ic">—</div><div class="tp-n">无冠</div><div class="tp-y">${
        C.bestIntl?`国际赛最远走到${INTL_DEPTH_N[C.bestIntl]||""}`:(C.best&&C.best<99)?`常规赛最好第 ${C.best} 名`:"那扇门没有为你开"}</div></div>`;
  const log=C.log||[], il=C.intlLog||[];
  /* 逐赛段轨迹（C.log）是 2026-09-05 才开始记的。老存档没有它，不能把那几年写成「未签约」
     （玩家实锤：拿了六个冠军的档，S12–S15 全是未签约）。没记录的年份用手头的账倒推：
     冠军表给成绩、荣誉表/转会记录给东家；只有第一份职业合同之前的年份才是真「未签约」。 */
  const tagSi=s=>{ const m=String(s||"").match(/S(\d\d)/); return m?(+m[1]-12):-1; };
  const allT=own.map(t=>({t,ring:false})).concat(ring.map(t=>({t,ring:true})));
  const tx=(S.txLog||[]);
  const known=[].concat(log.map(x=>x.si), allT.map(x=>tagSi(x.t)), tx.map(x=>tagSi(x.s))).filter(v=>v>=0);
  const firstPro=known.length?Math.min(...known):(S.career?S.si:99);
  const teamFromTx=si=>{
    for(const x of tx.filter(x=>tagSi(x.s)===si).slice().reverse()){
      const t=String(x.text||"");
      let m=t.match(/→\s*<b>([^<]+)<\/b>/)||t.match(/与\s*([^\s<]+?)\s*续约/)||t.match(/签到了\s*<b>([^<]+)<\/b>/)||t.match(/加盟\s*<b>([^<]+)<\/b>/);
      if(m) return m[1];
    }
    return null;
  };
  let prevTeam=null;   // 没记录又没转会的年份，沿用上一年的东家
  const years=SEASONS.map((sea,si)=>{
    const rows=log.filter(x=>x.si===si);
    const H=S.honors||{};
    let team=rows.length?rows[rows.length-1].team:null;
    if(!team&&(C.msiYears||[]).includes(si)&&H.msi&&H.msi[si]) team=H.msi[si];
    if(!team&&(C.worldsYears||[]).includes(si)&&H.worlds&&H.worlds[si]) team=H.worlds[si];
    if(!team) team=teamFromTx(si);
    if(!team&&S.career&&si===S.si) team=S.team;
    if(!team&&prevTeam&&si>=firstPro&&!tx.some(x=>tagSi(x.s)===si)) team=prevTeam;
    if(team) prevTeam=team;
    let res=rows.map(r=>`${SPLITS[r.split]?SPLITS[r.split][0]:""}${
      r.result==="champion"?"冠":r.result===3?"亚":r.result===2?"四强":r.seed>6?`第${r.seed}`:"季后赛"}`).join(" · ");
    if(!rows.length){   // 没有逐段记录：用当年的冠军顶上
      const tt=allT.filter(x=>tagSi(x.t)===si).map(x=>x.t.replace(/^S\d\d\s*/,"")+"冠军"+(x.ring?"（随队）":""));
      res=tt.join(" · ");
    }
    const best={}; il.filter(x=>x.si===si).forEach(x=>{ best[x.type]=Math.max(best[x.type]||0,x.d); });
    const it=Object.entries(best).map(([t,d])=>`${t==="msi"?"MSI":"世界赛"}${INTL_DEPTH_N[d]||""}`).join(" · ");
    const won=(C.lgYears||[]).includes(si)||(C.msiYears||[]).includes(si)||(C.worldsYears||[]).includes(si);
    const pre=si<firstPro;   // 第一份职业合同之前
    return `<div class="yr${won?' won':''}" style="--i:${si}">
      <div class="yr-t">${sea.tag}<small>${sea.y}</small></div>
      <div class="yr-team">${team?`${typeof teamLogo==="function"?teamLogo(team,16):""}<span>${team}</span>`
        :pre?`<span class="dim">未签约</span>`:`<span class="dim">职业中 · 队伍未记录</span>`}</div>
      <div class="yr-r">${res||(pre?"":"—")}</div>
      ${it?`<div class="yr-i">${it}</div>`:""}</div>`;
  }).join("");
  const stats=[
    ["生涯小分",`${C.w||0}<small>–</small>${C.l||0}`],
    ["冠军",`${typeof titleCount==="function"?titleCount():own.length}`],
    ["转会",`${(S.txLog||[]).length}<small> 站</small>`],
    ["段位",`<span style="font-size:14px">${rankFull(S.pre?S.pre.rank:0)}</span>`],
    ["粉丝",`<span style="font-size:14px">${fanTier()}</span>`]
  ];
  const now=new Date();
  return `<div class="poster">
    <div class="po-top" style="--i:0"><span class="po-mark">破晓</span><span>生涯名片 · S12–S16 · 2022–2026</span></div>
    <div class="po-hero" style="--i:1"><div class="po-title">${e.n}</div><div class="po-story">${e.d}</div></div>
    <div class="po-id" style="--i:2"><b>${meName()}</b> · ${POSN[S.pos]||""} · ${(ORIGIN[S.origin]||{}).n||""}${S.career?` · ${S.team||"—"}`:""} · ${S.age} 岁</div>
    <div class="po-wall">${wall}</div>
    <div class="po-years">${years}</div>
    <div class="po-stats" style="--i:9">${stats.map(([k,v])=>`<div><div class="k">${k}</div><div class="v mono">${v}</div></div>`).join("")}</div>
    <div class="po-sign" style="--i:10"><span>www.poxiao.lol</span><span>#破晓生涯</span><span class="mono">${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,"0")}</span></div>
  </div>`;
}
function viewEnd(){

    <button class="btn" id="again">再开一局</button><span class="note" style="margin:0">上面这张名片，截图就能发。</span></div>`;

    return `${careerPoster()}${again}${achCard()}`;

    const r=Object.entries(S.standings[lg]).map(([n,x])=>({n,...x,p:(x.w+x.l)?x.w/(x.w+x.l):0}))

    <p class="note">五年成长的形状由你开局那 20 点决定：高天赋维度练到了瓶颈，低天赋维度早早封顶。</p>
  </div>
  ${achCard()}
  <div class="card"><h2>五年后的世界</h2>
    <div class="tw"><table><thead><tr><th>赛区</th><th>末季第一</th><th>战绩</th></tr></thead><tbody>${champs}</tbody></table></div>
    ${vets.length?`<h3 style="margin-top:18px;font-size:14px">仍在坚持的老将</h3>
    <div class="tw"><table><thead><tr><th>选手</th><th>战队</th><th class="n">年龄</th><th class="n">操作</th><th class="n">指挥</th></tr></thead>
    <tbody>${vets.map(p=>`<tr><td>${p.id}${p.cn?`<span class="tag">${p.cn}</span>`:""}</td><td>${p.t}</td>

    <div class="row"><button class="btn" id="again2">再开一局</button></div>

/* z = 功能域，决定这一页的身份色。

const TABS_PRE=[
  {k:"act",  n:"本周", z:"act"},
  {k:"squad",n:"战队", z:"team"},

var _moreOpen=false;   // 手机「更多」抽屉开着没（不进存档）
function tabBar(list){
  const cur=curTab(list);
  const btn=t=>`<button class="tab z-${t.z||"act"} ${t.sep?"sep":""} ${t.k===cur?'on':''}" data-tab="${t.k}">${TAB_ICONS[t.k]?`<i class="ti">${TAB_ICONS[t.k]}</i>`:""}${t.n}${
      t.k==="ach"?`<span class="tcount">${ACHIEVEMENTS.filter(a=>hasAch(a.id)).length}</span>`:""}</button>`;
  // 手机（≤560px）：底栏只放四个主入口 + 「更多」，其余收进抽屉——
  // 外部测评量的：八个入口挤在 375px 里每个 47px，能用但拥挤。当前栏目在后面就顶替第四格。
  const mob=(typeof window!=="undefined"&&window.innerWidth&&window.innerWidth<=560);
  try{ if(typeof document!=="undefined"&&document.body&&document.body.classList) document.body.classList.toggle("moreopen",!!(mob&&_moreOpen)); }catch(e){}   // 抽屉开着时右下角浮窗让位
  if(!mob) return `<div class="tabs"><div class="tabcol">${list.map(btn).join("")}</div></div>`;
  let prim=list.slice(0,4);
  const ci=list.findIndex(t=>t.k===cur);
  if(ci>=4) prim=prim.slice(0,3).concat([list[ci]]);
  const rest=list.filter(x=>!prim.includes(x));
  return `${_moreOpen?`<div class="tabsheet-bg" data-more="0"></div><div class="tabsheet"><div class="ts-grid">${rest.map(btn).join("")}</div></div>`:""}
  <div class="tabs mob">${prim.map(btn).join("")}<button class="tab more ${_moreOpen?'on':''}" data-more="1"><i class="ti">${TAB_ICONS.more||""}</i>更多</button></div>`;
}

/* ================= 对阵图（2026-09-05 玩家点名）=================
   「赛程或者其他地方放上分组 / 赛程图，八强四强淘汰赛也画出来，玩家一眼知道下一场打谁、赢了打谁。」
   全部用 HTML 画、不用图片：同一套骨架，换队名和队标。
   · 瑞士轮 / 小组赛：按战绩分桶的看板（3 胜晋级、3 负淘汰），你的队晨光橙框
   · 淘汰赛：对阵树——已打完的轮次（intl.br.hist）+ 本轮 + 后续占位；MSI 双败按胜者组 / 败者组逐轮列
   · 联赛季后赛：六强种子 + 你的路线；常规赛期间按当前排名画「若现在结束」的形势
   · 杯赛：轮次阶梯（对手按轮固定，赢了打谁一目了然） */
/* 对阵图里的队名：LPL 用惯用缩写，其余不长就写全（玩家实锤：T1 显示成「T」、Cloud9 成「C」），太长才取首字母 */
function brCode(n){
  try{ if(typeof LPL_CODE!=="undefined"&&LPL_CODE[n]) return LPL_CODE[n]; }catch(e){}
  const str=String(n||"");
  if(str.length<=14) return str;
  const w=str.split(/\s+/).filter(Boolean);
  if(w.length===1) return str.slice(0,12);
  const ini=w.map(x=>x[0]).join("").toUpperCase();
  return ini.length>=2?ini:str.slice(0,12);
}
function brTeam(n,opt){
  opt=opt||{};
  if(!n) return `<span class="bt empty">${opt.ph||"待定"}</span>`;
  const me=(n===S.team);
  let code=n; try{ code=brCode(n); }catch(e){}
  return `<span class="bt ${me?'me':''} ${opt.win?'win':''} ${opt.lose?'lose':''}" title="${escapeHtml(n)}">${
    typeof teamLogo==="function"?teamLogo(n,16):""}<b>${escapeHtml(code)}</b></span>`;
}
function swissBoard(I){
  const groups={};
  (I.field||[]).forEach(n=>{ const r=I.swiss[n]||[0,0]; const k=r[0]+"-"+r[1]; (groups[k]=groups[k]||[]).push(n); });
  const keys=Object.keys(groups).sort((a,b)=>{ const [aw,al]=a.split("-").map(Number),[bw,bl]=b.split("-").map(Number); return (bw-aw)||(al-bl); });
  const next=(S.prep&&S.prep.opp)||(S.match&&S.match.oppName)||null;
  return `<div class="brk-board">${keys.map(k=>{ const [w,l]=k.split("-").map(Number); const st=w>=3?"adv":l>=3?"out":"";
    return `<div class="bb ${st}"><div class="bh">${k}${st==="adv"?' <em>晋级</em>':st==="out"?' <em>淘汰</em>':''}</div>${
      groups[k].map(n=>brTeam(n,{win:w>=3,lose:l>=3})).join("")}</div>`; }).join("")}</div>
  <p class="note" style="margin:8px 0 0">${I.stage==="groups"?"小组赛":"瑞士轮"}第 ${I.round} 轮 · 你 <b>${I.record.join("-")}</b>${
    next?` · 下一场 vs <b>${next}</b>（同战绩、不同赛区配对）`:""}。三胜晋级八强，三负出局。</p>`;
}
function koRounds(B){
  const rounds=(B.hist||[]).map(h=>({label:h.label,pairs:h.pairs,winners:h.winners,done:true}));
  const cur=(!B.champ&&typeof brStep==="function")?brStep():null;
  if(cur&&cur.pairs&&cur.pairs.length) rounds.push({label:cur.label,pairs:cur.pairs,winners:[],now:true});
  if(!B.champ){
    if(!B.double){
      let n=cur?cur.pairs.length:0;
      while(n>1){ n=Math.floor(n/2); rounds.push({label:n>=4?"八强":n>=2?"半决赛":"决赛",pairs:Array.from({length:n},()=>[null,null]),winners:[],ph:true}); }
    } else {
      const labs=["胜者组第一轮","败者组第一轮","胜者组半决赛","败者组第二轮","胜者组决赛","败者组第三轮","败者组决赛","总决赛"];
      const cnt=[4,2,2,2,1,1,1,1];
      for(let st=(B.step||0)+1;st<8;st++) rounds.push({label:labs[st],pairs:Array.from({length:cnt[st]},()=>[null,null]),winners:[],ph:true});
    }
  }
  return rounds;
}
function koTree(rounds,champ){
  return `<div class="brk-tree">${rounds.map(r=>`<div class="bcol ${r.now?'now':''} ${r.done?'done':''}"><div class="bh">${r.label}${r.now?' <em>本轮</em>':''}</div>${
    r.pairs.map((p,i)=>{ const w=r.winners[i]||null; const ph=r.ph?"胜者":"轮空";
      return `<div class="bm ${(p[0]===S.team||p[1]===S.team)&&r.now?'now':''}">${
        brTeam(p[0],{win:w&&w===p[0],lose:w&&p[0]&&w!==p[0],ph})}<span class="bvs">vs</span>${
        brTeam(p[1],{win:w&&w===p[1],lose:w&&p[1]&&w!==p[1],ph})}</div>`; }).join("")}</div>`).join("")}${
    champ?`<div class="bcol"><div class="bh">冠军</div><div class="bm">${brTeam(champ,{win:true})}<i class="bok">🏆</i></div></div>`:""}</div>`;
}
function intlBracketCard(){
  const I=S.intl; if(!I) return "";
  const name=I.type==="msi"?"MSI":"世界赛";
  if(I.stage==="playin"){
    return `<div class="card"><h2>${name}入围赛<em>第 ${I.round} 轮</em></h2>
      <div class="brk-tree"><div class="bcol"><div class="bh">入围赛名单</div>${(I.field||[]).map(n=>`<div class="bm">${brTeam(n)}</div>`).join("")}</div></div>
      <p class="note">从最底下打起，前 ${(I.cfg&&I.cfg.playin&&I.cfg.playin.take)||2} 名进正赛。</p></div>`;
  }
  if(I.stage==="swiss"||I.stage==="groups"){
    return `<div class="card"><h2>${name}${I.stage==="groups"?"小组赛":"瑞士轮"} · 对阵看板<em>${(I.field||[]).length} 队</em></h2>${swissBoard(I)}</div>`;
  }
  const B=I.br; if(!B) return "";
  const rounds=koRounds(B);
  return `<div class="card"><h2>${name}淘汰赛 · 对阵树<em>${B.double?"双败制 BO5":"单败 BO5"}</em></h2>${koTree(rounds,B.champ)}
    <p class="note">${B.champ?`冠军 <b>${B.champ}</b>。`:`亮字是赢了的队、划掉的是被淘汰的，晨光橙框是你。${
      (S.prep&&S.prep.opp)?`下一场 vs <b>${S.prep.opp}</b>。`:""}${typeof brOthersText==="function"?brOthersText():""}`}</p></div>`;
}
/* 联赛季后赛：六队三轮。首轮打 5/6 号种子，半决赛打 2/3 号，决赛打榜首（playoffOpp 的规则） */
function playoffBracketCard(){
  if(!S.career||!S.team||typeof lplRank!=="function") return "";
  const rk=lplRank(); if(!rk||rk.length<6) return "";
  const P=(S.playoff&&S.playoff.alive)?S.playoff:null;
  const inSeason=S.step==="season";
  if(!P&&!inSeason) return "";
  const six=rk.slice(0,6), mySeed=rk.findIndex(r=>r.n===S.team)+1;
  const sx=six.map(r=>r.n);
  const seedCol=`<div class="bcol"><div class="bh">六强种子${P?"":"（按当前排名）"}</div>${six.map((r,i)=>`<div class="bm seed ${r.n===S.team?'now':''}">${brTeam(r.n)}<span class="bsd">#${i+1} · ${r.w}−${r.l}</span></div>`).join("")}</div>`;
  let rounds=[], champ=null, head, note;
  if(P&&P.br){
    const B=P.br;
    rounds=(B.hist||[]).map(h=>({label:h.label,pairs:h.pairs,winners:h.winners,done:true}));
    if(!B.champ&&B.pairs.length) rounds.push({label:poRoundName(B.stage),pairs:B.pairs,winners:[],now:true});
    for(let st=(B.champ?4:B.stage+1);st<=3;st++)
      rounds.push({label:poRoundName(st),pairs:st===2?[[B.seeds[0]||null,null],[B.seeds[1]||null,null]]:[[null,null]],winners:[],ph:true});
    champ=B.champ;
    head=`季后赛 · 对阵树`;
    note=champ?`冠军 <b>${champ}</b>。`:`亮字是赢了的队、划掉的是被淘汰的，晨光橙框是你。${poMyOpp()?`下一场 vs <b>${poMyOpp()}</b>。`:""}一二号种子轮空进半决赛；1 号打 4v5 的胜者，2 号打 3v6 的胜者。`;
  } else if(P){
    // 老档（没有对阵树）：只画你的路线
    const beaten=(P.beaten||[]).filter(n=>n!==S.team);
    const names=["季后赛首轮","半决赛","决赛"];
    rounds=names.map((n,i)=>{ const r=i+1; const opp=r<P.round?beaten[r-1]:r===P.round?((S.prep&&S.prep.opp)||(S.match&&S.match.oppName)||null):null;
      return {label:n,pairs:[[S.team,opp]],winners:r<P.round?[S.team]:[],now:r===P.round,done:r<P.round,ph:r>P.round}; });
    head=`季后赛 · 你的路线`; note="这份存档是旧版季后赛开的，只有你自己的路线。";
  } else {
    rounds=[{label:"季后赛首轮",pairs:[[sx[2],sx[5]],[sx[3],sx[4]]],winners:[],ph:true},
            {label:"半决赛",pairs:[[sx[0],null],[sx[1],null]],winners:[],ph:true},
            {label:"决赛",pairs:[[null,null]],winners:[],ph:true}];
    head=`季后赛形势`;
    note=mySeed>=1&&mySeed<=6?`前六进季后赛，按现在的排名画的，每周都会变。首轮 3v6、4v5，一二号种子轮空。`:`前六进季后赛，你现在在线外——把排名打上去。`;
  }
  return `<div class="card"><h2>${head}<em>${P?poRoundName(P.round):`常规赛第 ${S.week}/${WEEKS} 周 · 你第 ${mySeed>0?mySeed:"—"} 名`}</em></h2>
    <div class="brk-tree">${seedCol}${koTree(rounds,champ).replace('<div class="brk-tree">','').replace(/<\/div>$/,'')}</div>
    <p class="note">${note}</p></div>`;
}
function bracketCard(){
  try{
    return (S.intl?intlBracketCard():"")+((!S.intl&&S.career)?playoffBracketCard():"");
  }catch(e){ return ""; }
}
/* 杯赛阶梯：对手按轮固定（CUPS.opps），赢了打谁一目了然 */
function cupLadder(k){
  try{
    const c=cupOf(k), C=CUPS[k]; if(!c||!C) return "";
    const steps=[];
    for(let r=1;r<=C.rounds;r++){
      const opp=C.opps[Math.min(r-1,C.opps.length-1)];
      const st=!c.alive?(r<=c.wins?"win":r===c.wins+1?"lost":"ph"):(r<c.round?"win":r===c.round?"now":"ph");
      steps.push({r,n:cupRoundName(k,r),opp,st});
    }
    const wait=Math.max(0,c.nextWeek-S.pre.week);
    return `<div class="brk-tree cup"><div class="bcol path"><div class="bh">赛程阶梯</div>${steps.map(x=>
      `<div class="bm ${x.st}"><span class="bsd">${x.n}</span><span class="bt ${x.st==="win"?"win":x.st==="lost"?"lose":""}"><b>${x.opp}</b></span>${
        x.st==="win"?'<i class="bok">胜</i>':x.st==="now"?`<i class="bnow">${wait===0?"本周":"第 "+c.nextWeek+" 周"}</i>`:x.st==="lost"?'<i class="bko">止步</i>':''}</div>`).join("")}</div></div>`;
  }catch(e){ return ""; }
}

    </div>${typeof fixtureStrip==="function"?fixtureStrip():""}</div>`;

function eventsCard(){

function newsCard(){

   数字换周时从旧值滚到新值（400ms，尊重 reduced-motion）。段位门槛那一长串说明只留在「我的」页。 */
var _hudPrev={}, _lastTab, _lastSc;
/* ---------- 事件提示条（界面重做第二期 ③）----------
   pushEvent 里 good / bad / big 三种语气的事件，除了进大事记，还从右上滑进一条提示。
   停留时间按字数走（6–12 秒；原来一律 3.2 秒，玩家实锤「还来不及看就没了」），
   鼠标悬着不走、移开再给两秒半、点一下就关；最多四条。完整内容永远在大事记 / 生涯日志里。
   队列是模块变量不进存档；托管连续处理（_renderLock）和无头批测时不弹。 */
var _toastQ=[];
function toastPush(ev){
  try{
    if(typeof document==="undefined"||!document.body||!document.body.appendChild) return;
    if(ev.tone!=="good"&&ev.tone!=="bad"&&ev.tone!=="big") return;
    _toastQ.push(ev); if(_toastQ.length>4) _toastQ.shift();
  }catch(e){}
}
function toastHold(txt){ return Math.min(12000, 6000+String(txt||"").length*70); }   // 中文按字算：40 字约 9 秒
function flushToasts(){
  try{
    if(!_toastQ.length||typeof document==="undefined"||!document.createElement) return;
    if(typeof _renderLock!=="undefined"&&_renderLock>0){ _toastQ.length=0; return; }
    let box=document.getElementById("toasts");
    if(!box){ box=document.createElement("div"); box.id="toasts"; box.className="toasts"; document.body.appendChild(box); }
    const rm=(typeof matchMedia==="function")&&matchMedia("(prefers-reduced-motion: reduce)").matches;
    _toastQ.splice(0).forEach((ev,i)=>{
      const raw=String(ev.text||"").replace(/<br\s*\/?>/gi," ").replace(/<[^>]+>/g,"").replace(/\s+/g," ").trim();
      const txt=raw.slice(0,140)+(raw.length>140?"…":"");
      const el=document.createElement("div"); el.className="toast t-"+ev.tone;   // t- 前缀：别和结局页的 .big 大字类撞名（玩家实锤：突破提示条变成 36px 宋体）
      el.title="点一下关闭 · 完整内容在大事记";
      el.innerHTML=`<span class="tt">${typeof escapeHtml==="function"?escapeHtml(ev.tag||""):(ev.tag||"")}</span><span class="tx">${typeof escapeHtml==="function"?escapeHtml(txt):txt}</span><button class="tx-x" aria-label="关闭" title="关闭">×</button>`;
      box.appendChild(el);
      while(box.children.length>4) box.removeChild(box.firstChild);
      let tm=null, gone=false;
      const close=()=>{ if(gone) return; gone=true; clearTimeout(tm); el.classList.add("out"); setTimeout(()=>{ try{ el.remove(); }catch(e){} }, rm?0:260); };
      const arm=ms=>{ clearTimeout(tm); tm=setTimeout(close, ms); };
      el.onmouseenter=()=>clearTimeout(tm);      // 悬停：不走
      el.onmouseleave=()=>arm(2500);             // 移开：再给两秒半
      el.onclick=close;                           // 点击 / 手机上点一下：关掉
      arm(toastHold(txt)+i*400);
    });
  }catch(e){}
}

function pinbar(){

  const top=DIMS.reduce((a,d)=>S.attrs[a]>=S.attrs[d]?a:d);

  const ap=(S.step==="pre"&&S.pre)?S.pre.ap
          :(S.step==="season"||S.step==="prep"||S.step==="offseason")?S.ap:null;
  const num=uiNum();
  const st=(typeof strength==="function")?strength(S.attrs):avg(DIMS.map(d=>S.attrs[d]));
  p.innerHTML=(ap!==null&&ap!==undefined?`<span class="pv ${ap>0?'top':'dim'}"><i>行动</i><b>${ap}</b></span>`:"")
  +(num
    ? DIMS.map(d=>`<span class="pv ${d===top?'top':''}"><i>${d}</i><b>${S.attrs[d].toFixed(0)}</b></span>`).join("")
    : `<span class="pv top"><i>实力</i><b>${dimWord(st)}</b></span><span class="pv pv-top2"><i>最强</i><b>${top}</b></span>`)
  +`<span class="pv dim"><i>体能</i><b>${100-Math.round(S.fatigue)}</b></span>`
  +(S.form!==undefined&&S.career?`<span class="pv dim"><i>状态</i><b>${Math.round(myForm())}</b></span>`:"")
  +`<span class="pv tools"><button class="pvb ${num?'on':''}" id="uinum" title="${num?"切回文字描述":"显示具体数值"}">${num?"数值 开":"数值 关"}</button><button class="pvb" id="tourbtn" title="重看一遍导览">导览</button></span>`;

function scrollStageTop(){
  try{
    const st=$("stage"); if(!st||!st.getBoundingClientRect) return;
    const pin=$("pin");
    const ph=(pin&&pin.getBoundingClientRect)?pin.getBoundingClientRect().height:0;
    const y=st.getBoundingClientRect().top+(window.scrollY||window.pageYOffset||0)-ph-6;
    window.scrollTo(0,Math.max(0,y));
  }catch(e){}
}
let _renderLock=0;
let _autosaveAt=0;
function render(){
  if(_renderLock>0) return;                 // 托管正在连续处理，等它做完再画
  if(typeof autoSweep==="function"&&S&&S.auto){
    _renderLock++;
    try{ autoSweep(); } finally{ _renderLock--; }
  }
  if(typeof watchRoster==="function") watchRoster();
  hud(); pinbar();
  // 节流自动存档（2026-09-05 玩家实锤：报了主播杯、刷新后「已错过」——原来只在推进周时存，
  // 两次存档之间做的事一刷新就没了）。每次状态变化后最多 1.5 秒存一次，弹窗类字段本来就不进档
  try{
    if(typeof saveGame==="function"&&S&&S.step!=="create"&&S.step!=="end"){
      const now=Date.now();
      if(now-_autosaveAt>1500){ _autosaveAt=now; saveGame("自动"); }
    }
  }catch(e){}
  const body = S.step==="create"?viewCreate()
    : S.step==="pre"?viewPre()
    : S.step==="offer"?viewOffer()
    : S.step==="season"?viewSeason()
    : S.step==="prep"?viewPrep()
    : S.step==="match"?viewMatch()
    : S.step==="offseason"?viewOffseason() : viewEnd();
  const _st=$("stage");
  _st.innerHTML = body
    + (typeof saveBar==="function"?saveBar():"")
    + (typeof achPopCard==="function"?achPopCard():"")
    + (typeof traitUpCard==="function"?traitUpCard():"")
    + (typeof streamOfferCard==="function"?streamOfferCard():"")
    + (typeof confirmCard==="function"?confirmCard():"");
  if(_st.setAttribute) _st.setAttribute("data-zone", curZone());
  if(typeof hudCta==="function") hudCta();               // HUD 主按钮镜像本页的 .btn.primary
  if(typeof stageSwitchFx==="function") stageSwitchFx(); // 换标签 160ms 淡入
  if(typeof flushToasts==="function") flushToasts();     // 事件提示条
  if(typeof bgmSeasonTick==="function") bgmSeasonTick();   // 赛季主题曲：赛季变了就切
  if(typeof tourMaybe==="function") tourMaybe();           // 第一次进职业前 / 赛季：教程导览
  if(S.step==="end"&&typeof supportNudge==="function") supportNudge("end");   // 通关才提「支持作者」（玩家定的：开局不弹）
  /* 大标题只在创建页和结局页铺开。
     进了游戏之后它每一屏都在重复占 237px，而首屏总共才 900px——
     收成一条窄横幅，把地方让给内容。 */
  const _top=$("top");
  if(_top&&_top.classList){
    const full = S.step==="create" || S.step==="end";
    _top.classList[full?"remove":"add"]("compact");
  }
  /* 标签栏要贴在属性条正下方，而属性条高度随宽度变——量一次写进变量，不写死 */
  const _pin=$("pin");
  if(_pin&&_pin.getBoundingClientRect&&document.documentElement&&document.documentElement.style){
    const h=Math.round(_pin.getBoundingClientRect().height);
    document.documentElement.style.setProperty("--pin-h",(h>0?h:0)+"px");
  }
  bind();
  const sig=blockSig();
  if(sig&&sig!==_lastBlock&&typeof window!=="undefined"&&window.scrollTo) scrollStageTop();
  _lastBlock=sig;
}
