  <header class="top" id="top">
    <div class="keyart" aria-hidden="true"></div>
    <div class="theme-top"><span class="tseg" role="radiogroup" aria-label="界面配色"><button type="button" class="pvb" role="radio" aria-checked="true" data-theme-set="dark" title="深色：默认，赛事转播那种黑底"><i class="tsw" data-t="dark" aria-hidden="true"></i>深</button><button type="button" class="pvb" role="radio" aria-checked="false" data-theme-set="light" title="浅色：白底，像一张数据表"><i class="tsw" data-t="light" aria-hidden="true"></i>浅</button><button type="button" class="pvb" role="radio" aria-checked="false" data-theme-set="cream" title="米色：米黄底，比白底柔和，看久了更舒服"><i class="tsw" data-t="cream" aria-hidden="true"></i>米</button></span><button type="button" class="pvb tcyc" data-theme-cycle aria-label="界面配色：深色。点击换成浅色"><i class="tsw" data-t="dark" aria-hidden="true"></i>深</button></div>
    <div class="brand">
      <svg width="66" height="66" viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <linearGradient id="crackG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#F0E6D2"/>
            <stop offset="55%" stop-color="#C9A961"/>
            <stop offset="100%" stop-color="#8A7440"/>
          </linearGradient>
          <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="2.6" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <!-- 外菱形 -->
        <path d="M50 5 L95 50 L50 95 L5 50 Z" fill="none" stroke="#2F6E8C" stroke-width="1.6"/>
        <!-- 内菱形 -->
        <path d="M50 22 L78 50 L50 78 L22 50 Z" fill="none" stroke="#1E4A63" stroke-width="1.2"/>
        <!-- 顶点节点 -->
        <circle cx="50" cy="5" r="2.4" fill="#4FBEDA"/>
        <circle cx="95" cy="50" r="2.4" fill="#2F6E8C"/>
        <circle cx="50" cy="95" r="2.4" fill="#2F6E8C"/>
        <circle cx="5" cy="50" r="2.4" fill="#2F6E8C"/>
        <!-- 金色裂缝：把菱形劈开 -->
        <path d="M50 2 L56 24 L44 40 L55 56 L45 74 L51 98"
              fill="none" stroke="url(#crackG)" stroke-width="3.4"
              stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
        <!-- 迸溅的碎片 -->
        <path d="M30 34 L37 32 L33 41 Z" fill="#C9A961" opacity=".85"/>
        <path d="M68 44 L75 42 L70 51 Z" fill="#C9A961" opacity=".7"/>
        <path d="M33 62 L40 60 L36 69 Z" fill="#C9A961" opacity=".6"/>
      </svg>
      <div class="title-block">
        <p class="game-kicker">LOL 电竞生涯模拟器</p>
        <h1 class="game-title">破晓</h1>
        <p class="game-en">www.poxiao.lol</p>
      </div>
    </div>
    <p class="tagline">S12 起，五年，或者再多三年。一段有限的职业生涯，去终结那个王朝——或者建一个。</p>
    <p class="pillars">自建选手 · 世界自运转 · 版本更迭 · 新老换血</p>
