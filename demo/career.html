/* ================= 试训与签约 =================

   原来这一段是：分数够了 → 弹出几个报价 → 点一下，签完了。
   「试训」两个字只出现在标题里，实际上没有试训，也没有谈判。

   现在拆成四段，每一段都能失败：

     一、邀请   城市赛打得好就有俱乐部来问，不用非得夺冠。
                不同的成绩，来的俱乐部档次不同。
     二、试训   去队里待几天，四个环节分别考操作、运营、指挥、心态，
                体质决定你后面几天还剩多少状态。每个环节都要做选择。
     三、评级   你的表现对上这家俱乐部的期望，得出 A+ / A / B / C / D。
                档次决定给不给合同、给什么合同——首发、替补还是青训。
     四、谈判   年薪、签字费、合同年限、违约金。你可以还价，
                但底气来自试训评级和手上有几家在抢你，还价过头会谈崩。   */

/* ---------- 俱乐部档次 ----------
   expect 是这家俱乐部的期望值，试训得分要对着它比。
   豪门当然更难——同样的表现，在弱队是 A，在豪门可能只有 C。 */
const CLUB_TIERS = {
  top:   { n:"豪门",   expect:62, pay:[180,420], sign:[120,300], years:3, buyout:[900,2200] },
  mid:   { n:"中游",   expect:52, pay:[90,190],  sign:[40,120],  years:2, buyout:[350,900] },
  low:   { n:"弱队",   expect:44, pay:[55,110],  sign:[15,50],   years:2, buyout:[150,400] },
  acad:  { n:"青训队", expect:36, pay:[18,42],   sign:[0,12],    years:2, buyout:[40,120] }
};

/* ---------- 试训的四个环节 ----------
   每个环节考一个维度，三个选项分别偏向不同的能力。
   risk 高的选项成了加得多，砸了扣得也多——
   底子薄的人赌一把是合理的，底子厚的人没必要赌。 */
const TRYOUT_DAYS = [
  { n:"第一天 · 单排考核", dim:"操作",
    ctx:"教练组在你身后架了台机器录屏。他们不看输赢，看你处理每一个细节的方式。",
    a:[{t:"拿出绝活英雄", dim:"操作", risk:1.3, d:"最能打出你的上限，但一旦被针对就很难看"},
       {t:"选版本强势位", dim:"运营", risk:0.8, d:"稳定发挥，不容易出彩"},
       {t:"选团队向英雄", dim:"指挥", risk:1.0, d:"展示视野和判断，个人数据会很难看"}] },
  { n:"第二天 · 训练赛", dim:"运营",
    ctx:"和一队打训练赛。你被安排在对位上，队伍不会为你调整战术。",
    a:[{t:"自己带节奏", dim:"指挥", risk:1.3, d:"打成了就是核心，打崩了就是不合群"},
       {t:"跟着队伍打", dim:"运营", risk:0.7, d:"融入度高，但显不出你"},
       {t:"专注打对位", dim:"操作", risk:1.0, d:"个人数据好看，教练看得出你只顾自己"}] },
  { n:"第三天 · 复盘会", dim:"指挥",
    ctx:"教练把昨天那波团战倒了七遍，然后问你：这一波，你觉得问题在谁身上。",
    a:[{t:"承认失误，给出方案", dim:"心态", risk:0.8, d:"教练最想听到的答案"},
       {t:"坚持自己的判断", dim:"指挥", risk:1.3, d:"说服了就是有主见，没说服就是听不进话"},
       {t:"把责任揽下来", dim:"心态", risk:0.6, d:"稳妥，但显得没有自己的想法"}] },
  { n:"第四天 · 经理面谈", dim:"心态",
    ctx:"经理把合同的样子摆在桌上，但没有推过来。他先问你：你觉得自己值多少。",
    a:[{t:"报一个高数字", dim:"心态", risk:1.4, d:"有底气是加分项，没底气就是不自量力"},
       {t:"说先看表现", dim:"运营", risk:0.7, d:"稳，但会被当成不自信"},
       {t:"谈规划不谈钱", dim:"指挥", risk:1.0, d:"聊你想成为什么样的选手"}] }
];

/* ---------- 一、邀请 ---------- */
/* 你现在的个人水平，和试训评分同一把尺子 */
function tryoutSkill(){
  return S.attrs.操作*0.34 + S.attrs.运营*0.24 + S.attrs.指挥*0.20
       + S.attrs.心态*0.14 + S.attrs.体质*0.08;
}
/* 城市赛/主播杯打完之后叫一次：打得好就有人来问。
   关键点是**不用夺冠**——走得远，数据被记下来，就够了。 */
function checkTryoutInvite(kind, reached, champion){
  const C = (typeof CUPS !== "undefined") ? CUPS[kind] : null;
  if(!C || !S.pre) return;
  const rounds = C.rounds;
  const depth = reached / rounds;
  // 被看到的概率随「打过多少场」累积。
  // 首轮就出局也不是零，只是很低；打得多、走得深、拿了冠军，概率才上来。
  const seen = Math.min(S.pre.scoutSeen || 0, 10);
  const p = clamp(0.10 + depth*0.50 + (champion?0.30:0) + seen*0.045, 0.05, 0.96);
  if(rnd() >= p) return;

  let tier = champion ? "mid" : depth >= 0.75 ? "low" : "acad";
  if(kind === "stream" && tier !== "top") tier = tier === "acad" ? "low" : "mid";
  const why = `${C.name}${champion ? "夺冠" : `走到第 ${reached+1} 轮`}`;
  // 兑现时机：整届打完之后。这会儿可能还有别的赛事在跑，那就先排队。
  queueInvite(fitTier(tier), why);
}
/* 发不出去就排队，等条件满足（赛程打完 / 冷却过了）再发。
   之前是直接丢弃，等于「打完城市赛那次机会白攒了」。 */
function queueInvite(tier, reason){
  const P = S.pre; if(!P) return;
  if(canInvite()){ addInvite(tier, reason); return; }
  P.inviteQ = P.inviteQ || [];
  if(P.inviteQ.length < 3) P.inviteQ.push({tier, reason});
}
function flushInviteQ(){
  const P = S.pre; if(!P || !P.inviteQ || !P.inviteQ.length) return;
  if(!canInvite()) return;
  const q = P.inviteQ.shift();
  // 排队期间你的水平可能变了，档次按现在重新判一次
  addInvite(fitTier(q.tier), q.reason);
}
/* 段位或人气到了也会有人来问——不是只有比赛这一条路 */
function checkRankInvite(){
  const P = S.pre; if(!P) return;
  if(typeof flushInviteQ === "function") flushInviteQ();   // 排队的先发
  if(!canInvite()) return;
  P.rankInvited = P.rankInvited || {};
  // 大师和宗师各算一次机会——上分这条路不该只在最后才兑现
  for(const [i, tier] of [[2,"acad"],[3,"low"],[4,"mid"],[5,"top"]]){
    if(RANKS[i] && P.rank >= RANKS[i].at && !P.rankInvited[i]){
      P.rankInvited[i] = 1;
      addInvite(fitTier(tier), `排位打到${RANKS[i].n}`);
      return;
    }
  }
  if(typeof checkFameInvite === "function") checkFameInvite();
}
/* 成绩决定「有没有人看你」，个人水平决定「谁来看你」。
   两头都要卡：水平不够，成绩再好也只有青训队打电话；
   水平明显超出，档次低的队自己就知道留不住你，会有更好的队来。 */
const TIER_ORDER = ["acad", "low", "mid", "top"];
function fitTier(tier){
  const me = tryoutSkill();
  let i = TIER_ORDER.indexOf(tier);
  // 往上：明显够得着更高一档就往上走
  while(i < TIER_ORDER.length-1 && me >= CLUB_TIERS[TIER_ORDER[i+1]].expect + 6) i++;
  // 往下：连这一档的门槛都差得远，就只剩青训队
  while(i > 0 && me < CLUB_TIERS[TIER_ORDER[i]].expect - 10) i--;
  return TIER_ORDER[i];
}
/* 邀请节流。
   实测过：整局平均只有 0.98 次试训机会，59/60 的局正好一次——
   意味着试训一失手，这一年就白费了。而试训本身是带运气的，
   「一次定生死」不是难度，是惩罚。
   现在放开触发点、加两周冷却，目标是整局 2–4 次机会：
   失手一次还能再来，但也不至于多到没有分量。 */
function canInvite(){
  const P = S.pre; if(!P) return false;
  if(P.invite && P.invite.pending) return false;        // 手上还有没处理的
  if(P.inviteCd && P.week < P.inviteCd) return false;   // 冷却中
  // 太早不行。代码里本来就有 PRE_EARLIEST=13「主播杯打完之前没人下判断」，
  // 加段位/人气触发时我把它绕过去了，结果第 6 周就有队来签，
  // 玩家在城市赛开打之前就走人——整条业余赛事线被跳过，
  // 奖金、成就、决赛全拿不到，职业赛胜率也掉了 11 个百分点。
  if(typeof PRE_EARLIEST !== "undefined" && P.week < PRE_EARLIEST) return false;
  // 手上还有没打完的杯赛，也先别来——让玩家把比赛打完
  if(typeof activeCups === "function" && activeCups().length) return false;
  return true;
}
/* 人气到了也有人来问——直播这条路本来就是设计里的一条路 */
function checkFameInvite(){
  const P = S.pre; if(!P || !canInvite()) return;
  P.fameInvited = P.fameInvited || {};
  for(const [at, tier] of [[55,"acad"],[110,"low"],[190,"mid"]]){
    if(S.fame >= at && !P.fameInvited[at]){
      P.fameInvited[at] = 1;
      addInvite(fitTier(tier), `直播间的人气涨到了${fameTier()}`);
      return;
    }
  }
}
function addInvite(tier, reason){
  const P = S.pre; if(!P) return;
  if(!canInvite()) return;
  const T = CLUB_TIERS[tier];
  const team = pickClub(tier);
  if(!team) return;
  P.invite = { tier, team, reason, pending:true, week:P.week, expect:T.expect };
  P.inviteCd = P.week + 2;
  P.inviteN = (P.inviteN || 0) + 1;
  preLog(`<b>${team}</b> 看了你的比赛录像——${reason}。<b>他们邀请你去队里试训。</b>`, "big");
  if(typeof render === "function") render();
}
/* 按档次挑一家真实存在的俱乐部 */
function pickClub(tier){
  try{
    const lg = S.world && S.world.LPL ? S.world.LPL : null;
    if(!lg || !lg.length) return null;
    const rk = lg.map(t=>({n:t.name, p:power(t)})).sort((a,b)=>b.p-a.p);
    const seg = { top:[0,3], mid:[4,10], low:[11,rk.length-1], acad:[11,rk.length-1] }[tier];
    const lo = Math.min(seg[0], rk.length-1), hi = Math.min(seg[1], rk.length-1);
    const pick = rk[lo + Math.floor(rnd()*(hi-lo+1))];
    return tier === "acad" ? pick.n + " 青训队" : pick.n;
  }catch(e){ return null; }
}
/* 邀请卡：接受就进试训，拒绝就继续练 */
function inviteCard(){
  const P = S.pre, iv = P && P.invite;
  if(!iv || !iv.pending) return "";
  const T = CLUB_TIERS[iv.tier];
  const me = tryoutSkill(), gap = me - iv.expect;
  return `<div class="card savecont"><h2>试训邀请<em>${T.n}</em></h2>
    <h3>${typeof teamLogo==="function"?teamLogo(iv.team,22):""} ${iv.team}</h3>
    <p class="note" style="margin:0 0 10px">因为${iv.reason}。<br>
      去队里待四天，教练组会从操作、运营、指挥、心态四个方面评估你。
      <b>试训不是走过场——评级不够就没有合同</b>，评级高低也决定给你什么档次的合同。</p>
    <div class="ver">
      他们的期望值 <b>${iv.expect}</b>　·　你现在 <b>${me.toFixed(0)}</b><br>
      <span style="color:${gap>=4?'var(--cyan)':gap>=-4?'var(--gold)':'var(--red)'}">${
        gap>=8 ? "以你现在的水平，这次试训应该很轻松。"
        : gap>=2 ? "你够得上他们的要求，稳住就行。"
        : gap>=-4 ? "刚好在门槛上——四天里每个选择都算数。"
        : gap>=-10 ? "他们的期望比你现在高不少，得靠临场发挥。"
        : "说实话，这个档次的队伍现在还不适合你。去了大概率是陪跑。"}</span></div>
    <div class="row">
      <button class="btn" id="ivgo">去试训 →</button>
      <button class="btn ghost" id="ivno">先不去，继续练</button>
    </div>
    <p class="note">拒绝不会关上门，但这家俱乐部今年不会再来第二次。</p></div>`;
}

/* ---------- 二、试训过程 ---------- */
function startTryout(tier, team, expect){
  S.tryout = { tier, team, expect, day:0, score:0, lines:[], fat:0, done:false };
  render();
}
function tryoutDay(){ return TRYOUT_DAYS[S.tryout.day]; }
/* 体质差的人，后面几天会明显掉状态——这是体质在这里的意义 */
function tryoutFatiguePenalty(){
  const t = S.tryout;
  const stamina = S.attrs.体质;
  return t.day * Math.max(0, (52 - stamina)) * 0.055;
}
function resolveTryoutDay(i){
  const t = S.tryout, D = TRYOUT_DAYS[t.day], opt = D.a[i];
  const v = S.attrs[opt.dim] - tryoutFatiguePenalty();
  const p = clamp(0.22 + (v/100)*0.62, 0.08, 0.92);
  const ok = rnd() < p;
  // 成败对称。原来失败只扣 0.85 倍，四个环节累下来整体偏正，
  // 结果刚够门槛的人也有三成概率拿 A+——评级就没意义了。
  const delta = (ok ? 1 : -1) * opt.risk * 4.2;
  t.score += delta;
  t.lines.push(`<div><span class="hi">${D.n.split(" · ")[1]}</span> ${opt.t} — ${
    ok ? '<span class="w">教练点了头</span>' : '<span class="l">没打动他们</span>'
  }　<b style="color:${delta>0?'var(--cyan)':'var(--red)'}">${delta>0?"+":""}${delta.toFixed(1)}</b></div>`);
  t.day++;
  if(t.day >= TRYOUT_DAYS.length) endTryout();
  else render();
}
/* 最终评级：四天的表现 + 你的底子，一起对上这家的期望 */
function tryoutGrade(){
  const t = S.tryout;
  const total = tryoutSkill() + t.score;
  const d = total - t.expect;
  // 贴着期望值就是 B——「能用，但不到能托付的程度」。
  // A+ 要明显高出一截，否则档次分不开。
  if(d >= 16) return { g:"A+", d, tier:"first" };
  if(d >= 8)  return { g:"A",  d, tier:"start" };
  if(d >= 0)  return { g:"B",  d, tier:"sub" };
  if(d >= -9) return { g:"C",  d, tier:"acad" };
  return { g:"D", d, tier:null };
}
function endTryout(){
  const t = S.tryout;
  t.done = true;
  t.result = tryoutGrade();
  addFat(18);
  // 一家只给一次机会。不消耗掉的话，评了 D 可以回头再试一次，
  // 反复刷到 A+ 为止——那评级就白设计了。
  consumeOffer(t.team);
  if(typeof checkAch === "function") checkAch("tryout", { grade:t.result.g });
  render();
}
function tryoutCard(){
  const t = S.tryout; if(!t) return "";
  const T = CLUB_TIERS[t.tier];
  if(t.done){
    const r = t.result;
    return `<div class="card"><h2>试训结束<em>${t.team} · ${T.n}</em></h2>
      <div class="ver" style="text-align:center">
        <div style="font-size:44px;font-weight:700;color:${
          r.g==="D"?"var(--red)":r.g[0]==="A"?"var(--gold-hi)":"var(--cyan)"}">${r.g}</div>
        <div style="margin-top:6px">${
          r.g==="A+" ? "教练组开会时用了「捡到了」这个说法。"
          : r.g==="A" ? "四天下来，他们对你没有保留意见。"
          : r.g==="B" ? "他们觉得你能用，但还不到能托付的程度。"
          : r.g==="C" ? "差了一口气。要么再练一年，要么从青训做起。"
          : "教练组没有留你的意思。"}</div>
      </div>
      ${t.lines.length?`<div class="log">${t.lines.slice().reverse().join("")}</div>`:""}
      <div class="row"><button class="btn" id="tryoutdone">${
        r.tier ? "谈合同 →" : "接受结果"}</button></div></div>`;
  }
  const D = tryoutDay();
  const pen = tryoutFatiguePenalty();
  return `<div class="card"><h2>${D.n}<em>${t.team} · 第 ${t.day+1}/4 天</em></h2>
    <p class="note" style="margin:0 0 12px">${D.ctx}</p>
    ${pen>1?`<p class="note" style="color:var(--red)">连着几天下来你已经有点撑不住了，
      发挥打了折扣（−${pen.toFixed(1)}）。<b>体质在这种时候才看得出来。</b></p>`:""}
    <div class="grid g2">${D.a.map((a,i)=>`<button class="opt" data-tryout="${i}">
      <div class="t">${a.t}</div>
      <div class="d">吃 <b>${a.dim}</b> · ${a.risk>=1.3?"高风险高回报":a.risk>=1?"中等":"稳健"}<br>${a.d}</div>
    </button>`).join("")}</div>
    ${t.lines.length?`<div class="log">${t.lines.slice().reverse().join("")}</div>`:""}</div>`;
}

/* ---------- 三、合同报价 ---------- */
/* 档次决定基准，评级在基准上浮动 */
const DEAL_TIERS = {
  first: { n:"核心首发", mul:1.00, k:"start" },
  start: { n:"首发",     mul:0.80, k:"start" },
  sub:   { n:"替补",     mul:0.55, k:"sub"   },
  acad:  { n:"青训合同", mul:0.30, k:"sub"   }
};
function makeDeal(){
  const t = S.tryout, r = t.result, T = CLUB_TIERS[t.tier], D = DEAL_TIERS[r.tier];
  const lerp=(a,b,x)=>a+(b-a)*clamp(x,0,1);
  const q = clamp((r.d + 10) / 26, 0, 1);          // 评级在这家队里的相对位置
  S.deal = {
    team:t.team, clubTier:t.tier, dealTier:r.tier, grade:r.g, kind:D.k,
    salary: Math.round(lerp(T.pay[0], T.pay[1], q) * D.mul),
    sign:   Math.round(lerp(T.sign[0], T.sign[1], q) * D.mul),
    years:  T.years,
    buyout: Math.round(lerp(T.buyout[0], T.buyout[1], q) * D.mul),
    asks: 0, leverage: dealLeverage(r.g), dead:false, signed:false, log:[]
  };
  S.tryout = null;
  render();
}
/* 还价的底气：试训评级 + 人气 + 段位。没有底气就别开口。 */
function dealLeverage(grade){
  const g = { "A+":26, "A":18, "B":10, "C":4 }[grade] || 0;
  return clamp(g + Math.min(S.fame,300)*0.045 + (S.pre.rank)*0.12, 5, 62);
}
/* 四个可以谈的方向。每个都有代价——不是免费加钱。 */
const DEAL_ASKS = [
  { k:"pay",    n:"要求加薪",   d:"年薪 +25%",
    hint:"最直接，也最容易谈崩", cost:16,
    run:d=>{ d.salary = Math.round(d.salary*1.25); } },
  { k:"sign",   n:"要求签字费", d:"签字费翻倍",
    hint:"一次性到手，俱乐部相对好接受", cost:10,
    run:d=>{ d.sign = Math.max(8, Math.round(d.sign*2)); } },
  { k:"years",  n:"缩短合同",   d:"年限 −1，更早成为自由身",
    hint:"打得好的话，早一年重签就是涨薪", cost:13,
    run:d=>{ d.years = Math.max(1, d.years-1); } },
  { k:"buyout", n:"压低违约金", d:"违约金 −40%",
    hint:"以后想走，别的队更容易买走你", cost:14,
    run:d=>{ d.buyout = Math.round(d.buyout*0.6); } }
];
function askDeal(k){
  const d = S.deal; if(!d || d.dead || d.signed) return;
  const A = DEAL_ASKS.find(x=>x.k===k); if(!A) return;
  d.asks++;
  // 提得越多越难：第一次好说，第三次就是得寸进尺
  const p = clamp((d.leverage - A.cost - (d.asks-1)*14) / 40 + 0.5, 0.06, 0.93);
  const ok = rnd() < p;
  if(ok){
    A.run(d);
    d.log.push(`<div><span class="hi">${A.n}</span> — <span class="w">对方同意了</span></div>`);
  } else {
    // 谈崩不是立刻失败，先降条件；提得太过分才会真的走人
    const blow = rnd() < clamp((d.asks-1)*0.24 + (A.cost-d.leverage)/70, 0.04, 0.55);
    if(blow){
      d.dead = true;
      d.log.push(`<div><span class="hi">${A.n}</span> — <span class="l">对方收回了报价</span></div>`);
      preLog(`<b>${d.team}</b> 觉得你要的太多，把合同收回去了。`, "bad");
    } else {
      d.salary = Math.round(d.salary*0.93);
      d.log.push(`<div><span class="hi">${A.n}</span> — <span class="l">被拒绝，对方把年薪压了一点</span></div>`);
    }
  }
  render();
}
function dealCard(){
  const d = S.deal; if(!d) return "";
  const D = DEAL_TIERS[d.dealTier], T = CLUB_TIERS[d.clubTier];
  if(d.dead){
    return `<div class="card"><h2>谈判破裂<em>${d.team}</em></h2>
      <p class="note">你把价格要到了对方不能接受的位置。这家今年不会再谈了。</p>
      ${d.log.length?`<div class="log">${d.log.slice().reverse().join("")}</div>`:""}
      <div class="row"><button class="btn ghost" id="dealend">继续练下去 →</button></div></div>`;
  }
  const lev = d.leverage;
  return `<div class="card"><h2>合同谈判<em>${d.team} · ${T.n}</em></h2>
    <h3>${D.n}<span class="tag g">试训 ${d.grade}</span></h3>
    <div class="grid g2" style="margin:12px 0">
      <div class="ver"><div class="k">年薪</div><div class="v mono" style="font-size:22px;color:var(--gold-hi)">${d.salary}<small> 万/赛段</small></div></div>
      <div class="ver"><div class="k">签字费</div><div class="v mono" style="font-size:22px">${d.sign}<small> 万</small></div></div>
      <div class="ver"><div class="k">合同年限</div><div class="v mono" style="font-size:22px">${d.years}<small> 赛段</small></div></div>
      <div class="ver"><div class="k">违约金</div><div class="v mono" style="font-size:22px">${d.buyout}<small> 万</small></div></div>
    </div>
    <p class="note">你的底气 <b>${lev.toFixed(0)}</b>——来自试训评级、人气和段位。
      已经提了 <b>${d.asks}</b> 次要求，<b>提得越多越容易谈崩</b>。</p>
    <div class="grid g2">${DEAL_ASKS.map(a=>{
      const p = clamp((lev - a.cost - d.asks*14)/40 + 0.5, 0.06, 0.93);
      return `<button class="act" data-ask="${a.k}">
        <div class="t">${a.n} <span class="tag">成功率 ${(p*100).toFixed(0)}%</span></div>
        <div class="d">${a.d}<br><span style="color:var(--ink-3)">${a.hint}</span></div></button>`;
    }).join("")}</div>
    ${d.log.length?`<div class="log">${d.log.slice().reverse().join("")}</div>`:""}
    <div class="row">
      <button class="btn" id="dealsign">就这么签 →</button>
      <button class="btn ghost" id="dealno">不签，再练一年</button>
    </div>
    <p class="note">签字费当场到账，年薪每个赛段结算一次。违约金越高，以后别队越难把你买走。<br>
      <b>不签也是一条路</b>——青训合同签下去就是两个赛段的板凳，
      再练一年换一家更好的队未必更亏。但这家今年不会再来了。</p>
  </div>`;
}


/* 主动拒签。评级过了不等于必须签——给的是青训合同的话，
   再练一年换一家更好的队是完全合理的打法，不该被系统堵死。
   代价由 dropDeal 里的 consumeOffer 承担：这家今年就没了。 */
function declineDeal(){
  const d = S.deal; if(!d) return;
  const D = DEAL_TIERS[d.dealTier];
  preLog(`拒绝了 <b>${d.team}</b> 的${D.n}（年薪 ${d.salary} 万）。
    你觉得自己值更多——那就得在剩下的时间里证明它。`, "info");
  dropDeal();
}

/* ---------- 四、签字 ---------- */
/* 谈完了才真正进队。签字费当场到账，其余条款写进合同，
   之后每个赛段结算薪资、到期续约、转会时看违约金。 */
function signDeal(){
  const d = S.deal; if(!d || d.dead || d.signed) return;
  d.signed = true;
  const P = S.pre;
  if(!P.world)    P.world = cloneWorld();
  if(!P.baseline) P.baseline = leagueBaseline(P.world);
  // 青训队的名字带后缀，签的其实是俱乐部本身
  let teamName = d.team.replace(/ 青训队$/, "");
  // 邀请是从 S.world 里挑的队名，签约时用的是新克隆的 world。
  // 正常情况下名字一致，但万一对不上（老存档、数据换版），
  // 不能让它崩在签约这一步——退回到一支中游队。
  if(!P.world.LPL.some(t=>t.name===teamName)){
    const rk=P.world.LPL.map(t=>({n:t.name,p:power(t)})).sort((a,b)=>b.p-a.p);
    teamName=rk[Math.min(6,rk.length-1)].n;
  }
  const D = DEAL_TIERS[d.dealTier];
  P.offers = [{ k:d.kind, team:teamName, t:D.n, d:"", note:"", league:"LPL" }];
  S.money += d.sign;
  if(d.sign) preLog(`签字费 <b>${d.sign} 万</b>到账。`, "good");
  S.pendingContract = {
    years:d.years, left:d.years, salary:d.salary, sign:d.sign,
    buyout:d.buyout, team:teamName, tier:d.dealTier, grade:d.grade,
    clubTier:d.clubTier
  };
  preLog(`和 <b>${teamName}</b> 签下 <b>${D.n}</b> 合同：
    年薪 ${d.salary} 万 · ${d.years} 个赛段 · 违约金 ${d.buyout} 万。`, "big");
  S.deal = null;
  acceptOffer(0);
}
/* 把这家从今年的可选名单里划掉 */
function consumeOffer(team){
  const P = S.pre; if(!P) return;
  if(P.offers) P.offers.forEach(o=>{ if(o.team === team || team.indexOf(o.team)===0) o.used = true; });
  if(P.invite && P.invite.team === team) P.invite.pending = false;
}
/* 试训没过，或者谈崩了：这家今年到此为止 */
function dropDeal(){
  const team = (S.deal && S.deal.team) || (S.tryout && S.tryout.team);
  if(team) consumeOffer(team);
  S.deal = null; S.tryout = null;
  const P = S.pre;
  // 年末的窗口里，如果所有队都试过了，这一年就到此为止
  if(P && S.step === "offer" && P.offers && P.offers.every(o=>o.used)){
    preLog(`转会窗口关了。<b>今年没有一家给出合同。</b>`, "bad");
    preNextYear();
    return;
  }
  render();
}
/* 试训结束按「谈合同」：没评上就直接结束 */
function afterTryout(){
  const t = S.tryout;
  if(!t) return;
  if(!t.result || !t.result.tier){ dropDeal(); return; }
  makeDeal();
}


/* ================= 侧栏 ================= */
function formBar(team){
  const f=S.teamForm[team]||[];
  if(!f.length) return "";
  return `<span class="forms">${f.slice(-5).map(x=>`<i class="${x?'w':'l'}"></i>`).join("")}</span>`;
}
function nextMatchCard(){
  const sea=SEASONS[S.si], on=S.schedule[S.week-1];
  const opp=S.world[S.homeLeague||"LPL"].find(t=>t.name===on);
  if(!opp) return "";
  const myPw=myPower(), opPw=teamPowerOf(on);
  const star=opp.players.slice().sort((a,b)=>ovrOf(b)-ovrOf(a))[0];
  const rival=opp.players.find(q=>q.pos===S.pos);
  const st=(S.standings[S.homeLeague||"LPL"]||{})[on]||{w:0,l:0};
  const diff=myPw-opPw;
  const V=gapVerdict(diff);
  return `<div class="card"><h2>下一场<em>${sea.tag} 第 ${S.week} 周 · BO3</em></h2>
    <div class="next">
      <div class="sd"><div class="nm">${teamLogo(S.team,28)}${S.team}${formBar(S.team)}</div>
        <div class="pw">综合实力 <b>${myPw.toFixed(1)}</b></div></div>
      <div class="mid">VS</div>
      <div class="sd"><div class="nm">${teamLogo(on,28)}${on}${formBar(on)}</div>
        <div class="pw">综合实力 <b>${opPw.toFixed(1)}</b></div></div>
    </div>
    <div class="oppinfo">
      <span class="chipx">对面战绩 <b>${st.w}−${st.l}</b></span>
      <span class="chipx">核心 <b>${star.id}</b>${star.cn?`（${star.cn}）`:""} ${POSN[star.pos]} ${ovrOf(star).toFixed(0)}${star.comeback?' · 复出':''}${star.rookie?' · 新秀':''}</span>
      ${rival?`<span class="chipx">你的对位 <b>${rival.id}</b> ${ovrOf(rival).toFixed(0)}${rival.rookie?' · 新秀':''}</span>`:""}
    </div>
    <div class="gapbar ${V.k}">
      <div class="gv">${V.t}<span class="gd mono">${diff>=0?"+":""}${diff.toFixed(1)}</span></div>
      <div class="gt">${V.d}</div>
    </div></div>`;
}
function eventsCard(){
  if(!S.events.length) return `<div class="card"><h2>大事记</h2>
    <p class="note" style="margin:0">赛季刚开始，还没什么值得记下的事。</p></div>`;
  const tags=["全部",...Array.from(new Set(S.events.map(e=>e.tag)))];
  const cur=S.evFilter||"全部";
  const list=S.events.filter(e=>cur==="全部"||e.tag===cur).slice(-40).reverse();
  return `<div class="card"><h2>大事记<em>${nowLabel()} · 共 ${S.events.length} 条</em></h2>
    <div class="filt">${tags.map(t=>`<button data-ef="${t}" class="${t===cur?'on':''}">${t}</button>`).join("")}</div>
    <div class="feed">${list.map(e=>`<div class="ev ${e.tone}">
      <span class="tg">${e.tag}</span>
      <span class="tx">${e.text}<span class="tm">${e.s}</span></span></div>`).join("")}</div></div>`;
}
function standingsCard(){
  const rows=lplRank();
  return `<div class="card"><h2>${S.homeLeague||"LPL"} 积分榜<em>第 ${S.week} 周</em></h2>
    <div class="tw"><table><thead><tr><th>#</th><th>战队</th><th>战绩</th></tr></thead><tbody>
    ${rows.map((r,i)=>`<tr class="${r.n===S.team?'me':''} ${i===5?'cut':''}">
      <td class="n">${i+1}</td><td>${teamLogo(r.n,18)}${r.n}${r.n===S.team?'<span class="tag">你</span>':''}</td>
      <td class="n">${r.w}−${r.l}</td></tr>`).join("")}</tbody></table></div>
    <p class="note">粗线以上进季后赛。</p></div>`;
}
function newsCard(){
  const other=Object.keys(S.world).filter(l=>l!=="LPL").map(lg=>{
    const t=Object.entries(S.standings[lg]).map(([n,r])=>({n,...r,p:(r.w+r.l)?r.w/(r.w+r.l):0}))
      .sort((a,b)=>b.p-a.p)[0];
    return `<tr><td>${lg}</td><td>${t?t.n:"—"}</td><td class="n">${t?t.w+"−"+t.l:"—"}</td></tr>`;
  }).join("");
  return `<div class="card"><h2>其他赛区</h2>
    <div class="tw"><table><thead><tr><th>赛区</th><th>当前第一</th><th>战绩</th></tr></thead><tbody>${other}</tbody></table></div>
    ${S.news.length?`<div class="log" style="max-height:150px;margin-top:12px">${S.news.slice(-6).reverse().join("")}</div>`:""}
    ${S.log.length?`<div class="log" style="max-height:140px">${S.log.slice(-6).reverse().join("")}</div>`:""}</div>`;
}

/* ================= 渲染 ================= */
function hud(){
  const h=$("hud");
  if(!S||S.step==="create"){h.classList.add("hide");return;}
  h.classList.remove("hide");
  if(S.step==="pre"||S.step==="offer"||(!S.career&&S.pre)){
    h.innerHTML=`
      <div><div class="k">选手</div><div class="v">${meName()} <small>${POSN[S.pos]}</small></div></div>
      <div><div class="k">年龄</div><div class="v mono">${S.age}</div></div>
      <div class="hud-now ${nowPhase().urgent?'urgent':''}"><div class="k">现在</div>
        <div class="v">${nowPhase().tag} ${nowPhase().phase} <small>${nowPhase().detail} · 窗口剩 ${Math.max(0,PRE_YEAR-S.pre.week)} 周</small></div></div>
      <div><div class="k">段位</div><div class="v">${rankBadge(S.pre.rank,26)}</div></div>
      <div><div class="k">名气</div><div class="v" style="font-size:13px">${fameTier()}</div></div>
      <div><div class="k">下一节点</div><div class="v">${(()=>{const n=nextMilestone();
        return n?`${n.name} <small>${Math.max(0,n.w-S.pre.week)}周</small>`:"—"})()}</div></div>
    <div><div class="k">资金</div><div class="v mono">${Math.round(S.money)}<small>万</small></div></div>
    <div><div class="k">体能</div><div class="v mono">${100-Math.round(S.fatigue)}<small>/100</small></div></div>`;
    return;
  }
  const sea=SEASONS[S.si];
  h.innerHTML=`
    <div><div class="k">选手</div><div class="v">${meName()} <small>${POSN[S.pos]}</small></div></div>
    <div><div class="k">年龄</div><div class="v mono">${S.age}</div></div>
    <div class="hud-now ${nowPhase().urgent?'urgent':''}"><div class="k">现在</div>
      <div class="v">${nowPhase().tag} ${nowPhase().phase} <small>${nowPhase().detail}</small></div></div>
    <div><div class="k">战队</div><div class="v">${S.team}</div></div>
    <div><div class="k">本季</div><div class="v mono">${S.record.w}−${S.record.l}</div></div>
    <div><div class="k">冠军</div><div class="v mono">${S.career.titles.length}</div></div>
    <div><div class="k">状态</div><div class="v" style="font-size:13px">${
      typeof formTier==="function"&&S.form!==undefined?formTier(myForm()).n:"—"}</div></div>
    <div><div class="k">资金</div><div class="v mono">${Math.round(S.money)}<small>万</small></div></div>
    <div><div class="k">体能</div><div class="v mono">${100-Math.round(S.fatigue)}<small>/100</small></div></div>`;
}
function render(){
  if(typeof watchRoster==="function") watchRoster();
  hud();
  const body = S.step==="create"?viewCreate()
    : S.step==="pre"?viewPre()
    : S.step==="offer"?viewOffer()
    : S.step==="season"?viewSeason()
    : S.step==="match"?viewMatch()
    : S.step==="offseason"?viewOffseason() : viewEnd();
  $("stage").innerHTML = body
    + (typeof saveBar==="function"?saveBar():"")
    + (typeof confirmCard==="function"?confirmCard():"");
  bind();
}
function bind(){
  const st=$("stage");
  st.querySelectorAll("[data-age]").forEach(b=>b.onclick=()=>{S.ageIdx=+b.dataset.age;render()});
  st.querySelectorAll("[data-bg]").forEach(b=>b.onclick=()=>{
    S.bgPick=b.dataset.bg;
    const bb=bgOf(S.bgPick); if(bb&&bb.origin) S.origin=bb.origin;   // 出身随背景走
    render()});
  const rr=$("reroll"); if(rr) rr.onclick=()=>{S.bgOffer=drawBackgrounds();S.bgPick=null;render()};
  const ru=$("rankupok"); if(ru) ru.onclick=()=>{S.rankUp=null;render()};
  const sy=$("signyes"); if(sy) sy.onclick=()=>{
    const m=S.signup; S.signup=null;
    S.money-=m.fee; preLog(`交了 <b>${m.fee} 万</b>报名费，${m.name}走起。`,"info");
    enterCup(m.signup);   // 建赛程，第一场在两周后
    advancePreWeek();
  };
  const sn=$("signno"); if(sn) sn.onclick=()=>{
    const m=S.signup; S.signup=null;
    preLog(`没报 ${m.name}。省下的钱和体力，用在别处。`,"info");
    advancePreWeek();
  };
  st.querySelectorAll("[data-gear]").forEach(b=>b.onclick=()=>{
    const a=b.dataset.gear.split(":");buyGear(a[0],+a[1]);});
  st.querySelectorAll("[data-course]").forEach(b=>b.onclick=()=>buyCourse(b.dataset.course));
  st.querySelectorAll("[data-relax]").forEach(b=>b.onclick=()=>buyRelax(b.dataset.relax));
  const dc=$("decline"); if(dc) dc.onclick=()=>{S.step="pre";preNextYear();};
  st.querySelectorAll("[data-pos]").forEach(b=>b.onclick=()=>{S.pos=b.dataset.pos;render()});
  st.querySelectorAll("[data-org]").forEach(b=>b.onclick=()=>{S.origin=b.dataset.org;render()});
  st.querySelectorAll("[data-inc]").forEach(b=>b.onclick=()=>{
    const d=b.dataset.inc;if(talentLeft()>0&&S.talent[d]<10){S.talent[d]++;render()}});
  st.querySelectorAll("[data-dec]").forEach(b=>b.onclick=()=>{
    const d=b.dataset.dec;if(S.talent[d]>1){S.talent[d]--;render()}});
  const nm=$("nm"); if(nm) nm.oninput=e=>{S.name=safeName(e.target.value)};
  const go=$("go"); if(go) go.onclick=()=>{
    S.name=(nm&&safeName(nm.value))||"无名"; S.showStart=true; render(); };
  const sg=$("startgo"); if(sg) sg.onclick=()=>{ S.showStart=false; startPre(); };
  st.querySelectorAll("[data-prolg]").forEach(b=>b.onclick=()=>{S.proLg=b.dataset.prolg;render()});
  st.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render()});
  const _rok=$("rndok"); if(_rok) _rok.onclick=()=>{S.rndResult=null;render()};
  st.querySelectorAll("[data-rnd]").forEach(b=>b.onclick=()=>resolveRandom(+b.dataset.rnd));
  st.querySelectorAll("[data-locker]").forEach(b=>b.onclick=()=>resolveLocker(+b.dataset.locker));
  st.querySelectorAll("[data-spend]").forEach(b=>b.onclick=()=>{
    const x=SPEND[+b.dataset.spend];
    if(S.money>=x.cost&&!(S.buff&&S.buff[x.k])){S.money-=x.cost;x.run();
      pushEvent(`花 ${x.cost} 万：${x.n}。`,"info","开销");render();}
  });
  st.querySelectorAll("[data-pre]").forEach(b=>b.onclick=()=>preAct(b.dataset.pre));
  st.querySelectorAll("[data-pretrain]").forEach(b=>b.onclick=()=>preAct("train",b.dataset.pretrain));
  const pn=$("prenext"); if(pn&&!S.rndEv&&!S.cupMatch) pn.onclick=preNextWeek;
  // 年末的报价现在也只是「试训机会」——点了是去试训，不是直接签
  st.querySelectorAll("[data-offer]").forEach(b=>b.onclick=()=>{
    const of=S.pre.offers[+b.dataset.offer];
    const tier={sub:"top",foreign:"top",start:"mid",core:"low"}[of.k]||"mid";
    S.pre.offerPick=+b.dataset.offer;
    S.step="pre";
    startTryout(tier, of.team, CLUB_TIERS[tier].expect);
  });

  /* ---- 试训 · 谈判 ---- */
  const _ivg=$("ivgo"); if(_ivg) _ivg.onclick=()=>{
    const iv=S.pre.invite; iv.pending=false;
    startTryout(iv.tier, iv.team, iv.expect);
  };
  const _ivn=$("ivno"); if(_ivn) _ivn.onclick=()=>{
    const iv=S.pre.invite; iv.pending=false;
    preLog(`婉拒了 <b>${iv.team}</b> 的试训。你想再练一练，也许下次能去更好的地方。`,"info");
    render();
  };
  st.querySelectorAll("[data-tryout]").forEach(b=>b.onclick=()=>resolveTryoutDay(+b.dataset.tryout));
  const _td=$("tryoutdone"); if(_td) _td.onclick=afterTryout;
  st.querySelectorAll("[data-ask]").forEach(b=>b.onclick=()=>askDeal(b.dataset.ask));
  const _ds=$("dealsign"); if(_ds) _ds.onclick=signDeal;
  const _de=$("dealend");  if(_de) _de.onclick=dropDeal;
  const _dn=$("dealno");   if(_dn) _dn.onclick=()=>askConfirm("拒绝这份合同",
    `<b>${S.deal.team}</b> 给的是 <b>${DEAL_TIERS[S.deal.dealTier].n}</b>，年薪 ${S.deal.salary} 万。<br>
     拒了就没了——这家今年不会再来第二次。<br>
     <span class="note">剩下的时间你得练出更好的成绩，才会有更好的队来找你。</span>`,
    "拒绝", declineDeal);
  st.querySelectorAll("[data-train]").forEach(b=>b.onclick=()=>doTrain(b.dataset.train));
  st.querySelectorAll("[data-cupprep]").forEach(b=>b.onclick=()=>cupPrep(b.dataset.cupprep));
  st.querySelectorAll("[data-cupgo]").forEach(b=>b.onclick=()=>startCupMatch(b.dataset.cupgo));
  st.querySelectorAll("[data-cupnode]").forEach(b=>b.onclick=()=>resolveCupNode(+b.dataset.cupnode));
  const _cd=$("cupdone"); if(_cd) _cd.onclick=cupDismissMatch;
  const _cr=$("cupresok"); if(_cr) _cr.onclick=()=>{S.cupResult=null;render()};
  const _rtA=$("rtRepeat"); if(_rtA) _rtA.onclick=repeatLast;
  const _rtB=$("rtPlan");   if(_rtB) _rtB.onclick=runPlan;
  const _rtR=$("rtResume"); if(_rtR) _rtR.onclick=()=>{runActs(null,true);render();};
  const _rtX=$("rtDrop");   if(_rtX) _rtX.onclick=()=>{S.exec=null;render();};

  /* ---- 存档 ---- */
  const _sc=$("savecont"); if(_sc) _sc.onclick=()=>{ if(!loadGame()) alert("这个存档读不了，只能重开一局。"); };
  const _sn=$("savenew");  if(_sn) _sn.onclick=()=>askConfirm("重新开一局",
      "上次那个存档会被覆盖，回不来了。","确定重开",()=>{dropSave();S.confirm=null;render();});
  const _sd=$("savedrop"); if(_sd) _sd.onclick=()=>{dropSave();render();};
  const _s1=$("savenow");  if(_s1) _s1.onclick=()=>{ saveGame("手动"); render(); };
  const _s2=$("saveexp");  if(_s2) _s2.onclick=exportSave;
  const _s3=$("saveimp");  if(_s3) _s3.onclick=importSave;
  const _s4=$("saverst");  if(_s4) _s4.onclick=()=>askConfirm("放弃这一局",
      "当前进度会被清掉，从捏人重新开始。<br><span class=\"note\">想留着的话，先「导出」。</span>",
      "放弃并重开",()=>{ dropSave(); location.reload(); });

  /* ---- 通用确认框 ---- */
  const _ck=$("cfmOk"); if(_ck) _ck.onclick=()=>{ const f=S.confirm&&S.confirm.fn; S.confirm=null; if(f) f(); else render(); };
  const _ca=$("cfmAlt"); if(_ca) _ca.onclick=()=>{ const a=S.confirm&&S.confirm.alt; S.confirm=null; if(a&&a.fn) a.fn(); else render(); };
  const _cn=$("cfmNo"); if(_cn) _cn.onclick=()=>{ S.confirm=null; render(); };
  const _rtC=$("rtSave");   if(_rtC) _rtC.onclick=savePlan;
  const _rtD=$("rtSave2");  if(_rtD) _rtD.onclick=savePlan;
  const _rtE=$("rtClear");  if(_rtE) _rtE.onclick=clearPlan;
  st.querySelectorAll("[data-list]").forEach(b=>b.onclick=()=>doList(b.dataset.list));
  st.querySelectorAll("[data-sign]").forEach(b=>b.onclick=()=>doSign(b.dataset.sign));
  st.querySelectorAll("[data-squad]").forEach(b=>b.onclick=()=>doSquad(b.dataset.squad));
  st.querySelectorAll("[data-do]").forEach(b=>b.onclick=()=>doAction(b.dataset.do));
  const p=$("play"); if(p&&!S.locker) p.onclick=()=>{isBenched()?benchWeek():startMatch(false)};
  const au=$("auto"); if(au) au.onclick=()=>{
    const f=DIMS.reduce((a,b)=>S.talent[a]>=S.talent[b]?a:b);
    askConfirm("自动推进",
      `由系统替你安排：疲劳高就休息，否则练 <b>${f}</b>，然后打完比赛。<br>
       <b>一旦有事情需要你决定，会立刻停下来交回给你</b>——推几周不影响这一点。<br>
       <span class="note">这期间的训练和临场决策都不是你做的。</span>`,
      "推 6 周", ()=>autoRest(f,AUTO_MAX),
      {t:"推到赛季结束", fn:()=>autoRest(f,AUTO_FAR)});
  };
  st.querySelectorAll("[data-node]").forEach(b=>b.onclick=()=>resolveNode(+b.dataset.node));
  const nx=$("next"); if(nx) nx.onclick=nextWeek;
  const of=$("off"); if(of) of.onclick=doOffseason;
  st.querySelectorAll("[data-ef]").forEach(b=>b.onclick=()=>{S.evFilter=b.dataset.ef;render()});
  const ag=$("again"); if(ag) ag.onclick=screenCreate;
}

let S=null;
screenCreate();
</script>

</body>
</html>
