/* ================= 国际赛：MSI 与 世界赛 =================
   赛制按真实历史:
   · MSI        — 四大赛区各 2 支，8 队双败淘汰（2024 起的赛制）
   · 世界赛 S12  — 入围赛 → 小组赛(16 队 4 组，双循环 BO1，每组前二) → 8 强 BO5
   · 世界赛 S13+ — 入围赛 → 瑞士轮(16 队，5 轮，3 胜晋级 / 3 败淘汰；
                    晋级局与淘汰局 BO3，其余 BO1) → 8 强 BO5
   入围赛：四大赛区第 4 名 + 小赛区冠军，8 队双败，取前 4 进正赛。            */

const MAJOR = (typeof DATA!=="undefined" && DATA.major) || ["LPL","LCK","LEC","LCS"];
const MINOR = (typeof DATA!=="undefined" && DATA.minor) || [];

function findTeam(name){
  if(!S||!S.world) return null;
  for(const lg of Object.keys(S.world)){
    const t=S.world[lg].find(x=>x.name===name);
    if(t) return t;
  }
  return null;
}
function leagueOf(name){
  if(!S||!S.world) return "LPL";
  for(const lg of Object.keys(S.world)) if(S.world[lg].some(x=>x.name===name)) return lg;
  return "LPL";
}
function rankOf(lg){
  const st=S.standings[lg];
  if(!st) return S.world[lg].map(t=>({n:t.name,w:0,l:0,p:0}));
  return Object.entries(st).map(([n,r])=>({n,...r,p:(r.w+r.l)?r.w/(r.w+r.l):0}))
    .sort((a,b)=>b.p-a.p||b.w-a.w);
}
function pw(name){ const t=findTeam(name); return t?power(t,0,SEASONS[S.si].fav):50; }
function winProb(a,b){ return 1/(1+Math.exp(-(pw(a)-pw(b))/SPREAD)); }
function simBo(a,b,need){ let x=0,y=0,p=winProb(a,b); while(x<need&&y<need){ rnd()<p?x++:y++; } return x>y?a:b; }

/* ---------- 赛区名额 ---------- */
/* 小赛区没有联赛积分榜，直接按战力取冠军 */
function minorChampion(lg){
  return S.world[lg].slice().sort((a,b)=>power(b.players)-power(a.players))[0].name;
}
/* 大赛区季后赛：前四打两轮，返回排名 [冠,亚,季,殿] */
function majorStandings(lg){
  const rk=rankOf(lg).map(x=>x.n);
  if(rk.length<4) return rk;
  const w1=simBo(rk[0],rk[3],3), w2=simBo(rk[1],rk[2],3);
  const champ=simBo(w1,w2,3);
  const runner=(champ===w1)?w2:w1;
  const rest=rk.filter(n=>n!==champ&&n!==runner);
  return [champ,runner,rest[0],rest[1]];
}

/* ---------- 组建世界赛 16 强 ---------- */
function buildWorldsField(playerResult,cfg){
  cfg=cfg||{playin:{teams:8,take:4}};
  const HL=S.homeLeague||"LPL";
  const seeds={};
  MAJOR.forEach(lg=>{ seeds[lg]=majorStandings(lg); });

  // 玩家结果覆盖本赛区种子顺序
  if(playerResult==="champion"){
    seeds[HL]=[S.team].concat(seeds[HL].filter(n=>n!==S.team)).slice(0,4);
  } else if(S.playoffSeed&&S.playoffSeed<=4){
    const others=seeds[HL].filter(n=>n!==S.team);
    const slot=clamp(S.playoffSeed-1,1,3);
    seeds[HL]=others.slice(0,slot).concat([S.team]).concat(others.slice(slot)).slice(0,4);
  }

  // 正赛 16 席 = 直进席 + 入围晋级席
  const takeN=cfg.playin.take, directN=16-takeN;
  const perMajor=Math.floor(directN/MAJOR.length);      // 每个大赛区直进几支
  const direct=[], playin=[];
  MAJOR.forEach(lg=>{
    direct.push(...seeds[lg].slice(0,perMajor));
    if(seeds[lg][perMajor]) playin.push(seeds[lg][perMajor]);
  });
  const minors=MINOR.filter(lg=>S.world[lg]&&S.world[lg].length)
    .map(lg=>minorChampion(lg)).sort((a,b)=>pw(b)-pw(a));
  // 直进席还差的，由最强的小赛区冠军补上
  while(direct.length<directN&&minors.length) direct.push(minors.shift());
  playin.push(...minors.slice(0,Math.max(0,cfg.playin.teams-playin.length)));
  return {direct:direct.slice(0,directN),playin:playin.slice(0,cfg.playin.teams),seeds};
}

/* ---------- 入围赛：8 队双败，取前 4 ---------- */
function simPlayIn(field){
  let win=field.slice(), lose=[], out=[];
  // 胜者组
  while(win.length>1){
    const nx=[];
    for(let i=0;i<win.length;i+=2){
      if(i+1>=win.length){ nx.push(win[i]); continue; }
      const w=simBo(win[i],win[i+1],2);
      nx.push(w); lose.push(w===win[i]?win[i+1]:win[i]);
    }
    win=nx;
  }
  // 败者组
  while(lose.length>1){
    const nx=[];
    for(let i=0;i<lose.length;i+=2){
      if(i+1>=lose.length){ nx.push(lose[i]); continue; }
      const w=simBo(lose[i],lose[i+1],2);
      nx.push(w); out.push(w===lose[i]?lose[i+1]:lose[i]);
    }
    lose=nx;
  }
  const rest=field.filter(n=>n!==win[0]&&n!==lose[0]&&!out.includes(n));
  return [win[0],lose[0]].concat(rest).filter(Boolean).slice(0,4);
}

/* ---------- 事件入口 ---------- */
function startIntl(type,playerResult){
  const HL=S.homeLeague||"LPL";
  const F=SEASONS[S.si];
  if(type==="msi"){
    const seeds={}; MAJOR.forEach(lg=>seeds[lg]=majorStandings(lg));
    if(playerResult==="champion") seeds[HL]=[S.team].concat(seeds[HL].filter(n=>n!==S.team));
    const field=MAJOR.flatMap(lg=>seeds[lg].slice(0,2));
    // 2022 的 MSI 是小组赛+淘汰，2023 起才是双败
    return openIntl("msi",field,F.msi.mode==="groups"?"groups":"knockout");
  }
  const cfg=F.worlds, {direct,playin}=buildWorldsField(playerResult,cfg);
  let qual;
  if(playin.includes(S.team)){
    // 你要打入围赛
    S.intl={type:"worlds",stage:"playin",field:playin,direct,record:[0,0],round:1,
            cfg,queue:playin.filter(n=>n!==S.team).sort((a,b)=>pw(a)-pw(b))};
    pushEvent(`<b>${S.team}</b> 只拿到入围赛资格，要从最底下打起。`,"bad","世界赛");
    S.step="match"; startMatch(cfg.playin.bo,S.intl.queue[0]); return true;
  }
  qual=simPlayIn(playin).slice(0,cfg.playin.take);
  const field=direct.concat(qual);
  if(qual.length) pushEvent(`入围赛结束（${cfg.playin.teams} 队争 ${cfg.playin.take} 个名额），<b>${qual.join("、")}</b> 晋级正赛。`,"info","世界赛");
  return openIntl("worlds",field,cfg.main);
}

function openIntl(type,field,stage){
  field=field.filter(Boolean);
  const name=type==="msi"?"MSI":"世界赛";
  if(!field.includes(S.team)){
    const champ=simWholeEvent(field,stage);
    pushEvent(`${name}落幕，<b>${champ}</b> 捧起奖杯。${
      leagueOf(champ)==="LCK"?"LCK 又一次站在了最高处。":"你在屏幕外看完了颁奖。"}`,
      leagueOf(champ)==="LCK"?"bad":"info",name);
    return false;
  }
  S.intl={type,stage,field,record:[0,0],round:1,
          knockRound:1, knockField:field.slice(), beaten:[], metOpp:[],
          double:(type==="msi"&&stage==="knockout"), wins:0, losses:0,
          swiss:{}};
  field.forEach(n=>S.intl.swiss[n]=[0,0]);
  if(typeof breakthrough==="function")
    breakthrough("运营",2.0,"见过国际赛场的强度，回头看联赛都慢了半拍。","intl"+S.si);
  pushEvent(`<b>${S.team}</b> 进入 ${name}${
    stage==="swiss"?" 瑞士轮":stage==="groups"?" 小组赛":""}。${
    type==="worlds"?"这是全年最后一次机会。":""}`,"big",name);
  S.step="match";
  startMatch(intlBoNeed(), nextIntlOpp());
  return true;
}

/* 本场几胜制：瑞士轮普通局 BO1，晋级/淘汰局 BO3；小组赛 BO1；淘汰赛 BO5 */
function intlBoNeed(){
  const I=S.intl;
  if(!I) return true;
  if(I.stage==="knockout") return 3;
  if(I.stage==="groups") return 1;
  if(I.stage==="playin") return (I.cfg&&I.cfg.playin.bo)||2;
  const [w,l]=I.record;
  return (w===2||l===2)?2:1;
}
function nextIntlOpp(){
  const I=S.intl;
  if(I.stage==="knockout"){
    const base=(I.knockField||I.field||[]);
    let pool=base.filter(n=>n!==S.team&&!(I.beaten||[]).includes(n));
    if(!pool.length) pool=base.filter(n=>n!==S.team);
    pool.sort((a,b)=>pw(a)-pw(b));
    const last=I.double?(I.wins>=(I.losses?3:2)):(I.knockRound>=3);
    return last?pool[pool.length-1]:pool[Math.min(I.knockRound-1,pool.length-1)];
  }
  if(I.stage==="playin") return I.queue[Math.min(I.round-1,I.queue.length-1)];
  // 瑞士轮/小组赛：配同战绩、不同赛区的对手
  const me=I.record.join("-");
  const same=I.field.filter(n=>n!==S.team&&I.swiss[n]&&I.swiss[n].join("-")===me
                &&leagueOf(n)!==leagueOf(S.team)&&!(I.metOpp||[]).includes(n));
  const any=I.field.filter(n=>n!==S.team&&!(I.metOpp||[]).includes(n));
  const pool=same.length?same:(any.length?any:I.field.filter(n=>n!==S.team));
  return pool[Math.floor(rnd()*pool.length)];
}

/* 你不在场时，把整个赛事跑完 */
function simWholeEvent(field,stage){
  let alive=field.slice();
  if(stage==="swiss"||stage==="groups"){
    // 抽象成按战力排序取前 8
    alive=alive.slice().sort((a,b)=>pw(b)-pw(a)).slice(0,8);
  }
  while(alive.length>1){
    const nx=[];
    for(let i=0;i<alive.length;i+=2){
      if(i+1>=alive.length){ nx.push(alive[i]); continue; }
      nx.push(simBo(alive[i],alive[i+1],3));
    }
    alive=nx;
  }
  return alive[0];
}

/* ---------- 每场之后 ---------- */
function intlAdvance(){
  const I=S.intl, won=S.match.sc[0]>S.match.sc[1];
  const name=I.type==="msi"?"MSI":"世界赛";
  I.metOpp=(I.metOpp||[]).concat([S.match.oppName]);

  /* --- 入围赛 --- */
  if(I.stage==="playin"){
    I.record[won?0:1]++;
    if(I.record[1]>=2){ finishIntl(`入围赛出局`,"playin"); return; }
    if(I.record[0]>=2){
      const take=(I.cfg&&I.cfg.playin.take)||4;
      const qual=[S.team].concat(simPlayIn(I.field.filter(n=>n!==S.team)).slice(0,take-1));
      S.cameFromPlayin=true;
      pushEvent(`<b>${S.team}</b> 从入围赛杀进正赛。`,"good",name);
      const field=I.direct.concat(qual);
      if(!openIntl("worlds",field,(I.cfg&&I.cfg.main)||"swiss")) finishIntl("正赛出局","main");
      return;
    }
    I.round++; S.step="match"; startMatch(intlBoNeed(),nextIntlOpp()); return;
  }

  /* --- 淘汰赛 --- */
  if(I.stage==="knockout"){
    I.beaten=(I.beaten||[]).concat([S.match.oppName]);
    if(I.double){
      /* MSI：8 队双败。输一场掉败者组，输两场淘汰；
         胜者组一路赢 3 场夺冠，走过败者组则需要 4 场。 */
      if(!won){
        I.losses++;
        if(I.losses>=2){ finishIntl(I.wins>=3?"败者组决赛":"败者组","knock"); return; }
        pushEvent(`MSI：<b>${S.team}</b> 输给 ${S.match.oppName}，掉入败者组。<b>再输一场就回家。</b>`,"bad","MSI");
        I.knockRound++; S.step="match"; startMatch(3,nextIntlOpp()); return;
      }
      I.wins++;
      if(I.wins>=(I.losses?4:3)){ crownChampion(); return; }
      I.knockRound++; S.step="match"; startMatch(3,nextIntlOpp()); return;
    }
    /* 世界赛：8 强单败 BO5，三轮 */
    if(!won){
      const stage=I.knockRound>=3?"决赛":I.knockRound===2?"半决赛":"八强";
      finishIntl(stage,I.knockRound>=3?"final":I.knockRound===2?"semi":"knock"); return;
    }
    if(I.knockRound>=3){ crownChampion(); return; }
    I.knockRound++; S.step="match"; startMatch(3,nextIntlOpp()); return;
  }

  /* --- 瑞士轮 / 小组赛 --- */
  I.record[won?0:1]++;
  I.swiss[S.team]=I.record.slice();
  simOtherSwiss();
  const [w,l]=I.record;
  const needW=I.stage==="groups"?3:3;
  if(l>=3){ finishIntl(I.stage==="swiss"?"瑞士轮出局":"小组赛出局","main"); return; }
  if(w>=needW){
    // 晋级八强
    const others=I.field.filter(n=>n!==S.team)
      .sort((a,b)=>pw(b)-pw(a)).slice(0,7);
    I.stage="knockout"; I.knockField=[S.team].concat(others);
    if(typeof checkAch==="function") checkAch("intlknock");
    I.knockRound=1; I.beaten=[];
    pushEvent(`<b>${S.team}</b> ${I.stage==="groups"?"小组出线":"瑞士轮 3 胜晋级"}，进入八强。`,"good",name);
    S.step="match"; startMatch(3,nextIntlOpp()); return;
  }
  I.round++; S.step="match"; startMatch(intlBoNeed(),nextIntlOpp());
}

/* 其余队伍的瑞士轮战绩推进 */
function simOtherSwiss(){
  const I=S.intl;
  I.field.forEach(n=>{
    if(n===S.team) return;
    const r=I.swiss[n]; if(!r||r[0]>=3||r[1]>=3) return;
    // 强队更容易赢
    const q=clamp((pw(n)-55)/22+0.5,0.15,0.85);
    r[rnd()<q?0:1]++;
  });
}

/* 生涯最深战绩：数字越大越深 */
const INTL_DEPTH={"main":1,"knock":2,"semi":3,"final":4,"champion":5};
function noteDepth(kind){
  const d=INTL_DEPTH[kind]||0;
  S.career.bestIntl=Math.max(S.career.bestIntl||0,d);
}
function crownChampion(){
  const I=S.intl, name=I.type==="msi"?"MSI":"世界赛";
  S.career.titles.push(`${SEASONS[S.si].tag} ${name}`);
  S.career[I.type]= (S.career[I.type]||0)+1;
  // 记年份，供「双冠王 / 卫冕 / 三冠」判定
  const yk=I.type==="msi"?"msiYears":"worldsYears";
  S.career[yk]=(S.career[yk]||[]).concat([S.si]);
  if(typeof breakthrough==="function"){
    breakthrough("心态",4.5,"你在世界最高的舞台上赢过一次。没有什么再能让你手抖。");
    breakthrough("指挥",3.0,"拿过冠军的人说话，队友会听。");
  }
  const beatLCK=leagueOf(S.match.oppName)==="LCK";
  pushEvent(`<b>${S.team} 夺得 ${SEASONS[S.si].tag} ${name} 冠军！</b>${
    beatLCK?`决赛击败 LCK 的 ${S.match.oppName}——<b>至暗时刻的墙，被你砸开了一道口子。</b>`:""}`,
    "big",name);
  S.intlResult=(S.intlResult||{}); S.intlResult[I.type]="champion";
  noteDepth("champion");
  S.intl=null; afterIntl();
}
function finishIntl(stageText,kind){
  const I=S.intl, name=I.type==="msi"?"MSI":"世界赛";
  pushEvent(`${name} ${stageText}：<b>${S.team}</b> 的赛季结束了。`,"bad",name);
  S.intlResult=(S.intlResult||{}); S.intlResult[I.type]=kind;
  noteDepth(kind);
  S.intl=null; afterIntl();
}
function afterIntl(){
  // MSI 打完回夏季赛，世界赛打完进休赛期
  if(S.afterIntlGo==="summer"){ S.afterIntlGo=null; startSeason(false,1); return; }
  S.afterIntlGo=null;
  S.step="offseason"; render();
}

/* 界面用：当前赛事阶段名 */
function intlStageName(){
  const I=S.intl; if(!I) return "";
  const n=I.type==="msi"?"MSI":"世界赛";
  if(I.stage==="playin") return n+" 入围赛";
  if(I.stage==="groups") return n+" 小组赛 "+I.record.join("-");
  if(I.stage==="swiss")  return n+" 瑞士轮 "+I.record.join("-");
  if(I.double) return n+" "+(I.losses?"败者组":"胜者组")+" 第"+(I.wins+I.losses+1)+"场";
  return n+" "+(I.knockRound>=3?"决赛":I.knockRound===2?"半决赛":"八强");
}


/* ================= 队友信任度 · 更衣室 · 合同与经济 ================= */

/* ---------- 队友信任度 ---------- */
/* 每个队友对你有 0~100 的信任。信任影响全队发挥，也决定更衣室事件走向。 */
function initTrust(){
  S.trust={};
  myRoster().forEach(p=>{ if(!p.me) S.trust[p.id]=42+Math.floor(rnd()*16); });
}
function trustOf(id){ return S.trust&&S.trust[id]!==undefined?S.trust[id]:50; }
function avgTrust(){
  const v=Object.values(S.trust||{});
  return v.length?avg(v):50;
}
function addTrust(id,n){
  if(!S.trust) return;
  if(S.trust[id]===undefined) return;
  S.trust[id]=clamp(S.trust[id]+n,0,100);
}
function addTrustAll(n){ Object.keys(S.trust||{}).forEach(k=>addTrust(k,n)); }
/* 每个赛段结束，信任向 50 回归一截：关系是要一直维护的，不是攒满就一劳永逸 */
function trustDecay(){
  Object.keys(S.trust||{}).forEach(k=>{
    const v=S.trust[k];
    S.trust[k]=clamp(v+(50-v)*0.28,0,100);
  });
}
/* 信任对战力的修正：更衣室散了，五个人打不出五个人的东西 */
function trustMod(){ return 1+(avgTrust()-50)/380; }

/* 换人后补上新队友的信任（新人不认识你） */
function syncTrust(){
  if(!S.trust) return;
  const ids=myRoster().filter(p=>!p.me).map(p=>p.id);
  ids.forEach(id=>{ if(S.trust[id]===undefined) S.trust[id]=38+Math.floor(rnd()*10); });
  Object.keys(S.trust).forEach(k=>{ if(!ids.includes(k)) delete S.trust[k]; });
}

function tryLockerEvent(){
  if(S.locker) return false;
  const mates=myRoster().filter(p=>!p.me);
  if(!mates.length) return false;
  const pool=LOCKER.filter(e=>!(S.lockerSeen||[]).includes(e.id+S.si+S.split)&&e.when());
  if(!pool.length) return false;
  const ev=pool[Math.floor(rnd()*pool.length)];
  let target=mates[Math.floor(rnd()*mates.length)];
  if(ev.id==="rookie") target=mates.find(p=>p.rookie)||target;
  if(ev.id==="veteran") target=mates.find(p=>p.age>=27)||target;
  S.locker={ev,target};
  S.lockerSeen=(S.lockerSeen||[]).concat([ev.id+S.si+S.split]);
  return true;
}
function resolveLocker(i){
  const {ev,target}=S.locker;
  const txt=ev.a[i].e(target);
  pushEvent(`更衣室：${txt}`,"info","更衣室");
  S.locker=null; render();
}

/* ---------- 合同与经济 ---------- */
const SPEND=[
  {k:"coach",n:"请私教",cost:120,d:"下个赛段训练收益提升",
   run:()=>{S.buff.coach=1;}},
  {k:"physio",n:"理疗师",cost:85,d:"疲劳恢复更快，状态更稳",
   run:()=>{S.buff.physio=1;addFat(-25);}},
  {k:"team",n:"团队建设",cost:110,d:"全队信任提升",
   run:()=>{addTrustAll(16);}},
  {k:"pr",n:"舆论公关",cost:70,d:"压下负面，人气回升",
   run:()=>{S.fame+=14;}}
];
/* 薪资 = 谈出来的年薪 + 人气与荣誉带来的浮动。
   合同里那个数字必须真的算数，否则谈判就是假的。 */
function salaryOf(){
  const c=S.contract||{};
  const bonus=Math.round(S.fame*0.20)+(S.career.leagueTitles||0)*14
    +((S.career.msi||0)+(S.career.worlds||0))*36;
  if(c.salary!==undefined) return Math.round(c.salary+bonus);
  // 老存档或没走谈判流程的情况，退回旧算法
  const kindMul={sub:1.25,start:1.0,core:0.85,foreign:1.15}[S.offerKind]||1;
  return Math.round((26+bonus)*kindMul);
}
function payday(){
  const pay=salaryOf();
  S.money+=pay;
  pushEvent(`赛段结算：薪资到账 <b>${pay} 万</b>（当前人气 ${Math.round(S.fame)}）。`,"info","合同");
}
/* 合同：两个赛季一签，到期看表现续约或走人 */
function contractCheck(){
  S.contract=S.contract||{years:2,left:2};
  S.contract.left--;
  if(S.contract.left>0) return null;
  const ovr=avg(DIMS.map(d=>S.attrs[d]));
  const teamAvg=avg(myRoster().filter(p=>!p.me).map(p=>avg(DIMS.map(d=>p.r[d]))));
  const keep = ovr>=teamAvg-6 && avgTrust()>=35;
  if(keep){
    // 续约不是重签一份一样的合同：打得好，年薪和违约金都往上走
    const raise=clamp(1.15+(ovr-teamAvg)*0.02,1.05,1.7);
    const old=S.contract.salary;
    S.contract={
      years:2, left:2,
      salary: old!==undefined?Math.round(old*raise):undefined,
      sign: 0,
      buyout: S.contract.buyout!==undefined?Math.round(S.contract.buyout*raise):undefined,
      team:S.team, tier:S.contract.tier, grade:S.contract.grade,
      clubTier:S.contract.clubTier
    };
    pushEvent(`<b>${S.team}</b> 与你续约两个赛段，薪资涨到 <b>${salaryOf()} 万</b>${
      S.contract.buyout?`，违约金提到 <b>${S.contract.buyout} 万</b>`:""}。`,"good","合同");
    return null;
  }
  S.contract={years:2,left:2};
  return "cut";
}


/* ================= 动态宿敌 =================
   不预设「中单就打 Faker」——谁淘汰过你、谁在决赛赢过你、
   谁抢走你的荣誉，谁才是你的宿敌。每个位置都有戏。 */

function rivalKey(p){ return p.id; }
function ensureRivals(){ if(!S.rivals) S.rivals={}; }

/* 记仇：weight 越大越难忘 */
function noteGrudge(teamName,weight,reason){
  ensureRivals();
  const t=findTeam(teamName); if(!t) return;
  // 记的是对位那个人，不是整支队
  const foe=t.players.find(p=>p.pos===S.pos)||t.players[0];
  if(!foe) return;
  const k=rivalKey(foe);
  const r=S.rivals[k]||(S.rivals[k]={id:foe.id,cn:foe.cn||"",pos:foe.pos,
                                     team:teamName,heat:0,log:[],beat:0,lost:0});
  r.team=teamName; r.heat+=weight; r.lost++;
  r.log.push(`${SEASONS[S.si].tag}${SPLITS[S.split||0]}：${reason}`);
  if(r.heat>=6&&!r.declared){
    r.declared=true;
    pushEvent(`<b>${foe.id}</b>${foe.cn?`（${foe.cn}）`:""} 又一次挡在你面前。${reason}——<b>这个名字你记住了。</b>`,"bad","宿敌");
  }
}
/* 复仇：赢回来 */
function noteRevenge(teamName){
  ensureRivals();
  const t=findTeam(teamName); if(!t) return;
  const foe=t.players.find(p=>p.pos===S.pos)||t.players[0];
  if(!foe) return;
  const r=S.rivals[rivalKey(foe)];
  if(!r||!r.declared) return;
  r.beat++; r.heat=Math.max(0,r.heat-4);
  pushEvent(`<b>${S.team}</b> 击败 ${teamName}。<b>${foe.id}</b> 这一次输给了你——${
    r.beat>=r.lost?"这笔账算平了。":"但账还没算完。"}`,"big","宿敌");
}
function topRival(){
  ensureRivals();
  const arr=Object.values(S.rivals).filter(r=>r.declared).sort((a,b)=>b.heat-a.heat);
  return arr[0]||null;
}
/* 宿敌在场时，你会更投入（心态高的人享受这个，心态低的人被压住） */
function rivalBoost(oppTeam){
  const r=topRival();
  if(!r||r.team!==oppTeam) return 0;
  const m=(S.attrs.心态-52)/14;
  return clamp(m,-2.2,2.6);
}

/* 界面卡片 */
function rivalCard(){
  const r=topRival();
  if(!r) return "";
  const meeting=S.schedule&&S.schedule[S.week-1]===r.team;
  return `<div class="card"><h2>宿敌<em>${r.beat}胜 ${r.lost}负</em></h2>
    <h3>${r.id}${r.cn?`（${r.cn}）`:""} <span class="tag">${POSN[r.pos]}</span>
      <span class="tag g">${r.team}</span></h3>
    <p class="note" style="margin-top:2px">${meeting
      ? '<b style="color:var(--gold)">本周就是他。</b>'
      : "还没轮到，但这个赛季总会碰上。"}</p>
    <div class="log" style="max-height:120px">${r.log.slice(-4).reverse()
      .map(x=>`<div>${x}</div>`).join("")}</div></div>`;
}

function teamLogo(name,size){
  size=size||22;
  if(!name) return "";
  // 职业前 S.world 还不存在，所以要按 世界 -> offer 世界 -> 原始数据 依次找
  const srcs=[];
  if(typeof S!=="undefined"&&S){ if(S.world)srcs.push(S.world); if(S.pre&&S.pre.world)srcs.push(S.pre.world); }
  if(typeof DATA!=="undefined"&&DATA.leagues) srcs.push(DATA.leagues);
  for(const src of srcs){
    for(const lg of Object.keys(src)){
      const t=(src[lg]||[]).find(x=>x.name===name);
      if(t&&t.logo) return `<img class="tlogo" src="${t.logo}" width="${size}" height="${size}" alt="">`;
    }
  }
  return "";
}

function initShop(){
  S.gear={}; SLOTS.forEach(s=>S.gear[s.k]=0);   // 0 = 自带的破烂
  S.courses={};
}
function gearOf(k){ return GEAR[k][(S.gear&&S.gear[k])||0]; }
/* 外设加成：直接加在属性发挥上（不提高天赋瓶颈，只是让你打出应有的水平） */
function gearBonus(dim){
  let v=0;
  SLOTS.forEach(s=>{ const g=gearOf(s.k); if(g.e[dim]) v+=g.e[dim]; });
  return v;
}
function hasCourse(k){ return !!(S.courses&&S.courses[k]); }
/* 语言课：在对应赛区打球才有用 */
function langBonus(){
  const hl=S.homeLeague||"LPL";
  if(hl==="LCK"&&hasCourse("kr")) return 2.6;
  if((hl==="LEC"||hl==="LCS")&&hasCourse("en")) return 2.2;
  return 0;
}
/* 课程对训练的加成 */
function courseTrainMul(dim){
  if(dim==="心态"&&hasCourse("psy")) return 1.25;
  if(dim==="运营"&&hasCourse("vod")) return 1.25;
  return 1;
}

/* 直播打赏：名气越高，礼物越多 —— 这是主播出身的主要变现路径 */
function streamIncome(){
  const f=S.fame;
  const gift=Math.pow(Math.max(f,0)/40,1.22)*2.6;      // 名气有回报，但不能指数爆炸
  const base=4+f*0.05;
  const originMul=S.origin==="streamer"?1.7:1.0;
  return (base+gift)*originMul;
}

function buyGear(slot,tier){
  const g=GEAR[slot][tier];
  const cur=(S.gear&&S.gear[slot])||0;
  if(tier<=cur||S.money<g.cost) return;
  S.money-=g.cost; S.gear[slot]=tier;
  pushEvent(`换上了 <b>${g.n}</b>（${TIER_N[tier]}级${SLOTS.find(s=>s.k===slot).n}）。`,"good","装备");
  render();
}
function buyCourse(k){
  const c=COURSES.find(x=>x.k===k);
  if(!c||hasCourse(k)||S.money<c.cost) return;
  S.money-=c.cost; S.courses[k]=1;
  pushEvent(`报了 <b>${c.n}</b>。${c.d}`,"good","课程");
  render();
}
function buyRelax(k){
  const x=RELAX.find(r=>r.k===k);
  if(!x||S.money<x.cost) return;
  S.money-=x.cost; addFat(x.fat);
  if(x.trust&&typeof addTrustAll==="function") addTrustAll(x.trust);
  pushEvent(`${x.n}：体力回来了${x.trust?"，顺便和队友聊了聊":""}。`,"info","放松");
  render();
}

/* 抽三个不重复的背景 */
function drawBackgrounds(){
  // 抽 4 张，并保证主播/青训两条路都至少有一张——
  // 出身已经并进背景卡里，随机不该把一整条路直接抽没。
  const pick=(arr)=>arr.splice(Math.floor(rnd()*arr.length),1)[0];
  const aca=BACKGROUNDS.filter(b=>b.origin==="academy");
  const str=BACKGROUNDS.filter(b=>b.origin==="streamer");
  const out=[pick(aca),pick(str)];
  const rest=aca.concat(str);
  while(out.length<4&&rest.length) out.push(pick(rest));
  for(let i=out.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[out[i],out[j]]=[out[j],out[i]];}
  return out;
}
function bgOf(k){ return BACKGROUNDS.find(x=>x.k===k)||BACKGROUNDS[0]; }

/* 背景卡文案：把数值翻译成人话 */
function bgEffects(b){
  const out=[];
  DIMS.forEach(d=>{ if(b.mod&&b.mod[d]) out.push(`${d} ${b.mod[d]>0?"+":""}${b.mod[d]}`); });
  if(b.money) out.push(`起始资金 ${b.money} 万`);
  if(b.fame) out.push(`名气 ${b.fame>0?"+":""}${b.fame}`);
  if(b.trust) out.push(`队友信任 ${b.trust>0?"+":""}${b.trust}`);
  if(b.train) out.push(`训练效率 +${Math.round((b.train-1)*100)}%`);
  if(b.rest) out.push(`恢复 +${Math.round((b.rest-1)*100)}%`);
  if(b.upkeep) out.push(`每赛段寄回家 ${b.upkeep} 万`);
  if(b.course) out.push(`自带${COURSES.find(c=>c.k===b.course).n}`);
  if(b.rival) out.push(`开局就有一个想超越的人`);
  return out;
}

/* ---------- 引擎 ---------- */
function initAch(){ S.ach={}; S.achLog=[]; }
function hasAch(id){ return !!(S.ach&&S.ach[id]); }

function applyAchReward(r){
  if(!r) return [];
  const out=[];
  if(r.fat){ addFat(r.fat); out.push(`体力 +${-r.fat}`); }
  if(r.money){ S.money+=r.money; out.push(`奖金 ${r.money} 万`); }
  if(r.fame){ addFame(r.fame); out.push(`名气 +${r.fame}`); }
  if(r.trust&&typeof addTrustAll==="function"){ addTrustAll(r.trust); out.push(`士气 ${r.trust>0?"+":""}${r.trust}`); }
  return out;
}

/* ctx 给条件用：{won, bo5, myScore, oppScore, gap, intl, oppLeague, laneWon, nodeFails, lostFirstTwo} */
/* 扩充条目在 achieve_more.js，构建时拼进来 */
if(typeof ACH_MORE!=="undefined") ACHIEVEMENTS.push(...ACH_MORE);

let queueAchCheck=false;
function checkAch(on,ctx){
  if(!S.ach) initAch();
  ctx=ctx||{};
  ACHIEVEMENTS.forEach(a=>{
    if(a.on!==on||hasAch(a.id)) return;
    let ok=false;
    try{ ok=a.cond(ctx); }catch(e){ ok=false; }
    if(!ok) return;
    S.ach[a.id]=1;
    const gains=applyAchReward(a.r);
    S.achLog=(S.achLog||[]).concat([{id:a.id,n:a.n,s:SEASONS[S.si]?SEASONS[S.si].tag:""}]);
    if(on!=="ach") setTimeout?0:0;   // 占位，避免递归
    if(on!=="ach") queueAchCheck=true;
    pushEvent(`<b>成就解锁 · ${a.n}</b>　${a.d}${a.flavor?`<br><span style="color:var(--gold)">${a.flavor}</span>`:""}${
      gains.length?`<br><span style="color:var(--cyan)">${gains.join(" · ")}</span>`:""}`,"big","成就");
  });
}

/* ---------- 界面 ---------- */
function achCard(){
  const got=ACHIEVEMENTS.filter(a=>hasAch(a.id));
  const byTag={};
  ACHIEVEMENTS.forEach(a=>{ (byTag[a.tag]=byTag[a.tag]||[]).push(a); });
  return `<div class="card"><h2>成就<em>${got.length} / ${ACHIEVEMENTS.length}</em></h2>

      <h3 style="font-size:13px;color:var(--ink-3);margin:14px 0 8px">${t}</h3>

/* ================= 战队实力 =================

   综合实力 = base × 默契 × 战术 × 士气 × 指挥 × 体能

   base   —— 五名选手的个人数值加权平均（主角权重更高）
   默契   —— 五个人配合得怎么样。靠合练、双排、训练赛
   战术   —— 队伍的准备程度。靠复盘、训练赛
   士气   —— 更衣室气氛（= 队友信任均值）。靠赢球和处理好人际
   指挥   —— 队内最高指挥值，是个全队乘数
   体能   —— 你的疲劳

   关键机制：换人会砸默契。
   一个高手加盟，base 立刻上去，但五个人要重新磨合——
   这就是为什么强援加盟的第一个赛段往往打得不如纸面。          */

const SQUAD_DECAY = 0.21;       // 每赛段向 50 回归——这是个要一直喂的池子

function initSquad(){
  S.squad={ syn:44+Math.floor(rnd()*10), tac:44+Math.floor(rnd()*10) };
}
function squadOf(k){ return (S.squad&&S.squad[k])!==undefined?S.squad[k]:50; }
function addSquad(k,n){
  if(!S.squad) initSquad();
  // 收益递减：越高越难往上推，不然几次就拉满
  const room=clamp(1-(S.squad[k]-40)/52,0.12,1);
  S.squad[k]=clamp(S.squad[k]+n*room,0,100);
}
function squadDecay(){
  if(!S.squad) return;
  ["syn","tac"].forEach(k=>{ S.squad[k]=clamp(S.squad[k]+(50-S.squad[k])*SQUAD_DECAY,0,100); });
}

/* ---------- 换人对默契的冲击 ---------- */
/* changed = 这次换了几个人（含你自己加盟）。换得越多，磨合期越长。 */
function disruptSynergy(changed,who){
  if(!S.squad) return;
  const hit=clamp(changed*7.5,0,32);
  const before=S.squad.syn;
  S.squad.syn=clamp(S.squad.syn-hit,0,100);
  S.squad.tac=clamp(S.squad.tac-hit*0.45,0,100);   // 战术也受影响，但没那么大
  if(hit>=5&&typeof pushEvent==="function"){
    pushEvent(`阵容变动：${who||"新人加入"}。<b>默契 ${Math.round(before)} → ${Math.round(S.squad.syn)}</b>，
      五个人要重新磨。纸面强了，打起来未必。`,"bad","磨合");
  }
}
/* 每次渲染前对一下名单，有变动就砸默契 */
function watchRoster(){
  if(!S.squad||!S.team) return;
  const ids=myRoster().map(p=>p.id).sort().join("|");
  if(S.rosterSig===undefined){ S.rosterSig=ids; return; }
  if(ids===S.rosterSig) return;
  const before=S.rosterSig.split("|"), now=ids.split("|");
  const changed=now.filter(x=>!before.includes(x)).length;
  S.rosterSig=ids;
  if(changed>0) disruptSynergy(changed,`${changed} 人换血`);
}

/* ---------- 综合实力：base × 各项权重 ---------- */
function squadBase(players){
  let s=0,wt=0;
  players.forEach(p=>{
    const r=p.r||p;
    const w=p.me?(S.offerKind==="core"?1.45:1.18):1.0;
    // 能力 × 状态：同一个人，今年打成什么样是另一回事
    const fm=(typeof formMul==="function")?(p.me?myFormMul():formMul(p)):1;
    s+=(r.操作*0.34+r.运营*0.28+r.心态*0.14+r.体质*0.10)*fm*w;
    wt+=w;
  });
  return s/wt;
}
/* 各权重系数——都以 1.0 为基准，50 分是中性 */
function squadWeights(players,fatigue,team){
  const cmd=Math.max(...players.map(p=>(p.r||p).指挥||50));
  // 替补期间你不在首发名单里，但那仍然是你的队
  const mine=players.some(x=>x.me)||(S.team&&team&&team.name===S.team)
             ||(S.team&&!team&&S.squad&&players===myRoster());
  return [
    {k:"syn", n:"默契", v:mine?squadOf("syn"):50, mult:1+((mine?squadOf("syn"):50)-50)/950},
    {k:"tac", n:"战术", v:mine?squadOf("tac"):50, mult:1+((mine?squadOf("tac"):50)-50)/1100},
    {k:"mor", n:"士气", v:mine&&typeof avgTrust==="function"?avgTrust():50,
     mult:1+(((mine&&typeof avgTrust==="function")?avgTrust():50)-50)/380},
    {k:"cmd", n:"指挥", v:cmd, mult:1+(cmd-55)/520},
    {k:"fit", n:"体能", v:100-clamp(fatigue,0,100), mult:1-clamp(fatigue,0,100)*0.0022}
  ];
}
/* 拆解版，界面用 */
function squadBreakdown(players,fatigue,verFav,team){
  players=players||myRoster();
  fatigue=fatigue===undefined?S.fatigue:fatigue;
  let base=squadBase(players);
  if(verFav) base+=players.filter(p=>verFav.includes(p.pos)).length*0.3;
  base+=(typeof dynastyBonus==="function")?dynastyBonus(players):0;
  // 传谁的名单就用谁的队——之前一律用我方，导致对手的默契/战术永远是中性
  const ws=squadWeights(players,fatigue,team||(players.some(x=>x.me)?findTeam(S.team):null));
  const total=ws.reduce((a,w)=>a*w.mult,base);
  return {base,ws,total};
}

/* ---------- 综合实力与差距 ---------- */
function teamPowerOf(name){
  const t=findTeam(name); if(!t) return 50;
  return power(t,0,SEASONS[S.si].fav);
}
function myPower(){
  return power(myRoster(),S.fatigue,SEASONS[S.si].fav)+versionFit();
}
const GAP_WINDOW=7.5;
function gapVerdict(diff){
  if(diff>=GAP_WINDOW)  return {k:"crush", t:"实力碾压", d:"正常打就能赢，别浪。"};
  if(diff>=3)           return {k:"edge",  t:"占优",     d:"稳住节奏就行。"};
  if(diff>-3)           return {k:"even",  t:"势均力敌", d:"胜负就在那几个关键决策上。"};
  if(diff>-GAP_WINDOW)  return {k:"under", t:"劣势",     d:"硬碰硬赢不了，得赌一把。"};
  return {k:"hopeless", t:"差距过大", d:"这一场基本没戏。打完它，把状态留给下一场。"};
}
function clampWinProb(p,diff){
  if(diff<=-GAP_WINDOW) return Math.min(p,0.07);
  if(diff>=GAP_WINDOW)  return Math.max(p,0.93);
  return p;
}

/* 花钱的统一出口。
   际遇里原来是直接 pay(50) 这样扣，不看余额——实测 7% 的局
   会把资金扣成负数，最低到过 −35 万。而「负债」在这个游戏里
   没有任何机制承接：不影响什么，也解释不通，纯粹是个漏洞。
   现在买不起的选项在界面上就是禁用的，这里再兜一道底。 */
function pay(n){
  if(S.money < n) return false;
  S.money -= n;
  return true;
}

/* ---------- 临时增益 ---------- */
/* {k:效果, v:倍率/数值, left:剩余周数, n:显示名} */
function addBuff(k,v,weeks,n){
  S.tbuff=S.tbuff||[];
  S.tbuff=S.tbuff.filter(b=>b.k!==k);       // 同类覆盖
  S.tbuff.push({k,v,left:weeks,n});
}
function buffVal(k,dflt){
  const b=(S.tbuff||[]).find(x=>x.k===k);
  return b?b.v:(dflt===undefined?1:dflt);
}
function tickBuffs(){
  if(!S.tbuff) return;
  S.tbuff.forEach(b=>b.left--);
  S.tbuff=S.tbuff.filter(b=>b.left>0);
}
function buffChips(){
  if(!S.tbuff||!S.tbuff.length) return "";
  return `<div class="buffs">${S.tbuff.map(b=>
    `<span class="buff ${b.v>=1?'good':'bad'}">${b.n}<i>${b.left}周</i></span>`).join("")}</div>`;
}

/* ---------- 触发与结算 ---------- */
function tryRandomEvent(){
  if(S.rndEv||S.locker||S.signup||S.rankUp) return false;
  const seen=S.rndSeen||{};
  const pool=RANDOM_EVENTS.filter(e=>{
    if((seen[e.id]||0)>=2) return false;      // 同一个事件一局最多两次
    try{ return e.when(); }catch(x){ return false; }
  });
  if(!pool.length) return false;
  const tot=pool.reduce((a,e)=>a+e.w,0);
  let r=rnd()*tot;
  const ev=pool.find(e=>(r-=e.w)<=0)||pool[0];
  S.rndSeen=Object.assign({},seen,{[ev.id]:(seen[ev.id]||0)+1});
  S.rndEv={id:ev.id,q:ev.q(),ctx:ev.ctx,a:ev.a};
  return true;
}
/* 选之前先拍个快照，选完对比出「到底变了什么」——
   光给一句文字，玩家不知道自己是赚了还是亏了。 */
function snapshot(){
  const o={money:S.money,fame:S.fame,fat:S.fatigue};
  DIMS.forEach(d=>o["a_"+d]=S.attrs[d]);
  if(S.pre) o.rank=S.pre.rank;
  if(typeof avgTrust==="function"&&S.trust) o.trust=avgTrust();
  if(S.squad){ o.syn=S.squad.syn; o.tac=S.squad.tac; }
  o.buffs=(S.tbuff||[]).map(b=>b.k).join(",");
  return o;
}
function diffOf(a,b){
  const out=[];
  const num=(n,x,y,unit,inv)=>{
    const d=(y||0)-(x||0);
    if(Math.abs(d)<0.5) return;
    out.push({n,v:(d>0?"+":"")+d.toFixed(0)+(unit||""),good:inv?d<0:d>0});
  };
  num("资金",a.money,b.money," 万");
  num("名气",a.fame,b.fame);
  num("体力",-a.fat,-b.fat);                 // 存的是疲劳，显示成体力要取反
  if(a.rank!==undefined) num("段位分",a.rank,b.rank);
  if(a.trust!==undefined) num("士气",a.trust,b.trust);
  if(a.syn!==undefined){ num("默契",a.syn,b.syn); num("战术",a.tac,b.tac); }
  DIMS.forEach(d=>num(d,a["a_"+d],b["a_"+d]));
  // 新拿到的临时增益
  const before=a.buffs.split(",").filter(Boolean);
  (S.tbuff||[]).forEach(x=>{
    if(!before.includes(x.k)) out.push({n:x.n,v:x.left+" 周",good:x.v>=1});
  });
  return out;
}
function resolveRandom(i){
  const ev=S.rndEv; if(!ev) return;
  const before=snapshot();
  const txt=ev.a[i].e();
  const after=snapshot();
  S.rndEv=null; S._ev=null;
  if(S.pre&&S.step==="pre") preLog(txt,"info");
  else pushEvent(txt,"info","际遇");
  // 把结果摊开给玩家看
  S.rndResult={choice:ev.a[i].t,txt,diff:diffOf(before,after)};
  render();
}
function randomResultCard(){
  const r=S.rndResult; if(!r) return "";
  const d=r.diff;

/* ================= 能力与状态 =================

   能力（attrs / r）  —— 生涯水位。练出来的，慢，掉得也慢。
   状态（form）      —— 今年打成什么样。波动大，赛段之间会变。

   分开的意义：「今年打得差」不等于「这个人变弱了」。
   一个能力 76、状态 32 的人是正在低谷的强者，不是一个废了的人——
   他随时可能回来。反过来，状态 81 的新人今年很吓人，但那未必是他的真实水平。   */

const FORM_NEUTRAL = 52;

function formOf(p){
  const f=(p&&p.form!==undefined&&p.form!==null)?p.form:FORM_NEUTRAL;
  return clamp(f,25,95);
}
/* 状态对发挥的乘数：温和。±20 状态差约值 ±5% 发挥。
   做大了会形成「赢→状态涨→更容易赢」的正反馈，一路滚雪球。 */
function formMul(p){ return 1+(formOf(p)-FORM_NEUTRAL)/420; }

/* 玩家自己的状态 */
function myForm(){ return clamp(S.form===undefined?FORM_NEUTRAL:S.form,25,95); }
function myFormMul(){ return 1+(myForm()-FORM_NEUTRAL)/420; }
function formTier(f){
  if(f>=78) return {n:"状态爆棚",k:"hot"};
  if(f>=64) return {n:"手感不错",k:"good"};
  if(f>=44) return {n:"正常",k:"norm"};
  if(f>=34) return {n:"状态下滑",k:"cold"};
  return {n:"低谷",k:"slump"};
}

/* ---------- 每个赛段重算状态 ---------- */
/* 状态不是随机数：赢球、体能、更衣室都会推它，但也留了不小的随机项——
   这就是为什么强队也会有打不动的赛季。 */
function rollForm(){
  const prev=myForm();
  let base=FORM_NEUTRAL;
  // 上赛段成绩
  const g=(S.record?S.record.w+S.record.l:0);
  if(g>0) base+=((S.record.w/g)-0.5)*20;   // 别做太大，否则赢球→状态→再赢会滚起来
  // 体能：透支会写在状态上
  base-=clamp(S.fatigue-40,0,60)*0.20;
  // 更衣室
  if(typeof avgTrust==="function") base+=(avgTrust()-50)*0.14;
  // 年龄：巅峰期状态更容易高
  const a=S.age||20;
  base+= (a>=22&&a<=25)?3 : (a>=27? -3 : 0);
  // 向上赛段的状态回归一半，再加随机
  const target=base*0.55+FORM_NEUTRAL*0.17+prev*0.28+(rnd()*32-16);
  const now=clamp(Math.round(target),25,95);
  const before=formTier(prev), after=formTier(now);
  S.form=now;
  if(after.k!==before.k){
    const up=now>prev;
    pushEvent(`状态${up?"回来了":"下滑"}：<b>${after.n}</b>（${Math.round(prev)} → ${now}）。${
      after.k==="hot"?"手感烫得吓人，这种赛段一年遇不到几次。":
      after.k==="slump"?"怎么打都不对。能力还在，只是现在打不出来。":
      ""}`,up?"good":"bad","状态");
  }
  return now;
}

/* ---------- NPC 的状态推进 ---------- */
function rollWorldForm(){
  if(!S.world) return;
  Object.keys(S.world).forEach(lg=>{
    S.world[lg].forEach(t=>{
      t.players.forEach(p=>{
        if(p.me) return;
        const prev=formOf(p);
        // 向中性回归 + 随机；年轻人波动更大
        const vol=(p.age&&p.age<=21)?20:15;
        p.form=clamp(Math.round(prev*0.76+FORM_NEUTRAL*0.24+(rnd()*vol*2-vol)),25,95);
      });
    });
  });
}
/* 全世界的状态爆发/低迷播报——只播和你相关或者顶级的 */
function formNews(){
  if(!S.world) return;
  const hot=[],cold=[];
  Object.keys(S.world).forEach(lg=>S.world[lg].forEach(t=>t.players.forEach(p=>{
    if(p.me) return;
    const f=formOf(p), ov=avg(DIMS.map(d=>p.r[d]));
    if(f>=80&&ov>=58) hot.push({p,t,f});
    if(f<=32&&ov>=62) cold.push({p,t,f});
  })));
  const pick=a=>a.length?a[Math.floor(rnd()*a.length)]:null;
  const h=pick(hot), c=pick(cold);
  if(h&&rnd()<0.6)
    pushEvent(`<b>${h.p.id}</b>${h.p.cn?`（${h.p.cn}）`:""}（${h.t.name}）状态爆棚，最近几场数据吓人。`,"good","状态");
  if(c&&rnd()<0.5)
    pushEvent(`<b>${c.p.id}</b>${c.p.cn?`（${c.p.cn}）`:""}（${c.t.name}）陷入低谷。能力还在，就是打不出来了。`,"bad","状态");
}

/* ---------- 界面 ---------- */
function formCard(){
  if(S.form===undefined) return "";
  const f=myForm(), T=formTier(f);
  return `<div class="card"><h2>状态<em>${T.n}</em></h2>
    <div class="at" style="grid-template-columns:50px 1fr 90px">
      <div class="lb">状态</div>
      <div class="track"><div class="fill form-${T.k}" style="width:${clamp(f,0,100)}%"></div>
        <div class="capline" style="left:${FORM_NEUTRAL}%"></div></div>
      <div class="vn mono"><b>${f}</b> ×${myFormMul().toFixed(3)}</div>
    </div>
    <p class="note">能力是你练出来的水位，状态是<b>今年打成什么样</b>。
      状态每个赛段重算——赢球、体能、更衣室都会推它，但也有运气成分。
      ${f>=78?"现在这个手感，能打的比赛都去打。":
        f<=34?"能力没掉，只是打不出来。休息、稳住更衣室，等它回来。":""}</p>
  </div>`;
}


/* ================= 赛后归因 =================

   不编解释。列出来的每一项，就是模拟器判定胜负时真正用到的那个数
   —— base 的差、每个权重的差、版本相性、宿敌加成、节点决策的摆动。
   按对结果的贡献从大到小排，每一项都写「怎么调整」。

   数值只决定每回合胜率，所以账面占优照样可能输——
   那种情况面板会直接说出来，而不是硬找理由。                        */

function attribute(myTeamPlayers,oppTeamObj,fatigue,verFav){
  const oppPlayers=oppTeamObj.players||oppTeamObj;
  const A=squadBreakdown(myTeamPlayers,fatigue,verFav);           // 我方
  const B=squadBreakdown(oppPlayers,0,verFav,oppTeamObj.players?oppTeamObj:null);  // 对手用对手自己的默契/战术
  const rows=[];

  // base 差：拆到「能力」与「状态」两层
  const abilityOf=(ps)=>avg(ps.map(p=>{
    const r=p.r||p;
    return r.操作*0.34+r.运营*0.28+r.心态*0.14+r.体质*0.10;
  }));
  const myAb=abilityOf(myTeamPlayers), opAb=abilityOf(oppPlayers);
  rows.push({n:"个人能力",v:myAb-opAb,
    fix:myAb<opAb?"五个人的底子就比对面薄。练自己，或者等队伍补强。":"底子占优，把它打出来。"});

  const myFm=avg(myTeamPlayers.map(p=>p.me?myFormMul():formMul(p)));
  const opFm=avg(oppPlayers.map(p=>formMul(p)));
  rows.push({n:"状态",v:(myFm-opFm)*myAb,
    fix:myFm<opFm?"手感不在。休息、稳住更衣室，状态下个赛段会回来。":"状态在你这边。"});

  // 各权重差，折算成等效战力
  const fixOf={
    默契:"换过人就要重新磨。多合练、多双排。",
    战术:"准备不够。战术复盘和训练赛。",
    士气:"更衣室出问题了。处理好队友关系，或者花钱团建。",
    指挥:"队里没人扛得起指挥。练自己的指挥，或者引进老将。",
    体能:"人是累的。该休息了。"
  };
  A.ws.forEach((w,i)=>{
    const ow=B.ws[i];
    rows.push({n:w.n,v:(w.mult-ow.mult)*A.base,
      fix:(w.mult<ow.mult?fixOf[w.n]:"这一项你是占优的。")});
  });

  // 版本相性
  const vf=(typeof versionFit==="function")?versionFit():0;
  if(Math.abs(vf)>0.2){
    const sea=SEASONS[S.si];
    rows.push({n:"版本相性",v:vf,
      fix:vf<0?`这个版本强调${sea.dim}，不是你的强项。适应力高能缓一缓，或者把${sea.dim}练上去。`
              :`版本站在你这边，趁这一年多拿分。`});
  }
  return {rows:rows.sort((a,b)=>Math.abs(b.v)-Math.abs(a.v)),
          myTotal:A.total+vf, opTotal:B.total};
}

/* 赛后面板 */
function postMatchCard(){
  const m=S.match;
  if(!m||!m.done||!m.attr) return "";
  const {rows,myTotal,opTotal}=m.attr;
  const won=m.sc[0]>m.sc[1];
  const diff=myTotal-opTotal;
  // 账面 vs 结果：不一致就直说
  const upset=(won&&diff<-1.5)||(!won&&diff>1.5);
  return `<div class="card"><h2>赛后拆解<em>${won?"胜":"负"} ${m.sc[0]}:${m.sc[1]}</em></h2>
    <div class="pm-head">
      <span>综合 <b>${myTotal.toFixed(1)}</b> vs <b>${opTotal.toFixed(1)}</b></span>
      <span class="pm-diff ${diff>=0?'up':'dn'}">${diff>=0?"+":""}${diff.toFixed(1)}</span>
    </div>
    ${upset?`<div class="pm-upset">${won
      ? "账面上你是劣势——这场是打出来的，不是数值给的。节点决策和运气都站在了你这边。"
      : "账面上你占优，还是输了。数值只决定每回合的胜率，不保证结果——看看状态、体能，剩下的是运气。"}</div>`:""}
    <div class="pmrows">${rows.map(r=>{
      const w=clamp(Math.abs(r.v)/6*100,4,100);
      return `<div class="pmr ${r.v>=0?'up':'dn'}">
        <span class="pn">${r.n}</span>
        <span class="pbar"><i style="width:${w}%"></i></span>
        <span class="pv mono">${r.v>=0?"+":""}${r.v.toFixed(1)}</span>
        <span class="pf">${r.fix}</span></div>`;
    }).join("")}</div>
    <p class="note">这些就是模拟器判胜负时用的数，不是事后编的解释。按影响从大到小排。</p>
  </div>`;
}


/* ================= 伤病 =================

   没有伤病，疲劳就只是个软约束，硬练没有真代价。
   加上之后，训练的最优解落在中间：练，但别练到人垮。

   风险公式（每周每人）：0.5% + (疲劳−40)×0.12%，27 岁以上每岁再 +0.2%。
   比赛日按当场体能另算一次。                                          */

const INJURIES=[
  {k:"wrist", n:"手腕劳损", w:4, weeks:[1,3], hit:{操作:-4,体质:-2},
   d:"腱鞘发炎。医生说必须停，不然会变慢性。"},
  {k:"back",  n:"腰背问题", w:3, weeks:[1,2], hit:{体质:-5,心态:-1},
   d:"久坐落下的。坐满一局就疼。"},
  {k:"eye",   n:"眼睛过劳", w:2, weeks:[1,2], hit:{操作:-3,运营:-2},
   d:"看久了会重影。补刀和视野都受影响。"},
  {k:"neck",  n:"颈椎", w:2, weeks:[2,4], hit:{操作:-3,体质:-4},
   d:"低头太久，手会发麻。"},
  {k:"burn",  n:"精神透支", w:3, weeks:[1,3], hit:{心态:-6,运营:-2},
   d:"不是身体的问题。你已经很久没有一天是真正休息的了。"}
];

/* 本周受伤概率 */
function injuryRisk(){
  if(S.injury) return 0;
  let p=0.005+clamp(S.fatigue-40,0,60)*0.0012;
  const a=S.age||20;
  if(a>=27) p+=(a-26)*0.002;
  // 体质是抗伤的：60 以上明显更耐操
  p*=clamp(1.5-(S.attrs.体质-40)/60,0.55,1.5);
  if(S.buff&&S.buff.physio) p*=0.6;              // 请了理疗师
  return clamp(p,0,0.30);
}
/* 掷一次；受伤则挂上伤病状态 */
function rollInjury(where){
  if(S.injury) return false;
  if(rnd()>=injuryRisk()) return false;
  const tot=INJURIES.reduce((a,x)=>a+x.w,0);
  let r=rnd()*tot;
  const inj=INJURIES.find(x=>(r-=x.w)<=0)||INJURIES[0];
  const wk=inj.weeks[0]+Math.floor(rnd()*(inj.weeks[1]-inj.weeks[0]+1));
  S.injury={k:inj.k,n:inj.n,d:inj.d,left:wk,hit:inj.hit};
  pushEvent(`<b>${inj.n}</b>　${inj.d}<br>
    预计影响 <b>${wk} 周</b>${where?`（${where}）`:""}。`,"bad","伤病");
  return true;
}
/* 伤病对属性的即时折扣（不改真实数值，只影响这段时间的发挥） */
function injuryHit(d){
  if(!S.injury||!S.injury.hit) return 0;
  return S.injury.hit[d]||0;
}
function injuryTick(){
  if(!S.injury) return;
  S.injury.left--;
  if(S.injury.left<=0){
    pushEvent(`<b>${S.injury.n}</b> 好了。这几周你落下的东西，得补回来。`,"good","伤病");
    S.injury=null;
  }
}
/* 受伤期间训练效率大打折扣——硬练只会更糟 */
function injuryTrainMul(){ return S.injury?0.45:1; }

function injuryCard(){
  if(!S.injury) return "";
  const h=Object.entries(S.injury.hit).map(([d,v])=>`${d} ${v}`).join("　");
  return `<div class="card injury"><h2>伤病<em>还有 ${S.injury.left} 周</em></h2>
    <h3>${S.injury.n}</h3>
    <p class="note" style="margin-top:2px">${S.injury.d}</p>
    <p class="note">当前影响：<b style="color:var(--red)">${h}</b>　·　训练效率大幅下降。
      <br>硬练只会拖长恢复。这段时间以休息为主。</p></div>`;
}
/* 风险提示：让玩家在练崩之前看得见 */
function riskHint(){
  const p=injuryRisk();
  if(p<0.02) return "";
  const lv=p>=0.14?"很高":p>=0.07?"偏高":"开始有了";
  return `<div class="riskbar ${p>=0.14?'hi':p>=0.07?'mid':'lo'}">
    受伤风险<b>${lv}</b>　体能 ${100-Math.round(S.fatigue)}/100${
      p>=0.07?"　——该休息了，练废了更亏。":""}</div>`;
}


/* ================= 话语权 =================

   现实里，一个够格的选手是可以对阵容说话的——Uzi 能让俱乐部为他配辅助。
   但那不是白来的：你得先有战绩、有人气、在队里说了算，
   而且教练和经理得站在你这边。

   三个前置：
     威望   —— 你在这个圈子里的分量。冠军、人气、队内地位、生涯战绩堆出来的。
     教练信任 —— 看你练不练、听不听战术、关键局顶不顶得住。
     经理信任 —— 看你值不值钱：人气、商业价值、合同表现。

   两种操作：
     挂牌队友 —— 需要威望 + 教练点头。不保证成功，失败会走漏风声。
     点名引援 —— 需要威望 + 经理点头 + 俱乐部有预算。

   刻意做得「不好用」：条件苛刻、有失败、有反噬。
   它应该是你打了两年之后的奖励，不是开局就能用的按钮。                   */

/* ---------- 教练 / 经理 ---------- */
function initStaff(){
  S.staff={coach:46+Math.floor(rnd()*10), mgr:46+Math.floor(rnd()*10)};
}
function coachTrust(){ return clamp((S.staff&&S.staff.coach)||50,0,100); }
function mgrTrust(){ return clamp((S.staff&&S.staff.mgr)||50,0,100); }
function addStaff(k,n){
  if(!S.staff) initStaff();
  S.staff[k]=clamp(S.staff[k]+n,0,100);
}

/* ---------- 威望 ---------- */
/* 0~100。这是「别人凭什么听你的」的量化。 */
function cloutOf(){
  if(!S.team) return 0;
  let v=18;
  // 荣誉
  v+=(S.career.leagueTitles||0)*5;
  v+=((S.career.msi||0)+(S.career.worlds||0))*11;
  // 人气
  v+=clamp((S.fame||0)/14,0,16);
  // 队内地位：你在 base 里占多少
  const me=myRoster().find(p=>p.me);
  if(me){
    const mine=me.r.操作*.34+me.r.运营*.28+me.r.心态*.14+me.r.体质*.10;
    const others=avg(myRoster().filter(p=>!p.me).map(p=>
      p.r.操作*.34+p.r.运营*.28+p.r.心态*.14+p.r.体质*.10));
    v+=clamp((mine-others)*0.9,-8,18);
  }
  // 生涯战绩
  const g=(S.career.w||0)+(S.career.l||0);
  if(g>20) v+=clamp(((S.career.w/g)-0.5)*40,-8,12);
  // 更衣室不认你，威望就是空的
  if(typeof avgTrust==="function") v+=clamp((avgTrust()-50)*0.16,-6,6);
  return clamp(Math.round(v),0,100);
}
function cloutTier(c){
  if(c>=78) return {n:"队魂",d:"你说的话，俱乐部会认真听。"};
  if(c>=62) return {n:"核心",d:"你在这支队里说得上话。"};
  if(c>=44) return {n:"主力",d:"打得不错，但还轮不到你定阵容。"};
  if(c>=26) return {n:"轮换",d:"先把位置坐稳再说别的。"};
  return {n:"新人",d:"没人会听一个新人的意见。"};
}

/* ---------- 队友两两关系 ---------- */
/* 除了「对你的信任」，队友之间也有关系。
   两个互相看不顺眼的人在场上就是配合不起来——直接吃默契。 */
function initRelations(){
  S.rel={};
  const m=myRoster().filter(p=>!p.me);
  for(let i=0;i<m.length;i++) for(let j=i+1;j<m.length;j++){
    S.rel[relKey(m[i].id,m[j].id)]=42+Math.floor(rnd()*20);
  }
}
function relKey(a,b){ return [a,b].sort().join("|"); }
function relOf(a,b){ const v=S.rel&&S.rel[relKey(a,b)]; return v===undefined?50:v; }
function addRel(a,b,n){
  if(!S.rel) return;
  const k=relKey(a,b);
  if(S.rel[k]===undefined) return;
  S.rel[k]=clamp(S.rel[k]+n,0,100);
}
function syncRelations(){
  if(!S.rel) { initRelations(); return; }
  const ids=myRoster().filter(p=>!p.me).map(p=>p.id);
  for(let i=0;i<ids.length;i++) for(let j=i+1;j<ids.length;j++){
    const k=relKey(ids[i],ids[j]);
    if(S.rel[k]===undefined) S.rel[k]=38+Math.floor(rnd()*14);   // 新来的还不熟
  }
  Object.keys(S.rel).forEach(k=>{
    const [a,b]=k.split("|");
    if(!ids.includes(a)||!ids.includes(b)) delete S.rel[k];
  });
}
/* 关系网对默契的修正：有一对闹掰，整队都别想顺 */
function relMod(){
  const v=Object.values(S.rel||{});
  if(!v.length) return 1;
  const worst=Math.min(...v);
  const mean=avg(v);
  return 1+((mean-50)/900)+((worst<32)?-(32-worst)/700:0);
}
/* 关系每赛段的自然漂移：一起赢会更近，一起输会互相埋怨 */
function relDrift(won){
  Object.keys(S.rel||{}).forEach(k=>{
    S.rel[k]=clamp(S.rel[k]+(won?1.6:-2.2)+(rnd()*5-2.5),0,100);
  });
}

/* ---------- 挂牌队友 ---------- */
function canList(){
  const c=cloutOf(), ct=coachTrust();
  if(c<55) return {ok:false,why:`威望不够（${c}/55）。先打出成绩再谈阵容。`};
  if(ct<68) return {ok:false,why:`教练不认你（信任 ${ct}/68）。他不会为你动人。`};
  if(S.listCooldown>0) return {ok:false,why:`刚提过一次，${S.listCooldown} 个赛段内别再提。`};
  return {ok:true};
}
/* 成功率：目标越弱、你威望越高、教练越信你、你和他关系越差，越容易 */
function listOdds(t){
  const perf=t.r.操作*.34+t.r.运营*.28+t.r.心态*.14+t.r.体质*.10;
  const teamAvg=avg(myRoster().map(p=>p.r.操作*.34+p.r.运营*.28+p.r.心态*.14+p.r.体质*.10));
  let p=0.30;
  p+=(cloutOf()-55)/120;
  p+=(coachTrust()-68)/180;
  p+=clamp((teamAvg-perf)/16,-0.2,0.32);        // 他确实打得差
  p-=clamp((trustOf(t.id)-50)/200,-0.15,0.22);  // 他跟你关系好，你反而难开口
  if(t.age>=27) p+=0.08;                         // 老将本来就该换了
  if(t.rookie) p-=0.10;                          // 青训才提上来，俱乐部要脸面
  return clamp(p,0.05,0.82);
}
function doList(id){
  const t=myRoster().find(p=>p.id===id);
  if(!t||!canList().ok) return;
  const p=listOdds(t), ok=rnd()<p;
  S.listCooldown=3;
  if(ok){
    const lg=S.homeLeague||"LPL";
    const team=myTeam();
    const base=(S.baseline&&S.baseline[lg])||50;
    const nr=makeRookie(t.pos,base-3);
    team.players=team.players.map(q=>q===t?nr:q);
    addStaff("coach",-4);                        // 教练替他惋惜
    addTrustAll(-6); relDrift(false);
    pushEvent(`你向教练组提出换掉 <b>${t.id}</b>，成功了。<br>
      ${t.id} 被挂牌，<b>${nr.id}</b> 从青训提上来。<br>
      <span style="color:var(--red)">更衣室安静了很久——他们知道这是你提的。</span>`,"big","话语权");
    syncTrust(); syncRelations();
    if(typeof checkAch==="function") checkAch("clout",{kind:"list",ok:true});
    if(typeof disruptSynergy==="function") disruptSynergy(1,`${t.id} 被挂牌`);
  }else{
    addTrust(t.id,-26); addTrustAll(-9); addStaff("coach",-14); relDrift(false);
    if(typeof addSquad==="function") addSquad("syn",-6);
    pushEvent(`你提出换掉 <b>${t.id}</b>，教练组没同意——<b>而且消息走漏了</b>。<br>
      <span style="color:var(--red)">${t.id} 知道了。整个更衣室都知道了。</span>`,"bad","话语权");
    if(typeof checkAch==="function") checkAch("clout",{kind:"list",ok:false});
  }
  render();
}

/* ---------- 点名引援 ---------- */
function canSign(){
  const c=cloutOf(), mt=mgrTrust();
  if(c<66) return {ok:false,why:`威望不够（${c}/66）。这种要求得是队魂级别的人才提得动。`};
  if(mt<72) return {ok:false,why:`经理不认你（信任 ${mt}/72）。他要先看到你值这个钱。`};
  if(S.signCooldown>0) return {ok:false,why:`本赛季已经提过，${S.signCooldown} 个赛段后再说。`};
  return {ok:true};
}
/* 你能要到多好的人，取决于威望和经理信任 */
function signTargets(){
  const lg=S.homeLeague||"LPL";
  const mine=myRoster().map(p=>p.id);
  const pool=[];
  Object.keys(S.world).forEach(l=>S.world[l].forEach(t=>{
    if(t.name===S.team) return;
    t.players.forEach(p=>{
      if(mine.includes(p.id)) return;
      pool.push({p,team:t.name,lg:l,
        ovr:p.r.操作*.34+p.r.运营*.28+p.r.心态*.14+p.r.体质*.10});
    });
  }));
  const teamAvg=avg(myRoster().filter(p=>!p.me).map(p=>
    p.r.操作*.34+p.r.运营*.28+p.r.心态*.14+p.r.体质*.10));
  const reach=teamAvg+ (cloutOf()-60)/6 + (mgrTrust()-60)/9;   // 你够得着的档次
  return pool.filter(x=>x.ovr<=reach+4&&x.ovr>=teamAvg-1)
             .sort((a,b)=>b.ovr-a.ovr).slice(0,5);
}
function signOdds(x){
  const teamAvg=avg(myRoster().filter(p=>!p.me).map(p=>
    p.r.操作*.34+p.r.运营*.28+p.r.心态*.14+p.r.体质*.10));
  let p=0.50;
  p+=(cloutOf()-66)/110;
  p+=(mgrTrust()-72)/160;
  p-=clamp((x.ovr-teamAvg)/18,0,0.30);        // 要得越好越难
  if(x.lg!==(S.homeLeague||"LPL")) p-=0.12;   // 跨赛区更麻烦
  return clamp(p,0.10,0.82);
}
function doSign(id){
  const list=signTargets();
  const x=list.find(y=>y.p.id===id);
  if(!x||!canSign().ok) return;
  S.signCooldown=4;
  const p=signOdds(x), ok=rnd()<p;
  if(ok){
    const team=myTeam();
    // 顶掉同位置最弱的那个（不是你）
    const same=team.players.filter(q=>!q.me&&q.pos===x.p.pos);
    const out=same.length?same.reduce((a,b)=>
      (a.r.操作*.34+a.r.运营*.28)<(b.r.操作*.34+b.r.运营*.28)?a:b)
      :team.players.filter(q=>!q.me).reduce((a,b)=>
      (a.r.操作*.34+a.r.运营*.28)<(b.r.操作*.34+b.r.运营*.28)?a:b);
    const src=findTeam(x.team);
    if(src) src.players=src.players.map(q=>q===x.p?makeRookie(x.p.pos,
      ((S.baseline&&S.baseline[x.lg])||50)-4):q);
    team.players=team.players.map(q=>q===out?Object.assign({},x.p):q);
    addStaff("mgr",-3);
    pushEvent(`俱乐部按你的要求把 <b>${x.p.id}</b>${x.p.cn?`（${x.p.cn}）`:""} 签了下来，
      ${out.id} 腾出位置。<br><b>这是你的话语权换来的——现在成绩得对得起它。</b>`,"big","话语权");
    syncTrust(); syncRelations();
    if(typeof checkAch==="function") checkAch("clout",{kind:"sign",ok:true});
    if(typeof disruptSynergy==="function") disruptSynergy(1,`${x.p.id} 加盟`);
  }else{
    addStaff("mgr",-12);
    pushEvent(`你向经理提出签下 <b>${x.p.id}</b>。<br>
      对方要价太高，谈崩了。<span style="color:var(--red)">经理觉得你不太懂行情。</span>`,"bad","话语权");
  }
  render();
}

/* ---------- 每赛段维护 ---------- */
function cloutTick(won){
  if(S.listCooldown>0) S.listCooldown--;
  if(S.signCooldown>0) S.signCooldown--;
  // 信任向 50 回归：教练和经理不会因为你两年前打得好就一直信你。
  // 不加这条，中期之后门槛形同虚设。
  if(S.staff){
    S.staff.coach=clamp(S.staff.coach+(50-S.staff.coach)*0.32,0,100);
    S.staff.mgr  =clamp(S.staff.mgr  +(50-S.staff.mgr)  *0.32,0,100);
  }
  // 教练看你练不练、比赛顶不顶
  const g=(S.record?S.record.w+S.record.l:0);
  if(g>0) addStaff("coach",((S.record.w/g)-0.5)*22);
  addStaff("coach",clamp((S.btk&&S.btk.vod||0)-1,-1,3));      // 复盘做得多，教练喜欢
  if(S.fatigue>78) addStaff("coach",-2);                       // 把自己练废了他也不高兴
  // 经理看你值不值钱
  addStaff("mgr",clamp((S.fame-90)/26,-4,6));
  if(g>0) addStaff("mgr",((S.record.w/g)-0.5)*12);
  relDrift(g>0&&S.record.w>=S.record.l);
  syncRelations();
}

/* ================= 重复上回合 · 训练计划 =================

   一局要点三百多次训练按钮，其中大部分是「跟上周一样」。
   这个模块把重复的部分收起来，但不替玩家做决定——
   计划是你自己排的，出事的那几周你还是得手动改。

   两个东西：
     重复上回合 —— 一键把上周做过的事再做一遍
     训练计划   —— 你自己存一套「没事发生时的默认安排」，随时一键执行     */

/* 记录一次行动 */
function noteAct(kind, key){
  S.thisWeek = S.thisWeek || [];
  S.thisWeek.push({k: kind, v: key});
}
/* 一周结束时把它归档成「上回合」 */
function archiveWeek(){
  if(S.thisWeek && S.thisWeek.length) S.lastWeek = S.thisWeek.slice();
  S.thisWeek = [];
}

/* 行动的中文名，界面用 */
function actLabel(a){
  if(a.k === "train")  return "练" + a.v;
  if(a.k === "squad"){
    const s = (typeof SQUAD_ACTS !== "undefined") ? SQUAD_ACTS.find(x => x.k === a.v) : null;
    return s ? s.n : "战队";
  }
  if(a.k === "pre"){
    return a.v === "rank" ? "打排位" : a.v === "stream" ? "直播" : "休息";
  }
  return a.v === "stream" ? "直播" : "休息";
}
function actListText(list){
  if(!list || !list.length) return "空";
  const c = {};
  list.forEach(a => { const n = actLabel(a); c[n] = (c[n] || 0) + 1; });
  return Object.entries(c).map(([n, v]) => v > 1 ? `${n}×${v}` : n).join(" · ");
}

/* 执行一串行动，直到行动点用完或列表走完。
   已经撞瓶颈的训练会自动跳过——不浪费点数。

   中途会有事打断：际遇、更衣室谈话、报名、上分。
   打断的位置必须记下来。否则处理完弹窗再点一次「执行计划」，
   会从第一项重新跑一遍——排位打两次、休息被跳过、疲劳莫名其妙地高。 */
function weekKey(){
  return S.step === "pre" ? "pre" + (S.pre ? S.pre.week : 0)
                          : "s" + S.si + "w" + S.week;
}
/* 本周还有没有没跑完的计划？（换周之后自动失效） */
function pendingActs(){
  const e = S.exec;
  if(!e || e.wk !== weekKey() || !e.list) return null;
  return (e.list.length - e.i) > 0 ? e : null;
}
function runActs(list, fromCursor){
  if(fromCursor){
    const e = pendingActs();
    if(e){ list = e.list; }
  }
  if(!list || !list.length) return 0;
  let done = 0, guard = 0;
  const inPre = () => S.step === "pre";
  const apNow = () => inPre() ? (S.pre ? S.pre.ap : 0) : S.ap;
  let i = (fromCursor && pendingActs()) ? pendingActs().i : 0;
  for(; i < list.length; i++){
    const a = list[i];
    if(guard++ > 40) break;
    if(apNow() <= 0) break;
    // 有事发生就停下，交回给玩家——但记住停在第几项
    if(S.rndEv || S.locker || S.signup || S.rankUp){
      S.exec = { wk: weekKey(), list: list.slice(), i: i };
      return done;
    }
    const before = apNow();

    if(a.k === "train"){
      // 计划里的维度练满了就换一个还能练的——空转等于白扔一个行动点
      let d = a.v;
      if(S.attrs[d] >= capOf(d)){
        const av = DIMS.filter(x => S.attrs[x] < capOf(x));
        d = av.length ? av[0] : null;
      }
      if(d) inPre() ? preAct("train", d) : doTrain(d);
      else  inPre() ? preAct("stream") : doAction("stream");

    } else if(a.k === "squad"){
      // 战队行动只有进队之后才有；职业前就换成排位
      if(!inPre() && typeof doSquad === "function" && S.squad) doSquad(a.v);
      else if(inPre()) preAct("rank");
      else doAction("stream");

    } else {
      // pre 与 season 的行动名不通用，按当前阶段翻译一次
      const key = a.v;
      if(inPre()){
        preAct(key === "stream" ? "stream" : key === "rest" ? "rest" : "rank");
      } else {
        // 职业前的「打排位」在赛季里没有对应项 —— 折算成练最短板
        if(key === "rank"){
          const av = DIMS.filter(x => S.attrs[x] < capOf(x));
          av.length ? doTrain(av[0]) : doAction("stream");
        } else {
          doAction(key === "rest" ? "rest" : "stream");
        }
      }
    }

    if(apNow() === before) break;   // 这一步没消耗点数，说明卡住了，别死循环
    done++;
  }
  S.exec = null;   // 走完了，或者这周点数没了——两种情况都不用再接着走
  return done;
}
/* 把当前这周剩下的点数按计划填满。
   有断点就先把断点接上，不要重头再来。 */
function runPlan(){
  if(pendingActs()){ runActs(null, true); render(); return; }
  const plan = S.plan && S.plan.length ? S.plan : S.lastWeek;
  if(!plan) return;
  runActs(plan);
  render();
}
function repeatLast(){
  if(pendingActs()){ runActs(null, true); render(); return; }
  if(!S.lastWeek) return;
  runActs(S.lastWeek);
  render();
}
function savePlan(){
  const src = (S.thisWeek && S.thisWeek.length) ? S.thisWeek : S.lastWeek;
  if(!src || !src.length) return;
  S.plan = src.slice();
  pushEvent(`把这周的安排存成了默认计划：<b>${actListText(S.plan)}</b>。`, "info", "计划");
  render();
}
function clearPlan(){ S.plan = null; render(); }

/* ---------- 界面 ---------- */
function routineBar(){
  const ap = (S.step === "pre") ? (S.pre ? S.pre.ap : 0) : S.ap;
  const blocked = S.rndEv || S.locker || S.signup || S.rankUp;
  const hasLast = S.lastWeek && S.lastWeek.length;
  const hasPlan = S.plan && S.plan.length;
  const pend = (typeof pendingActs === "function") ? pendingActs() : null;
  if(!hasLast && !hasPlan && !pend && !(S.thisWeek && S.thisWeek.length)) return "";
  // 上次执行被打断了——先把断点摆在最显眼的位置
  const resume = pend ? `<div class="rt-row rt-resume">
      <button class="btn sm" id="rtResume" ${(ap <= 0 || blocked) ? "disabled" : ""}>
        接着执行</button>
      <span class="rt-txt">还剩 <b>${pend.list.length - pend.i}</b> 项：${
        actListText(pend.list.slice(pend.i))}</span>
      <button class="rt-x" id="rtDrop" title="不接了，这周自己安排">放弃</button>
    </div>` : "";
  return `<div class="routine">
    ${resume}
    <div class="rt-row">
      <button class="btn ghost sm" id="rtRepeat" ${(!hasLast || ap <= 0 || blocked) ? "disabled" : ""}>
        重复上回合</button>
      <span class="rt-txt">${hasLast ? actListText(S.lastWeek) : "还没有上回合"}</span>
    </div>
    <div class="rt-row">
      <button class="btn ghost sm" id="rtPlan" ${(!hasPlan || ap <= 0 || blocked) ? "disabled" : ""}>
        执行计划</button>
      <span class="rt-txt">${hasPlan ? actListText(S.plan) : "还没存计划"}</span>
      ${hasPlan
        ? `<button class="rt-x" id="rtClear" title="清掉计划">×</button>`
        : `<button class="rt-x" id="rtSave" title="把这周的安排存成计划">存为计划</button>`}
      ${hasPlan ? `<button class="rt-x" id="rtSave2" title="用这周的安排覆盖计划">覆盖</button>` : ""}
    </div>
    ${blocked ? `<div class="rt-note">有事情要先处理，处理完才能一键推进。</div>` : ""}
  </div>`;
}


/* ================= 比赛节点决策（扩充池） =================
   一局生涯会遇到两百多次节点，原来只有 8 个模板，每个要看三十遍。
   这里扩到 26 个，并按局势分组：只有对得上的才会出现。

   每个选项吃一个维度，风险高的摆动大。
   文案尽量写成「场上真的会发生的事」，不是抽象选择题。            */

const NODES_MORE=[
  /* ---- 通用：任何时候都可能发生 ---- */
  {q:"对面打野在你这边露头了，你的打野问要不要跟。",ctx:"跟上去可能二打二，也可能被反蹲。",when:()=>true,

   a:[{t:"去吧，我扛",dim:"心态",risk:0.85},{t:"别走，稳住线",dim:"运营",risk:0.35}]},
  {q:"小龙和峡谷先锋撞在一起了。",ctx:"两个都要是不可能的。",when:()=>true,
   a:[{t:"抢龙，赌团战",dim:"操作",risk:0.9},{t:"拿先锋推塔",dim:"运营",risk:0.45}]},
  {q:"你被单杀了一次，队友在打字。",ctx:"这波确实是你的问题。",when:()=>true,

/* ================= 业余赛事：城市争霸赛 / 主播杯 =================

   原来是报名之后一次性把所有轮次跑完，玩家只能看结果，全程没有参与。
   现在改成真正的赛程：

     报名 → 隔两周打第一轮 → 赢了才有下一轮 → 每轮更难
     轮次之间的周你照常训练、直播、冲分，也可以专门备战
     每一场都有节点决策，赢面靠你自己的属性和选择撑

   奖金按走到第几轮发，输了当场淘汰。                                */

/* 对手强度怎么定？

   两条约束，缺一不可：

   一、绝对强度，不跟着玩家走。
       国服第一去打城市争霸赛就该碾压，这是常识；
       一个大师去打，打得艰难才是对的。
       （之前试过按报名时的水平锚定，等于把「变强」这件事抵消掉了，
         练到国服第一还是一样难——不合理。）

   二、必须明显比职业赛容易。
       市级公开赛不该比 LPL 难。实测过一版带宽定高了的：
       业余杯赛胜率 55%，职业赛 65%——杯赛反而更难，荒谬。
       原因是职业赛有队友、默契、战术、士气一起抬，
       而这里几乎是纯个人，所以对手带必须压得更低。

   带宽按玩家在这个阶段的真实水平定标：
   第 8 周报名时玩家约 53，决赛时约 55。
   第一版定成 46→56，结果钻石段位夺冠率只有 5%——第一年基本
   打不赢，那这个赛事对新玩家就等于不存在。整体下调 3 分。

     城市争霸赛  43 → 52.5
       首轮明显打得过（网吧联队），决赛才追平你当时的水平（市队）。
       名单长度要和轮数一致，否则最后一支永远轮不到——决赛得是最强的那支。
     主播杯      47 → 55.5
       邀请制，门槛更高，整体上浮一档；决赛的冠军主播队要强过你。

   赛程节奏：一周一轮，整届 3–4 周打完。
   原来是两周一轮，城市赛从第 10 周拖到第 16 周——业余赛事不是
   这么办的，都是集中几周、一周多赛就结束。拖那么长还有个副作用：
   试训邀请要等赛事结束才能发，赛程占满中段就没有窗口了。

   注意：这里的数字和职业选手评分不是一把尺子——
   职业评分是在同位置同层级内做 z 标准化的（见 export_game.py），
   50 分意思是「该层级的平均水平」，不能跨系统直接比大小。      */
const CUPS={
  city:{ name:"城市争霸赛", rounds:4, gap:1, band:[43,52.5],
         prize:[0,25,70,180,420],
         opps:["网吧联队","本地车队","大学生战队","市队"] },
  stream:{ name:"主播杯", rounds:3, gap:1, band:[47,55.5],
         prize:[0,60,180,520],
         opps:["百万粉丝队","退役选手队","冠军主播队"] }
};

/* ---------- 报名之后：建赛程，而不是直接出结果 ---------- */
function enterCup(kind){
  const C=CUPS[kind]; if(!C) return;
  S.cups=S.cups||{};
  S.cups[kind]={ kind, name:C.name, round:1, rounds:C.rounds,
                 nextWeek:S.pre.week+C.gap, alive:true, wins:0, prep:0,
                 oppRoll:rollOpp() };
  preLog(`报名成功。<b>${C.name}</b> 第一轮在 <b>第 ${S.cups[kind].nextWeek} 周</b>——
    中间这两周你可以练，也可以专门备战。`,"good");
}
/* 对手强度随轮次递增 */
function cupOf(k){ return (S.cups||{})[k]; }
function activeCups(){ return Object.values(S.cups||{}).filter(c=>c.alive); }
function rollOpp(){ return (rnd()-0.5)*3.0; }   // 每轮抽一次，签运
function cupOppPower(k){
  const c=cupOf(k), C=CUPS[k];
  if(!c||!C) return 0;
  const [lo,hi]=C.band;
  const t=(C.rounds>1)?(c.round-1)/(C.rounds-1):0;
  return lo+(hi-lo)*t+((c.oppRoll!==undefined)?c.oppRoll:0);
}
/* 把强度翻回段位，界面上直说「这一轮对手大概什么水平」。
   玩家对段位有直觉，对 56.9 这个数字没有。 */
function powerRank(p){
  const v=clamp((p-40)/0.38,0,100);
  let n=RANKS[0].n;
  RANKS.forEach(r=>{ if(v>=r.at) n=r.n; });
  return n;
}
function cupOppName(k){
  const c=cupOf(k), C=CUPS[k];
  return C.opps[Math.min(c.round-1,C.opps.length-1)];
}
/* 你的业余赛战力：和职业赛不同，这里几乎全看个人 */
function cupMyPower(k){
  return S.attrs.操作*0.42+S.attrs.运营*0.28+S.attrs.心态*0.18+S.attrs.体质*0.12
       +(S.attrs.指挥-50)*0.12
       +(typeof gearBonus==="function"?gearBonus("操作")*0.4:0)
       +((k&&cupOf(k))?cupOf(k).prep*1.15:0)      // 针对这一轮对手的功课，下一轮清零
       +(S.pre.cupPrep||0)*0.55;                  // 练下来的战术与配合，不清零
}

/* ---------- 备战 ----------

   备战里有两样东西，性质完全不同：

   · 针对这一个对手的功课（看他们的录像、找弱点）——换了对手就作废
   · 练下来的战术执行和配合默契——这是你自己的东西，不会因为
     换个对手就没了，也不会因为换个赛事就归零

   原来两样混在一个 c.prep 里，每轮清零，等于上一轮的功课全白做。
   现在拆开：前者留在 c.prep（每轮重置），后者进 S.pre.cupPrep（永久），
   并且真的落到属性上——运营和指挥会涨，在试训和职业赛里一样有用。  */
function cupPrep(k){
  const c=cupOf(k);
  if(S.pre.ap<=0||!c||!c.alive) return;
  c.prep++;
  S.pre.cupPrep=(S.pre.cupPrep||0)+1;
  addFat(11);
  S.pre.ap--;
  // 练配合这件事本身会长本事，所以给一点真实的属性成长（受天赋瓶颈约束）
  const g1=Math.min(0.34,Math.max(0,capOf("运营")-S.attrs.运营));
  const g2=Math.min(0.26,Math.max(0,capOf("指挥")-S.attrs.指挥));
  S.attrs.运营+=g1; S.attrs.指挥+=g2;
  preLog(`针对 <b>${cupOppName(k)}</b> 看了录像，也把几套配合过了一遍。
    ${(g1+g2)>0.05?`<span class="hi">运营 +${g1.toFixed(2)}　指挥 +${g2.toFixed(2)}</span>`:""}`,"info");
  if(typeof noteAct==="function") noteAct("pre","prep");
  render();
}

/* 每周推进时叫一次：到点的比赛要提醒，不然玩家会错过 */
function cupTick(){
  activeCups().forEach(c=>{
    const wait=c.nextWeek-S.pre.week;
    if(wait===1) preLog(`<b>${c.name}</b> 第 ${c.round} 轮下周开打，对手 ${cupOppName(c.kind)}。`,"info");
    else if(wait<=0&&!c.due){ c.due=true;
      preLog(`<b>${c.name}</b> 第 ${c.round} 轮就是本周——随时可以上场。`,"good"); }
    if(wait>0) c.due=false;
  });
}

/* ---------- 开打 ---------- */
function startCupMatch(k){
  const opp=cupOppName(k), op=cupOppPower(k);
  S.cupMatch={ kind:k, opp, op, sc:[0,0], need:2, game:1, lines:[], node:null, swing:0, done:false };
  cupNextGame();
}
function cupNextGame(){
  const m=S.cupMatch;
  if(m.sc[0]>=m.need||m.sc[1]>=m.need){ endCupMatch(); return; }
  // 复用比赛节点池，但只取通用的那些（业余赛没有国际赛/赛点那套）
  const ALL=(typeof NODES_MORE!=="undefined")?NODES.concat(NODES_MORE):NODES;
  const ctx=Object.assign({},m,{lead:m.sc[0]-m.sc[1]});
  let pool=ALL.filter(n=>{ try{ return n.when(ctx); }catch(e){ return false; } });
  m.seen=m.seen||[];
  const fresh=pool.filter(n=>!m.seen.includes(n.q));
  if(fresh.length) pool=fresh;
  m.node=pool[Math.floor(rnd()*pool.length)];
  if(m.node) m.seen.push(m.node.q);
  render();
}
function resolveCupNode(i){
  const m=S.cupMatch, opt=m.node.a[i], v=S.attrs[opt.dim];
  const p=clamp(0.30+(v/100)*0.55,0.15,0.9);
  const ok=rnd()<p;
  m.swing+=(ok?1:-1)*opt.risk*5.0;
  m.lines.push(`<div><span class="hi">第${m.game}局</span> ${opt.t} — ${
    ok?'<span class="w">成了</span>':'<span class="l">没成</span>'}</div>`);
  m.node=null;
  cupPlayGame();
}
function cupPlayGame(){
  const m=S.cupMatch;
  const my=cupMyPower(m.kind)+m.swing;
  const p=clamp(1/(1+Math.exp(-(my-m.op)/5.5)),0.05,0.95);
  const win=rnd()<p;
  if(win) m.sc[0]++; else m.sc[1]++;
  m.lines.push(`<div>第${m.game}局 ${win?'<span class="w">胜</span>':'<span class="l">负</span>'}</div>`);
  m.game++; m.swing*=0.4;
  cupNextGame();
}
function endCupMatch(){
  const m=S.cupMatch, k=m.kind, c=cupOf(k), C=CUPS[k];
  const won=m.sc[0]>m.sc[1];
  m.done=true;
  // 打得越多，被球探看到的次数越多。累积在这里，但兑现要等整届打完——
  // 赛程进行中发邀请会把比赛线整个短路（试过：玩家半决赛就签约走人）。
  S.pre.scoutSeen = (S.pre.scoutSeen||0) + 1;
  if(won){
    c.wins++;
    addFame(4+c.round*2);
    preLog(`<b>${C.name}</b> 第 ${c.round} 轮：${m.sc[0]}:${m.sc[1]} 击败 ${m.opp}。`,"good");
    // 这里原本会「每赢一轮就可能来邀请」，但那会把杯赛线整个短路：
    // 玩家在半决赛就签约走人，奖金、成就、决赛全都拿不到，
    // 职业赛胜率也从 66% 掉到 51%（签得太早，属性还没练起来）。
    // 邀请只在整届打完后发——机会数量靠段位和人气那两条线补。
    if(c.round>=C.rounds){
      c.alive=false; cupPayout(k,true);
    } else {
      // 清掉的只是「针对上一个对手」的功课；练出来的东西在 S.pre.cupPrep 里留着
      c.round++; c.prep=0; c.oppRoll=rollOpp();
      c.nextWeek=S.pre.week+C.gap;
      preLog(`下一轮对手是 <b>${cupOppName(k)}</b>，<b>第 ${c.nextWeek} 周</b>开打。`,"info");
    }
  } else {
    c.alive=false;
    preLog(`<b>${C.name}</b> 第 ${c.round} 轮：${m.sc[0]}:${m.sc[1]} 不敌 ${m.opp}，止步于此。`,"bad");
    cupPayout(k,false);
  }
  render();
}
function cupPayout(k,champion){
  const c=cupOf(k), C=CUPS[k];
  const reached=champion?C.rounds:c.wins;
  const prize=(C.prize||[])[reached]||0;
  if(prize){ S.money+=prize; preLog(`奖金到账 <b>${prize} 万</b>。`,"good"); }
  addFame(reached*(k==="stream"?6:4));
  if(k==="city") S.pre.cityCup=reached;
  else S.pre.streamCup=reached;
  if(typeof checkAch==="function") checkAch("cup",{kind:k,win:reached});
  // 关键：不用夺冠。走得远，数据被记下来，就有人来问。
  if(typeof checkTryoutInvite==="function") checkTryoutInvite(k,reached,champion);
  if(champion) preLog(`<b>${C.name} 冠军。</b>这个名字开始有人记住了。`,"big");
  // 结算先挂在这场比赛上，等玩家看完比分点「继续」再弹总结。
  // 之前这里直接 S.cupMatch=null，被淘汰那一场的比分和过程会凭空消失——
  // 玩家只看到一个「止步第几轮」的框，不知道最后那局是怎么输的。
  if(S.cupMatch) S.cupMatch.result={name:C.name,reached,rounds:C.rounds,prize,champion};
  else S.cupResult={name:C.name,reached,rounds:C.rounds,prize,champion};
}
/* 看完比分，收起比赛卡；该弹总结的时候再弹 */
function cupDismissMatch(){
  const m=S.cupMatch;
  if(m&&m.result) S.cupResult=m.result;
  S.cupMatch=null;
  render();
}

/* ---------- 界面 ---------- */
/* 两个赛事时间会重叠，所以是列表，不是单个 */
function cupCard(){
  const list=activeCups();
  if(!list.length) return "";
  return list.map(c=>{
    const k=c.kind, C=CUPS[k];
    const wait=Math.max(0,c.nextWeek-S.pre.week);
    const my=cupMyPower(k), op=cupOppPower(k);
    const d=my-op;
    return `<div class="card cup"><h2>${C.name}<em>第 ${c.round}/${C.rounds} 轮</em></h2>
      <div class="next">
        <div class="sd"><div class="nm">${meName()}</div>

/* ================= 存档 =================

   一局 80–140 分钟，刷新一下就没了是不可接受的。

   几个要点：
   · 带版本号。改了存档结构就换号，旧档不会把新代码搞崩，而是提示重开
   · 待处理的弹窗（际遇 / 更衣室 / 报名）里挂着函数，序列化不了——
     存档时剔除，读档后回到「本周」界面，那次弹窗算跳过
   · 存档失败（隐私模式、容量满）不能影响游戏，一律 try/catch 吞掉
   · 提供手动导出/导入，方便测试者把坏档发回来                        */

const SAVE_KEY = "pojuzhe_save_v1";
const SAVE_VER = 4;                 // 存档结构版本；改结构就 +1

/* 这些字段挂着函数或临时 UI 状态，不进存档 */
const SAVE_SKIP = ["locker", "rndEv", "signup", "rankUp", "rndResult",
                   "cupResult", "cupMatch", "showStart", "match", "confirm"];

function saveGame(reason) {
  try {
    if (!S || S.step === "create") return false;
    const data = {};
    Object.keys(S).forEach(k => { if (!SAVE_SKIP.includes(k)) data[k] = S[k]; });
    const blob = { ver: SAVE_VER, at: Date.now(), reason: reason || "", S: data };
    localStorage.setItem(SAVE_KEY, JSON.stringify(blob));
    return true;
  } catch (e) {
    // 隐私模式 / 容量满 / 循环引用——都不该影响正在进行的这局
    return false;
  }
}
/* 老存档的迁移。
   能升就升，别动不动让人重开——正在玩的人不该为我改数值付代价。
   v3 -> v4：年龄语义从「出道年龄」改成「当前年龄」。
   v3 的职业前存档里 age 比选的小一岁（签约时才 +1），而新代码
   不再 +1，直接读会让整个生涯小一岁。所以职业前的档补回这一岁；
   已经签约的档当年就已经是正确年龄，不用动。 */
function migrate(blob) {
  if (blob.ver === 3) {
    const s = blob.S;
    if (s.step === "pre" && typeof s.age === "number") s.age += 1;
    blob.ver = 4;
  }
  return blob;
}
function readSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    let blob = JSON.parse(raw);
    if (!blob || typeof blob !== "object" || !blob.S) return { bad: "格式不对" };
    blob = migrate(blob);
    if (blob.ver !== SAVE_VER) return { bad: "版本不符（存档 v" + blob.ver + "，当前 v" + SAVE_VER + "）" };
    if (!blob.S.step || !blob.S.attrs) return { bad: "内容缺失" };
    return blob;
  } catch (e) {
    return { bad: "读取失败" };
  }
}
function hasSave() { const b = readSave(); return !!(b && !b.bad); }
function dropSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

function loadGame() {
  const blob = readSave();
  if (!blob || blob.bad) return false;
  try {
    S = blob.S;
    // 存档时被剔除的弹窗字段补回空值，避免到处 undefined
    SAVE_SKIP.forEach(k => { if (S[k] === undefined) S[k] = null; });
    S.tab = "act";
    // 读档落在比赛中途会尴尬——回到本周界面
    if (S.step === "match") S.step = S.pre && !S.career ? "pre" : "season";
    render();
    return true;
  } catch (e) {
    return false;
  }
}

/* 存档时间的人话 */
function saveAgeText(at) {
  const m = Math.round((Date.now() - at) / 60000);
  if (m < 1) return "刚刚";
  if (m < 60) return m + " 分钟前";
  const h = Math.round(m / 60);
  if (h < 24) return h + " 小时前";
  return Math.round(h / 24) + " 天前";
}
/* 存档里的进度摘要，让玩家确认是不是自己那一局 */
function saveSummary(s) {
  try {
    const sea = (typeof SEASONS !== "undefined" && SEASONS[s.si]) ? SEASONS[s.si].tag : "S12";
    const who = (s.name || "无名") + " · " + (POSN[s.pos] || "");
    if (!s.career) return `${who} · ${sea} 职业前 第 ${s.pre ? s.pre.week : 1} 周`;
    const t = (s.career.titles || []).length;
    return `${who} · ${sea} · ${s.team || "无队"}${t ? " · 冠军 " + t : ""}`;
  } catch (e) { return "存档"; }
}

/* ---------- 界面 ---------- */
/* 捏人页顶部：有档就先问要不要继续 */
function continueCard() {
  const blob = readSave();

/* 设置类操作：手动存、导出、导入 */
function saveBar() {

  const b = readSave();

function exportSave() {
  saveGame("手动导出");
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([raw], { type: "application/json" }));
    a.download = "破局者存档.json";
    document.body.appendChild(a); a.click(); a.remove();
  } catch (e) {}
}
function importSave() {
  try {
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = ".json,application/json";
    inp.onchange = () => {
      const f = inp.files && inp.files[0];
      if (!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        try {
          let blob = JSON.parse(rd.result);
          if (!blob || !blob.S) { alert("这个文件不像是存档。"); return; }
          blob = migrate(blob);
          if (blob.ver !== SAVE_VER) { alert("存档版本不符，读不了。"); return; }
          localStorage.setItem(SAVE_KEY, JSON.stringify(blob));
          loadGame();
        } catch (e) { alert("读取失败。"); }
      };
      rd.readAsText(f);
    };
    inp.click();
  } catch (e) {}
}


/* ================= 两个到处都要用的小东西 ================= */

/* 玩家名字是唯一一处玩家能写进 innerHTML 的文本。
   自己玩当然无所谓，但存档能导出导入、以后还可能有分享——
   一个叫 <img onerror=...> 的选手不该能执行代码。 */
function escapeHtml(v){
  if(v === null || v === undefined) return "";
  return String(v).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}
/* 玩家名字的统一出口：空名字有兜底，且一定转义 */
function meName(){ return escapeHtml(S && S.name ? S.name : "你"); }
/* 名字会被存进队伍名单、再被十几个地方拼进 innerHTML。
   与其追着每个显示点转义，不如在唯一的入口就把危险字符挡掉——
   这是比赛服 ID，本来也不该有尖括号。 */
function safeName(v){
  // 白名单比黑名单省心：ID 本来就只该是字母、数字、汉字和几个连接符
  return String(v == null ? "" : v)
    .replace(/[^\w一-龥぀-ヿ .\-]/g, "")
    .trim().slice(0, 12);
}

/* 通用确认框。用在那些「按下去就回不来」的操作上：
