name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22   # jsdom 30（undici）要 22+；线上 server.js 仍是 18+ 就能跑
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 构建工具链（esbuild / TypeScript / tsx）只在开发和 CI 用；线上仍是零依赖的 node server.js
      - name: install toolchain
        run: npm ci

      # 类型检查：strict 还没开，但已经没有任何 @ts-nocheck
      - name: typecheck
        run: npm run typecheck

      # 提交的 career.html 必须和 demo/src 的构建产物一致——
      # Railway 只跑 node server.js，直接发仓库里的产物，漏提交不会被部署发现
      - name: build consistency
        run: python demo/check_build.py

      # 无头跑完整生涯：非零退出码才算失败
      - name: headless career
        run: npm test

      # 服务端冒烟：健康检查、压缩、安全头、规范域名跳转、存档接力页
      - name: server smoke
        run: |
          node server.js & sleep 1
          set -e
          curl -fsS http://localhost:3000/healthz | grep -q ok
          curl -fsSI -H 'Accept-Encoding: br' http://localhost:3000/ | grep -qi 'content-encoding: br'
          curl -fsSI http://localhost:3000/ | grep -qi 'content-security-policy: '
          # CSP 哈希必须等于「浏览器眼里的脚本」（LF 归一后）的哈希——外部测评抓的 Windows 白屏就是这里对不上
          node -e "
            const http=require('http'),crypto=require('crypto');
            http.get('http://localhost:3000/',res=>{let b='';res.setEncoding('utf8');res.on('data',c=>b+=c);res.on('end',()=>{
              const csp=String(res.headers['content-security-policy']||'');
              const re=/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi; let m,bad=0,n=0;
              while((m=re.exec(b))){ n++; const h=crypto.createHash('sha256').update(Buffer.from(m[1].replace(/\r\n/g,'\n'),'utf8')).digest('base64'); if(!csp.includes(h)) bad++; }
              if(!n||bad){ console.error('CSP 哈希与内联脚本不匹配', {n,bad}); process.exit(1); }
              console.log('CSP 哈希匹配', n, '段');
            });}).on('error',e=>{console.error(e);process.exit(1);});
          "
          curl -sSI -H 'Host: poxiao.lol' http://localhost:3000/ | grep -q '301'
          curl -sSI -H 'Host: poxiao.lol' http://localhost:3000/ | grep -qi 'location: https://www.poxiao.lol/'
          curl -fsS -H 'Host: poxiao.lol' http://localhost:3000/xfer | grep -q 'poxiao-xfer'
          kill %1
