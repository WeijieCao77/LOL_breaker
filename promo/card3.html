<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1440px;overflow:hidden;position:relative;
  background:
    radial-gradient(900px 700px at 110% 0%, rgba(224,122,114,.12), transparent 55%),
    linear-gradient(168deg,#0b1320 0%,#0e1a2c 46%,#091019 100%);
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#e8eef7}
.grid{position:absolute;inset:0;opacity:.05;
  background-image:linear-gradient(#5aa 1px,transparent 1px),linear-gradient(90deg,#5aa 1px,transparent 1px);
  background-size:72px 72px}
.frame{position:absolute;inset:34px;border:1px solid rgba(201,169,97,.4);
  clip-path:polygon(46px 0,100% 0,100% calc(100% - 46px),calc(100% - 46px) 100%,0 100%,0 46px)}
.inner{position:absolute;inset:0;padding:100px 92px;display:flex;flex-direction:column}
.eyebrow{font-size:30px;letter-spacing:.5em;color:#c9a961;margin-bottom:20px}
h1{font-size:84px;font-weight:900;margin-bottom:26px;line-height:1.25}
h1 .r{color:#e07a72}
.sub{font-size:38px;color:#9fb3cc;line-height:1.7;margin-bottom:56px}
.sub b{color:#e8eef7}
.card{border:1px solid rgba(120,150,180,.3);background:rgba(14,26,44,.75);padding:44px 48px;margin-bottom:30px}
.ct{font-size:40px;font-weight:800;color:#c9a961;margin-bottom:20px}
.ci{font-size:33px;color:#c3d2e4;line-height:1.75}
.ci b{color:#5bc6cf}
.ci i{font-style:normal;color:#e07a72}
.foot{margin-top:auto;display:flex;align-items:baseline;justify-content:space-between;border-top:1px solid rgba(120,150,180,.25);padding-top:40px}
.url{font-size:56px;font-weight:900;color:#c9a961}
.free{font-size:30px;color:#9fb3cc}
</style></head><body>
<div class="grid"></div><div class="frame"></div>
<div class="inner">
  <div class="eyebrow">硬核规则</div>
  <h1>这是<span class="r">五个人</span>的游戏</h1>
  <div class="sub">你再强，<b>也带不动四个坑</b>。想夺冠？<br>打出数据，让强队来买你——或者把强队门票打出来。</div>
  <div class="card">
    <div class="ct">世界照真实历史走</div>
    <div class="ci">S12 世界赛就是 <b>DRX 从入围赛杀上来夺冠</b>，MSI 就是 RNG。<br>你不去搅动的地方，历史一分不差；<i>你碰过的地方，世界因你而变</i>。</div>
  </div>
  <div class="card">
    <div class="ct">每一场比赛都有账可查</div>
    <div class="ci">赛后拆解告诉你<b>输在哪、明天练什么</b>；<br>赢面 90% 还是输了？回放会指名道姓——<i>谁慢了半拍，账上写着</i>。</div>
  </div>
  <div class="card">
    <div class="ct">2022 真实数据建模</div>
    <div class="ci">四大赛区 + 外卡，两百多名选手按 <b>2022 赛季真实表现</b>定值，<br>连 LDL 二队都是当年的真实名单。</div>
  </div>
  <div class="foot"><div class="url">poxiao.lol</div><div class="free">免费 · 无需下载</div></div>
</div>
</body></html>
