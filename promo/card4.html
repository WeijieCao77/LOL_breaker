<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1440px;overflow:hidden;position:relative;
  background:
    radial-gradient(1100px 800px at 50% 115%, rgba(201,169,97,.2), transparent 62%),
    linear-gradient(168deg,#0b1320 0%,#0e1a2c 46%,#091019 100%);
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#e8eef7}
.grid{position:absolute;inset:0;opacity:.05;
  background-image:linear-gradient(#5aa 1px,transparent 1px),linear-gradient(90deg,#5aa 1px,transparent 1px);
  background-size:72px 72px}
.frame{position:absolute;inset:34px;border:1px solid rgba(201,169,97,.4);
  clip-path:polygon(46px 0,100% 0,100% calc(100% - 46px),calc(100% - 46px) 100%,0 100%,0 46px)}
.inner{position:absolute;inset:0;padding:120px 92px;display:flex;flex-direction:column;align-items:center;text-align:center}
.eyebrow{font-size:32px;letter-spacing:.6em;color:#c9a961;margin-bottom:70px}
h1{font-size:150px;font-weight:900;letter-spacing:.06em;line-height:1.15}
h1 .g{color:#c9a961}
.mean{font-size:44px;color:#9fb3cc;margin-top:30px;letter-spacing:.3em}
.url{margin-top:110px;font-size:120px;font-weight:900;color:#c9a961;letter-spacing:.02em;
  border:3px solid rgba(201,169,97,.65);padding:34px 70px;
  clip-path:polygon(28px 0,100% 0,100% calc(100% - 28px),calc(100% - 28px) 100%,0 100%,0 28px);
  background:rgba(201,169,97,.08)}
.how{margin-top:56px;font-size:40px;color:#c3d2e4;line-height:1.9}
.how b{color:#5bc6cf}
.foot{margin-top:auto;font-size:30px;color:#7d8ea6;line-height:1.8}
</style></head><body>
<div class="grid"></div><div class="frame"></div>
<div class="inner">
  <div class="eyebrow">至暗时刻之后</div>
  <h1><span class="g">破</span>晓</h1>
  <div class="mean">PO XIAO · LOL</div>
  <div class="url">www.poxiao.lol</div>
  <div class="how">浏览器打开就能玩 · <b>手机电脑都行</b><br>免费 · 无需下载 · 自动存档</div>
  <div class="foot">猪之家出品 · 玩家社区共创打磨中<br>粉丝同人作品，与拳头游戏及各俱乐部无关</div>
</div>
</body></html>
