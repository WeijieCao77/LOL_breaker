<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1440px;overflow:hidden;position:relative;
  background:
    radial-gradient(1000px 700px at 85% -10%, rgba(201,169,97,.16), transparent 60%),
    radial-gradient(900px 900px at -10% 110%, rgba(40,120,150,.22), transparent 60%),
    linear-gradient(168deg,#0b1320 0%,#0e1a2c 46%,#091019 100%);
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#e8eef7}
.grid{position:absolute;inset:0;opacity:.05;
  background-image:linear-gradient(#5aa 1px,transparent 1px),linear-gradient(90deg,#5aa 1px,transparent 1px);
  background-size:72px 72px}
.frame{position:absolute;inset:34px;border:1px solid rgba(201,169,97,.4);
  clip-path:polygon(46px 0,100% 0,100% calc(100% - 46px),calc(100% - 46px) 100%,0 100%,0 46px)}
.inner{position:absolute;inset:0;padding:110px 92px;display:flex;flex-direction:column}
.eyebrow{font-size:30px;letter-spacing:.55em;color:#c9a961;margin-bottom:26px}
.tag{display:inline-block;border:1px solid rgba(201,169,97,.6);color:#c9a961;
  font-size:28px;padding:8px 26px;margin-bottom:60px;letter-spacing:.2em;width:max-content}
h1{font-size:118px;line-height:1.22;font-weight:900;letter-spacing:.02em;margin-bottom:38px}
h1 .g{color:#c9a961}
.sub{font-size:42px;line-height:1.75;color:#9fb3cc;max-width:820px}
.sub b{color:#e8eef7}
.years{margin-top:auto;display:flex;gap:18px;margin-bottom:64px}
.y{flex:1;border:1px solid rgba(120,150,180,.28);background:rgba(14,26,44,.7);
  padding:26px 0;text-align:center}
.y .s{font-size:30px;color:#7d8ea6;letter-spacing:.1em}
.y .c{font-size:40px;font-weight:800;margin-top:10px;color:#d6e2f0}
.y.dark .c{color:#e07a72}
.y.you{border-color:#c9a961;background:rgba(201,169,97,.1)}
.y.you .c{color:#c9a961}
.foot{display:flex;align-items:baseline;justify-content:space-between;border-top:1px solid rgba(120,150,180,.25);padding-top:44px}
.url{font-size:66px;font-weight:900;color:#c9a961;letter-spacing:.04em}
.free{font-size:32px;color:#9fb3cc}
</style></head><body>
<div class="grid"></div><div class="frame"></div>
<div class="inner">
  <div class="eyebrow">LOL 电竞选手模拟器</div>
  <div class="tag">网页免费玩 · 无需下载</div>
  <h1>穿越回 2022，<br>去打破 <span class="g">LCK</span><br>的四年王朝</h1>
  <div class="sub">从网吧赛的路人，到把 <b>T1 拉下王座</b>的那个人。<br>五个赛季，一条从青训到世界冠军的路。</div>
  <div class="years">
    <div class="y dark"><div class="s">S12</div><div class="c">DRX</div></div>
    <div class="y dark"><div class="s">S13</div><div class="c">T1</div></div>
    <div class="y dark"><div class="s">S14</div><div class="c">T1</div></div>
    <div class="y dark"><div class="s">S15</div><div class="c">T1</div></div>
    <div class="y you"><div class="s">S16</div><div class="c">你？</div></div>
  </div>
  <div class="foot"><div class="url">www.poxiao.lol</div><div class="free">猪之家出品 · 粉丝同人作品</div></div>
</div>
</body></html>
